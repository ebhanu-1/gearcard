      <div style="display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: #3D4350">
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #1F7A4D"></span>Sharpest</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #F2CF7E"></span>Diffraction measurable</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #DB6A2C"></span>Visible at 100%</span>

<figure style="margin:0;display:flex;flex-direction:column;gap:10px"><figcaption style="font:600 14px 'IBM Plex Sans',system-ui,sans-serif;color:#3D4350;max-width:390px">2 · Lens card, full scroll · <a href="LensCardFull.html">open alone</a></figcaption><div style="width:390px;border-radius:28px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12);border:1px solid #D9D6CE"><div style="width: 390px; height: 1900px; box-sizing: border-box; background: #FBFAF7; color: #1D2129; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">

      <span style="font-size: 18px; font-weight: 700">Z 70-200 f/2.8 VR S</span>

    </div>
  </header>

  <div style="padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 22px">

    <section style="display: flex; flex-direction: column; gap: 10px">

        <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); padding: 10px 14px; font-size: 11px; font-weight: 600; color: #5B6270; border-bottom: 1px solid #EFEDE6"><span>mm</span><span>Center best</span><span>Corners best</span></div>
        <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); padding: 10px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; border-bottom: 1px solid #EFEDE6"><span>98</span><span>f/4–5.6</span><span>f/5.6</span></div>
        <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); padding: 10px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; border-bottom: 1px solid #EFEDE6"><span>147</span><span>f/4–5.6</span><span>f/8</span></div>
        <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); padding: 10px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; border-bottom: 1px solid #EFEDE6"><span>189</span><span>f/5.6</span><span>f/8</span></div>
        <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); padding: 10px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; background: #F1F7F3; font-weight: 600"><span>280</span><span>f/5.6–8</span><span>f/5.6–8</span></div>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #5B6270">With the TC on, values are the displayed f-numbers. 98–189 mm rows are extrapolated one stop from the bare-lens tests; 280 mm was tested with the TC.</p>
    </section>

          <span style="font-size: 11px; color: #5B6270; font-weight: 600">MAX MAGNIFICATION</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">0.28×</span>
          <span style="font-size: 12px; color: #5B6270">1:3.6 · est. from 0.2× bare</span>

          <span style="font-size: 12px; color: #5B6270">from sensor, at 280 mm</span>

          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: #17633E">f/5.6–8</span>
          <span style="font-size: 12px; color: #5B6270">displayed · extrapolated</span>
        </div>
      </div>

        <span>Past f/11 displayed with the TC on the Z8, unless you need the depth.</span>
        <span>TC wide open (f/4) when you have light to spare — f/5.6 is clearly crisper.</span>
        <span>The TC-2.0x on this lens for critical detail.</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; letter-spacing: 0.06em; color: #5B6270; font-weight: 600">CHARACTER</h2>
      <div style="background: #FFFFFF; border: 1px solid #E3E1DA; border-radius: 14px; display: flex; flex-direction: column">
        <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 11px 14px; border-bottom: 1px solid #EFEDE6; font-size: 14px; line-height: 1.4"><span style="color: #5B6270; font-weight: 500">CA</span><span>Under ~1 px lateral, axial essentially absent — clean moon limbs.</span></div>
        <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 11px 14px; border-bottom: 1px solid #EFEDE6; font-size: 14px; line-height: 1.4"><span style="color: #5B6270; font-weight: 500">Bokeh</span><span>Neutral, smooth transitions; cat's-eye highlights at 200 mm f/2.8.</span></div>
        <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 11px 14px; border-bottom: 1px solid #EFEDE6; font-size: 14px; line-height: 1.4"><span style="color: #5B6270; font-weight: 500">Flare</span><span>Some ghosting into the sun, worse at 200 mm. Keep the hood on.</span></div>
        <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 11px 14px; border-bottom: 1px solid #EFEDE6; font-size: 14px; line-height: 1.4"><span style="color: #5B6270; font-weight: 500">Vignetting</span><span>Up to ~1.6 stops at 200 mm wide open; gone by f/5.6.</span></div>
        <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 11px 14px; font-size: 14px; line-height: 1.4"><span style="color: #5B6270; font-weight: 500">Focus</span><span>No breathing; not parfocal — refocus after zooming.</span></div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">

        <div style="display: flex; gap: 10px"><span style="font-family: 'IBM Plex Mono', monospace; color: #9A5B00; font-weight: 600">1</span><span>Moonrise at 280 mm: shoot displayed f/5.6–f/8. The moon is about 2.5 mm on the sensor (≈580 px on the Z8), so plan to crop.</span></div>
        <div style="display: flex; gap: 10px"><span style="font-family: 'IBM Plex Mono', monospace; color: #9A5B00; font-weight: 600">2</span><span>On a tripod, focus manually on the moon's limb at full magnification; focus holds when you stop down.</span></div>
        <div style="display: flex; gap: 10px"><span style="font-family: 'IBM Plex Mono', monospace; color: #9A5B00; font-weight: 600">3</span><span>For long bursts, VR Sport keeps framing steady; Normal can jump between frames as it recentres.</span></div>
      </div>

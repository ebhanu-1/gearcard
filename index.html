ghtly grouped (one slightly soft outlier). 13 elements in 10 groups. Weight 1130 g per published Sigma specs (Photography Life, TDP). TDP measured 1135 g, and a Nikon-mount-specific figure was not found."},qa=["Stage dance: f/1.8–f/2 is fully usable, with no need to stop down for sharpness. From the audience it frames about one dancer full-length at 10–15 m (inference). On the Z50 II it acts like about 200mm.","Set the focus limiter to 1.5 m–infinity for stage work. It cuts hunting (Dustin Abbott). Use 0.875–1.5 m only for tight portraits.","Family portraits: f/2–f/2.8 for a single face, f/4 for small groups. f/4 is the edge-to-edge sweet spot (Photozone 50MP).","Keep Sigma firmware current (USB Dock UD-01, Sigma Optimization Pro). The Z-specific fix cures overexposure when stopped past f/5.6. Detach the lens before updating camera firmware.","With about 1.26 kg on the FTZ II and only 3-axis IBIS, handhold at 1/250 s or faster on the Z8 and Z5 II. On the Z50 II (no IBIS) use 1/400 s or faster, or a monopod."],Ja=[{body:"z8",note:"The 50MP 5Ds R tests (Photozone, TDP) match the Z8's pixel pitch, so expect excellent f/1.8 and a peak at f/2.8–f/4, with diffraction from f/8. 3-axis IBIS via FTZ II."},{body:"z5ii",note:"24.5MP is easily out-resolved, so f/1.8 is effectively peak sharpness per pixel. 3-axis IBIS via FTZ II. Heavy on the smaller body: support the lens."},{body:"z50ii",note:"About 200mm-equivalent framing, and vignetting falls outside the DX frame. No IBIS, so keep the shutter fast or use a monopod."}],Qa=null,Ya=[{id:"photozone",name:"Photozone/OpticalLimits: Sigma 135mm f/1.8 DG HSM Art (Canon) review, analysis page",url:"https://photozone.de/canon_eos_ff/1008-sigma135f18art?start=1",kind:"measured",tested_on:"Canon EOS 5Ds R (50MP FX, about 4.1 µm)",date:null,findings:"Distortion about 0.18% pincushion. Vignetting 1.4 EV at f/1.8, irrelevant from f/2.8. Center tack sharp wide open, improving marginally stopped down. Borders and corners very good at f/1.8. Sweet spot f/4 with excellent performance across the field. Diffraction first noticeable at f/8, f/11 usable. Low field curvature, very good centering. Lateral CA under 0.5 px at the borders. Bokeh: symmetrical transition, no outlining f/1.8–f/2.8, slight at f/4, cat's eye in corners wide open. LoCA comparatively low but visible (purple front, green behind) through f/4. No focus shift. LW/PH values are in a chart image (not read)."},{id:"lenstip",name:"Lenstip review: Sigma A 135 mm f/1.8 DG HSM (resolution, CA and summary chapters)",url:"https://www.lenstip.com/501.4-Lens_review-Sigma_A_135_mm_f_1.8_DG_HSM_Image_resolution.html",kind:"measured",tested_on:"Canon EOS 5D Mark III (22MP FX), RAW MTF50",date:null,findings:"Best result 51.6 lp/mm at f/2.8, a new record on that sensor (previous 49.7 Sigma 85 Art, 49.2 Otus 28). Decency level 30–32, best primes 45–48. Center noticeably sharper than the edge. Summary (https://www.lenstip.com/501.11-Lens_review-Sigma_A_135_mm_f_1.8_DG_HSM_Summary.html): FX edge 44.1 lp/mm wide open, versus the Canon 135/2L's best center of 43.2. Pros: excellent center and edges on APS-C and FX, no spherical aberration problems, almost no lateral CA or distortion, very good coma, slight astigmatism, quiet accurate AF. Cons: noticeable vignetting wide open on FX, LoCA slightly too high. CA chapter (https://www.lenstip.com/501.5-Lens_review-Sigma_A_135_mm_f_1.8_DG_HSM_Chromatic_and_spherical_aberration.html): lateral CA max 0.02%, LoCA moderate but noticeable, no focus shift. Per-aperture values are in a chart image (not read)."},{id:"tdp",name:"The-Digital-Picture: Sigma 135mm f/1.8 DG HSM Art lens review (Bryan Carnathan) + specifications",url:"https://the-digital-picture.com/Reviews/Sigma-135mm-f-1.8-DG-HSM-Art-Lens.aspx",kind:"measured",tested_on:"Canon EOS 5Ds R (50MP) for ISO 12233 crops. AF tests on 1D X II, 5Ds R, 77D",date:"2017",findings:"Extremely sharp center and sharp corners at f/1.8. Slight contrast gain at f/2–f/2.8, corners improve modestly to f/4 (mainly vignetting). Vignetting about 2 / 1.5 / 0.5 / 0.3 stops at f/1.8 / f/2 / f/2.8 / f/4. Mild axial CA at f/1.8, largely gone by f/2. Low lateral CA. Flare only from f/16. 18-point sunstars. AF consistency at f/1.8 (about 2,000 frames): about 95% center and 92% peripheral on the 1D X II, upper 80s% center on the 5Ds R. MFD spec 875 mm (838 mm measured), 0.20×, sharpness holds at MFD. Noticeable focus breathing. Specs page (https://www.the-digital-picture.com/Reviews/Lens-Specifications.aspx?Lens=1122): 1130 g spec, 1135 g measured, 13/10, 9 rounded blades, 82 mm, f/16, limiter FULL / 1.5 m–inf / 0.875–1.5 m."},{id:"lensrentals",name:"Lensrentals blog: Sigma 135mm f/1.8 Art MTF charts and a look behind the curtain",url:"https://www.lensrentals.com/blog/2017/04/sigma-135mm-f1-8-art-mtf-charts-and-a-look-behind-the-curtain/",kind:"measured",tested_on:"Optical bench (Olaf), 10 copies, lens only",date:"2017-04",findings:"MTF maintained 'impressively well all the way to the corners'. Nearly flat field. Minor sagittal/tangential separation. Tight copy grouping (one slightly soft outlier excluded). An average copy at f/2.8 markedly sharper than at f/1.8. Clearly better than the Canon 135/2L, about even with the Zeiss 135/2 APO (Sigma possibly better at the edges), better than the Nikon 70-200/2.8E FL at 135mm. No numbers in text."},{id:"dustinabbott",name:"Dustin Abbott: Sigma 135mm f/1.8 HSM ART review",url:"https://dustinabbott.net/2017/05/sigma-135mm-f1-8-hsm-art-review/",kind:"review",tested_on:"Canon EOS 5D Mark IV (30MP)",date:"2017-05",findings:"Slightly behind the Sigma 85 Art and the Zeiss Milvus 135/2 in absolute sharpness, ahead of the Tamron lenses compared. LoCA almost perfectly controlled. Creamy bokeh with smoother transitions than the 85 Art. Strong flare resistance. Vignetting present at f/1.8, low by f/2. MFD 0.87 m, 0.20×. AF fast, center consistency good, outer points less consistent. Focus limiter reduces hunting. 1130 g, front-heavy."},{id:"sigma_spec",name:"Photography Life lens database: Sigma 135mm f/1.8 DG HSM Art (spec summary)",url:"https://photographylife.com/lenses/sigma-135mm-f1-8-dg-hsm-art",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 87.5 cm, 1:5, 1130 g, 82 mm filter, 9 rounded blades, 13/10, f/16, focus limiter, 91.4 × 114.9 mm. Sigma's own spec page was not fetched."},{id:"sigma_fw_z",name:"Nikon Rumors: Sigma releases new firmware updates for several Nikon F-mount lenses",url:"https://nikonrumors.com/2019/01/26/sigma-releases-new-firmware-updates-for-several-nikon-f-mount-lenses.aspx/",kind:"manufacturer",tested_on:null,date:"2019-01",findings:"Sigma firmware for Z7 + FTZ use. 135mm F1.8 DG HSM Art and 85 Art: fixes occasional overexposure when stopping down from f/5.6. Installed via the Sigma USB Dock with SIGMA Optimization Pro 1.5.0 or later. Improved version of an Oct 2018 release."},{id:"sigma_z_statement",name:"TechRadar: Sigma says its lenses are fully compatible with the Nikon Z7",url:"https://www.techradar.com/news/sigma-says-its-lenses-are-fully-compatible-with-the-nikon-z7",kind:"review",tested_on:null,date:"2018",findings:"Sigma: current lenses work with full functionality via the FTZ. Lenses without an AF motor are MF only. Some pre-Nov-2013 lenses incompatible with recent DSLRs won't work."},{id:"z8_fw3",name:"Imaging Resource: Nikon Z8 firmware 3.00 reportedly causing issues with third-party lenses",url:"https://old.imaging-resource.com/news/2025/07/03/nikon-z8-firmware-3.00-reportedly-causing-issues-with-third-party-lenses",kind:"review",tested_on:null,date:"2025-07",findings:"Nikon warned about updating with non-NIKKOR Z lenses or non-FTZ adapters attached. Tamron and Viltrox reported issues. Sigma not mentioned. No fix reported at the time."},{id:"nikon_ftz_ii",name:"Nikon: Mount Adapter FTZ II product page",url:"https://www.nikon.ie/en_IE/product/accessories/mirrorless/mount-adapter-ftz-ii",kind:"manufacturer",tested_on:null,date:null,findings:"With a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. F lenses with built-in AF motors keep full AF. Third-party lenses not addressed."},{id:"pl_ftz_guide",name:"Photography Life: Nikon FTZ and FTZ II adapter lens compatibility, explained",url:"https://photographylife.com/nikon-ftz-adapter-lens-compatibility",kind:"review",tested_on:null,date:null,findings:"Many Sigma HSM Art/Sports/Contemporary lenses are fully compatible. Some (50 Art, 24-35 Art, 85 Art) need current firmware for past Z issues (AF on very blurred subjects, video stopping, overexposure)."},{id:"frost_lensvid",name:"LensVid: Sigma 135mm f/1.8 DG HSM Art lens hands-on review (embeds Christopher Frost's video)",url:"https://lensvid.com/gear/sigma-135mm-f1-8-dg-hsm-art-lens-hands-on-review",kind:"video",tested_on:"Canon EOS 6D (20MP), per the LensVid write-up",date:"2017-11",findings:"Third-party write-up (Iddo Genuth) of Frost's video. See chris_frost."}],er={url:"https://www.youtube.com/watch?v=Vi59UXGVGQg",access:"description",summary:"The video page itself could not be fetched (YouTube is blocked here). Its title, confirmed via noembed/oEmbed with author 'Christopher Frost', is 'Sigma 135mm f/1.8 DG HSM 'Art' lens review with samples (Full-frame & APS-C)'. What was read is LensVid's written summary of the video (Nov 2017), not a transcript. Per that summary: optically superb, out-resolving the 20MP Canon 6D he tested on (the summary notes a higher-resolution body would be a better test). Very little CA or flare, good wide open. About 1.2 kg. His main criticism is AF accuracy, a precision issue with newer fast Sigma lenses, where the summary cites 70–80% hits with the Sigma 50-100 f/1.8 as a similar case. That AF finding is from a Canon DSLR (phase-detect) and may not carry over to on-sensor AF on Z bodies (inference)."},tr="1) All lab tests used Canon EF copies. Optics are identical across mounts, but no Nikon-mount lab test was found. 2) Weight: 1130 g is the published figure (Photography Life, TDP). Some retailers list other figures for the Nikon mount, and Sigma's own page was not fetched, so the Nikon-F-specific weight is unverified. The FTZ II itself adds roughly 135 g (from memory, not re-verified here), hence 'about 1.26 kg'. 3) Lenstip per-aperture resolution and Photozone LW/PH are chart images and not read. Only text-stated numbers are used. 4) Eye-detection with this lens on Z: no direct confirmation found. Body-side detection with adapted lenses is forum-reported (BCG, AF-S/AF-P Nikon lenses). 5) In-camera vignette/distortion control for third-party lenses on Z is assumed unsupported (not verified). 6) tc_compatible null: Sigma TC-1401/2001 compatibility for the Nikon mount was not checked, and Nikon TC-14E etc. are not intended for third-party lenses. 7) Z8 FW 3.00 warning: Sigma not named. Current status (Nov 2026) not checked. 8) Imaging-Resource/SLRgear full lab page (blur index) and Thom Hogan's dslrbodies review did not return readable content.",or={id:za,name:xa,short:Ra,mount:Da,adapter:La,coverage:Ma,kind:Oa,focal_mm:Ta,max_aperture:Ea,min_aperture_f:Va,aperture_blades:$a,rounded_blades:Xa,weight_g:Ba,filter_mm:Ha,focus:Wa,stabilization:ja,close_focus:Ga,quick:Ka,character:Ua,field_tips:qa,body_notes:Ja,tc_compatible:Qa,sources:Ya,chris_frost:er,research_notes:tr},nr="sigma-30-f14-dc-dn",ir="Sigma 30mm F1.4 DC DN | Contemporary (Nikon Z)",sr="Sigma 30 f/1.4 DC DN",ar="Z",rr=null,lr="DX",cr="prime",dr=[30],mr=[{focal_mm:30,f:1.4}],ur=16,hr=9,fr=!0,pr=285,gr=52,br={on_z_body:"AF",cpu:!0,motor:"Stepping motor (STM); focus-by-wire MF ring",focus_throw_deg:null,notes:"Z-mount weight is 285 g and length 75.3 mm (Sigma UK). Dust- and splash-resistant mount on the Z, L and X versions only (Sigma). On the Nikon Z30, AF was fast, accurate and quiet (Amateur Photographer). Lenstip (Micro 4/3, E-PL1/E-M10): infinity to MFD in about 0.6 s, silent, no misses in good light, and some hunting in dim, low-contrast scenes. On the E-PL1, a very slight back-focus tendency appeared only at MFD. Fstoppers (OM-1) saw occasional hunting. Lenstip (M4/3 version) measured about 220° of MF ring rotation. Z-version ring behaviour is unverified, and Sigma lists non-linear focus as L-mount only. No AF/MF switch."},wr={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"No optical stabilisation. On the Z50 II (no IBIS) stills are unstabilised: AP's Z section advises faster shutter speeds or higher ISO. The Z8 and Z5 II use their body IBIS (inferred from them being IBIS bodies; no source tested this lens on them)."},_r={mfd_m:[{focal_mm:30,value:.3}],max_mag:[{focal_mm:30,value:.14}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 30 cm and max magnification 1:7 (0.14x) (Sigma UK; Lenstip barrel marking). Working distance is roughly 300 − 75 mm lens − 16 mm flange ≈ 0.21 m. This is arithmetic, not measured, so the field is null. AP: depth of field at close range is very shallow, so focus must be precise. Lenstip: slight back-focus at MFD on one M4/3 body, and a slight focus shift (DoF moving farther away) between f/1.4 and f/2.0 from imperfectly corrected spherical aberration."},vr={headline:"Sharp, fast normal prime (45mm-equivalent on DX): excellent center wide open, best overall at f/4–f/5.6, corners best at f/5.6–f/8, no stabilisation on the Z50 II.",sweet_spot:"f/4–f/5.6",wide_open:"Center very sharp at f/1.4 (Lenstip: record 83.8 lp/mm peak on M4/3; AP: as sharp in the center as a 50mm f/1.4 DSLR prime). Edges were 'decent' at f/1.4 on M4/3 (Lenstip), but on APS-C the corners are softer from field curvature (AP MTF) and slightly soft wide open (Finding Range, X-T3). About 1.2–1.4 stops of vignetting and medium longitudinal CA wide open.",by_focal:[{focal_mm:30,center_peak:"f/4–f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"AP (Applied Imaging MTF, APS-C Sony): center peak about f/4–f/5.6, edges improve stopped down, and a slight test drop at f/8. Fstoppers (OM-1, M4/3): sharp at f/1.4, slightly better f/2.8, sharpest about f/5–f/8. Finding Range (X-T3): best f/5.6–f/8. Lenstip's per-aperture lp/mm values are in a chart image only."}],close_up_best:"f/2.8–f/5.6 (inference)",close_up_note:"No source measured sharpness at 30 cm. Inference: avoid f/1.4–f/2 at MFD unless you want the look, because DoF is razor-thin (AP), there is slight f/1.4→f/2 focus shift (Lenstip), and Lenstip saw slight back-focus at MFD on one body. f/2.8–f/5.6 gives center sharpness near peak with enough DoF to absorb focus error.",diffraction_note:"AP MTF (APS-C): slight drop already at f/8, though real images still looked sharp. Fstoppers (OM-1, 20MP M4/3, finer pixels): slight diffraction softening at f/16, visible only at 100%. No source measured f/11 on APS-C. Best-supported: f/8 is fine, f/11 is a mild loss, and f/16 is visibly softer on the Z50 II.",avoid:["f/1.4 at minimum focus for anything needing depth.","f/16 for detail work.","Slow handheld shutter speeds on the Z50 II: there is no VR in the lens or body."],confidence:"medium",confidence_reason:"One measured lab with numbers in text (Lenstip, but on Micro 4/3, which does not see the APS-C corners) plus AP's MTF lab on APS-C Sony (qualitative text). Both agree on an excellent center from f/1.4. Corner and peak apertures rest on AP plus two hands-on APS-C/M4/3 reviews. OpticalLimits could not be fetched."},yr={bokeh:"Lenstip: highlights rendered evenly without hot spots, but mechanical vignetting strongly truncates them (cat's-eye) at f/1.4. AP: round highlights and smooth transitions from f/1.8. Finding Range: smooth. Fstoppers: creamy, with some colour fringing in out-of-focus areas, gone by about f/5.",flare_sunstar:"Lenstip's only con: performance against bright light could be better. AP saw no flare in backlit tests. Fstoppers: 9 rounded blades give a pleasant 18-point starburst.",ca:"Lateral low: Lenstip about 0.09% at f/1.4 and about 0.04% from about f/2 on. Longitudinal medium: visible colour fringing out of focus at f/1.4–f/2 (Lenstip, Fstoppers), largely gone by f/5.",distortion:"Barrel. Lenstip (M4/3): −1.10% RAW, −0.30% JPEG. AP (APS-C): −2.6% SMIA TV uncorrected, so enable in-camera distortion control. Sigma says the design relies on in-camera correction, and the Z version is listed as compatible with Lens Aberration Correction.",vignetting:"Lenstip (M4/3): 38% (−1.39 EV) at f/1.4, 16% at f/2, 7% at f/2.8. AP (APS-C Sony): about 1.2 stops at f/1.4, essentially gone at f/2.8. The APS-C corners will be darker than Lenstip's M4/3 numbers.",coma_astro:"Lenstip: almost no coma problems at f/1.4–f/2. Astigmatism 6.2% (moderate). A good candidate for astro on DX (inferred from coma results).",focus_breathing:"Not measured by any source found.",other:"Lenstip (2016) gave it an Editors' Choice as best in class on M4/3, beating the Panasonic Leica 25mm f/1.4. AP's Z section (Amy Davies, Z30): fast, accurate, quiet AF and excellent sharpness with natural fall-off. On FX bodies the Z camera switches to DX crop."},kr=["f/1.4–f/2 for subject isolation with the subject centred. f/4–f/5.6 for the sharpest frame, and f/5.6–f/8 for corner-to-corner detail.","Keep Auto distortion control and Vignette control on: the design relies on in-camera correction (Sigma; AP measured −2.6% raw).","No VR on the Z50 II: use a minimum shutter of about 1/60–1/100 s, or Auto ISO with a minimum shutter speed set.","At 30 cm, stop to f/2.8–f/5.6, and check focus on the first frame (a slight MFD back-focus was seen on one body in testing).","Shield the front element from strong light sources: flare resistance is its one Lenstip con."],Ir=[{body:"z50ii",note:"Native use, 45mm-equivalent. 20.9MP (4.2 µm), close to Lenstip's E-PL1 pitch (about 4.3 µm) but showing the full APS-C corners that Lenstip did not test. No stabilisation at all. AP confirmed fast, quiet AF on the Z30 (same mount and sensor class)."},{body:"z8",note:"Auto DX crop, 19.4MP (4.35 µm), so the same per-pixel behaviour as the Z50 II, plus body IBIS. Nikon's firmware page warns against updating the camera with non-NIKKOR lenses attached (Imaging Resource, Z8 FW 3.00 news), so remove the Sigma before body updates."},{body:"z5ii",note:"DX crop only about 10MP (computed). IBIS available. Prefer the Z50 II or Z8 for detail."}],Fr=!1,Sr=[{id:"lenstip",name:"Lenstip: Sigma C 30 mm f/1.4 DC DN review (Arkadiusz Olech)",url:"https://www.lenstip.com/477.4-Lens_review-Sigma_C_30_mm_f_1.4_DC_DN_Image_resolution.html",kind:"measured",tested_on:"Olympus E-PL1 (12MP Micro 4/3, about 4.3 µm); AF also on E-M10. M4/3 crop does not reach the APS-C corners.",date:"2016-06-14",findings:"Center peak 83.8 lp/mm, a new M4/3 record (decency level about 44–45 lp/mm). Edge 'decent' already at f/1.4, similar to the Panasonic Leica 25/1.4 by f/2.8. Per-aperture values only in a chart image. Lateral CA about 0.09% at f/1.4, about 0.04% from about 1 EV down. Longitudinal CA medium. Slight focus shift f/1.4→f/2. Distortion −1.10% RAW, −0.30% JPEG (barrel). Vignetting 38% (−1.39 EV) f/1.4, 16% (−0.51 EV) f/2, 7% (−0.22 EV) f/2.8. Coma almost absent, astigmatism 6.2%. AF about 0.6 s infinity to MFD, silent, slight back-focus at MFD on E-PL1 only. Con: performance against bright light. Editors' Choice. Build page: MFD 0.3 m, 52 mm filter, 9 blades, about 220° MF rotation. Other chapters: 477.5 CA, 477.6 Distortion, 477.7 Coma, 477.8 Vignetting, 477.10 AF, 477.11 Summary."},{id:"ap",name:"Amateur Photographer: Sigma 30mm f/1.4 DC DN review (Sony/Fuji/Nikon Z sections)",url:"https://amateurphotographer.com/review/sigma-30mm-f1-4-dc-dn-review/",kind:"measured",tested_on:"Sony A6000/A6300/A7R APS-C crop (MTF via Applied Imaging, body unspecified); Fujifilm X-S10; Nikon Z30 (Z section, Amy Davies)",date:"2017 (Sony); Nikon Z section 2023",findings:"Center very sharp wide open, corners softer on MTF partly from field curvature, improving stopped down. Peak center about f/4–f/5.6, with a slight test drop at f/8. Vignetting about 1.2 stops at f/1.4 on APS-C, gone by f/2.8. Barrel −2.6% SMIA TV uncorrected. Slight lateral CA. No flare in backlit shots. Very shallow DoF close up. Z section: fast, accurate, quiet AF on the Z30. Excellent sharpness. No stabilisation on Z DX bodies, so use faster shutter speeds or higher ISO. Recommended (4 stars)."},{id:"fstoppers_rackham",name:"Fstoppers (Ivor Rackham): Is the Affordable Sigma 30mm f/1.4 DC DN Contemporary Lens Worth Buying?",url:"https://fstoppers.com/reviews/affordable-sigma-30mm-f14-dc-dn-contemporary-lens-worth-buying-review-624085",kind:"review",tested_on:"OM System OM-1 (20MP Micro 4/3)",date:"2023-01-20",findings:"Incredibly sharp for the price. Sharp at f/1.4, slightly better f/2.8, sharpest about f/5–f/8. Slight diffraction softening at f/16 only at 100%. Out-of-focus CA, mostly gone by f/5. Pleasant starburst. Fast AF with occasional hunting. Distortion and vignetting well controlled. MFD 30 cm."},{id:"findingrange",name:"Finding Range: Sigma 30mm f1.4 DC DN Contemporary Review (Fuji X)",url:"https://findingrange.com/2022/11/27/sigma-30mm-f1-4-dc-dn-contemporary-review-fuji-x/",kind:"review",tested_on:"Fujifilm X-T3 (26MP APS-C)",date:"2022-11-27",findings:"Tack sharp center wide open with slightly softer corners. Best f/5.6–f/8 (pixel-peeping). Vignetting wide open, reduced by about f/2. Slight barrel distortion. Fast, silent, accurate AF."},{id:"sigma",name:"Sigma UK: 30mm F1.4 DC DN | C product page (Nikon Z specs)",url:"https://sigmauk.com/lenses/30mm-f1-4-dc-dn-c",kind:"manufacturer",tested_on:null,date:null,findings:"Z mount: 285 g, φ70 × 75.3 mm. MFD 30 cm, 1:7, 52 mm filter, 9 rounded blades, min f/16, 9 elements in 7 groups (1 aspherical, 1 double-aspherical). Dust/splash-resistant mount on L/X/Z. Lens Aberration Correction compatible (on supported cameras, limited to what the camera supports). Non-linear focus L-mount only. Stepping motor. Hood LH586-01 supplied."},{id:"frost_rumble",name:"Christopher Frost (Rumble): Sigma 30mm f/1.4 DC DN 'C' on Canon RF (EOS R7) review, description",url:"https://rumble.com/v5r326w-sigma-30mm-f1.4-dc-dn-c-on-canon-rf-eos-r7-review.html",kind:"video",tested_on:"Canon EOS R7 and Sony a5100 (per description)",date:null,findings:"Description only: notes the lens is now on about its sixth camera system and links his original full review (https://youtu.be/3p7ukIDfbnA). Pictures taken on the Canon EOS R7 and Sony a5100. No findings in the description."},{id:"ir_z8_fw",name:"Imaging Resource news: Nikon Z8 firmware 3.00 reportedly causing issues with third-party lenses",url:"https://old.imaging-resource.com/news/2025/07/03/nikon-z8-firmware-3.00-reportedly-causing-issues-with-third-party-lenses",kind:"review",tested_on:"Nikon Z8",date:"2025-07-03",findings:"Nikon's download page warns not to update with non-NIKKOR Z lenses attached. Tamron and Viltrox advisories. Sigma not mentioned."}],Zr={url:"https://rumble.com/v5r326w-sigma-30mm-f1.4-dc-dn-c-on-canon-rf-eos-r7-review.html",access:"description",summary:"Only the description of his follow-up 'Sigma 30mm f/1.4 DC DN C on Canon RF (EOS R7)' video (Rumble) could be read. It says the lens has now come to a sixth camera system, links his original full review at https://youtu.be/3p7ukIDfbnA, and says the samples were shot on the Canon EOS R7 and Sony a5100. No transcript, no verdict and no sharpness findings were readable, and the YouTube video itself could not be opened."},Pr="1) Format caveat: Lenstip tested on Micro 4/3 (2× crop), so its edge figures sit about 76% of the way to the APS-C corner and say nothing about the DX corners. AP's APS-C MTF (qualitative) and the X-T3 review fill that gap. 2) OpticalLimits (Sony APS-C) and Photography Life pages could not be fetched, and the web-search budget ran out before more measured sources (e.g. DPReview, TDP) could be tried. 3) Z-specific: AP's Z30 section confirms AF works well. Sigma lists Lens Aberration Correction compatibility without naming Z bodies. No source tested it on the Z50 II, Z8 or Z5 II specifically. 4) No source reported focus breathing. 5) synchro_vr false because the lens has no VR. 6) Weight differs by mount (Z 285 g per Sigma UK).",Ar={id:nr,name:ir,short:sr,mount:ar,adapter:rr,coverage:lr,kind:cr,focal_mm:dr,max_aperture:mr,min_aperture_f:ur,aperture_blades:hr,rounded_blades:fr,weight_g:pr,filter_mm:gr,focus:br,stabilization:wr,close_focus:_r,quick:vr,character:yr,field_tips:kr,body_notes:Ir,tc_compatible:Fr,sources:Sr,chris_frost:Zr,research_notes:Pr},Cr="sigma-56-f14-dc-dn",Nr="Sigma 56mm F1.4 DC DN | Contemporary (Nikon Z)",zr="Sigma 56 f/1.4 DC DN",xr="Z",Rr=null,Dr="DX",Lr="prime",Mr=[56],Or=[{focal_mm:56,f:1.4}],Tr=16,Er=9,Vr=!0,$r=295,Xr=55,Br={on_z_body:"AF",cpu:!0,motor:"Stepping motor (STM); focus-by-wire MF ring",focus_throw_deg:null,notes:"Z-mount weight is 295 g and length 61.5 mm (Sigma UK). Dust- and splash-resistant mount on Z/L/X. No AF/MF switch: focus mode is set in the camera (AP). Lenstip (Sony A7R II APS-C mode): about 1 s across the full range, 'noiseless but not exactly quick', and inconsistent accuracy (a miss tended to repeat for 2–3 frames) with no front- or back-focus bias. Lenstip judged the lens unimpressive on an A6500 at Photokina. Dustin Abbott (a6400/a6500): very fast for f/1.4 with no focus misses, and silent in video. AP: brisk with occasional low-light hunting and a faint whir audible on camera mics. AP's Nikon Z30 section reports no separate AF test. DCW: quick for stills, smooth and near-silent for video. Lenstip: the focus-by-wire ring's range depends on turning speed (version not stated)."},Hr={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"No optical stabilisation. At 84mm-equivalent on the Z50 II (no IBIS) this is the lens's main practical weakness. AP's Z section flags shake risk at slow shutter speeds. The Z8 and Z5 II have body IBIS (no source tested this lens on them)."},Wr={mfd_m:[{focal_mm:56,value:.5}],max_mag:[{focal_mm:56,value:.135}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 50 cm and 1:7.4 (0.135x) (Sigma UK; Dustin Abbott 0.135x; DCW 0.14x). Working distance is roughly 500 − 61.5 mm lens − 16 mm flange ≈ 0.42 m. This is arithmetic, not measured, so the field is null. Dustin Abbott: detail stays very high at MFD (subjective, Sony a6400). Lenstip: slight focus shift toward greater distances near MFD, possibly from field curvature, judged minor."},jr={headline:"Very sharp 84mm-equivalent portrait prime: excellent center from f/1.4, best center about f/2–f/4, edges best at f/5.6–f/6.3, strong pincushion until corrected, no stabilisation on the Z50 II.",sweet_spot:"f/2–f/5.6",wide_open:"Excellent center at f/1.4 (Lenstip: 'excellent already from maximum aperture', record center 82.4 lp/mm on APS-C crop of A7R II; DCW: plenty of sharpness wide open). Edges are above Lenstip's decency level wide open but never reach 60 lp/mm and lag the center (Lenstip; AP). Dustin Abbott found the corners nearly as sharp as the center at f/1.4 on a6400. Vignetting about 1.2–1.9 EV at f/1.4.",by_focal:[{focal_mm:56,center_peak:"f/2–f/4",corners_peak:"f/5.6–f/6.3",wide_open_note:"AP (A6500): center good at f/1.4, sharper from f/2, peak f/2.8–f/4, corners improve steadily to f/5.6 and best edge to edge at f/5.6–f/6.3. OpticalLimits (quoted via SonyAddict): 'downright superb' f/2–f/8. Lenstip: significant center dip at f/2.8 from local aberration behaviour, seen on all charts. Dustin Abbott: maxed by about f/2–f/2.8."}],close_up_best:"f/2.8–f/4 (inference)",close_up_note:"No source measured resolution at 0.5 m. Dustin Abbott reports very high detail at MFD (aperture not stated). f/2.8–f/4 gives near-peak center (AP) and some depth at 0.135x. If maximum center detail matters, compare f/2.8 with f/2 and f/4, because Lenstip measured a dip at f/2.8. Lenstip noted a slight AF shift near MFD, so verify focus.",diffraction_note:"DCW (Imatest, Canon M): sharpness excellent through f/11, with a diffraction drop at f/16. AP (A6500): softening noticeable at f/16. OpticalLimits: superb to f/8. Best-supported: f/8 is free, f/11 is fine, and avoid f/16.",avoid:["f/16 except for long exposures.","Turning off distortion control: about +3.3–3.4% pincushion uncorrected.","Handheld below about 1/125 s on the Z50 II: 84mm-equivalent with no VR."],confidence:"medium",confidence_reason:"Lenstip (A7R II APS-C crop, about 18MP), DCW Imatest (Canon M), AP MTF (A6500) and OpticalLimits (summary only) all agree on an excellent center from wide open and diffraction only at f/16. Disagreement on the f/2.8 dip (Lenstip only) and on corners wide open (Abbott 'nearly as sharp' vs Lenstip and AP 'lagging') lowers confidence."},Gr={bokeh:"Mixed. AP: circular highlights and smooth transitions, with cat's-eye shapes toward the edges at f/1.4. Lenstip: smooth and even with barely visible onion rings, a moderate rim, and distinct mechanical vignetting. Dustin Abbott: subjectively busy, with more contrast and harder edges in defocused areas than he prefers (vs Samyang 85/1.4).",flare_sunstar:"Dustin Abbott: very strong flare resistance at all apertures. Lenstip's ghosting chapter was not read. Sunstars not assessed by sources read.",ca:"Lenstip: lateral CA about 0.06% or lower (peak 0.063% near f/2.8), longitudinal CA low, and no focus-shift signs from spherical aberration. AP: purple and green fringing on high-contrast edges at f/1.4 with corrections off, with some remaining even with the profile. DCW: very low fringing throughout. Abbott: close to nil.",distortion:"Strong pincushion for a short tele: Lenstip +3.43% (RAW and JPEG), AP 3.3% TV SMIA uncorrected, DCW 'a little pincushion'. Abbott found it not fully corrected by in-camera or profile corrections. Sigma's design relies on in-camera correction, and the Z version is listed as compatible with Lens Aberration Correction.",vignetting:"Lenstip (A7R II APS-C): 48% (−1.89 EV) f/1.4, 31% (−1.08 EV) f/2, 25% (−0.83 EV) f/2.8, 19% (−0.60 EV) f/4, 14% f/5.6, 13% f/8. AP: about 1.2 EV at f/1.4, 0.7 EV at f/2, almost gone at f/4. Lenstip: the lens does not cover full frame.",coma_astro:"Lenstip: coma visible at f/1.4 and reduced at f/2, with slight point deformation still at f/2. Astigmatism 5.6% (slight).",focus_breathing:"Not measured by any source found.",other:"Lenstip's cons: edges inconsistent with the rest of the frame, high distortion, heavy vignetting. Abbott: possibly the sharpest APS-C lens he had tested (2019). AP Z section (Z30): balances well on DX bodies and is recommended as an affordable portrait lens."},Kr=["Portraits: f/1.4–f/2 with the face centred, or near center where it's sharpest. Use f/5.6 for group shots where the edges matter.","Keep Auto distortion control on. Fix straight lines near the frame edge in post if needed: Abbott found residual pincushion.","On the Z50 II use at least about 1/125 s handheld (84mm-equivalent, no VR anywhere). Auto ISO with a minimum shutter speed helps.","If AF misses one frame, refocus rather than holding the burst: Lenstip saw misses repeat for 2–3 frames.","Close-ups at 0.5 m: f/2.8–f/4, then check focus at 100%."],Ur=[{body:"z50ii",note:"Native use, 84mm-equivalent. 20.9MP (4.2 µm) is close to Lenstip's A7R II APS-C crop (about 18MP, 4.5 µm), so its findings transfer well. No stabilisation, so shutter discipline matters."},{body:"z8",note:"Auto DX crop, 19.4MP (4.35 µm), so the same per-pixel behaviour plus body IBIS. Remove the Sigma before updating Z8 firmware (Nikon warning reported by Imaging Resource for FW 3.00)."},{body:"z5ii",note:"DX crop only about 10MP (computed), with IBIS. Lenstip confirmed the lens does not cover FX, so keep DX crop on."}],qr=!1,Jr=[{id:"lenstip",name:"Lenstip: Sigma C 56 mm f/1.4 DC DN review (Arkadiusz Olech)",url:"https://www.lenstip.com/550.4-Lens_review-Sigma_C_56_mm_f_1.4_DC_DN_Image_resolution.html",kind:"measured",tested_on:"Sony A7R II in APS-C mode (about 18MP, about 4.5 µm)",date:"2018-12-22",findings:"Center excellent from f/1.4, own record 82.4 lp/mm (aperture not stated in text). Significant dip by f/2.8, confirmed on all charts and attributed to an aberration maximum. Edge above the decency level (39–41 lp/mm) wide open but never 60 lp/mm. Lateral CA 0.063% peak near f/2.8 (low), longitudinal CA low, no focus shift. Distortion +3.43%. Vignetting 48% (−1.89 EV) f/1.4, 31% (−1.08) f/2, 25% (−0.83) f/2.8, 19% (−0.60) f/4, 14% (−0.43) f/5.6, 13% (−0.41) f/8. Coma visible f/1.4, reduced f/2. Astigmatism 5.6%. AF about 1 s full range, quiet, inconsistent. Slight shift near MFD. Summary cons: inconsistent edges, high distortion, heavy vignetting. Build: MFD 0.5 m, 55 mm, 9 blades, 10 elements in 6 groups. Chapters 550.3–550.11."},{id:"dcw",name:"Digital Camera World: Sigma 56mm f/1.4 DC DN | C review (Matthew Richards)",url:"https://www.digitalcameraworld.com/reviews/sigma-56mm-f14-dc-dn-or-c-review",kind:"measured",tested_on:"Canon EOS M (APS-C) test sample; Imatest",date:"2020-01-11",findings:"Plenty of sharpness wide open at f/1.4, excellent through f/11, drop at f/16 from diffraction (chart values not in text). Very low fringing including the extreme corners. Distortion score 3.26 (a little pincushion). MFD 0.5 m, 0.14x. Quick AF, near-silent in video."},{id:"ap",name:"Amateur Photographer: Sigma 56mm f/1.4 DC DN Contemporary review (Sony, X and Nikon Z sections)",url:"https://amateurphotographer.com/review/sigma-56mm-f-1-4-dc-dn-contemporary-review/",kind:"measured",tested_on:"Sony A6500 (24MP APS-C) primary, A7 III crop; Fujifilm X-S10; Nikon Z30 (Z section)",date:"2019 (Sony); Z section 2023",findings:"Center good f/1.4, sharper from f/2, peak f/2.8–f/4. Corners improve steadily to f/5.6, never matching the center. Best edge to edge f/5.6–f/6.3. Diffraction noticeable at f/16. Fringing at f/1.4 with corrections off. Vignetting about 1.2 EV f/1.4, 0.7 EV f/2, almost gone by f/4. Pincushion 3.3% SMIA TV uncorrected. Cat's-eye bokeh at the edges at f/1.4. AF brisk with some low-light hunting and a faint whir. Z section: balances well on the Z30, recommended portrait lens for DX, no stabilisation."},{id:"dustinabbott",name:"Dustin Abbott: Sigma 56mm F1.4 DC DN Review",url:"https://dustinabbott.net/2019/04/sigma-56mm-f1-4-dc-dn-review/",kind:"review",tested_on:"Sony a6400 and a6500 (24MP APS-C)",date:"2019-04-09",findings:"f/1.4 near-perfect, with a pin-sharp center and corners nearly as sharp. Contrast up at f/2 and slightly better at f/2.8. Possibly the sharpest APS-C lens he had tested. Detail very high at MFD (0.5 m, 0.135x). Longitudinal and lateral CA close to nil. Strong pincushion not fully corrected. Very strong flare resistance. Busy bokeh. Fast, accurate, silent AF. Mount gasket."},{id:"opticallimits",name:"OpticalLimits: Sigma 56mm f/1.4 DC DN Contemporary (Sony APS-C), conclusion as quoted by SonyAddict",url:"https://sonyaddict.com/?p=11806",kind:"measured",tested_on:"Sony APS-C body (not stated in excerpt)",date:null,findings:"Original review at https://opticallimits.com/sony-alpha-aps-c-lens-tests/1092-sigma56f14 could not be fetched. Excerpt: sharpness 'downright superb' between f/2 and f/8. Lateral CA very low. Distortion on the high side for a prime. Vignetting pronounced at f/1.4 but largely corrected in JPEG/RAW. Highly recommended."},{id:"sigma",name:"Sigma UK: 56mm F1.4 DC DN | C product page (Nikon Z specs)",url:"https://sigmauk.com/lenses/56mm-f1-4-dc-dn-c",kind:"manufacturer",tested_on:null,date:null,findings:"Z mount: 295 g, φ70 × 61.5 mm. MFD 50 cm, 1:7.4, 55 mm filter, 9 rounded blades, min f/16, 10 elements in 6 groups, 28.5° angle of view. Dust/splash-resistant mount on L/X/Z. Lens Aberration Correction compatible (limited to what the camera supports). Relies on the body for distortion and vignetting correction."}],Qr={url:"https://www.youtube.com/watch?v=V9a7KXvboNI",access:"title-only",summary:`A web search returned a YouTube video titled "Sigma 56mm f/1.4 DC DN 'C' lens review with samples". The title format matches Frost's usual naming, but the channel could not be confirmed because the page could not be fetched. No description, transcript or verdict was readable, and nothing about the lens is attributed to him.`},Yr="1) Conflict on the f/2.8 behaviour: Lenstip measured a significant center dip at f/2.8 on all charts, while AP puts the center peak at f/2.8–f/4 and Abbott saw a mild gain at f/2.8. Possibly copy or test-body dependent. The sweet spot is kept broad (f/2–f/5.6). 2) Corners wide open: Abbott says nearly as sharp as the center, while Lenstip and AP say they lag, with best edges at f/5.6–f/6.3 (AP). Two measured sources outweigh one subjective one. 3) Distortion sign: Lenstip gives +3.43% without naming the type. AP, DCW and Abbott all call it pincushion. 4) OpticalLimits' own page could not be fetched, so only a third-party excerpt is used. 5) No source tested the Z version on Z50 II, Z8 or Z5 II for AF. AP's Z30 section gives handling only. 6) The Frost video channel is unverified, and the web-search budget ran out before a confirmation search. 7) synchro_vr false because the lens has no VR.",el={id:Cr,name:Nr,short:zr,mount:xr,adapter:Rr,coverage:Dr,kind:Lr,focal_mm:Mr,max_aperture:Or,min_aperture_f:Tr,aperture_blades:Er,rounded_blades:Vr,weight_g:$r,filter_mm:Xr,focus:Br,stabilization:Hr,close_focus:Wr,quick:jr,character:Gr,field_tips:Kr,body_notes:Ur,tc_compatible:qr,sources:Jr,chris_frost:Qr,research_notes:Yr},tl="thypoch-simera-28-f14",ol="Thypoch Simera 28mm f/1.4 ASPH (Nikon Z)",nl="Simera 28 f/1.4",il="Z",sl=null,al="FX",rl="prime",ll=[28],cl=[{focal_mm:28,f:1.4}],dl=16,ml=14,ul=!0,hl=368,fl=49,pl={on_z_body:"MF (manual-focus lens)",cpu:!1,motor:"None. Fully manual helicoid, manual aperture ring, no electronic contacts.",focus_throw_deg:null,notes:"No electronic contacts: no EXIF, no camera-controlled aperture, no AF (OpticalLimits, tested on Nikon Z). Dustin Abbott measured about 100° of focus rotation, but on the Leica M version; the Z version is longer (72.1 mm vs 55 mm per Thypoch's spec table / OpticalLimits) and its throw was not found, so the field is null. M-version reviewers note slight extra drag at about 0.7 m, a deliberate detent where rangefinder coupling ends (Phillip Reeve, Dustin Abbott, PetaPixel). Aperture ring: 1/3-stop clicks f/1.4–f/8, full stops f/11 and f/16, with a click/declick switch (Abbott, M version; Thypoch lists the 'dual aperture mode'). Reeve found the click spacing irregular. Fstoppers (Sony E version) found the throw nearly ideal, with a fixed focus tab. Thypoch newsroom: a 'Type II' focus-tab version also exists (OpticalLimits news); which one the owner has is not known. Focus with peaking plus magnified view; with no CPU the Z8 has no focus-distance readout."},gl={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"Native Z mount, so FTZ II does not apply. The body cannot read the focal length, so enter 28 mm and f/1.4 under Setup menu > Non-CPU lens data on the Z8 and Z5 II. Nikon's Z8 manual says recording these values enables on-board vibration reduction tuned to the lens (and records focal length/aperture in EXIF). Without it, IBIS does not know the focal length. The Z50 II has no IBIS for stills."},bl={mfd_m:[{focal_mm:28,value:.4}],max_mag:[{focal_mm:28,value:.08}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:!1,notes:"MFD 0.4 m from the sensor plane (Thypoch, OpticalLimits, Lenstip spec). Max magnification 0.08× (Lenstip spec database); Phillip Reeve measured 1:12.8 (about 0.078×) on the M version. Thypoch does not publish magnification. Floating element group for close-range correction (Thypoch). Reeve: the close-range part of the focus throw is very short, which makes precise close focusing hard. Effective-aperture loss at 0.08× is negligible (about 1/10 stop)."},wl={headline:"Rendering-first compact 28: pretty f/1.4 look with soft corners and heavy vignetting; centre outstanding by f/2.8, whole frame best at f/5.6–f/8.",sweet_spot:"f/5.6–f/8",wide_open:"Centre good to 'very good' at f/1.4 but not biting; corners soft (OpticalLimits on 45MP Z; Abbott 'very soft' on 61MP; Fstoppers soft). About 2.6–3.2 EV vignetting. Contrast and LoCA improve noticeably by f/2.",by_focal:[{focal_mm:28,center_peak:"f/2.8–f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"OpticalLimits (Nikon Z, 45MP): f/1.4 centre very good, corners soft; f/2 corners still unimpressive; f/2.8 centre outstanding, borders very sharp, corners good; peak around f/5.6 with very good corners. Abbott (61MP a7RV, M version adapted): centre very high detail by f/2, midframe pin-sharp f/4–f/5.6, corners peak f/8. Reeve (24MP M10): best f/5.6–f/8 overall; at 0.9 m it was already good across the frame at f/1.4."}],close_up_best:"f/2.8–f/4",close_up_note:"Phillip Reeve (42MP A7rII, M version): centre slightly soft wide open at close range; one to two stops down noticeably improves contrast and resolution. OpticalLimits (Z): focus shifts rearward when stopping down, a potential issue at close focus, so check focus magnified at the shooting aperture.",diffraction_note:"Abbott (61MP a7RV): slight diffraction softening at f/11 and f/16, not severe. OpticalLimits (45MP Z): peak around f/5.6; numeric values beyond were only in a chart image. On the Z8 expect a small loss from f/11.",avoid:["Do not expect sharp corners before f/5.6 on the Z8.","Do not focus wide open and then stop down at close range: focus shifts rearward (OpticalLimits).","Do not shoot into strong light without the hood."],confidence:"medium",confidence_reason:"One measured test on Nikon Z (OpticalLimits, 45MP; chart values not readable, verbal grades used). Abbott (61MP) and Reeve (24MP) visual tests on the M version agree on soft wide-open corners and an f/5.6–f/8 peak. Focus-shift and flare verdicts conflict between sources."},_l={bokeh:"Phillip Reeve rates it the best of the fast 28mm M lenses: well-corrected field curvature and 14 rounded blades keep highlights round when stopped down. Abbott: lemon-shaped highlights near the edges at f/1.4 give mild swirl, round by f/2.8; transitions very nice. OpticalLimits: clean centre discs, good background blur, but foreground blur 'more nervous' with outlined edges. PetaPixel (film) found nothing special. Onion rings from the asphere can show (Reeve).",flare_sunstar:"Mixed. OpticalLimits (Z): flare 'very obvious' in contra-light, use the hood. Reeve (pre-production, limited test): various artifacts with strong point sources, including sensor reflections. Abbott: good flare resistance, mostly one ghost blob. PetaPixel: moderately controlled. Sunstars: Reeve saw distinct, even rays f/5.6–f/16; OpticalLimits: first rays at f/4, pointy at f/8, best at f/16.",ca:"Lateral CA low: OpticalLimits about 0.8 px at the borders at f/1.4, about 0.4 px stopped down; Reeve and Abbott minimal. LoCA moderate: OpticalLimits noticeable at f/1.4–f/2, much reduced at f/2.8, gone by f/4; Reeve green behind / magenta in front, not fully gone at f/2.",distortion:"Low pincushion: OpticalLimits about 0.7% (no in-camera correction possible). Reeve: low, slightly wavy. Abbott: next to none.",vignetting:"Heavy wide open. OpticalLimits (Z): about 2.6 EV at f/1.4, about 1.3 EV from f/2.8. Reeve (M10): 3.2 EV at f/1.4, 2.4 at f/2, 2.1 at f/2.8, 1.9 from f/4. Abbott: nearly 3 stops of correction needed. No profile is applied in-camera (no CPU).",coma_astro:"Reeve: noticeable but small at f/1.4, most 'wings' gone at f/2, f/5.6 for clean extreme corners. Abbott: average coma toward the edges. Usable for astro at f/2 with some edge coma.",focus_breathing:"Not measured by any source found.",other:"OpticalLimits optical score 6/10, build 9/10. PetaPixel's lab test (a7RV, adapted M version) found the lens measured closer to f/1.7 than f/1.4 (method not stated in what was read). Sony E/M-adapted results on thick-filter-stack bodies are worse than on Z: Reeve's A7rII corners needed f/11. The Z filter stack is thinner, and OpticalLimits tested natively on Z."},vl=["Before the first shot: Setup menu > Non-CPU lens data, store 28 mm f/1.4 and select it, so IBIS is set for 28 mm and EXIF records the lens.","Focus at the shooting aperture with peaking + magnified view, especially closer than about 1 m: focus moves rearward as you stop down (OpticalLimits).","For character: f/1.4–f/2 with the subject near the centre; for landscapes edge to edge: f/5.6–f/8, and stop at f/11.","Always fit the hood; flare is the most-criticised trait in backlight. Use f/8–f/16 for sunstars.","Add vignetting (about 2.5–3 EV at f/1.4) and distortion corrections manually in raw processing; no profile is applied automatically."],yl=[{body:"z8",note:"45.7MP shows soft corners until f/5.6 and LoCA at f/1.4–f/2 (OpticalLimits tested at 45MP on Z). Enter Non-CPU lens data for IBIS. No distance scale in the EVF."},{body:"z5ii",note:"24.5MP is more forgiving; Reeve's 24MP M10 results (good across the frame at f/1.4 at 0.9 m, best f/5.6–f/8) are a fair guide. Enter Non-CPU lens data for IBIS."},{body:"z50ii",note:"About 42mm-equivalent framing on DX; the soft corners and much of the vignetting fall outside the frame, so f/1.4–f/2 is more usable. No IBIS. Whether the Z50 II offers Non-CPU lens data was not verified."}],kl=!1,Il=[{id:"opticallimits",name:"OpticalLimits: Thypoch Simera 28mm f/1.4 (Z) review",url:"https://opticallimits.com/nikon/nikon-z/thypoch-simera-28mm-f-1-4-z-review/",kind:"measured",tested_on:"Nikon Z full-frame, 45MP (Imatest MTF)",date:"2024-07",findings:"Z version: 368 g, φ54 × 72.1 mm, 49 mm filter, 14 blades, 11/7 (1 ED, 1 asph, 3 HRI), MFD 0.4 m, floating system. All-manual: no AF, EXIF or camera-controlled aperture. Resolution (verbal; numbers only in chart image): f/1.4 centre very good, corners soft; f/2 corners unimpressive; f/2.8 centre outstanding, borders very sharp, corners good; peak around f/5.6 with very good corners; focus field of the tested copy slightly wavy. Vignetting about 2.6 EV at f/1.4, about 1.3 EV from f/2.8. Distortion about 0.7% pincushion. Lateral CA about 0.8 px at f/1.4, about 0.4 px stopped down. LoCA noticeable at f/1.4–f/2, much reduced f/2.8, gone by f/4. Focus shift rearward when stopping down; check magnified, especially at close focus. Flare very obvious in contra-light. Sunstars from f/4, best at f/16. Bokeh: clean centre highlights, edge discs deteriorate at f/1.4, foreground blur nervous. Scores: optics 6, build 9, price/performance 7.5."},{id:"phillipreeve",name:"phillipreeve.net: Review: Thypoch Simera 28mm 1.4",url:"https://phillipreeve.net/blog/review-thypoch-simera-28mm-1-4/",kind:"review",tested_on:"Leica M10 (24MP), Sony A7rII (42MP), Sony A7III (24MP), film; M-mount version",date:"2024-04 (updated 2025-12)",findings:"331 g (M), 49 mm filter, 14 rounded blades, 0.40 m MFD, 1:12.8 measured max magnification. Infinity on M10: very good, slight midzone dip and lower corner contrast at f/1.4–f/2, best f/5.6–f/8; on A7rII much worse (midframe needs f/5.6, corners best at f/11). At 0.9 m: very good across the frame already at f/1.4. Close (A7rII centre): slightly soft wide open, 1–2 stops down improves noticeably. No relevant focus shift; field curvature well corrected. Best bokeh of fast 28mm M lenses. Lateral CA minimal; LoCA average, not fully gone at f/2. Vignetting 3.2 / 2.4 / 2.1 / 1.9 EV at f/1.4 / f/2 / f/2.8 / f/4+. Coma small at f/1.4, mostly gone at f/2, clean corners f/5.6. Sunstars distinct f/5.6–f/16. Flare artifacts with strong point sources (pre-production test). Close-range focus throw very short. Comments: Z filter stack slightly thinner than Sony E."},{id:"dustinabbott",name:"Dustin Abbott: Thypoch Simera 28mm F1.4 Review",url:"https://dustinabbott.net/2024/01/thypoch-simera-28mm-f1-4-review/",kind:"review",tested_on:"Sony a7RV (61MP) and Alpha 1 (50MP), M version via adapters; visual chart crops",date:"2024-01",findings:"330 g, 49 mm, 14 rounded blades, 0.4 m MFD (estimates about 0.09×), 11/7 with floating group. f/1.4 centre good not pin-sharp, corners very soft; f/2 centre very high contrast; f/4–f/5.6 midframe pin-sharp; f/8 corners peak 'fantastic'; f/11–f/16 slight diffraction softening. Close-to-medium distances strong. Bokeh: lemon highlights near edges at f/1.4 (mild swirl), round by f/2.8. LoCA minimal; lateral CA not evident. Good flare resistance. Coma average. Vignetting nearly 3 stops (about +73 LR). Distortion next to none. Focus rotation about 100°; 1/3-stop clicks to f/8; declick switch."},{id:"fstoppers",name:"Fstoppers: We Review the Thypoch Simera 28mm f/1.4 Lens",url:"https://fstoppers.com/gear/review-thypoch-simera-28mm-f14-lens-673893",kind:"review",tested_on:"Sony a7C R (61MP), Sony E version",date:null,findings:"Corners soft at f/1.4, good by about f/5.6 (brick-wall series f/1.4–f/16). Vignetting noticeable at f/1.4, well controlled by f/2. Minimal distortion. Well-damped focus ring with near-ideal throw; fixed focus tab."},{id:"petapixel",name:"PetaPixel: Thypoch Simera 28mm f/1.4 and Eureka 50mm f/2 Review",url:"https://petapixel.com/2025/07/01/thypoch-simera-28mm-f-1-4-and-eureka-50mm-f-2-review-great-options-for-film-fans",kind:"review",tested_on:"Sony a7RV (61MP) with M-to-E adapter for charts; Voigtländer Bessa R2a for film",date:"2025-07",findings:"f/1.4 centre good, edges/corners soft and smudgy; f/2.8 edges improve, corners still poor; measured closer to f/1.7 than f/1.4 (their lab). Bokeh nothing special. Flare moderately controlled with some ghosting. Small LoCA. Verdict 'maybe': good build and feel at $700, not a top performer."},{id:"thypoch",name:"Thypoch: Simera product page",url:"https://thypoch.com/Simera",kind:"manufacturer",tested_on:null,date:null,findings:"F1.4–F16, 14 blades, 11 elements in 7 groups (ED, HRI, aspherical), floating elements for close range, MFD 0.4 m from sensor plane, 49 mm filter, φ54 mm. Weights per mount listed as ≈330/368/353/344/347 g and lengths 55 / 72.1 mm; the Z column assignment (368 g, 72.1 mm) is consistent with OpticalLimits."},{id:"lenstip_spec",name:"Lenstip specification database: Thypoch Simera 28 mm f/1.4",url:"https://www.lenstip.com/2305-Thypoch_Simera_28_mm_f_1.4-lens_specifications.html",kind:"manufacturer",tested_on:null,date:null,findings:"Spec page only (no Lenstip test): MFD 0.4 m, max magnification 0.08×, 14 blades, f/16 min, 49 mm. No full review exists."},{id:"nikon_z8_noncpu",name:"Nikon Z8 Online Manual: Non-CPU Lens Data",url:"https://onlinemanual.nikonimglib.com/z8/en/sum_non-cpu_lens_data_308.html",kind:"manufacturer",tested_on:null,date:null,findings:"Setup menu item. Record a lens number, focal length and maximum aperture for a non-CPU lens to use features normally reserved for CPU lenses, including on-board vibration reduction. The page phrases it for lenses on an optional mount adapter; a contactless native Z lens is also seen as non-CPU (inference)."}],Fl={url:null,access:"not-found",summary:"No Christopher Frost review of the Thypoch Simera 28mm f/1.4 was found. Searches for his name with the lens, a youtube.com-restricted search and a search on his usual title format returned only other reviewers (Dustin Abbott, PetaPixel, Fstoppers, Phillip Reeve). Nothing is attributed to him."},Sl="1) Only OpticalLimits tested the Nikon Z version; its MTF values are in a chart image, so verbal grades are used. Abbott, Fstoppers and PetaPixel tested on 61MP Sony bodies (M version adapted or E version); Reeve on 24MP M10 and 42MP A7rII. Sony thick filter stacks hurt this lens's corners (Reeve), so Sony-based corner results may be pessimistic for Z. 2) Focus shift conflict: OpticalLimits (Z) reports rearward shift on stopping down; Reeve (M) reports none relevant. Tip follows the cautious OpticalLimits finding. 3) Flare conflict: OpticalLimits and Reeve negative, Abbott positive, PetaPixel moderate. 4) Bokeh: Reeve very positive, PetaPixel neutral, OpticalLimits mixed (foreground nervous). 5) Weight 368 g and length 72.1 mm for Z from OpticalLimits; the M version is 330 g / 55 mm. 6) Focus throw of the Z version not found (100° is Abbott's M-version figure). 7) Whether the Z version keeps the M version's 0.7 m detent and infinity lock was not confirmed; a Reeve commenter said the Z version would drop the infinity lock (unverified). 8) Digital Camera World, 35mmc, Australian Photography and Alik Griffin reviews exist but were not read. No Photography Life, DPReview or Lenstip review found. 9) Z50 II Non-CPU lens data availability not verified.",Zl={id:tl,name:ol,short:nl,mount:il,adapter:sl,coverage:al,kind:rl,focal_mm:ll,max_aperture:cl,min_aperture_f:dl,aperture_blades:ml,rounded_blades:ul,weight_g:hl,filter_mm:fl,focus:pl,stabilization:gl,close_focus:bl,quick:wl,character:_l,field_tips:vl,body_notes:yl,tc_compatible:kl,sources:Il,chris_frost:Fl,research_notes:Sl},Pl="tokina-100-f28-macro",Al="Tokina AT-X M100 AF PRO D 100mm f/2.8 Macro (Nikon F)",Cl="Tokina 100 f/2.8 Macro",Nl="F",zl="FTZ II",xl="FX",Rl="macro",Dl=[100],Ll=[{focal_mm:100,f:2.8}],Ml=32,Ol=9,Tl=!1,El=490,Vl=55,$l={on_z_body:"MF only (screw-drive lens on FTZ II)",cpu:!0,motor:"None in lens: screw-drive AF powered by a DSLR body motor (Tokina; Photozone). The FTZ II has no drive, so there is no AF on Z bodies.",focus_throw_deg:null,notes:"One-Touch Focus Clutch: push the focus ring forward for AF, pull it back toward the mount for MF (Tokina; Ken Rockwell; Photozone). On the FTZ II, pull it back to MF or the ring will not focus the lens (inference from the clutch design). Focus limiter switch: Tokina says it restricts focus to the macro or the non-macro range, and Rockwell says it blocks the 1:2–1:1 range. If the ring stops short of 1:1, check the limiter. Whether the limiter acts in MF was not verified. Not internal focusing: the inner tube extends considerably toward the subject as you focus closer (Photozone). The 55 mm filter thread moves in and out but does not rotate (Tokina; Rockwell). Aperture ring: Tokina says CPU-equipped Nikon bodies need it set to f/32 or the shutter will not release, so lock it at f/32 and set aperture from the camera. Nikon's FTZ table lists AF Type D lenses as MF with the electronic rangefinder (in-focus indicator) supported (as recorded in the GearCard AF Micro 60 record); not specifically confirmed for this third-party lens. Focus throw not found."},Xl={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:"3-axis (yaw, pitch, roll) via FTZ II on Z8 and Z5 II. None on Z50 II (no IBIS).",notes:"Nikon FTZ II page (fetched 2026-11-05): with a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. The CPU passes 100 mm to IBIS. Nikon names only those 3 axes, so x/y shift, which dominates at 1:1, is not corrected (inference). Use flash, a tripod or a rail for 1:1."},Bl={mfd_m:[{focal_mm:100,value:.3}],max_mag:[{focal_mm:100,value:1}],working_distance_mm_at_max_mag:115,effective_aperture_at_max_mag:"About f/5.6 at 1:1 when wide open (Ken Rockwell's table: f/2.8 becomes f/5.6 and f/32 becomes f/64 at 1:1). N_eff ≈ N × (1 + m) = N × 2 at 1:1, a 2-stop loss. Whether Z bodies show the reduced value through the FTZ II was not verified.",camera_displays_effective:null,notes:`MFD 0.3 m from the focal plane for 1:1 (Tokina; Photozone; Rockwell). Free working distance at 1:1 is about 115 mm (4.5 in) from the front of the lens, measured by Ken Rockwell. Tokina only says 'a little working distance'. An Imaging Resource user's '~12 in' figure matches the MFD, not the working distance, so it is disregarded. Arithmetic check: 300 mm MFD − 46.5 mm F flange − 95 mm lens length − the extended inner tube ≈ 115 mm if the tube extends about 40 mm (extension not measured; consistent, not proof).

Effective aperture at 1:1 (×2, −2 stops), computed: f/2.8→f/5.6, f/4→f/8, f/5.6→f/11, f/8→f/16, f/11→f/22, f/16→f/32, f/32→f/64. At 1:2 the factor is ×1.5 (−1.2 stops): f/5.6→f/8.4.

The lens extends toward the subject while focusing, which shrinks the room for light.`},Hl={headline:"Superb, cheap classic 100mm macro: very good from f/2.8, excellent from f/4–f/8, no focus shift, about 115 mm of room at 1:1. Manual focus only on Z: pull the clutch back.",sweet_spot:"f/4–f/8",wide_open:"Very good centre and borders at f/2.8; FX corners one step softer, nearly equal to the border from f/4 (Photozone FX). Lenstip: edge over 30 lp/mm at f/2.8 (8MP APS-C). Strong bokeh fringing wide open (magenta in front, green behind).",by_focal:[{focal_mm:100,center_peak:"f/4–f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"Photozone FX (Nikon D3X 24MP, 2017): centre very good wide open, excellent at medium apertures; border very good wide open with little gain stopped down; corner one step softer wide open, nearly matching the border from f/4. DxOMark (D800 36MP): good centre wide open, across the frame by f/4, peak f/8, excellent corner-to-corner at f/11. Lenstip (Canon 20D 8MP APS-C): centre 42.8 lp/mm at f/4 ('sensational'). Photozone DX (D200): excellent f/2.8 to about f/11."}],close_up_best:"f/4–f/5.6 set (f/8–f/11 effective at 1:1)",close_up_note:"No source measured resolution at 1:1, so this is calculated. At 1:1 the effective aperture doubles (Rockwell: f/2.8 shows as f/5.6). DxOMark (36MP) peaks at f/8 at distance and Photozone DX saw diffraction beyond f/11 on 10MP. On the Z8's 4.35 µm pixels, softening starts at about f/8–f/11 effective, which is set f/4–f/5.6 at 1:1. Photozone DX also advises avoiding very small apertures in macro. Focus-stack rather than stopping to f/16+ (f/32+ effective). No focus shift (Photozone FX), so focusing wide open is safe.",diffraction_note:"Photozone DX (D200 10MP): diffraction beyond about f/11. DxOMark (D800 36MP): still excellent at f/11 at distance. Ken Rockwell: diffraction limits sharpness by f/8 on flat subjects (not measured). At 1:1 every set aperture is one effective step of two stops smaller.",avoid:["Do not leave the clutch in the AF (forward) position: the ring will not focus the lens on the FTZ II.","Avoid set f/16–f/32 at 1:1 (f/32–f/64 effective) except as a last resort on the Z8.","Do not count on IBIS at 1:1 (no x/y shift correction for F lenses; none on the Z50 II)."],confidence:"medium",confidence_reason:"Photozone FX (D3X 24MP) and DxOMark (D800 36MP) agree on a strong lens peaking at f/5.6–f/8 across the frame. Lenstip and Photozone DX are low-resolution APS-C. No test above 36MP and none at 1:1, so the close-up guidance is computed (low confidence on that part)."},Wl={bokeh:"Good. Photozone FX: very smooth blur in front of the focal plane, slightly less smooth in the transition and behind; near-circular highlights stopped down with some outlining. Rockwell: mostly 'wonderful', varying with distance. Blades mostly straight (Rockwell).",flare_sunstar:"Lenstip: good performance against bright light. Sunstars not documented (9 straight blades would give 18-point stars; inferred, not tested).",ca:"Lateral CA: Photozone FX about 1 px average at the borders from f/5.6; Photozone DX above average, over 1 px; Lenstip and DxOMark well controlled. Bokeh fringing (LoCA): Photozone FX fairly strong wide open, magenta in front, green behind, decreasing stopped down; Rockwell slight spherochromatism.",distortion:"Essentially none: Photozone FX 0.06% barrel, DX 0.07%; Lenstip zero; Rockwell none visible.",vignetting:"Low: Photozone FX about 2/3 stop wide open; DxOMark (D800) very low at f/2.8, nearly gone by f/4, gone by f/5.6; Lenstip slight.",coma_astro:"Lenstip: small coma. Not an astro lens.",focus_breathing:"Not measured. The lens extends to focus, so framing changes strongly from infinity to 1:1.",other:"Photozone FX: no focus shift when stopping down. Ratings 5/5 optics, 5/5 build, 5/5 price/performance, but the lack of a motor and the extending tube feel dated. DxOMark: score 31, 19 P-Mpix on D800; nearly matches the Nikon AF-S 105 VR Micro, sharper stopped down, less sharp at full aperture. Weight: Tokina 490 g, Photozone 540 g, Rockwell measured 513 g."},jl=["Pull the focus ring back toward the camera (MF clutch), lock the aperture ring at f/32 and set aperture on the command dial.","At 1:1 you get about 115 mm of room and the barrel grows toward the subject. Light from the side or use a diffused flash.","At 1:1 you lose 2 stops: f/4 set is f/8 effective. Shoot f/4–f/5.6 for the sharpest frame, then focus-stack instead of using f/16+.","To hit 1:1, set the ring to minimum focus and move the camera or rail. If the ring stops short, check the focus limiter switch.","At normal distances it is a fine 100mm portrait/tele: f/2.8 is very good, f/4–f/8 excellent across the frame, with no focus shift."],Gl=[{body:"z8",note:"45.7MP: wide-open FX corners and LoCA are visible; f/5.6–f/8 at distance. At 1:1, diffraction appears from about set f/4–f/5.6. IBIS 3-axis via FTZ II."},{body:"z5ii",note:"24.5MP matches Photozone's D3X test: very good from f/2.8, excellent at medium apertures. At 1:1, set f/8 (f/16 effective) is still acceptable per pixel. IBIS 3-axis via FTZ II."},{body:"z50ii",note:"About 150mm-equivalent framing on DX, and soft FX corners fall outside the frame. 20.9MP (about 4.2 µm), similar diffraction behaviour to the Z8. No IBIS: flash or tripod at 1:1."}],Kl=null,Ul=[{id:"photozone_fx",name:"Photozone (OpticalLimits): Tokina AF 100mm f/2.8 AT-X Pro D macro (FX) review",url:"https://photozone.de/nikon_ff/819-tokina10028atxfx?start=1",kind:"measured",tested_on:"Nikon D3X (24.5MP FX) per sample-image captions",date:"2017-09",findings:"Centre very good wide open, excellent at medium apertures; border very good wide open, little gain stopped down; corner one step softer wide open, nearly equal to the border from f/4 (LW/PH only in chart). Distortion 0.06% barrel. Vignetting about 2/3 stop wide open. Lateral CA about 1 px from f/5.6. Bokeh fringing fairly strong wide open, magenta in front, green behind. Bokeh smooth in front, less so behind; some outlining. No focus shift. Page 1: 540 g, 0.3 m, 1:1, 9 blades, 55 mm non-rotating front, screw-drive AF, one-touch clutch, focus limiter; the inner tube extends considerably. Verdict (https://photozone.de/nikon_ff/819-tokina10028atxfx?start=2): very solid optics, 5/5/5 stars."},{id:"dxomark",name:"DXOMARK: Tokina AT-X M100 AF Pro D 100mm f/2.8 Nikon mount lens review",url:"https://www.dxomark.com/tokina-at-x-m100-af-pro-d-100mm-f2-8-nikon-mount-lens-review-excellent-all-round-performance/",kind:"measured",tested_on:"Nikon D800 (36MP FX)",date:"2013-12",findings:"Score 31, sharpness 19 P-Mpix. Good centre at f/2.8; across the frame by f/4; peak f/8; excellent corner-to-corner at f/11. Vignetting very low wide open, gone by f/5.6. Distortion and CA well controlled (no numbers in text). Nearly matches the Nikon AF-S 105 VR Micro, sharper stopped down; the Nikon is sharper wide open with better corners."},{id:"photozone_dx",name:"Photozone: Tokina AF 100mm f/2.8 AT-X Pro D macro (Nikon APS-C) review",url:"https://www.photozone.de/nikon--nikkor-aps-c-lens-tests/269-tokina-af-100mm-f28-at-x-pro-d-macro-review--test-report?start=1",kind:"measured",tested_on:"Nikon D200 (10.2MP DX)",date:null,findings:"Excellent centre and border from f/2.8 to about f/11; diffraction beyond about f/11. Distortion 0.07%. Vignetting well controlled. CA above average, over 1 px at the borders. Avoid very small apertures in macro use."},{id:"lenstip",name:"Lenstip: Tokina AT-X M100 PRO AF D 100 mm f/2.8 review",url:"https://www.lenstip.com/21.4-Lens_review-Tokina_AT-X_M100_PRO_AF_D_100_mm_f_2.8_Image_resolution.html",kind:"measured",tested_on:"Canon EOS 20D (8.2MP APS-C), Canon-mount sample",date:"2007-10",findings:"Centre 42.8 lp/mm at f/4 ('sensational'); edge over 30 lp/mm at f/2.8; sharper than the Tamron 90 at f/2.8, comparable f/4–f/32. Summary (https://www.lenstip.com/21.11-Lens_review-Tokina_AT-X_M100_PRO_AF_D_100_mm_f_2.8_Summary.html): exquisite image quality, good CA correction, zero distortion, small coma, slight vignetting, good against bright light; average AF."},{id:"kenrockwell",name:"Ken Rockwell: Tokina 100mm f/2.8 AT-X PRO AF Macro review",url:"https://kenrockwell.com/tokina/100mm-f28.htm",kind:"review",tested_on:"Nikon D3 (12MP FX) and D7000 (16MP DX); qualitative",date:null,findings:"Measured 512.6 g (spec 540 g). MFD 0.3 m. Measured working distance at 1:1 about 115 mm (4.5 in). 9 mostly straight blades. 55 mm thread moves in and out, does not rotate. 9/8 with floating elements. Limiter blocks 1:2–1:1. Push/pull one-touch clutch (pull for MF). f/32 at infinity, f/64 at 1:1; max aperture f/5.6 at 1:1. Claims f/5.6 sharpest and diffraction by f/8 on flat subjects (not measured). Bokeh mostly wonderful; slight spherochromatism; no visible distortion. Lower weight as a source."},{id:"tokina",name:"Tokina: AT-X M100 PRO D product page",url:"https://tokinalens.com/product/at_x_m100_pro_d/",kind:"manufacturer",tested_on:null,date:null,findings:"9/8, MFD 0.3 m, 1:1, 9 blades, 55 mm, f/32 min, 74 × 95 mm, 490 g. One-Touch Focus Clutch: push forward for AF, pull back for MF. Limiter selects macro or non-macro range. Nikon F version has no AF motor. On CPU Nikon bodies the aperture ring must be at f/32 or the shutter will not release."},{id:"nikon_ftz_ii",name:"Nikon: Mount Adapter FTZ II product page",url:"https://www.nikon.ie/en_IE/product/accessories/mirrorless/mount-adapter-ftz-ii",kind:"manufacturer",tested_on:null,date:null,findings:"Non-VR F-mount lens: yaw, pitch and roll corrected in-camera. Full AF only for AF-S, AF-P and AF-I types; screw-drive lenses are not in that group."},{id:"imaging_resource_users",name:"Imaging Resource: Tokina 100mm f/2.8 AT-X 100 AF PRO D Macro (user reviews; not lab tested)",url:"https://old.imaging-resource.com/lenses/tokina/100mm-f2.8-at-x-100-af-pro-d/review",kind:"forum",tested_on:"Various (user reports, e.g. D70s, film)",date:"2006–2024",findings:"Not lab tested. Users: sharp, slow hunting AF, clutch works well, limiter helps but doesn't eliminate hunting, some CA wide open, corners soft wide open on film improving by f/4."}],ql={url:null,access:"not-found",summary:"No Christopher Frost review of the Tokina AT-X M100 AF PRO D was found. A search with his name and the lens returned the newer Tokina FíRIN/atx-i 100mm reviews from other outlets, plus TDP and Photozone. Nothing is attributed to him."},Jl="1) Version: Photozone FX, DxOMark, Photozone DX and Lenstip all tested the AT-X M100 AF PRO D (Lenstip on a Canon-mount sample). The later atx-i 100mm and FíRIN 100mm FE are different products and were not used. 2) Weight conflict: Tokina 490 g (current page), Photozone 540 g, Rockwell measured 512.6 g; manufacturer value used. 3) Working distance 115 mm rests on one measurement (Rockwell) plus a consistency check; Tokina publishes none. 4) Effective-aperture display on Z bodies via FTZ II not verified. 5) The-Digital-Picture review failed to load (client error) and Imaging Resource has no lab test. 6) Rounded blades false per Rockwell ('mostly straight'). Photozone saw near-circular highlights stopped down, so the field could be argued; Rockwell's direct statement is used. 7) tc_compatible null: not checked. 8) Limiter behaviour in MF and focus throw not verified. 9) Close-up apertures are computed (×2 at 1:1) from diffraction onsets measured at distance; low confidence.",Ql={id:Pl,name:Al,short:Cl,mount:Nl,adapter:zl,coverage:xl,kind:Rl,focal_mm:Dl,max_aperture:Ll,min_aperture_f:Ml,aperture_blades:Ol,rounded_blades:Tl,weight_g:El,filter_mm:Vl,focus:$l,stabilization:Xl,close_focus:Bl,quick:Hl,character:Wl,field_tips:jl,body_notes:Gl,tc_compatible:Kl,sources:Ul,chris_frost:ql,research_notes:Jl},Yl="voigtlander-58-f14-sl2",ec="Voigtländer Nokton 58mm f/1.4 SL II (SL II / SL II N / SL II S)",tc="Nokton 58 f/1.4 SL II",oc="F",nc="FTZ II",ic="FX",sc="prime",ac=[58],rc=[{focal_mm:58,f:1.4}],lc=16,cc=9,dc=null,mc=320,uc=null,hc={on_z_body:"MF (manual-focus lens)",cpu:!0,motor:"None. Manual-focus double-Gauss with CPU contacts (AI-S/AI-P style): passes aperture and focal length to the body; aperture set from the camera's command dial.",focus_throw_deg:270,notes:"Phillip Reeve's site (SL IIs, 2024): about 270° throw, turning the Nikon way. Lenstip: wide focus-ring range, and the contacts enable the in-focus indicator, though that indicator's range is often too broad to rely on. Use peaking + magnified view instead. Jake Horn (SL II): smooth but tight at the start and end of travel. Versions: SL II (rubber grip, Nikon and Pentax), SL II N (April 2012, all-metal focus barrel, Nikon only) and SL II S (2016, retro barrel, 52 mm filter, NAI prong). CameraQuest says each has 'the same glass' as the previous version. Phillip Reeve's site says the 2007, 2012 and 2017 versions share the same optical design. Diglloyd (2013) calls the newer versions 'apparently optically identical'. So all three are optically identical (manufacturer documentation not found; dealer and reviewer sources agree). As with other CPU lenses on the FTZ, the aperture ring should be locked at minimum aperture (f/16) so the camera controls the aperture (inferred from the ZF.2 behaviour Reeve documents and Nikon's CPU-lens convention; not specifically tested for this lens)."},fc={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:"3-axis (yaw, pitch, roll) via FTZ II on Z8 and Z5 II. None on Z50 II (no IBIS).",notes:"Nikon FTZ II page (fetched 2026-11-05): with a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. The CPU passes 58 mm to IBIS automatically."},pc={mfd_m:[{focal_mm:58,value:.45}],max_mag:[{focal_mm:58,value:.17}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 0.45 m (Lenstip, Phillip Reeve's site, Photography Life). Max magnification 1:5.8 (about 0.17×; Lenstip, Photography Life, diglloyd); Reeve's site measured 1:5.9. Working distance was not found. Light loss at 0.17× is about 0.4 stop (computed), so negligible. Close-range sharpness is weak wide open: Reeve's site (42MP, 0.45 m) found f/1.4 very soft, f/2 still soft, f/2.8 almost good, f/4 very contrasty. Photozone (FF) says avoid large apertures at close focus."},gc={headline:"Character 58: glowy, low-contrast f/1.4 that is sharp in the centre by f/2.8 and excellent at f/5.6; wild bokeh, weak flare control, slight focus shift.",sweet_spot:"f/4–f/8",wide_open:"Centre very good but low contrast at f/1.4. Edges soft and extreme corners relatively soft (Photozone FF). Lenstip (D3x 24MP): FX edge needs about f/2.8 to be useful. Phillip Reeve's site: contrast rises markedly by f/2–f/2.8. Vignetting about 2.3–2.6 EV.",by_focal:[{focal_mm:58,center_peak:"f/4–f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"Photozone (Canon FF DSLR): f/1.4 centre very good with low contrast, borders quite decent, corners soft; f/2 better; f/2.8 'really snappy'; f/5.6 peak, truly excellent; diffraction slightly more obvious from f/11. Lenstip (Nikon D3x 24MP, RAW): f/4 and f/5.6 centre 'nearly record-breaking'; FX edge needs about f/2.8; lp/mm values only in a chart. Phillip Reeve's site (Sony A7rII 42MP): corners good from f/8 at infinity; good at f/1.4–f/2 at portrait distance (1.5 m)."}],close_up_best:"f/4–f/5.6",close_up_note:"Phillip Reeve's site (42MP, 0.45 m): f/1.4 very soft, f/2 soft, f/2.8 almost good, f/4 very contrasty. Photozone (FF): softer at close focus, avoid large apertures. Focus shift appears from f/2.8 to f/4 (diglloyd), so focus at the shooting aperture.",diffraction_note:"Photozone (Canon FF DSLR, lower resolution than the Z8): diffraction slightly more obvious from f/11, still plenty sharp. Expect it a little earlier, about f/8–f/11, on the Z8's 4.35 µm pixels (inference).",avoid:["Do not shoot close-ups at f/1.4–f/2 and expect detail: very soft at 0.45 m.","Do not trust the camera's in-focus indicator alone: Lenstip found its range too broad.","Avoid bright light sources in frame if you need clean contrast: flare-prone (Reeve's site)."],confidence:"medium",confidence_reason:"Two measured tests (Photozone FF and Lenstip D3x 24MP, verbal only; numbers in charts) agree on a centre peak at f/4–f/5.6 and weak FX edges below f/2.8. The 42MP visual test (Phillip Reeve's site, on Sony with a thick filter stack) puts the corners at f/8. No 45MP Nikon test was found."},bc={bokeh:"Classic all-spherical double Gauss (Phillip Reeve's site): smooth backgrounds at close range at f/1.4, but busy double-edged rendering with structured backgrounds at mid distance; noticeably calmer at f/2.8. Strong cat's eyes from optical vignetting. Photozone FF: very smooth foreground blur, rough background with contrasty subjects, outlined highlights; better at f/2, very good at f/2.8. Photozone DX: outlining at f/1.4–f/2, gone by f/2.8.",flare_sunstar:"Conflict. Phillip Reeve's site: poor flare resistance, with strong ghosts even at f/1.4, a ring artifact at f/2.8 and ghosts or veiling at f/11; a hood would not help; easier to trigger than most Voigtländers. Lenstip (2010): good performance against bright light. Sunstars decent f/8–f/16 but less distinct than 10–12-blade lenses (Reeve's site).",ca:"Lateral CA low: Photozone FF under 0.4 px, DX about 0.5 px; Lenstip well corrected (graph only); Reeve's site almost none. LoCA: Photozone noticeable green/magenta halos at f/1.4–f/2, not objectionable at f/2.8, gone at f/4; Reeve's site average for the class. Purple halos at f/1.4 from undercorrected spherical aberration (Reeve's site).",distortion:"Low barrel: Photozone FF 0.7%, DX 0.3%; Lenstip slight; Reeve's site low.",vignetting:"Heavy wide open. Phillip Reeve's site (FF): 2.6 EV at f/1.4, 2.1 at f/2, 1.1 at f/2.8, 0.5 at f/4, 0.3 from f/5.6. Photozone FF: about 2.3 EV at f/1.4, moderate at f/2.8. Lenstip D3x: 52% at f/1.4, 36% at f/2, 18% at f/2.8, 8% at f/4. DX: Lenstip 28% (−0.96 EV), Photozone about 0.7 EV at f/1.4.",coma_astro:"Lenstip: high coma (con). Phillip Reeve's site: not well corrected, corners very good from f/5.6. Astigmatism low, 5% (Lenstip).",focus_breathing:"Not measured by any source found.",other:"Focus shift: Phillip Reeve's site found it slight, the lowest of three fast Voigtländers compared, and visible on close inspection; direction not stated. Diglloyd (excerpt only): relatively small, much less than 50mm alternatives, noticeable from f/2.8 to f/4. Photozone (DX) found about 2/3 EV overexposure on the D200. Photography Life readers say it is sensitive to filters."},wc=["Focus at the shooting aperture for f/2.8–f/5.6 portraits and close-ups: focus shifts slightly between f/2.8 and f/4. Check a test frame magnified.","Keep the aperture ring at f/16 (minimum) and set aperture from the camera; focus with peaking + magnified view, not the in-focus dot.","For the glow and swirl, use f/1.4–f/2 at portrait distance (1.5 m is good across the frame). For clean detail use f/4–f/5.6, and f/8 for corners on the Z8.","Close to 0.45 m, start at f/4: wide open it is very soft up close.","Shade the lens when light sources are near the frame: ghosts appear even at f/1.4 and f/11."],_c=[{body:"z8",note:"45.7MP magnifies the f/1.4 haze, LoCA and focus shift. Centre excellent from f/4, corners need about f/8. IBIS 3-axis via FTZ II."},{body:"z5ii",note:"24.5MP matches Lenstip's D3x test (24MP FX): FX edges usable from f/2.8, peak f/4–f/5.6. IBIS 3-axis via FTZ II."},{body:"z50ii",note:"About 87mm-equivalent portrait lens on DX. Photozone (DX): f/2 already good at the borders, vignetting only about 0.7–1 EV at f/1.4. No IBIS."}],vc=!1,yc=[{id:"photozone_ff",name:"Photozone (OpticalLimits): Voigtländer Nokton 58mm f/1.4 SL II, Full Format Review",url:"https://photozone.de/canon_eos_ff/518-voigtlander58f14ff?start=1",kind:"measured",tested_on:"Canon full-frame DSLR (model not named in text), adapted",date:null,findings:"f/1.4 centre very good with reduced contrast, borders quite decent, extreme corners relatively soft; f/2 better; f/2.8 really snappy; f/5.6 peak, truly excellent; softer at close focus, so avoid large apertures there. Diffraction slightly more obvious from f/11. Distortion 0.7% barrel. Vignetting about 2.3 EV at f/1.4, moderate at f/2.8. Lateral CA under 0.4 px. LoCA green/magenta at f/1.4–f/2, gone by f/4. Bokeh: smooth foreground, rough background with contrasty subjects, outlined highlights, very good by f/2.8. Ratings: optics 3, mechanics 4, price/performance 4. MTF values only in charts."},{id:"photozone_dx",name:"Photozone: Voigtländer Nokton 58mm f/1.4 SL II (Nikon APS-C)",url:"https://www.photozone.de/nikon--nikkor-aps-c-lens-tests/360-voigtlander-nokton-58mm-f14-sl-ii?start=1",kind:"measured",tested_on:"Nikon D200 (10.2MP DX)",date:null,findings:"f/1.4 centre very good, borders soft, low contrast; f/2 borders good; f/2.8 big improvement; f/5.6 peak. Distortion about 0.3% barrel. Vignetting about 0.7 EV at f/1.4 (DX). Lateral CA about 0.5 px. LoCA magenta in front, green behind, well controlled for the speed. Bokeh outlining at f/1.4–f/2, gone by f/2.8. About 2/3 EV overexposure noted."},{id:"lenstip",name:"Lenstip: Voigtländer Nokton 58 mm f/1.4 SL II review",url:"https://www.lenstip.com/265.4-Lens_review-Voigtlander_Nokton_58_mm_f_1.4_SL_II_Image_resolution.html",kind:"measured",tested_on:"Nikon D3x (24.5MP FX), RAW; APS-C on D200",date:"2010-09",findings:"Resolution numbers only in a graph; decency level about 30 lp/mm on D3x. FX: f/4–f/5.6 centre 'nearly record-breaking'; beats the AF-S 50/1.4G, slightly behind the Zeiss Planar 50/1.4. FX edge needs about f/2.8; APS-C edge acceptable about f/2.2, very high by f/4. Vignetting D3x 52% at f/1.4, 36% at f/2, 18% at f/2.8, 8% at f/4; D200 28% (−0.96 EV) at f/1.4. Astigmatism 5%. Coma high. Pros: excellent centre, well-corrected CA, slight distortion, good against bright light. Cons: weak edges near f/1.4, high coma, huge FX vignetting. Specs: 7/6, 0.45 m, 1:5.8, 9 blades, 320 g. In-focus indicator range

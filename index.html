 shutter & VR",name:"Interval timer shooting",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > Interval timer shooting",z5ii:"Photo shooting menu > Interval timer shooting",z50ii:"Photo shooting menu > Interval timer shooting"},one_liner:"Shoots stills automatically at set intervals; can also build a time-lapse.",what_it_does:"Takes a set number of shots at a fixed interval from a start time. Options include exposure smoothing (gradual exposure changes), electronic shutter, interval priority, refocus before each shot, AE bracketing per interval and an in-camera time-lapse movie built from the stills.",options:[{value:"Interval / Intervals x shots",meaning:"Timing and count.",use_when:"Moonrise every 10-30 s; sunset sequences."},{value:"Exposure smoothing",meaning:"Matches exposure to previous frame (needs Auto ISO in M).",use_when:"Day-to-night transitions."},{value:"Interval priority",meaning:"Keeps the interval in P/A even if exposure gets long.",use_when:"Time-lapse where rhythm matters."},{value:"Focus before each shot",meaning:"Refocus every frame.",use_when:"OFF for moon/landscape (keep focus fixed)."},{value:"Options: AE bracketing / Time-lapse video",meaning:"Bracket each interval or make a movie too.",use_when:"High-contrast scenes / quick shareable time-lapse."}],when_to_change:"Any timed sequence on a tripod.",suggested:[{scenario:"Birds in flight",value:"n/a",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"n/a",scenario_id:"dance"},{scenario:"Kids running",value:"n/a",scenario_id:"kids"},{scenario:"Landscape on tripod",value:"Interval 3-5 s, exposure smoothing ON, focus before each shot OFF",scenario_id:"landscape"},{scenario:"Macro handheld",value:"n/a",scenario_id:"macro"},{scenario:"Moonrise at 280mm on tripod",value:"Interval 10-20 s, 60-200 shots, manual exposure, focus before each shot OFF, VR off",scenario_id:"moonrise"}],body_differences:"All three. Z50II e-shutter option overrides d6.",gotchas:["Interval must exceed exposure + write time or intervals get skipped.","E-shutter still makes a sound unless volume is 0, even in Silent mode.","Moon moves its own diameter in about 2 minutes - at 280mm reframe or plan the path."],related:["time-lapse-video","focus-shift-shooting","exposure-delay-mode"],firmware_note:"",research_notes:"Moon-motion tip is general astronomy, not from a fetched source.",sources:[{id:"nikon-z50ii-interval",name:"Nikon Z50II Reference Guide - Interval timer shooting",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03-31.html",kind:"manufacturer",findings:"Options: start, interval, intervals x shots, exposure smoothing, e-shutter, interval priority, focus before each shot, AE bracketing / time-lapse video option, storage folder; cautions."},{id:"nikon-z8-menu-index",name:"Nikon Z8 Reference Guide - menu index (current FW 3.x manual)",url:"https://onlinemanual.nikonimglib.com/z8/en/csma_af-c_priority_selection_204.html",kind:"manufacturer",findings:"Interval Timer Shooting in Photo shooting menu."},{id:"nikon-z5ii-menu-index",name:"Nikon Z5II Reference Guide - Custom Settings / Photo shooting / Setup menu index",url:"https://onlinemanual.nikonimglib.com/z5II/en/csm_menu_items_205.html",kind:"manufacturer",findings:"Interval timer shooting in Photo shooting menu."}]},{id:"time-lapse-video",group:"Drive, shutter & VR",name:"Time-lapse video",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > Time-lapse video",z5ii:"Photo shooting menu > Time-lapse video",z50ii:"Photo shooting menu > Time-lapse video"},one_liner:"Makes a time-lapse movie in camera without keeping the stills.",what_it_does:"Shoots at intervals and assembles a movie directly; individual frames are not kept as stills. Use the interval timer's Time-lapse video option instead if you also want the stills for editing.",options:[{value:"Interval, shooting time, exposure smoothing, frame size/rate",meaning:"Defines the movie.",use_when:"Clouds, crowds, moonrise preview."}],when_to_change:"Quick shareable time-lapses; use interval timer + stills for best quality.",suggested:[{scenario:"Birds in flight",value:"n/a",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"n/a",scenario_id:"dance"},{scenario:"Kids running",value:"n/a",scenario_id:"kids"},{scenario:"Landscape on tripod",value:"Interval 2-5 s, exposure smoothing ON",scenario_id:"landscape"},{scenario:"Macro handheld",value:"n/a",scenario_id:"macro"},{scenario:"Moonrise at 280mm on tripod",value:"Prefer interval timer stills (keeps raw frames)",scenario_id:"moonrise"}],body_differences:"All three list it in the Photo shooting menu.",gotchas:["No stills to rescue if exposure goes wrong.","HLG tone mode forces H.265 10-bit output (Z50II)."],related:["interval-timer-shooting"],firmware_note:"",research_notes:"Option list not read from manual body text for any body.",sources:[{id:"nikon-z50ii-psm-index",name:"Nikon Z50II Reference Guide - Photo shooting menu index",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03.html",kind:"manufacturer",findings:"Time-lapse video listed in Photo shooting menu."},{id:"nikon-z8-menu-index",name:"Nikon Z8 Reference Guide - menu index (current FW 3.x manual)",url:"https://onlinemanual.nikonimglib.com/z8/en/csma_af-c_priority_selection_204.html",kind:"manufacturer",findings:"Time-Lapse Video in Photo shooting menu."},{id:"nikon-z5ii-menu-index",name:"Nikon Z5II Reference Guide - Custom Settings / Photo shooting / Setup menu index",url:"https://onlinemanual.nikonimglib.com/z5II/en/csm_menu_items_205.html",kind:"manufacturer",findings:"Time-lapse video in Photo shooting menu."}]},{id:"auto-capture",group:"Drive, shutter & VR",name:"Auto capture",available_on:["z8"],menu_path:{z8:"Photo shooting menu > Auto capture (video menu has its own)",z5ii:null,z50ii:null},one_liner:"Z8 fires by itself when a subject moves, is detected, or enters a distance band.",what_it_does:"Unattended triggering based on motion (direction/speed), subject detection type and size, and/or a focus distance range. Useful for a camera on a tripod at a perch, feeder or nest while you shoot with another body.",options:[{value:"Motion criteria",meaning:"Trigger on movement direction/speed.",use_when:"Birds landing on a perch."},{value:"Subject detection criteria",meaning:"Trigger when a set subject type/size is detected.",use_when:"Birds at feeder."},{value:"Distance criteria",meaning:"Trigger when subject is in a focus distance range.",use_when:"Pre-focused perch or landing spot."}],when_to_change:"Remote/second-camera wildlife setups.",suggested:[{scenario:"Birds in flight",value:"Z8 on tripod at a feeder/perch: Birds detection + distance criteria; you shoot BIF with the Z5II",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"n/a",scenario_id:"dance"},{scenario:"Kids running",value:"n/a",scenario_id:"kids"},{scenario:"Landscape on tripod",value:"n/a",scenario_id:"landscape"},{scenario:"Macro handheld",value:"n/a",scenario_id:"macro"},{scenario:"Moonrise at 280mm on tripod",value:"n/a",scenario_id:"moonrise"}],body_differences:"Z8 only (FW 2.00+, improved FW 3.00). Not in Z5II or Z50II menus.",gotchas:["Battery and card fill quickly - set limits and test triggers first."],related:["release-mode","subject-detection","interval-timer-shooting"],firmware_note:"Added FW 2.00; FW 2.10 fixed failure to start; FW 3.00 improvements.",research_notes:"Sub-option names not read from the Z8 manual body.",sources:[{id:"nikon-z8-fw-history",name:"Nikon Download Center - Z8 firmware change history (latest C 3.10)",url:"https://downloadcenter.nikonimglib.com/en/download/fw/573.html",kind:"manufacturer",findings:"FW 2.00 added auto capture (motion, distance, subject detection); FW 3.00 improvements."},{id:"nikon-z8-menu-index",name:"Nikon Z8 Reference Guide - menu index (current FW 3.x manual)",url:"https://onlinemanual.nikonimglib.com/z8/en/csma_af-c_priority_selection_204.html",kind:"manufacturer",findings:"Auto Capture in Photo shooting menu."},{id:"nikon-z5ii-menu-index",name:"Nikon Z5II Reference Guide - Custom Settings / Photo shooting / Setup menu index",url:"https://onlinemanual.nikonimglib.com/z5II/en/csm_menu_items_205.html",kind:"manufacturer",findings:"No Auto capture in Z5II Photo shooting menu."},{id:"nikon-z50ii-psm-index",name:"Nikon Z50II Reference Guide - Photo shooting menu index",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03.html",kind:"manufacturer",findings:"No Auto capture in Z50II Photo shooting menu."}]},{id:"pixel-shift-shooting",group:"Drive, shutter & VR",name:"Pixel shift shooting",available_on:["z8","z5ii"],menu_path:{z8:"Photo shooting menu > Pixel shift shooting",z5ii:"Photo shooting menu > Pixel shift shooting",z50ii:null},one_liner:"Shifts the sensor between frames for higher-resolution, low-moire composites.",what_it_does:"Takes a series of RAW frames with the sensor moved by sub-pixel amounts, then merges them in Nikon NX Studio on a computer into a higher-resolution image (Nikon cites up to about 180 MP on the Z8). Needs a static subject and a rock-solid tripod. On the Z8, FW 3.00 can combine it with focus shift or AE bracketing.",options:[{value:"Number of shots / delay / interval",meaning:"How many shifted frames and timing.",use_when:"More frames = more resolution and colour accuracy, more chance of movement artefacts."},{value:"Z8: combine with focus shift or AE bracketing (FW 3.00)",meaning:"High-res stacking or HDR.",use_when:"Static macro (MC 105) or high-contrast architecture."},{value:"Z8: WB lock at first shot, new folder per sequence, self-timer (FW 3.00)",meaning:"Workflow aids.",use_when:"Always - sorting and merging is easier."}],when_to_change:"Static, tripod-mounted subjects only: architecture, art reproduction, still-life macro.",suggested:[{scenario:"Birds in flight",value:"n/a",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"n/a",scenario_id:"dance"},{scenario:"Kids running",value:"n/a",scenario_id:"kids"},{scenario:"Landscape on tripod",value:"Only for windless, cloud-free static scenes",scenario_id:"landscape"},{scenario:"Macro handheld",value:"Not handheld; tripod still-life only",scenario_id:"macro"},{scenario:"Moonrise at 280mm on tripod",value:"No - the moon moves",scenario_id:"moonrise"}],body_differences:"Z8: added FW 2.00; FW 3.00 adds focus-shift/AE-bracket combination. Z5II: listed in its Photo shooting menu. Z50II: not available.",gotchas:["Merging happens in NX Studio, not in camera.","Any movement (leaves, water, people) causes artefacts.","Uses the IBIS mechanism - VR has no role here."],related:["focus-shift-shooting","vibration-reduction"],firmware_note:"Z8 FW 2.00 added pixel shift; FW 3.00 extended it.",research_notes:"Z5II shot-count options and output resolution not retrieved; Nikon's Z5II spec section doesn't mention pixel shift, but the Z5II manual index lists it.",sources:[{id:"nikon-z8-fw-history",name:"Nikon Download Center - Z8 firmware change history (latest C 3.10)",url:"https://downloadcenter.nikonimglib.com/en/download/fw/573.html",kind:"manufacturer",findings:"FW 2.00 added pixel shift; FW 3.00 pixel shift with focus shift and AE bracketing."},{id:"petapixel-z8-fw3",name:"PetaPixel - Nikon Z8 firmware adds pixel shift with focus shift and AE bracketing (2025-06-11)",url:"https://petapixel.com/2025/06/11/nikon-z8-firmware-adds-worlds-first-pixel-shift-mode-with-focus-shift-and-ae-bracketing",kind:"review",findings:"Up to 180 MP composite assembled in NX software; FW 3.00 adds focus-shift/AE-bracket combination, per-sequence folder, self-timer, WB lock."},{id:"nikon-z5ii-pixel-shift",name:"Nikon Z5II Reference Guide - Pixel shift shooting",url:"https://onlinemanual.nikonimglib.com/z5II/en/psm_pixel_shift_shooting_162.html",kind:"manufacturer",findings:"Listed as a Photo shooting menu item (body text not retrievable)."},{id:"nikon-z50ii-psm-index",name:"Nikon Z50II Reference Guide - Photo shooting menu index",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03.html",kind:"manufacturer",findings:"No pixel shift item in Z50II Photo shooting menu."}]},{id:"sensor-shield-power-off",group:"Drive, shutter & VR",name:"Sensor shield behavior at power off",available_on:["z8"],menu_path:{z8:"Setup menu > Sensor shield behavior at power off",z5ii:null,z50ii:null},one_liner:"Z8 closes a shield over the sensor when off, keeping dust out.",what_it_does:"The Z8 has a thin shield in front of the sensor (it has no mechanical shutter). Set it to close at power-off so dust lands on the shield instead of the sensor during lens changes - but only if you switch off before changing lenses.",options:[{value:"Sensor shield closes",meaning:"Shield closes when the camera is turned off.",use_when:"Default choice for field use, especially changing lenses outdoors."},{value:"Sensor shield stays open (factory default)",meaning:"Sensor exposed when off.",use_when:"Wet sensor cleaning (or use Clean image sensor maintenance)."}],when_to_change:"Set to close once; switch off before every lens change.",suggested:[{scenario:"Birds in flight",value:"Closes",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"Closes",scenario_id:"dance"},{scenario:"Kids running",value:"Closes",scenario_id:"kids"},{scenario:"Landscape on tripod",value:"Closes",scenario_id:"landscape"},{scenario:"Macro handheld",value:"Closes",scenario_id:"macro"},{scenario:"Moonrise at 280mm on tripod",value:"Closes",scenario_id:"moonrise"}],body_differences:"Z8 only. Z5II and Z50II have mechanical shutters and no such setting.",gotchas:["Never touch the shield - it is more fragile than a mechanical shutter; use only a hand blower.","If the power switch is on 'sleep'/standby or the card is still writing, the shield may stay open - turn fully OFF.","Doesn't help if you change lenses with the camera on."],related:["clean-image-sensor"],firmware_note:"",research_notes:"Exact option labels from Have Camera Will Travel, not from the Z8 manual body.",sources:[{id:"nikon-z8-spec",name:"Nikon Z8 product page - Specifications",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z_8/",kind:"manufacturer",findings:"Electronic shutter with shutter sound and sensor shield."},{id:"nikon-z8-menu-index",name:"Nikon Z8 Reference Guide - menu index (current FW 3.x manual)",url:"https://onlinemanual.nikonimglib.com/z8/en/csma_af-c_priority_selection_204.html",kind:"manufacturer",findings:"Setup menu: Sensor Shield Behavior at Power Off."},{id:"hcwt-z8-shield",name:"Have Camera Will Travel - Nikon Z8 sensor shield",url:"https://havecamerawilltravel.com/nikon-z8-sensor-shield/",kind:"review",findings:"Options 'Sensor shield stays open' (default) and 'Sensor shield closes'; don't touch the shield; blower only; stays open if writing or switch not fully OFF."},{id:"reed-hoffmann-z8",name:"Reed Hoffmann - Nikon Z 8 Menus Jump Start",url:"https://reedhoffmann.com/nikon-z-8-menus-jump-start/",kind:"review",findings:"Recommends turning it on, provided the camera is off before lens changes."}]},{id:"clean-image-sensor",group:"Drive, shutter & VR",name:"Clean image sensor",available_on:["z8","z5ii"],menu_path:{z8:"Setup menu > Clean image sensor",z5ii:"Setup menu > Clean image sensor",z50ii:null},one_liner:"Ultrasonic shake that knocks loose dust off the sensor.",what_it_does:"Vibrates the sensor filter to remove loose dust, on demand or automatically at shutdown. It won't remove sticky spots - those need a blower or wet clean.",options:[{value:"Clean now",meaning:"Run once.",use_when:"After a dusty outing or before a critical f/11+ landscape."},{value:"Clean at shutdown (Z5II default since FW 1.02) / off",meaning:"Automatic cleaning when switching off.",use_when:"Leave on."}],when_to_change:"Run Clean now when a test shot of sky at f/16 shows spots.",suggested:[{scenario:"Landscape on tripod",value:"Clean now before the shoot",scenario_id:"landscape"},{scenario:"Moonrise at 280mm on tripod",value:"Clean at shutdown",scenario_id:"moonrise"},{scenario:"Birds in flight",value:"Clean at shutdown",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"Clean at shutdown",scenario_id:"dance"},{scenario:"Kids running",value:"Clean at shutdown",scenario_id:"kids"},{scenario:"Macro handheld",value:"Clean at shutdown (dust shows at small apertures)",scenario_id:"macro"}],body_differences:"Z8 and Z5II only. The Z50II setup menu has no Clean image sensor item (Image Dust Off ref photo only).",gotchas:["On the Z8, use this maintenance mode (or set the shield to stay open) before a wet clean."],related:["sensor-shield-power-off"],firmware_note:"Z5II FW 1.02 changed the default to 'Clean at shutdown'.",research_notes:"Exact option labels not read from manual body text.",sources:[{id:"nikon-z5ii-fw-history",name:"Nikon Download Center - Z5II firmware change history (latest C 1.20)",url:"https://downloadcenter.nikonimglib.com/en/download/fw/601.html",kind:"manufacturer",findings:"FW 1.02 changed default image sensor cleaning to 'Clean at shutdown'."},{id:"nikon-z8-menu-index",name:"Nikon Z8 Reference Guide - menu index (current FW 3.x manual)",url:"https://onlinemanual.nikonimglib.com/z8/en/csma_af-c_priority_selection_204.html",kind:"manufacturer",findings:"Setup menu: Clean Image Sensor."},{id:"nikon-z5ii-menu-index",name:"Nikon Z5II Reference Guide - Custom Settings / Photo shooting / Setup menu index",url:"https://onlinemanual.nikonimglib.com/z5II/en/csm_menu_items_205.html",kind:"manufacturer",findings:"Setup menu: Clean image sensor."},{id:"nikon-z50ii-setup-index",name:"Nikon Z50II Reference Guide - Setup menu (index via Silent mode page)",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-06-49.html",kind:"manufacturer",findings:"Z50II setup menu has Image Dust Off ref photo but no Clean image sensor."},{id:"hcwt-z8-shield",name:"Have Camera Will Travel - Nikon Z8 sensor shield",url:"https://havecamerawilltravel.com/nikon-z8-sensor-shield/",kind:"review",findings:"Z8 Clean image sensor runs at power-off by default; use it for wet-cleaning access."}]}],fg=[{id:"auto-iso",group:"Exposure & Image",name:"Auto ISO sensitivity control (maximum ISO, minimum shutter speed)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > ISO sensitivity settings > Auto ISO sensitivity control / Maximum sensitivity / Minimum shutter speed",z5ii:"Photo shooting menu > ISO sensitivity settings > Auto ISO sensitivity control / Maximum sensitivity / Minimum shutter speed",z50ii:"Photo shooting menu > ISO sensitivity settings > Auto ISO sensitivity control / Maximum sensitivity / Minimum shutter speed"},one_liner:"Camera raises ISO to protect your shutter speed, up to a ceiling you set.",what_it_does:"With Auto ISO on, the camera varies ISO to reach correct exposure, never exceeding Maximum sensitivity. In P and A modes it also holds a Minimum shutter speed: ISO climbs before shutter speed is allowed to drop below it. Minimum shutter speed can be a fixed value or Auto, which scales with focal length and can be fine-tuned faster or slower. In M mode with Auto ISO, you fix shutter and aperture and ISO floats, steered by exposure compensation.",options:[{value:"Auto ISO sensitivity control: ON / OFF",meaning:"ON lets ISO float; OFF keeps the ISO you set.",use_when:"ON for moving subjects and changing light; OFF for tripod landscape/astro where you want base ISO or a fixed ISO."},{value:"Maximum sensitivity",meaning:"Upper ISO limit Auto ISO may use.",use_when:"Set to the highest ISO you still accept after Lightroom AI Denoise for that body."},{value:"Maximum sensitivity with flash",meaning:"Separate ISO ceiling when a flash is fitted.",use_when:"Keep lower for bounce flash indoors."},{value:"Minimum shutter speed: fixed value",meaning:"P/A modes: ISO rises before shutter falls below this speed (Z50II manual: 1/2000–30 s).",use_when:"When you know the speed the subject needs (e.g. dancer's hands)."},{value:"Minimum shutter speed: Auto (with fine-tune)",meaning:"Speed is derived from focal length; fine-tune shifts it faster (toward 'protect against motion') or slower.",use_when:"Zooms and walk-around use; push fine-tune faster for kids and birds."}],when_to_change:"Change maximum ISO when light gets dramatically worse (stage, indoors at night) and change minimum shutter when the subject's speed changes, not the lens.",suggested:[{scenario:"Stage dance low light",value:"M mode + Auto ISO ON, 1/500–1/640 s, lens wide open, max ISO 12800 (Z8) / 25600 (Z5II); use exposure compensation to bias for spotlit skin",scenario_id:"dance"},{scenario:"Birds",value:"M mode + Auto ISO, 1/2000–1/3200 s for flight, max ISO 6400–12800",scenario_id:"birds"},{scenario:"Landscape tripod",value:"Auto ISO OFF, base ISO (64 on Z8, 100 on Z5II/Z50II)",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"Auto ISO OFF; fixed ISO, shutter ~1/125–1/250 s so the moon stays sharp; expose for the moon",scenario_id:"moonrise"},{scenario:"Family indoors",value:"A mode, Auto ISO ON, Minimum shutter Auto fine-tuned 1–2 steps faster, max ISO 12800",scenario_id:"kids"},{scenario:"Bird video",value:"Video uses its own ISO settings (Video recording menu > ISO sensitivity settings) - see video file",scenario_id:"birds"}],body_differences:"Z8 base ISO 64 (native 64–25600); Z5II native ISO 100–64000; Z50II native ISO 100–51200 (per Nikon spec pages/manual). On the Z5II, 'C' firmware 1.20 changed the range of selectable Minimum shutter speed values (Nikon manual change page; new range not read in this pass). Z8 minimum shutter speed range not verified in this pass.",gotchas:["If Maximum sensitivity is reached, shutter speed will drop below your minimum anyway - watch the shutter readout in dark venues.","Minimum shutter speed is ignored in S and M modes; it only governs P and A.","In M + Auto ISO, exposure compensation is how you brighten/darken - it changes ISO, not shutter/aperture.","Active D-Lighting stops working at Hi ISO values, including Hi values chosen by Auto ISO (Z50II manual)."],related:["exposure-compensation","metering","active-d-lighting","high-iso-nr"],firmware_note:"Z5II 'C' firmware 1.20 changed available Minimum shutter speed values. Z8 manual covers firmware 3.10.",research_notes:"Z8 and Z5II manual pages load their text via script and could not be read; Z8/Z5II option names inferred from the shared Nikon menu structure (Z8/Z5II table of contents confirms the menu item and location) and the readable Z50II page. Suggested ISO ceilings are field judgement, not measured.",sources:[{id:"z50ii-iso",name:"Nikon Z50II Reference Guide - ISO sensitivity settings",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03-09.html",kind:"manufacturer",findings:"Auto ISO with Maximum sensitivity, Maximum sensitivity with flash, Minimum shutter speed (P/A only, 1/2000–30 s, Auto with fine-tune); shutter can fall below minimum if max ISO is reached."},{id:"z8-iso",name:"Nikon Z8 Reference Guide - ISO Sensitivity Settings",url:"https://onlinemanual.nikonimglib.com/z8/en/psm_iso_sensitivity_settings_124.html",kind:"manufacturer",findings:"Confirms item location in Photo shooting menu (page body not machine-readable)."},{id:"z5ii-iso",name:"Nikon Z5II Reference Guide - ISO sensitivity settings",url:"https://onlinemanual.nikonimglib.com/z5II/en/psm_iso_sensitivity_settings_129.html",kind:"manufacturer",findings:"Confirms item location in Photo shooting menu."},{id:"z5ii-fw120-minss",name:"Nikon Z5II - Change in available Minimum shutter speed (C fw 1.20)",url:"https://onlinemanual.nikonimglib.com/z5II/en/changing_min_shutter_speed_range_in_auto_iso_389.html",kind:"manufacturer",findings:"Firmware 1.20 changed the selectable Minimum shutter speed values (detail not readable)."},{id:"nikon-z8-spec",name:"Nikon Z8 product/spec page",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z_8/",kind:"manufacturer",findings:"ISO 64–25600, expandable to ISO 32 / 102400 equivalent."},{id:"nikon-z5ii-spec",name:"Nikon Z5II product/spec page",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z5_2/",kind:"manufacturer",findings:"ISO 100–64000, expandable to ISO 50 / 204800 equivalent."},{id:"z50ii-spec",name:"Nikon Z50II Reference Guide - Specifications",url:"https://onlinemanual.nikonimglib.com/z50II/en/15-08.html",kind:"manufacturer",findings:"ISO 100–51200, Hi up to ISO 204800 equivalent."}]},{id:"metering",group:"Exposure & Image",name:"Metering mode",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > Metering (also i menu; assignable to a button)",z5ii:"Photo shooting menu > Metering (also i menu)",z50ii:"Photo shooting menu > Metering (also i menu; assignable via f2 Custom controls)"},one_liner:"Decides which part of the scene the meter trusts when setting exposure.",what_it_does:"Metering reads scene brightness and feeds the exposure the camera picks (or the meter you follow in M). Matrix analyses the whole frame; center-weighted favours the middle; spot reads a ~2.5% circle at the active focus point; highlight-weighted biases exposure to keep the brightest areas from clipping. It does not change RAW data, only the exposure chosen.",options:[{value:"Matrix",meaning:"Whole-frame evaluation using tone distribution, color, composition and distance.",use_when:"Default for most scenes, family, travel; works best with Active D-Lighting."},{value:"Center-weighted",meaning:"Greatest weight on a central circle (size set in Custom setting b5; Average option meters full frame).",use_when:"Subject fills the centre; also Nikon's suggestion when using filters with a filter factor."},{value:"Spot",meaning:"Meters a circle about 2.5% of the frame centred on the current focus point (centre point with Auto-area AF).",use_when:"Bird against bright sky or dark foliage; meter a specific face."},{value:"Highlight-weighted",meaning:"Weights highlights to reduce highlight clipping, e.g. spotlit stage performers.",use_when:"Stage dance, moon, white birds in sun; expect a dark rest-of-frame you lift in Lightroom."}],when_to_change:"Switch from Matrix when a small bright or dark subject sits against a very different background.",suggested:[{scenario:"Stage dance low light",value:"Highlight-weighted (protect costume and face highlights under spots)",scenario_id:"dance"},{scenario:"Birds",value:"Matrix for general; Spot or Highlight-weighted for white egrets/gulls in sun",scenario_id:"birds"},{scenario:"Landscape tripod",value:"Matrix, check histogram; bracket if needed",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"Highlight-weighted or Spot on the moon (then check histogram)",scenario_id:"moonrise"},{scenario:"Family indoors",value:"Matrix (with b4 Matrix metering face detection ON)",scenario_id:"kids"},{scenario:"Bird video",value:"Matrix or Highlight-weighted; spot metering is not offered for video",scenario_id:"birds"}],body_differences:"All three offer the same four modes for stills. For video, the Z8 and Z50II specs list Matrix, Center-weighted and Highlight-weighted only (no Spot).",gotchas:["Spot follows the focus point; with Auto-area AF it uses the centre - not where the subject is.","Highlight-weighted can underexpose a scene with a small specular highlight (chrome, sun glint).","In M mode with fixed ISO, metering only moves the exposure indicator - it changes nothing by itself."],related:["exposure-compensation","auto-iso","histogram","active-d-lighting"],firmware_note:"",research_notes:"Option descriptions read from the Z50II manual; Z8 and Z5II menu location confirmed from their table of contents and spec pages list the same four modes.",sources:[{id:"z50ii-metering",name:"Nikon Z50II Reference Guide - Metering",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03-21.html",kind:"manufacturer",findings:"Four modes; spot ~2.5% of frame following focus point (centre with auto-area); highlight-weighted recommended for spotlit stage performers; b5 sets centre-weighted area."},{id:"z8-metering",name:"Nikon Z8 Reference Guide - Metering",url:"https://onlinemanual.nikonimglib.com/z8/en/psm_metering_141.html",kind:"manufacturer",findings:"Item in Photo shooting menu; Custom settings b4 Matrix metering face detection, b5 Center-weighted area, b6 Fine-tune optimal exposure."},{id:"z5ii-metering",name:"Nikon Z5II Reference Guide - Metering",url:"https://onlinemanual.nikonimglib.com/z5II/en/psm_metering_145.html",kind:"manufacturer",findings:"Item in Photo shooting menu."},{id:"nikon-z8-spec",name:"Nikon Z8 product/spec page",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z_8/",kind:"manufacturer",findings:"Stills: matrix, center-weighted, spot, highlight-weighted. Video: matrix, center-weighted, highlight-weighted."},{id:"z50ii-spec",name:"Nikon Z50II Reference Guide - Specifications",url:"https://onlinemanual.nikonimglib.com/z50II/en/15-08.html",kind:"manufacturer",findings:"Spot = ~3.5 mm circle at focus point; video metering matrix/center-weighted/highlight-weighted."}]},{id:"exposure-compensation",group:"Exposure & Image",name:"Exposure compensation and EV steps",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Exposure compensation button + main command dial; step size: Custom settings b2 EV steps for exposure cntrl; b3 Easy exposure compensation",z5ii:"Exposure compensation button + main command dial; step size: Custom settings b2 EV steps for exposure cntrl; b3 Easy exposure compensation",z50ii:"Exposure compensation button + main command dial; step size: Custom settings b2 EV steps for exposure cntrl; b3 Easy exposure compensation"},one_liner:"Tells the camera to make the picture brighter or darker than metered.",what_it_does:"Exposure compensation biases the exposure the camera chooses in P, S, A, and in M when Auto ISO is on (where it moves ISO). b2 sets whether exposure steps (shutter, aperture, compensation) move in 1/3 or 1/2 EV. b3 Easy exposure compensation lets a bare command dial set compensation without pressing the button.",options:[{value:"+ / − EV",meaning:"Positive brightens, negative darkens relative to the meter.",use_when:"Snow/white birds (+), stage spotlight or moon (−), backlit faces (+)."},{value:"b2: 1/3 step or 1/2 step",meaning:"Granularity of shutter/aperture/compensation changes.",use_when:"Keep 1/3 for finer control."},{value:"b3: Off / On / On (auto reset)",meaning:"Whether the free dial sets compensation directly; auto reset clears it at power-off/standby.",use_when:"On (auto reset) if you often forget to zero compensation."}],when_to_change:"Whenever the histogram or preview shows the meter is fooled by a mostly bright or mostly dark scene.",suggested:[{scenario:"Stage dance low light",value:"−0.7 to −1.3 EV with Matrix; ~0 with Highlight-weighted",scenario_id:"dance"},{scenario:"Birds",value:"+0.3 to +1 EV for dark birds in shade; −0.3 to −1 EV for white birds",scenario_id:"birds"},{scenario:"Landscape tripod",value:"0; adjust by histogram",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"−1 to −2 EV if Matrix is metering the dark sky",scenario_id:"moonrise"},{scenario:"Family indoors",value:"0 to +0.3 EV for faces",scenario_id:"kids"}],body_differences:"Same Custom settings numbering (b2, b3) on all three per their manuals' tables of contents.",gotchas:["Compensation persists until you reset it - check the display before the next scene.","In M with Auto ISO OFF, the button only shifts the meter indicator, not the exposure.","b6 Fine-tune optimal exposure permanently shifts the meter without any on-screen icon - leave it at 0."],related:["auto-iso","metering","view-mode-exposure-preview","histogram"],firmware_note:"",research_notes:"Exact EV ranges not re-read in this pass; omitted.",sources:[{id:"z8-b2",name:"Nikon Z8 Reference Guide - b2 EV Steps for Exposure Cntrl",url:"https://onlinemanual.nikonimglib.com/z8/en/csmb_ev_steps_for_exposure_cntrl_222.html",kind:"manufacturer",findings:"Menu location of EV steps."},{id:"z8-b3",name:"Nikon Z8 Reference Guide - b3 Easy Exposure Compensation",url:"https://onlinemanual.nikonimglib.com/z8/en/csmb_easy_exposure_compensation_223.html",kind:"manufacturer",findings:"Menu location of easy exposure compensation."},{id:"z5ii-b2",name:"Nikon Z5II Reference Guide - b2 EV steps",url:"https://onlinemanual.nikonimglib.com/z5II/en/csmb_ev_steps_for_exposure_cntrl_222.html",kind:"manufacturer",findings:"Menu location."},{id:"z50ii-b3",name:"Nikon Z50II Reference Guide - b3 Easy exposure compensation",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-05-16.html",kind:"manufacturer",findings:"Menu location."},{id:"z50ii-f2",name:"Nikon Z50II Reference Guide - f2 Custom controls (shooting)",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-05-40.html",kind:"manufacturer",findings:"Z50II has an Exposure compensation button among assignable controls."}]},{id:"view-mode-exposure-preview",group:"Exposure & Image",name:"View mode (photo Lv) - exposure/settings preview",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Custom settings menu > d9 View mode (photo Lv)",z5ii:"Custom settings menu > d10 View mode (photo Lv)",z50ii:"Custom settings menu > d10 View mode (photo Lv)"},one_liner:"Choose whether the EVF shows the real exposure or an easy-to-see image.",what_it_does:"'Show effects of settings' makes the viewfinder/monitor preview reflect exposure, white balance, Picture Control and compensation, so what you see approximates the shot. 'Adjust for ease of viewing' brightens and neutralises the view regardless of settings, useful when using flash or deliberately dark exposures. Video mode always shows setting effects.",options:[{value:"Show effects of settings > Always",meaning:"Preview reflects settings even when a flash is ready.",use_when:"Natural-light work where you judge exposure in the EVF."},{value:"Show effects of settings > Only when flash is not used",meaning:"Brightness adjusted for viewing when flash is in use; color effects still shown.",use_when:"Default choice if you sometimes use flash."},{value:"Adjust for ease of viewing > Auto / Custom",meaning:"View ignores settings; Custom lets you choose WB, Picture Control and Brighten shadows (Off/+1/+2/+3) for the view.",use_when:"Flash/studio, astro framing, or when you deliberately underexpose (moon, stage)."}],when_to_change:"Use Show effects for natural-light stills; switch to Adjust for ease of viewing when the preview becomes too dark to compose.",suggested:[{scenario:"Stage dance low light",value:"Show effects of settings (see real exposure and highlight protection)",scenario_id:"dance"},{scenario:"Birds",value:"Show effects of settings",scenario_id:"birds"},{scenario:"Landscape tripod",value:"Show effects of settings",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"Show effects of settings to judge the moon's exposure; temporarily Adjust for ease of viewing to compose a dark foreground",scenario_id:"moonrise"},{scenario:"Family indoors",value:"Show effects of settings > Only when flash is not used",scenario_id:"kids"}],body_differences:"Same feature on all three; it is d9 on the Z8 and d10 on Z5II/Z50II. Assignable to a button as 'View mode (photo Lv)' (verified on Z50II).",gotchas:["With 'Adjust for ease of viewing', the EVF lies about exposure - rely on the histogram.","With TTL flash and Auto ISO, the preview brightness may not match the result (Nikon note)."],related:["histogram","starlight-view","exposure-compensation","highlight-display-zebras-stills"],firmware_note:"",research_notes:"Option text read from Z50II manual; Z8 option wording assumed identical (same menu item name).",sources:[{id:"z50ii-d10",name:"Nikon Z50II Reference Guide - d10 View mode (photo Lv)",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-05-63.html",kind:"manufacturer",findings:"Show effects of settings (Always / Only when flash is not used) vs Adjust for ease of viewing (Auto / Custom with WB, Picture Control, Brighten shadows). Video always shows effects."},{id:"z8-d9",name:"Nikon Z8 Reference Guide - d9 View Mode (Photo Lv)",url:"https://onlinemanual.nikonimglib.com/z8/en/csmd_view_mode_photo_lv_239.html",kind:"manufacturer",findings:"Menu location on Z8."},{id:"z5ii-d10",name:"Nikon Z5II Reference Guide - d10 View mode (photo Lv)",url:"https://onlinemanual.nikonimglib.com/z5II/en/csmd_view_mode_photo_lv_239.html",kind:"manufacturer",findings:"Menu location on Z5II."}]},{id:"starlight-view",group:"Exposure & Image",name:"Starlight view (photo Lv)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Custom settings menu > d10 Starlight view (photo Lv)",z5ii:"Custom settings menu > d11 Starlight view (photo Lv)",z50ii:"Custom settings menu > d11 Starlight view (photo Lv)"},one_liner:"Brightens the live view in near darkness so you can compose and focus.",what_it_does:"Starlight view boosts live-view brightness in very dark scenes so you can frame the Milky Way or a dark foreground and focus manually on a star. It is a display aid only; it does not change the recorded exposure.",options:[{value:"ON / OFF",meaning:"ON brightens the photo live view in dark conditions.",use_when:"Astro and moonrise blue-hour foregrounds."}],when_to_change:"Turn on at night on the tripod; turn off for normal shooting.",suggested:[{scenario:"Moonrise at 280mm",value:"ON while composing the foreground before moonrise",scenario_id:"moonrise"},{scenario:"Landscape tripod",value:"ON for night/astro only",scenario_id:"landscape"}],body_differences:"Present on all three; d10 on Z8, d11 on Z5II/Z50II.",gotchas:["Refresh rate drops in starlight view, so it is useless for moving subjects.","Z8 firmware 2.00 removed the histogram from starlight view (Nikon release notes) - don't expect a histogram there."],related:["view-mode-exposure-preview","warm-display-colors","extended-shutter-speeds"],firmware_note:"Z8 fw 2.00: histogram display removed in starlight view.",research_notes:"Detailed option text not read; description from Nikon feature naming and fw notes. Refresh-rate statement is general Nikon behaviour, not re-verified this pass.",sources:[{id:"z8-d10",name:"Nikon Z8 Reference Guide - d10 Starlight View (Photo Lv)",url:"https://onlinemanual.nikonimglib.com/z8/en/csmd_starlight_view_photo_lv_240.html",kind:"manufacturer",findings:"Menu location."},{id:"z50ii-d11",name:"Nikon Z50II Reference Guide - d11 Starlight view",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-05-64.html",kind:"manufacturer",findings:"Menu location."},{id:"z8-fw",name:"Nikon Download Center - Z8 firmware 3.10 notes (history)",url:"https://downloadcenter.nikonimglib.com/en/download/fw/573.html",kind:"manufacturer",findings:"Fw 2.00 removed histogram display in starlight view."}]},{id:"highlight-display-zebras-stills",group:"Exposure & Image",name:"Highlight warning / zebras for stills",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Playback menu > Playback display options > Highlights (blinkies in playback). Live zebras: Custom settings g15 Zebra pattern (video mode only)",z5ii:"Playback menu > Playback display options > Highlights (unverified on Z5II). Live zebras: Custom settings g12 Zebra pattern (video mode only)",z50ii:"Playback menu > Playback display options > Highlights (unverified on Z50II). Live zebras: Custom settings g12 Zebra pattern (video mode only)"},one_liner:"Stills get blinking highlights in playback; live zebras exist only in video mode.",what_it_does:"None of the three bodies lists a live zebra/highlight warning for photo mode: the zebra item sits in the video (g) group of Custom settings. For stills, the highlight check is the playback 'Highlights' page (clipped areas blink) plus the live histogram. Both are based on the JPEG rendering (Picture Control), so RAW usually has a little more headroom.",options:[{value:"Playback display options > Highlights",meaning:"Adds a playback page where clipped areas flash.",use_when:"Always enable it; check after first frames of a scene."},{value:"Workaround: flip to video mode",meaning:"Video-mode zebras (threshold 120–255) show highlights live, then flip back to photo.",use_when:"Static scenes like moon or stage set-up shots."}],when_to_change:"Enable Highlights once and leave it; use the video-mode trick when you must judge highlights live.",suggested:[{scenario:"Stage dance low light",value:"Highlights page on; review first frames of each lighting change",scenario_id:"dance"},{scenario:"Moonrise at 280mm",value:"Check moon with Highlights page; protect lunar detail",scenario_id:"moonrise"},{scenario:"Birds",value:"Highlights on for white plumage",scenario_id:"birds"}],body_differences:"Zebra pattern is g15 on Z8 (with zebra color option added in fw 2.10) and g12 on Z5II/Z50II.",gotchas:["Blinkies and histogram reflect the JPEG/Picture Control, not RAW - Flat Picture Control gives a more honest view.","In video-mode manual focus, focus peaking overrides zebras - turn peaking display off to see zebras (Z50II manual note)."],related:["histogram","picture-control","zebra-pattern","metering"],firmware_note:"Z8 fw 2.10 added zebra pattern color option.",research_notes:"The absence of photo-mode zebras is inferred from menu structure (zebra item in video group) and the Z50II zebra page, which describes video-mode use only. The Playback display options > Highlights wording was not read from page text in this pass. Claim that the histogram/blinkies are JPEG-based is general knowledge, not re-sourced.",sources:[{id:"z50ii-g12",name:"Nikon Z50II Reference Guide - g12 Zebra pattern",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-05-91.html",kind:"manufacturer",findings:"Zebras in video mode; highlights threshold 120–255 or mid-tone range; peaking overrides zebras in MF."},{id:"z8-g15",name:"Nikon Z8 Reference Guide - g15 Zebra Pattern",url:"https://onlinemanual.nikonimglib.com/z8/en/csmg_zebra_pattern_289.html",kind:"manufacturer",findings:"Zebra pattern is in the g (video) custom settings group."},{id:"z8-pb-display",name:"Nikon Z8 Reference Guide - Playback Display Options",url:"https://onlinemanual.nikonimglib.com/z8/en/pbm_playback_display_options_301.html",kind:"manufacturer",findings:"Playback menu item where playback info pages are chosen."}]},{id:"histogram",group:"Exposure & Image",name:"Live histogram (shooting display)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Custom settings menu > d19 Custom monitor shooting display / d20 Custom viewfinder shooting display > tick Histogram; cycle with DISP",z5ii:"Custom settings menu > d19 Custom monitor shooting display / d20 Custom viewfinder shooting display > Histogram",z50ii:"Custom settings menu > d19 Custom monitor shooting display / d20 Custom viewfinder shooting display > Histogram"},one_liner:"Puts a live brightness graph on one of your DISP screens.",what_it_does:"d19/d20 choose which indicators each DISP screen shows, separately for monitor and viewfinder; Histogram is one of them. The histogram reflects the previewed image, so it is only meaningful when View mode is 'Show effects of settings'.",options:[{value:"Histogram ticked on a display (2–4)",meaning:"Histogram appears on that DISP page.",use_when:"Set one EVF page with histogram + virtual horizon for landscapes."}],when_to_change:"Set once; use DISP to call the page when exposure matters.",suggested:[{scenario:"Landscape tripod",value:"EVF page with histogram + virtual horizon + grid",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"Histogram page; keep the moon's spike off the right wall",scenario_id:"moonrise"},{scenario:"Stage dance low light",value:"Histogram page in EVF",scenario_id:"dance"}],body_differences:"Same numbering (d19/d20) on all three. In video mode the brightness display is chosen separately (histogram or waveform) - see video file.",gotchas:["A tiny bright subject (moon, spotlit face) is a few pixels in the histogram - zoom the playback to check.","Histogram follows Picture Control and View mode; with 'Adjust for ease of viewing' it is misleading."],related:["view-mode-exposure-preview","highlight-display-zebras-stills","brightness-information-display"],firmware_note:"",research_notes:"Item list read from Z50II d19 page; Z8/Z5II assumed equivalent (same item names in ToC).",sources:[{id:"z50ii-d19",name:"Nikon Z50II Reference Guide - d19 Custom monitor shooting display",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-05-71.html",kind:"manufacturer",findings:"Displays 2–4 customisable with Histogram, Virtual horizon, Framing grid, Center indicator etc."},{id:"z8-d19",name:"Nikon Z8 Reference Guide - d19 Custom Monitor Shooting Display",url:"https://onlinemanual.nikonimglib.com/z8/en/csmd_custom_monitor_shooting_display_249.html",kind:"manufacturer",findings:"Menu location."},{id:"z5ii-d19",name:"Nikon Z5II Reference Guide - d19 Custom monitor shooting display",url:"https://onlinemanual.nikonimglib.com/z5II/en/csmd_custom_monitor_shooting_display_248.html",kind:"manufacturer",findings:"Menu location."}]},{id:"active-d-lighting",group:"Exposure & Image",name:"Active D-Lighting (ADL)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > Active D-Lighting (also i menu)",z5ii:"Photo shooting menu > Active D-Lighting (also i menu)",z50ii:"Photo shooting menu > Active D-Lighting (also i menu)"},one_liner:"Protects highlights and lifts shadows in high-contrast scenes; can darken RAWs.",what_it_does:"ADL tries to keep both highlight and shadow detail in contrasty light, e.g. a shaded face against bright sky or a window view. Nikon describes it working best with Matrix metering. The shadow lift is applied to JPEG/HEIF (and honoured by NX Studio), but the highlight protection comes from the camera choosing a lower exposure, so the RAW file itself is recorded darker than without ADL.",options:[{value:"Auto",meaning:"Camera picks the strength; in M mode Auto behaves as Normal.",use_when:"JPEG shooting of family/travel."},{value:"Extra high / High / Normal / Low",meaning:"Fixed strengths.",use_when:"Low or Normal if you want a little highlight protection on RAW."},{value:"Off",meaning:"No ADL processing or exposure change.",use_when:"RAW workflow in Lightroom; you control exposure yourself."}],when_to_change:"For a RAW + Lightroom workflow leave it Off and use exposure compensation; turn on only for straight-out-of-camera JPEGs.",suggested:[{scenario:"Stage dance low light",value:"Off (high ISO; ADL adds noise and is disabled at Hi ISO anyway)",scenario_id:"dance"},{scenario:"Birds",value:"Off",scenario_id:"birds"},{scenario:"Landscape tripod",value:"Off; bracket or expose to the right instead",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"Off",scenario_id:"moonrise"},{scenario:"Family indoors",value:"Off for RAW; Auto if shooting JPEG-only for quick sharing",scenario_id:"kids"}],body_differences:"Same options on all three. Unavailable when stills Tone mode is HLG (verified on Z50II).",gotchas:["Lightroom does not apply ADL's shadow lift, so ADL RAWs open darker than expected (widely reported; not re-verified this pass).","May add visible noise, banding or uneven shading (Nikon cautions).","Disabled at Hi ISO values, including those reached by Auto ISO.","In M mode, Auto = Normal."],related:["metering","picture-control","tone-mode-stills","exposure-compensation"],firmware_note:"",research_notes:"Nikon's Z50II ADL page does not describe an effect on exposure. The RAW-darkening behaviour is a long-standing, widely reported Nikon ADL characteristic (Thom Hogan, Photography Life) that I could not re-fetch in this pass (search budget exhausted, PL page failed). Treat as medium confidence.",sources:[{id:"z50ii-adl",name:"Nikon Z50II Reference Guide - Active D-Lighting",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03-14.html",kind:"manufacturer",findings:"Options Auto/Extra high/High/Normal/Low/Off; best with matrix metering; may cause noise/banding/uneven shading; Auto = Normal in M; not applied at Hi ISO."},{id:"z8-adl",name:"Nikon Z8 Reference Guide - Active D-Lighting",url:"https://onlinemanual.nikonimglib.com/z8/en/psm_active_d-lighting_130.html",kind:"manufacturer",findings:"Menu location (photo and video menus each have an ADL item)."},{id:"z50ii-tone",name:"Nikon Z50II Reference Guide - Tone mode",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03-36.html",kind:"manufacturer",findings:"ADL unavailable with HLG tone mode."}]},{id:"picture-control",group:"Exposure & Image",name:"Picture Controls (incl. Flat, Rich Tone Portrait, Flexible Color, Imaging Recipes)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > Set Picture Control (video: Video recording menu > Set Picture Control); custom ones via Manage Picture Control",z5ii:"Photo shooting menu > Set Picture Control (also Picture Control button); Manage Picture Control; Set Picture Control (HLG)",z50ii:"Photo shooting menu > Set Picture Control (also Picture Control button); Manage Picture Control; Set Picture Control (HLG)"},one_liner:"Sets the JPEG/HEIF look and the preview, histogram and blinkies you judge.",what_it_does:"A Picture Control is the in-camera rendering recipe (contrast, color, sharpening) applied to JPEG/HEIF and video, and embedded with the NEF as an instruction that NX Studio honours. It also drives the EVF preview, histogram and highlight warnings. Lightroom ignores it unless you choose a matching Camera profile. Flexible Color profiles are built in NX Studio and loaded into the camera; Imaging Recipes come from Nikon Imaging Cloud.",options:[{value:"Auto / Standard / Neutral / Vivid / Landscape",meaning:"General looks; Neutral is minimal processing.",use_when:"Standard for family JPEGs; Neutral for an honest preview."},{value:"Portrait / Rich Tone Portrait",meaning:"Portrait smooths skin; Rich Tone Portrait is more vivid while keeping skin and highlight detail, intended for retouching.",use_when:"Family portraits, dance portraits."},{value:"Flat",meaning:"Preserves detail across the tonal range; low contrast.",use_when:"RAW shooters wanting the histogram/blinkies to show the most highlight room; heavy grading."},{value:"Monochrome / Flat Monochrome / Deep Tone Monochrome",meaning:"B&W variants; Deep Tone has a built-in red-filter effect.",use_when:"B&W previsualisation."},{value:"Creative Picture Controls (01–20)",meaning:"Stylised presets with Effect level.",use_when:"Fun JPEGs."},{value:"Flexible Color (custom, from NX Studio)",meaning:"Custom color-graded profile made in NX Studio, loaded as a custom Picture Control; cannot be edited on-camera.",use_when:"Your own consistent look across bodies."},{value:"Imaging Recipe (Nikon Imaging Cloud)",meaning:"Downloaded looks via Wi-Fi + Nikon Imaging Cloud (formerly 'Cloud Picture Control').",use_when:"Z5II/Z50II only."}],when_to_change:"Pick once per project: Flat or Neutral for RAW judgement, Standard/Rich Tone Portrait when you will use the JPEGs straight.",suggested:[{scenario:"Stage dance low light",value:"Neutral or Flat (honest highlight preview under spots)",scenario_id:"dance"},{scenario:"Birds",value:"Standard or Neutral",scenario_id:"birds"},{scenario:"Landscape tripod",value:"Flat or Neutral for RAW judgement",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"Flat (maximises visible highlight room)",scenario_id:"moonrise"},{scenario:"Family indoors",value:"Rich Tone Portrait (JPEGs) or Neutral (RAW)",scenario_id:"kids"},{scenario:"Bird video",value:"N-Log (no Picture Control) or Neutral/Flat in SDR for grading in Final Cut Pro",scenario_id:"birds"}],body_differences:"Z8: Rich Tone Portrait, Flat Monochrome and Deep Tone Monochrome added in firmware 2.00; Flexible Color support added in firmware 3.00; no Nikon Imaging Cloud / Imaging Recipes (Z8 not on Nikon USA's compatible list as of July 2025 and its network menu lists no Imaging Cloud item); no dedicated Picture Control button. Z5II and Z50II: full set incl. Flexible Color and Imaging Recipes (renamed from 'Cloud Picture Control' in Z50II fw 1.10 / Z5II fw 1.20); dedicated Picture Control button.",gotchas:["Lightroom ignores in-camera Picture Controls - pick 'Camera Flat'/'Camera Standard' etc. profiles in Lightroom for a match.","Flexible Color-based custom Picture Controls cannot be adjusted or renamed on the camera.","Monochrome Picture Controls disable Portrait impression balance."],related:["picture-control-button","portrait-impression-balance","highlight-display-zebras-stills","tone-mode-video"],firmware_note:"Z8 fw 2.00: Rich Tone Portrait, Flat Monochrome, Deep Tone Monochrome. Z8 fw 3.00: Flexible Color. Z50II fw 1.10 and Z5II fw 1.20: 'Cloud Picture Control' renamed 'Imaging Recipe'.",research_notes:"Full preset list read from the Z50II Picture Controls page; Z8 list = same core presets plus fw 2.00 additions (Nikon USA). Lightroom profile behaviour is general knowledge, not re-sourced.",sources:[{id:"z50ii-pc-list",name:"Nikon Z50II Reference Guide - Picture Controls",url:"https://onlinemanual.nikonimglib.com/z50II/en/18-07.html",kind:"manufacturer",findings:"Preset list incl. Flat, Rich Tone Portrait, Flat/Deep Tone Monochrome, Creative 01–20, Flexible Color (NX Studio), Cloud Picture Controls; Picture Control button; parameter list."},{id:"z50ii-set-pc",name:"Nikon Z50II Reference Guide - Set Picture Control",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03-11.html",kind:"manufacturer",findings:"Add Cloud Picture Control via Nikon Imaging Cloud; renamed Imaging Recipe in fw 1.10."},{id:"z5ii-recipe",name:"Nikon Z5II - 'Cloud Picture Control' changed to 'Imaging Recipe' (fw 1.20)",url:"https://onlinemanual.nikonimglib.com/z5II/en/changing_imaging_recipe_390.html",kind:"manufacturer",findings:"Rename in fw 1.20."},{id:"nikonusa-z8-fw2",name:"Nikon USA - Z8 firmware 2.0",url:"https://www.nikonusa.com/content/z-8-firmware-2-point-0",kind:"manufacturer",findings:"New Picture Controls: Rich Tone Portrait, Flat Monochrome, Deep Tone Monochrome."},{id:"z8-fw",name:"Nikon Download Center - Z8 firmware notes",url:"https://downloadcenter.nikonimglib.com/en/download/fw/573.html",kind:"manufacturer",findings:"Fw 3.00 added Flexible Color Picture Controls (stills and video)."},{id:"nikonusa-nic",name:"Nikon USA - Understanding Nikon Imaging Cloud",url:"https://www.nikonusa.com/learn-and-explore/c/tips-and-techniques/understanding-what-nikon-imaging-cloud-can-do-for-you",kind:"manufacturer",findings:"Imaging recipes for Z6III, Z50II, Z5II, Zf and ZR (as of July 2025); Z8 not listed."},{id:"nikon-z5ii-spec",name:"Nikon Z5II product page",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z5_2/",kind:"manufacturer",findings:"Dedicated Picture Control button; Imaging Recipes and Flexible Color."}]},{id:"picture-control-button",group:"Exposure & Image",name:"Picture Control button",available_on:["z5ii","z50ii"],menu_path:{z5ii:"Dedicated Picture Control button on body; reassignable in Custom settings f2 Custom controls (shooting)",z50ii:"Dedicated Picture Control button on body; reassignable in Custom settings f2 Custom controls (shooting)"},one_liner:"One press opens the Picture Control picker with live preview.",what_it_does:"Pressing the button shows the Picture Control list over live view so you can preview and choose a look; highlighting one and pressing right lets you edit it. You can limit which Picture Controls appear in this list (photo SDR and video lists separately). Like any Fn button it can be reassigned in f2.",options:[{value:"Default role (Picture Control selection)",meaning:"Opens the Picture Control list.",use_when:"If you switch looks often (JPEG users)."},{value:"Reassigned role",meaning:"Any f2 role (e.g. AF-ON, ISO, Metering).",use_when:"RAW shooters who set Picture Control once - repurpose it."}],when_to_change:"If you never change Picture Control in the field, reassign it to something you do change.",suggested:[{scenario:"Family indoors",value:"Keep default if you shoot JPEG for sharing",scenario_id:"kids"},{scenario:"Stage dance low light",value:"Reassign to Metering or Silent mode (Z50II f2 offers both)",scenario_id:"dance"}],body_differences:"Z8 has no Picture Control button (assign 'Set Picture Control' to an Fn button or i menu instead).",gotchas:["Limiting the list hides Picture Controls only from this picker; menus still show all.","HLG photo-mode Picture Controls cannot be limited."],related:["picture-control","custom-controls-i-menu"],firmware_note:"",research_notes:"Reassignability verified on Z50II (Picture Control button listed in f2); Z5II assumed same.",sources:[{id:"z50ii-pc-list",name:"Nikon Z50II Reference Guide - Picture Controls",url:"https://onlinemanual.nikonimglib.com/z50II/en/18-07.html",kind:"manufacturer",findings:"Picture Control button behaviour; limiting choices."},{id:"z50ii-f2",name:"Nikon Z50II Reference Guide - f2 Custom controls (shooting)",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-05-40.html",kind:"manufacturer",findings:"Picture Control button is an assignable control."},{id:"nikon-z5ii-spec",name:"Nikon Z5II product page",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z5_2/",kind:"manufacturer",findings:"Dedicated Picture Control button."}]},{id:"white-balance",group:"Exposure & Image",name:"White balance (incl. Auto variants and Natural light auto)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > White balance (also WB button + dials / i menu)",z5ii:"Photo shooting menu > White balance (also i menu)",z50ii:"Photo shooting menu > White balance (also Fn1 + dials / i menu)"},one_liner:"Sets color neutrality for the light; RAW lets you change it later.",what_it_does:"White balance neutralises the light's color for JPEG/HEIF/video and sets the as-shot value a RAW opens with in Lightroom. Auto has three flavours for warm light: Keep white, Keep overall atmosphere, Keep warm lighting colors. Natural light auto targets daylight scenes (about 4500–8000 K) for colors closer to what the eye sees. Kelvin and preset manual give fixed, repeatable results.",options:[{value:"Auto 0 - Keep white (reduce warm colors)",meaning:"Removes the warm cast of incandescent light.",use_when:"Indoor family shots where you want neutral skin."},{value:"Auto 1 - Keep overall atmosphere",meaning:"Partially keeps warm cast.",use_when:"General default."},{value:"Auto 2 - Keep warm lighting colors",meaning:"Keeps the warm cast.",use_when:"Festival lamps, candle-lit pooja, cosy evenings."},{value:"Natural light auto",meaning:"Auto tuned for daylight (~4500–8000 K); may misbehave under artificial light.",use_when:"Landscape, foliage, birds outdoors."},{value:"Presets (Direct sunlight 5200K, Cloudy 6000K, Shade 8000K, Incandescent 3000K, Fluorescent, Flash 5400K)",meaning:"Fixed values.",use_when:"Consistent sequences."},{value:"Choose color temperature (~2500–10000 K)",meaning:"Manual Kelvin.",use_when:"Stage with fixed lighting, moonrise, video."},{value:"Preset manual (d-1 to d-6)",meaning:"Measure off a white/grey card or copy from a photo.",use_when:"Mixed or colored light, video interviews."}],when_to_change:"For RAW stills Auto is fine; fix the Kelvin for video and for sequences you want consistent.",suggested:[{scenario:"Stage dance low light",value:"Auto 1 for RAW; for video or JPEG a fixed Kelvin (e.g. 3200–4300 K) measured at the venue",scenario_id:"dance"},{scenario:"Birds",value:"Natural light auto or Auto 1",scenario_id:"birds"},{scenario:"Landscape tripod",value:"Natural light auto or Direct sunlight (fix for panoramas)",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"Daylight/~5000 K (fixed so the moon's color isn't neutralised)",scenario_id:"moonrise"},{scenario:"Family indoors",value:"Auto 0 (Keep white) or Auto 2 for warm mood",scenario_id:"kids"},{scenario:"Bird video",value:"Fixed Kelvin or Natural light auto locked; never let WB drift mid-clip",scenario_id:"birds"}],body_differences:"Same option set on all three per Nikon menu structure; WB access buttons differ (Z8 has a dedicated WB button; Z50II uses Fn1 + dial by default).",gotchas:["Don't use Kelvin under fluorescent light - use the Fluorescent preset (Nikon note).","Auto may fail with large studio flash; use Flash preset or preset manual.","Video WB is a separate menu item; it doesn't follow the photo setting unless linked by your banks."],related:["picture-control","portrait-impression-balance"],firmware_note:"",research_notes:"Option list and Kelvin values read from Z50II manual WB chapter. Z8 WB button: from body layout knowledge, not re-verified.",sources:[{id:"z50ii-wb",name:"Nikon Z50II Reference Guide - White balance (chapter)",url:"https://onlinemanual.nikonimglib.com/z50II/en/18-06.html",kind:"manufacturer",findings:"Auto with Keep white / Keep overall atmosphere / Keep warm lighting colors (~3500–8000 K); Natural light auto (~4500–8000 K); preset values; Kelvin 2500–10000 K; preset manual d-1..d-6; fine-tuning."},{id:"z8-wb",name:"Nikon Z8 Reference Guide - White Balance",url:"https://onlinemanual.nikonimglib.com/z8/en/psm_white_balance_125.html",kind:"manufacturer",findings:"Menu location."},{id:"z5ii-wb",name:"Nikon Z5II Reference Guide - White balance",url:"https://onlinemanual.nikonimglib.com/z5II/en/psm_white_balance_130.html",kind:"manufacturer",findings:"Menu location."}]},{id:"image-area",group:"Exposure & Image",name:"Image area / DX crop",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > Image area > Choose image area (FX, DX, 1:1, 16:9); limit choices in Custom settings d7",z5ii:"Photo shooting menu > Image area > Choose image area; limit choices in Custom settings d8",z50ii:"Photo shooting menu > Choose image area (DX, 1:1, 16:9); limit choices in Custom settings d8"},one_liner:"Crops the sensor (DX or aspect ratios) for reach, framing or speed.",what_it_does:"Image area records only part of the sensor. DX on the FX bodies gives a 1.5x crop (Z8 DX = 5392 x 3592, about 19.4 MP) with the EVF filled by the cropped view. 1:1 and 16:9 change aspect ratio. JPEG/HEIF are permanently cropped; on the Z8, per one review, the RAW keeps crop information as metadata.",options:[{value:"FX (36x24)",meaning:"Full sensor.",use_when:"Default on Z8/Z5II."},{value:"DX (24x16)",meaning:"1.5x crop; Z8 19.4 MP; Z5II about 10 MP (not verified).",use_when:"Birds when out of reach on Z8, DX-only lenses on FX bodies."},{value:"1:1 / 16:9",meaning:"Aspect-ratio crops.",use_when:"Previsualising square or cinematic frames."}],when_to_change:"Use DX on the Z8 to fill the EVF with a distant bird; otherwise stay FX and crop in Lightroom.",suggested:[{scenario:"Birds",value:"Z8: FX normally; DX when the bird is tiny and you need a bigger EVF view (19.4 MP)",scenario_id:"birds"},{scenario:"Landscape tripod",value:"FX (crop later)",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"Z8: DX gives ~420 mm equivalent framing; same pixels on the moon as cropping FX",scenario_id:"moonrise"}],body_differences:"Z50II is DX-native; its options are DX, 1:1 and 16:9 (no FX). Z8 offers FX/DX/1:1/16:9. Z5II offers FX and DX at least; aspect-ratio options not verified.",gotchas:["DX crop doesn't add detail on the moon/bird - it only changes framing and file size.","DX-format lenses force DX on FX bodies.","Forgetting DX on after a bird session silently cuts your landscape resolution."],related:["raw-compression","video-frame-size-rate"],firmware_note:"",research_notes:"Z8 pixel dimensions from havecamerawilltravel review; Z50II from Nikon manual. Z5II DX MP and aspect options not verified.",sources:[{id:"z50ii-image-area",name:"Nikon Z50II Reference Guide - Image recording options",url:"https://onlinemanual.nikonimglib.com/z50II/en/18-01.html",kind:"manufacturer",findings:"Z50II image areas DX, 1:1, 16:9 with pixel sizes; RAW always Large."},{id:"z8-image-area",name:"Nikon Z8 Reference Guide - Image Area",url:"https://onlinemanual.nikonimglib.com/z8/en/psm_image_area_119.html",kind:"manufacturer",findings:"Menu location; d7 Limit selectable image area."},{id:"z5ii-image-area",name:"Nikon Z5II Reference Guide - Image area",url:"https://onlinemanual.nikonimglib.com/z5II/en/psm_image_area_124.html",kind:"manufacturer",findings:"Menu location; d8 Limit selectable image area."},{id:"hcwt-z8",name:"Have Camera Will Travel - Nikon Z8 image formats, sizes & types",url:"https://havecamerawilltravel.com/nikon-z8-image-settings/",kind:"review",findings:"Z8 FX/DX/1:1/16:9; DX Large 5392x3592 (19.4 MP); RAW keeps crop as metadata."}]},{id:"raw-compression",group:"Exposure & Image",name:"RAW recording (NEF compression)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > RAW recording",z5ii:"Photo shooting menu > RAW recording",z50ii:"Photo shooting menu > RAW recording"},one_liner:"Trades NEF file size against compression: Lossless, High efficiency star, High efficiency.",what_it_does:"Chooses how NEF files are compressed. Lossless keeps all data and is largest. High efficiency star (HE*) and High efficiency (HE) use Nikon's TicoRAW-based codec for much smaller files; Nikon states HE* is comparable in quality to lossless and better than HE. All three bodies record 14-bit NEFs per Nikon specifications.",options:[{value:"Lossless compression",meaning:"Mathematically lossless; largest files.",use_when:"Landscapes, astro, macro stacks; anything you may push hard."},{value:"High efficiency* (HE star)",meaning:"Smaller files, near-lossless quality per Nikon.",use_when:"Default for birds/events on Z8 to save card space and buffer time."},{value:"High efficiency (HE)",meaning:"Smallest NEF, more compression.",use_when:"Long bird bursts or travel with limited cards."}],when_to_change:"Go Lossless for scenes you'll lift shadows heavily; HE* for high-volume action.",suggested:[{scenario:"Stage dance low light",value:"Lossless or HE* (shadows get lifted after AI Denoise)",scenario_id:"dance"},{scenario:"Birds",value:"HE*",scenario_id:"birds"},{scenario:"Landscape tripod",value:"Lossless",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"Lossless",scenario_id:"moonrise"},{scenario:"Family indoors",value:"HE*",scenario_id:"kids"}],body_differences:"Same three options on all three bodies (Nikon spec pages / Z50II manual). Z50II and Z5II use SD cards, so HE* noticeably helps buffer clearing there.",gotchas:["Lightroom Classic supports HE/HE* NEFs only in recent versions - keep LR updated.","Lightroom AI Denoise works on HE/HE* NEFs, but deep-shadow pushes are where lossless matters most (field judgement)."],related:["raw-bit-depth-readout","raw-plus-jpeg-preview"],firmware_note:"",research_notes:"TicoRAW basis and Lightroom/AI Denoise remarks are general knowledge, not re-sourced this pass. Card-buffer remark is field judgement.",sources:[{id:"z50ii-raw",name:"Nikon Z50II Reference Guide - RAW recording",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03-08.html",kind:"manufacturer",findings:"Lossless / High efficiency* / High efficiency; HE* comparable to lossless and better than HE."},{id:"z8-raw",name:"Nikon Z8 Reference Guide - RAW Recording",url:"https://onlinemanual.nikonimglib.com/z8/en/psm_raw_recording_123.html",kind:"manufacturer",findings:"Menu location."},{id:"z5ii-raw",name:"Nikon Z5II Reference Guide - RAW recording",url:"https://onlinemanual.nikonimglib.com/z5II/en/psm_raw_recording_128.html",kind:"manufacturer",findings:"Menu location."},{id:"nikon-z8-spec",name:"Nikon Z8 product/spec page",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z_8/",kind:"manufacturer",findings:"NEF 14-bit; lossless, HE*, HE."},{id:"nikon-z5ii-spec",name:"Nikon Z5II product/spec page",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z5_2/",kind:"manufacturer",findings:"NEF 14-bit; lossless, HE*, HE."},{id:"z50ii-spec",name:"Nikon Z50II Reference Guide - Specifications",url:"https://onlinemanual.nikonimglib.com/z50II/en/15-08.html",kind:"manufacturer",findings:"NEF 14-bit; lossless or two HE options."}]},{id:"raw-plus-jpeg-preview",group:"Exposure & Image",name:"RAW + JPEG fine for sharper playback checks (embedded preview)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > Image quality > RAW + JPEG fine (or fine star) ; secondary slot can split RAW/JPEG via Secondary slot function",z5ii:"Photo shooting menu > Image quality > RAW + JPEG fine",z50ii:"Photo shooting menu > Image quality > RAW + JPEG/HEIF fine"},one_liner:"Adds a high-quality JPEG so zoomed playback shows truer sharpness.",what_it_does:"In-camera playback never renders the RAW; it shows a JPEG. With RAW only, it shows the JPEG preview embedded in the NEF, which on recent Nikon Z bodies is full-size but roughly 'basic' quality. With RAW + JPEG, the camera displays the separate JPEG copy, so 100% zoom gives a better read of focus and motion blur at the cost of card space.",options:[{value:"RAW",meaning:"NEF only; playback uses the embedded preview.",use_when:"Card space matters; you check sharpness on the computer."},{value:"RAW + JPEG fine",meaning:"NEF plus fine JPEG; playback uses the JPEG.",use_when:"Critical focus checks in the field (macro, birds, stage)."},{value:"RAW + JPEG basic / normal",meaning:"Smaller companion JPEG.",use_when:"Compromise for sharing; preview quality between embedded and fine."}],when_to_change:"Turn on when nailing focus in the field matters more than card space; off for long bird bursts.",suggested:[{scenario:"Stage dance low light",value:"RAW + JPEG fine on Z8 (JPEG to slot 2 via Secondary slot function if you prefer)",scenario_id:"dance"},{scenario:"Birds",value:"RAW only (buffer/card) - or RAW + JPEG basic",scenario_id:"birds"},{scenario:"Landscape tripod",value:"RAW + JPEG fine to judge focus/diffraction at 100%",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"RAW + JPEG fine to check moon sharpness",scenario_id:"moonrise"},{scenario:"Family indoors",value:"RAW + JPEG fine (quick sharing)",scenario_id:"kids"}],body_differences:"Z50II records NEF + HEIF instead of NEF + JPEG when Tone mode is HLG (same applies to other HLG-capable bodies). Z8 has two card slots (CFexpress B + SD) so it can split RAW/JPEG across slots; Z5II has two SD slots; Z50II one SD slot.",gotchas:["Deleting the JPEG copy on the camera also deletes the NEF (Z50II manual).","Embedded-preview sharpness is a forum-measured observation (Z6III), not a Nikon spec; Z8 behaviour assumed similar.","JPEG burst depth is lower than RAW-only - matters on SD-card bodies."],related:["raw-compression","picture-control"],firmware_note:"",research_notes:"Embedded preview = full-size, ~JPEG basic quality: DPReview forum test on a Z6III (user 'Mike'); not verified for Z8/Z5II/Z50II specifically. Slot counts from general body knowledge, not re-sourced this pass.",sources:[{id:"dpr-embedded",name:"DPReview forum - Z8 macro resolution, live view versus capture",url:"https://www.dpreview.com/forums/threads/z8-macro-resolution-live-view-versus-capture.4815332",kind:"forum",findings:"Z6III embedded NEF preview is full size (6040x4024) at about JPEG-basic sharpness; paired JPEG slightly sharper at 200%."},{id:"z50ii-quality",name:"Nikon Z50II Reference Guide - Image recording options",url:"https://onlinemanual.nikonimglib.com/z50II/en/18-01.html",kind:"manufacturer",findings:"Camera displays only the JPEG/HEIF copy of dual-format pictures; deleting it deletes the NEF; HLG gives NEF+HEIF."},{id:"z8-quality",name:"Nikon Z8 Reference Guide - Image Quality Settings",url:"https://onlinemanual.nikonimglib.com/z8/en/psm_image_quality_121.html",kind:"manufacturer",findings:"Menu location."}]},{id:"raw-bit-depth-readout",group:"Exposure & Image",name:"NEF bit depth (14 vs 12) and Z8 sensor readout",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"No user menu for bit depth; readout behaviour follows Release mode / Custom settings d1",z5ii:"No user menu for bit depth found in the menu structure",z50ii:"No user menu for bit depth (RAW recording page lists compression only)"},one_liner:"All three record 14-bit NEFs; Z8's fast readout governs e-shutter distortion.",what_it_does:"Nikon lists 14-bit NEF for the Z8, Z5II and Z50II and none of their menus offers a bit-depth choice. On the Z8 (electronic shutter only), how fast the sensor is read decides rolling-shutter skew and banding under flicker: about 1/270 s in normal stills drive, slower in the JPEG-only C60/C120 modes and in video. 12-bit sensor reads apply to N-RAW/ProRes RAW video, not stills.",options:[{value:"Normal stills drive (Single, CL, CH)",meaning:"Measured ~1/268–1/270 s readout (14-bit stills) on Z8/Z9.",use_when:"All stills; skew essentially invisible."},{value:"C60 / C120 high-speed frame capture+",meaning:"JPEG only; readout measured slower (~1/90 s at C60, ~1/173 s at C120).",use_when:"Rarely; expect more skew on fast wings."},{value:"Video",meaning:"Readout measured ~1/70 s in video mode; RAW video is 12-bit.",use_when:"Expect some skew on fast pans in 8K/full-width modes."}],when_to_change:"Nothing to set for bit depth; choose release mode knowing C60/C120 and video read slower.",suggested:[{scenario:"Birds",value:"Z8: CH (RAW) for flight - fast readout; avoid C60/C120 for wing detail",scenario_id:"birds"},{scenario:"Stage dance low light",value:"Z8: fine under LED stage lights at normal drive; turn on Photo flicker reduction if banding appears",scenario_id:"dance"},{scenario:"Bird video",value:"Expect slower readout than stills; avoid whip pans",scenario_id:"birds"}],body_differences:"Z8 is stacked-sensor, electronic-shutter only with very fast readout. Z5II and Z50II have mechanical shutters; their electronic-shutter readout is much slower (not measured in this pass) - use mechanical/EFCS for moving subjects on those bodies.",gotchas:["Some sources claim the Z8/Z9 drop to 12-bit in certain high-speed modes; Nikon's spec lists only 14-bit NEF - unverified.","Silent/electronic shutter on Z5II/Z50II can bend moving subjects and band under LED lights."],related:["raw-compression","video-file-type"],firmware_note:"",research_notes:"Readout figures are Horshack's measurements reported in a DPReview forum thread (forum-weight). Whether any Z8 stills mode is 12-bit could not be confirmed; Nikon's Z8 spec page shows 14-bit NEF only. Z5II/Z50II e-shutter readout not measured in this pass. Thom Hogan's 'Sensor read-out speeds' page could not be read (content not served).",sources:[{id:"dpr-horshack",name:"DPReview forum - Z8/Z9 rolling shutter in 60fps/120fps modes (Horshack)",url:"https://www.dpreview.com/forums/thread/4752433",kind:"forum",findings:"Usual Z8/Z9 readout ~1/268–1/270; C60 1/90; C120 1/173; video ~1/70. Stills 14-bit, N-RAW 12-bit, H.264/H.265 10-bit readout."},{id:"nikon-z8-spec",name:"Nikon Z8 product/spec page",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z_8/",kind:"manufacturer",findings:"NEF 14-bit; 12-bit figures relate to RAW video."},{id:"z50ii-spec",name:"Nikon Z50II Reference Guide - Specifications",url:"https://onlinemanual.nikonimglib.com/z50II/en/15-08.html",kind:"manufacturer",findings:"NEF 14-bit."},{id:"nikon-z5ii-spec",name:"Nikon Z5II product/spec page",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z5_2/",kind:"manufacturer",findings:"NEF 14-bit."},{id:"thom-readout",name:"Thom Hogan - Sensor Read-Out Speeds",url:"https://zsystemuser.com/z-mount-cameras/z-camera-articles/sensor-read-out-speeds.html",kind:"review",findings:"Page exists but its body could not be retrieved in this pass."}]},{id:"long-exposure-nr",group:"Exposure & Image",name:"Long exposure NR",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > Long exposure NR",z5ii:"Photo shooting menu > Long exposure NR",z50ii:"Photo shooting menu > Long exposure NR"},one_liner:"Dark-frame subtraction for exposures over 1 s; doubles each exposure's time.",what_it_does:"For shutter speeds slower than 1 s, the camera takes a second, dark exposure of equal length after the shot and subtracts its hot pixels and glow. This roughly doubles the time per frame and you cannot shoot while it runs.",options:[{value:"ON",meaning:"Dark frame after exposures longer than 1 s.",use_when:"Single long exposures on warm nights where hot pixels show."},{value:"OFF",meaning:"No dark frame.",use_when:"Star stacking, time-lapse, moonrise sequences - take your own dark frames instead."}],when_to_change:"Turn on for a few single long exposures; off for any sequence or stacking.",suggested:[{scenario:"Landscape tripod",value:"ON for single 30 s+ night frames; OFF for blue hour sequences",scenario_id:"landscape"},{scenario:"Moonrise at 280mm",value:"OFF (short exposures, timing matters)",scenario_id:"moonrise"}],body_differences:"Same on all three.",gotchas:["Turning the camera off during processing saves the photo without NR.","It blocks shooting during the dark frame - you will miss a fast-changing sky."],related:["extended-shutter-speeds","high-iso-nr"],firmware_note:"",research_notes:"Whether LENR is baked into the NEF is general knowledge (yes, dark frame is applied to raw data), not re-sourced this pass.",sources:[{id:"z50ii-lenr",name:"Nikon Z50II Reference Guide - Long exposure NR",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03-15.html",kind:"manufacturer",findings:"Applies slower than 1 s; processing roughly doubles time; cannot shoot during 'Performing noise reduction'."},{id:"z8-lenr",name:"Nikon Z8 Reference Guide - Long Exposure NR",url:"https://onlinemanual.nikonimglib.com/z8/en/psm_long_exposure_nr_131.html",kind:"manufacturer",findings:"Menu location."},{id:"z5ii-lenr",name:"Nikon Z5II Reference Guide - Long exposure NR",url:"https://onlinemanual.nikonimglib.com/z5II/en/psm_long_exposure_nr_136.html",kind:"manufacturer",findings:"Menu location."}]},{id:"high-iso-nr",group:"Exposure & Image",name:"High ISO NR (and Z8 High ISO NR mode)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > High ISO NR; Photo shooting menu > High ISO NR mode (fw 3.00+)",z5ii:"Photo shooting menu > High ISO NR",z50ii:"Photo shooting menu > High ISO NR"},one_liner:"In-camera noise reduction for JPEG/HEIF; irrelevant if you use Lightroom AI Denoise.",what_it_does:"Applies noise reduction to processed images, more strongly at higher ISO. Settings are High, Normal, Low or Off (Off still applies minimal NR when needed). For NEF files Lightroom ignores this setting, so it matters for JPEGs, the playback preview and NX Studio renders. The Z8 gained a separate High ISO NR mode item in firmware 3.00.",options:[{value:"High / Normal / Low",meaning:"Stronger to weaker NR; stronger smears fine detail.",use_when:"JPEG-only high-ISO shooting."},{value:"Off",meaning:"Only minimal NR when needed (always less than Low).",use_when:"RAW + Lightroom AI Denoise workflow."},{value:"Z8 High ISO NR mode",meaning:"Additional mode item added in fw 3.00; option names not verified.",use_when:"See Z8 manual page."}],when_to_change:"Set Low/Off for RAW workflows; Normal for JPEG-only events.",suggested:[{scenario:"Stage dance low light",value:"Low or Off (RAW + AI Denoise)",scenario_id:"dance"},{scenario:"Birds",value:"Low",scenario_id:"birds"},{scenario:"Family indoors",value:"Normal if sharing JPEGs straight from camera",scenario_id:"kids"}],body_differences:"Only the Z8 has the extra 'High ISO NR mode' item (fw 3.00). Video has its own High ISO NR item in the Video recording menu on all three.",gotchas:["High NR on JPEGs can make the playback preview look softer than the RAW really is.","Video High ISO NR is separate and is baked into the footage."],related:["long-exposure-nr","auto-iso","raw-plus-jpeg-preview"],firmware_note:"Z8 fw 3.00 added 'High ISO NR mode' in the Photo shooting menu.",research_notes:"Z8 High ISO NR mode option names and behaviour could not be read (Z8 manual body not machine-readable; search budget exhausted). 'Lightroom ignores in-camera NR for NEF' is general knowledge, not re-sourced.",sources:[{id:"z50ii-hinr",name:"Nikon Z50II Reference Guide - High ISO NR",url:

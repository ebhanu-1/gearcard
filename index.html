often too broad (focusing chapter)."},{id:"phillipreeve",name:"phillipreeve.net (BastianK): Review: Voigtländer 58mm 1.4 SL IIs Nokton (Nikon F)",url:"https://phillipreeve.net/blog/review-voigtlander-58mm-1-4-sl-iis-nokton-nikon-f/",kind:"review",tested_on:"Sony A7rII (42MP) adapted; A7III and Nikon FM2n film for samples; SL IIs (2017) version",date:"2024-06",findings:"2007, 2012 and 2017 versions share the same optical design. 315 g measured, 0.45 m, 1:5.9 measured, 9 rounded blades, 52 mm, about 270° throw. Infinity: contrast rises strongly by f/2–f/2.8; corners good from f/8. Portrait (1.5 m): good at f/1.4–f/2 across centre and midframe. Close (0.45 m): f/1.4 very soft, f/2 soft, f/2.8 almost good, f/4 very contrasty. Focus shift slight (lowest of three compared), visible on close inspection. Bokeh classic double Gauss: smooth close up, busy double edges mid-distance, calmer at f/2.8, strong cat's eyes. Lateral CA almost none; LoCA average. Flare poor (ghosts at f/1.4, ring at f/2.8, ghosts or veil at f/11). Sunstars decent f/8–f/16. Coma not well corrected, very good from f/5.6. Vignetting 2.6 / 2.1 / 1.1 / 0.5 / 0.3 EV at f/1.4 / f/2 / f/2.8 / f/4 / f/5.6+. Low barrel distortion."},{id:"diglloyd",name:"Diglloyd (premium page excerpt): Voigtländer Nokton 58 focus shift; and 2013 D800E 58mm blog post",url:"https://diglloyd.com/prem/s/DAP/Voigtlander/Nokton58-focus-shift-dolls.html",kind:"review",tested_on:"Body not named in the visible excerpt",date:"2022 or earlier (copyright footer)",findings:"Visible excerpt only: focus shift relatively small, much less than 50mm alternatives, noticeable from f/2.8 to f/4, predictable elsewhere. Direction not visible. Blog post https://diglloyd.com/blog/2013/20131103_1-D800E-58mm-lenses.html (2013-11): focuses to 1:5.8; newer SL II N 'apparently optically identical'."},{id:"cameraquest",name:"CameraQuest: Voigtländer SL II lenses",url:"https://cameraquest.com/Voigt_SL2.htm",kind:"manufacturer",tested_on:null,date:null,findings:"Dealer/importer page. SL II v1: rubber grip, Nikon AI-S and Pentax KA, CPU. SL II N (April 2012): 'same glass as earlier SL II Version', all-metal focus barrel, 65.9 mm diameter (vs 64.4), Nikon only, CPU. SL II S (2016): 'same glass as the previous SLIIN version'; differences are the barrel, smaller 52 mm filter ring, NAI prong and new 58LHs hood; CPU integrated."},{id:"specs_db",name:"Lenstip SL II S spec page and Photography Life lens database",url:"https://lenstip.com/1415-Voigtlander_Nokton_58_mm_f_1.4_SL_II_S-lens_specifications.html",kind:"manufacturer",tested_on:null,date:null,findings:"Lenstip SL II S: 7/6, 0.45 m, 9 blades, 52 mm, 320 g, f/16, announced 2016-09-16. Photography Life (https://photographylife.com/lenses/voigtlander-58mm-f1-4-nokton-sl-ii): 0.45 m, 1:5.8, 9 blades, 320 g, 7/6, CPU built in, and lists a 58 mm filter for the SL II."},{id:"jakehorn",name:"Jake Horn: Voigtlander 58mm F1.4 SL II Review",url:"https://jakehornphotography.com/blog/voigtlander58",kind:"review",tested_on:"Body not named (digital and film)",date:"2018-09",findings:"SL II v1. Second version optically and mechanically the same, with cosmetic changes such as a metal focus ring. Focus smooth but tight at the ends of travel. Implies the blades are straight compared with the Nikon 58/1.4G's curved blades. Aperture clicks only at marked stops. Hood sold separately."},{id:"nikon_ftz_ii",name:"Nikon: Mount Adapter FTZ II product page",url:"https://www.nikon.ie/en_IE/product/accessories/mirrorless/mount-adapter-ftz-ii",kind:"manufacturer",tested_on:null,date:null,findings:"Non-VR F-mount lens: yaw, pitch and roll corrected in-camera."}],kc={url:null,access:"not-found",summary:"No Christopher Frost review of the Voigtländer Nokton 58mm f/1.4 SL II (any version) was found. A search with his name and the lens returned only Lenstip, Photozone, Adorama and spec pages. Nothing is attributed to him."},Ic="1) Version identity: CameraQuest (SL II → SL II N → SL II S each 'same glass'), Phillip Reeve's site (2007/2012/2017 same optical design), Jake Horn and diglloyd ('apparently optically identical') agree. No Cosina/voigtlaender.de document was fetched to confirm. 2) Filter: SL II S is 52 mm (Lenstip spec, Reeve's site, CameraQuest). CameraQuest calls the SL II S filter 'smaller', and Photography Life lists 58 mm for the SL II, yet Lenstip's SL II review lists 52 mm. The owner's version is not recorded, so filter_mm is null. 3) Rounded blades: Reeve's site (SL IIs) says rounded; Jake Horn (SL II) implies straight. Null. 4) Test vintage: Lenstip D3x (24MP) and Photozone FF (Canon DSLR) are 2010-era; Reeve's site used a 42MP Sony with a thick filter stack, which may make the corners look worse than on Nikon Z. No Nikon Z or 45MP Nikon test found. 5) Focus shift: present but small; direction not stated by any source read (diglloyd full page is paywalled). 6) Flare conflict: Lenstip positive (2010) vs Reeve's site strongly negative (2024). Reeve's more detailed test is weighted higher. 7) Aperture-ring-at-minimum behaviour on FTZ II is inferred from general CPU-lens behaviour and the Zeiss ZF.2 finding; not tested for this lens. 8) Weight 315 g (Reeve's site measured, SL IIs) to 320 g (Lenstip, Photography Life).",Fc={id:Yl,name:ec,short:tc,mount:oc,adapter:nc,coverage:ic,kind:sc,focal_mm:ac,max_aperture:rc,min_aperture_f:lc,aperture_blades:cc,rounded_blades:dc,weight_g:mc,filter_mm:uc,focus:hc,stabilization:fc,close_focus:pc,quick:gc,character:bc,field_tips:wc,body_notes:_c,tc_compatible:vc,sources:yc,chris_frost:kc,research_notes:Ic},Sc="z-14-30-f4-s",Zc="NIKKOR Z 14-30mm f/4 S",Pc="14-30 f/4 S",Ac="Z",Cc=null,Nc="FX",zc="zoom",xc=[14,30],Rc=[{focal_mm:14,f:4},{focal_mm:30,f:4}],Dc=22,Lc=7,Mc=!0,Oc=485,Tc=82,Ec={on_z_body:"AF",cpu:!0,motor:"STM (stepping motor), focus-by-wire",focus_throw_deg:null,notes:"Retractable design: the lens must be unlocked (twist the zoom ring out of the retracted position) before the camera will shoot (Phillip Reeve: cannot shoot while locked). Front element does not rotate during zoom or focus (Phillip Reeve), so polarizers and graduated filters stay put. Dustin Abbott (Z8) calls focus breathing very low even at 30mm and the lens near-parfocal when zooming. Lenstip: AF quiet, fast and accurate; stopping from f/4 to f/5.6 shifts the depth of field slightly backward, visible only at 30mm and short distances."},Vc={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"No optical VR (Nikon spec lists none). Body IBIS only on Z8 and Z5 II. The Z50 II has no IBIS (Digital Camera World), but at 14–30mm (21–45mm equivalent) handholding is rarely the limit."},$c={mfd_m:[{focal_mm:14,value:.28},{focal_mm:30,value:.28}],max_mag:[{focal_mm:30,value:.16}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"Nikon: MFD 0.28 m (single figure for the whole range), max reproduction 0.16x. Photography Life: 1:6.3 at 30mm, filling the frame horizontally with an object about 22.4 cm wide. At 0.16x the effective-aperture loss is negligible. Working distance not published; the lens is 85 mm long from the flange (Nikon), so at 0.28 m from the focal plane the front is roughly 0.18 m from the subject (rough arithmetic: 280 − 16 flange back − 85 barrel; not measured, so the field is null)."},Xc={headline:"Excellent center from f/4; on the Z8 use f/5.6–f/8 for edge-to-edge at 14–24mm and f/8–f/11 at 30mm, where the corners are weakest. Strong raw vignetting, low coma.",sweet_spot:"f/5.6–f/8",wide_open:"Center very good to excellent at f/4 from 14–24mm (Lenstip Z7; Abbott Z8; Phillip Reeve Z7 II). FX corners need stopping down: Lenstip says the 14mm FF edge needs closing down for sensible quality; Photography Life says 14mm corners are weakest wide open. 30mm is the weak setting: Lenstip's center at f/4 is only at the 42–44 lpmm decency level and the APS-C edge is below it even at f/5.6.",by_focal:[{focal_mm:14,center_peak:"f/4–f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"Lenstip (Z7): center very good at f/4, over 60 lpmm at f/5.6; FF edge almost 50 lpmm at f/5.6, sensible f/5.6–f/11. Abbott (Z8): f/4 corners good for a UWA, f/5.6 excellent across the frame. Photography Life: 14mm corners never fully reach 'good', best f/5.6–f/8. Reeve: center 'excellent to phenomenal' f/4–f/5.6."},{focal_mm:20,center_peak:"f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"Lenstip 22mm (Z7): center over 50 lpmm at f/4, near 60 stopped down; APS-C edge blurry areas at f/4 that f/4.5 removes; FF edge slightly weaker than 14mm, sensible f/5.6–f/11. Abbott: 20mm center slightly softer than 16mm but midframe and corners better; 16mm has a midframe dip at f/4 fixed by f/5.6 (wavy field curvature per Photography Life)."},{focal_mm:24,center_peak:"f/4–f/5.6",corners_peak:"f/5.6",wide_open_note:"Abbott (Z8): center and corners excellent at f/4 but midframe dips; f/5.6 evens it out. Photography Life ranks its 24mm corners above the Z 14-24 f/2.8 S."},{focal_mm:30,center_peak:"f/5.6–f/8",corners_peak:"f/8–f/11",wide_open_note:"Weakest focal length. Lenstip (Z7): center at f/4 only at the 42–44 lpmm decency level, near 60 stopped down; APS-C edge below decency at f/4 and f/5.6; sharp across the frame by f/11. Phillip Reeve (Z7 II): 30mm corners sharpest at f/11. Abbott: low contrast at f/4, restored at f/5.6. Lenstip astigmatism 24.5% at 30mm."}],close_up_best:"f/5.6–f/8",close_up_note:"Phillip Reeve (Z7 II) found close-range sharpness strong at all focal lengths from f/4 to f/16 (floating elements), with only f/22 to avoid. Abbott (Z8): sharp in the plane of focus at MFD, but that plane is not perfectly flat. Lenstip: focus shift from f/4 to f/5.6 at 30mm at short distances. No per-aperture close-focus numbers exist, so f/5.6–f/8 is an inference: enough to cover the curved focus plane and focus shift without diffraction cost. Medium-low confidence.",diffraction_note:"Abbott (Z8): softening very slight from f/11, obvious at f/22 ('huge difference between F11 and F22'). Photography Life: diffraction noticeable especially at f/16. Phillip Reeve (Z7 II): f/16 still very good, f/22 the weakest. On the Z8 treat f/11 as the practical limit except at 30mm, where corners need it.",avoid:["Avoid f/16–f/22 for detail on the Z8 (except for sunstars).","Don't judge 30mm at f/4: it is the soft corner of the zoom; stop to f/8–f/11 when corners matter.","Don't stack thick or multiple filters at 14mm (Photography Life: added vignetting; slim 82 mm is fine).","Don't trust uncorrected raw at 14mm: ~7–8% barrel and ~3.5 EV corner falloff; always apply the profile."],confidence:"high",confidence_reason:"Lenstip (Z7, MTF50 with some values) and Photography Life (Imatest, text summary) agree on corner peaks at f/5.6–f/8 for 14–24mm, with OpticalLimits (45MP) agreeing on a strong center and slight drop at f/4. The 30mm f/8–f/11 corner verdict rests on Lenstip plus Phillip Reeve (visual), so that row is medium."},Bc={bokeh:"Not a bokeh lens. Lenstip: imperfect out-of-focus circles with slight onion rings from the four aspherical elements; mechanical vignetting at 30mm only at f/4; spherical aberration not fully corrected at 30mm (bright/dark-centered circles). 7 rounded blades keep highlights round (Abbott).",flare_sunstar:"Flare resistance very good (Lenstip: good against bright light; Abbott: 'unfazed' in a barn test where other lenses flared; Reeve: handles the sun in frame well). Photography Life: some green/magenta dots at 14mm with sun near the frame, fainter blobs at 30mm, red-dot flare at narrow apertures. Sunstars: 14 points (7 blades). Reeve: attractive at 14mm from f/11; 20mm needs f/16–f/22; 30mm needs f/22. Photography Life: present at f/16 but not well defined.",ca:"Lateral CA is the main aberration: Lenstip rates 14mm poor and high near maximum aperture, medium mid-zoom, low at 30mm. OpticalLimits: over 3 px average at the borders at 14mm, well corrected at 30mm. Photography Life: modest, under ~2 px, greatest at 14mm f/4. Auto-corrected by the profile. Longitudinal CA negligible (Lenstip, Reeve).",distortion:"Severe uncorrected: Lenstip −7.04% at 14mm, +1.22% at 20mm, +3.0% at 24mm, +3.72% at 30mm (RAW FF); Photography Life nearly 8% barrel at 14mm; OpticalLimits about 6%. Nikon designed it to be 14mm after correction; correction is embedded and cannot be removed in Nikon/Adobe software (Photography Life). Corrected JPEG residual ≤0.22% (Lenstip).",vignetting:"Heavy at 14mm on FX. Lenstip RAW (Z7): 14mm −3.48 EV at f/4, −2.74 at f/5.6, −2.31 at f/8, −2.01 at f/16; 22mm −1.48 EV at f/4; 30mm −1.39 at f/4, −0.88 from f/8. JPEG with correction off: 14mm −2.06 EV at f/4. DX crop: only about −0.4 to −0.6 EV. OpticalLimits RAW over 4.5 EV at 14mm f/4. Abbott needed +100 correction at 14mm; Nikon's profile undercorrects. Matters for night-sky stacking: shoot flats or apply the profile before stacking.",coma_astro:"Low coma. Lenstip: no serious coma; slight elongation at 14mm f/4 in FF corners, slight enlargement of star images at 22–30mm. Photography Life: very good, corner points stay sharp at 14mm f/4. Phillip Reeve: negligible, fine for occasional astro. Against it: f/4 is 1–2 stops slower than astro primes, astigmatism is high (Lenstip average 19.3%, 24.5% at 30mm), and raw vignetting is strong. Astropix rates it 2/5 for astro (slight coma, weak corners, large vignetting).",focus_breathing:"Very low, even at 30mm; near-parfocal (Dustin Abbott, Z8, not measured).",other:"Copy variation: Photography Life found one of two lab samples (four copies in total) significantly decentered with poor 14mm corners at f/8; check your copy. Takes standard 82 mm filters, unusual for a 14mm. Retracted for transport and locked; cannot shoot until extended."},Hc=["Aurora and meteors: shoot 14mm at f/4 (coma is low, so wide open is usable); stars elongate only slightly in the corners. Focus manually on a bright star with maximum magnification; the lens is focus-by-wire, so re-check focus after power-cycling.","Expect about 3.5 EV raw corner falloff at 14mm f/4: apply the Nikon profile (or shoot flat frames) before stacking or stitching night skies and meteor composites.","Landscape at 14–24mm on the Z8: f/5.6–f/8. At 30mm go to f/8–f/11 if corners matter; f/16+ softens visibly.","Remember to un-retract the zoom before a timed or remote sequence; a locked lens blocks shooting.","For a 14-point sunstar use f/11–f/16 at 14mm; at 30mm it needs f/22, which costs detail on the Z8."],Wc=[{body:"z8",note:"Most measured data are 45MP (Lenstip Z7, OpticalLimits 45MP, Abbott Z8, Reeve Z7 II), so verdicts apply directly. f/11 is the practical limit for detail; 30mm corners are the exception. No Synchro VR (no lens VR)."},{body:"z5ii",note:"24.5MP: corner softness at f/4 is less visible per pixel and f/11–f/16 costs less (inference from pixel pitch). Good astro pairing because the larger pixels tolerate f/4 ISO pushes; the vignetting and coma notes still apply."},{body:"z50ii",note:"DX crop = about 21–45mm equivalent. Lenstip DX vignetting is only about −0.4 to −0.6 EV, and the APS-C edge is usable wide open at 14mm but weak at 30mm f/4–f/5.6 (stop to f/8). No IBIS."}],jc=!1,Gc=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor Z 14-30 mm f/4 S (resolution, CA, distortion, coma, vignetting, summary chapters)",url:"https://lenstip.com/599.4-Lens_review-Nikon_Nikkor_Z_14-30_mm_f_4_S_Image_resolution.html",kind:"measured",tested_on:"Nikon Z7 (45.7MP), RAW MTF50",date:"2019 or later (summary mentions a 2019 Iceland trip); exact date not captured",findings:"Decency level 42–44 lpmm; f/4 zooms at f/8 reach about 65 lpmm on Z7. 14mm: center very good at f/4, over 60 lpmm at f/5.6; APS-C edge good from f/4; FF edge needs stopping down, almost 50 lpmm at f/5.6, sensible f/5.6–f/11. 22mm: center over 50 at f/4, near 60 stopped down; APS-C edge blurry areas at f/4 removed at f/4.5; FF edge slightly weaker than 14mm, sensible f/5.6–f/11. 30mm: weakest — center borderline decency at f/4, APS-C edge below decency at f/4 and f/5.6, sharp across frame by f/11. Coma (599.7): no serious problems, slight elongation at 14mm f/4 corners; astigmatism 19.3% average, 24.5% at 30mm. Vignetting (599.8) RAW FF 14mm: −3.48/−2.74/−2.31/−2.13/−2.01 EV at f/4/5.6/8/11/16; 30mm −1.39 EV at f/4. DX JPEG about −0.3 to −0.57 EV. Distortion (599.6) RAW FF: −7.04% (14mm), +1.22% (20), +3.00% (24), +3.72% (30). CA (599.5): lateral poor at 14mm, high near max aperture; longitudinal negligible; slight focus shift f/4→f/5.6 at 30mm close range. Summary (599.11): pros include little serious coma, good against bright light; cons include RAW distortion, strong FF vignetting, weaker 30mm edges, high astigmatism, high lateral CA at 14mm."},{id:"opticallimits",name:"OpticalLimits: Nikkor Z 14-30mm f/4 S review",url:"https://opticallimits.com/nikon/nikon-z/nikkor-z-14-30mm-f-4-s-review/",kind:"measured",tested_on:"45MP Nikon Z body (model not named in fetched text)",date:null,findings:"Center mostly excellent across the range up to f/8, near-center very good, borders very good at 14mm, corners fine but extreme edge soft; slight drop at f/4. RAW distortion ~6% barrel at 14mm, ~2.7% pincushion at 30mm; autocorrection mandatory and 'perfect'. RAW vignetting over 4.5 EV at 14mm f/4, still heavy at f/11; corrected just under 2 EV at 14mm f/4. Lateral CA over 3 px at 14mm borders, well corrected at 30mm. MFD 0.28 m, 0.16x. Scores: optics 6, build 7, value 7. Numbers only in chart images."},{id:"photographylife",name:"Photography Life: Nikon Z 14-30mm f/4 S review, optical performance page",url:"https://photographylife.com/reviews/nikon-z-14-30mm-f4-s/2",kind:"measured",tested_on:"Imatest lab; body not named in fetched text",date:null,findings:"Corners weakest at 14mm wide open and never fully 'good' at 14mm; better by 16mm; slight drop toward 30mm. Best corner apertures f/5.6–f/8. Diffraction especially at f/16. Slight wavy field curvature (midframe can trail corners). One of two lab samples (four copies total) significantly decentered. Coma very good, corner points sharp at 14mm f/4. Uncorrected vignetting about 2.5 stops at 14mm f/4; slim 82 mm filter adds little, avoid thick/stacked filters. Nearly 8% barrel at 14mm, profile not removable; Nikon designed it to be 14mm after correction. Lateral CA modest, under ~2 px, worst 14mm f/4. Flare well resisted; sunstars at f/16 not well defined. Max magnification 1:6.3 at 30mm. Comparison page (/3) ranks it close to the 14-24 f/2.8G at 14mm and sharper in the corners than the Z 14-24 f/2.8 S at 24mm."},{id:"phillipreeve",name:"Phillip Reeve blog: REVIEW Nikon Z Nikkor 14-30mm F/4 S",url:"https://phillipreeve.net/blog/review-nikon-z-nikkor-14-30mm-f-4-s/",kind:"review",tested_on:"Nikon Z7 II (45.7MP); samples on Zf",date:null,findings:"14mm best: center excellent to phenomenal at f/4–f/5.6, corners good to very good. 30mm corners sharpest at f/11, weakest at f/22 (still good). Overall f/5.6–f/8 optimal; f/16 very good; f/22 weakest (diffraction). Close-up strong at all focal lengths (floating elements); avoid f/22. Negligible coma; OK for occasional astro. Sunstars: 14mm attractive from f/11; 20mm at f/16–f/22; 30mm needs f/22. No LoCA; negligible lateral CA at 14–16mm (as processed). Front element doesn't rotate; 82 mm filters; cannot shoot while locked."},{id:"dustinabbott",name:"Dustin Abbott: Nikkor Z 14-30mm F4 S review (2026)",url:"https://dustinabbott.net/2026/04/nikkor-z-14-30mm-f4-s-review/",kind:"review",tested_on:"Nikon Z8 (45.7MP); Z6III for AF",date:"2026-04",findings:"14mm f/4: center extremely sharp, midframe weaker, corners good; f/5.6 excellent across the frame. 16mm midframe dip at f/4. 20mm better midframe/corners than 16mm. 24mm center and corners excellent at f/4, midframe dips, f/5.6 improves. 30mm low contrast at f/4, restored at f/5.6. Diffraction very slight around f/11, obvious at f/22. MFD 28 cm, 0.16x; focus plane at MFD not perfectly flat. Flare very good. Heavy vignetting at 14mm (+100 correction), Nikon profile undercorrects. Focus breathing very low; near-parfocal. Video: https://dustinabbott.net/openvideo/v/nikkor-z-14-30mm-f4-s-review-2026-still-the-best-nikon-uwa-zoom"},{id:"astropix",name:"Astropix (Jerry Lodriguss site): Nikon Z lenses for astrophotography",url:"https://astropix.com/html/equipment/ultimate/Nikon-Z-Lenses-For-Astrophotography.html",kind:"review",tested_on:"Not stated",date:null,findings:"Z 14-30 f/4 S: slight coma, good center sharpness, not great in corners, large vignetting; notes high astigmatism and high CA wide open. Astro rating 2/5 ('Not That Great'). Appears to be a compilation of others' test results rather than an own test."},{id:"nikon_spec",name:"Nikon Imaging: NIKKOR Z 14-30mm f/4 S product/spec page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_14-30mmf4s/",kind:"manufacturer",tested_on:null,date:null,findings:"f/4–f/22; MFD 0.28 m; 0.16x; about 485 g; 89 × 85 mm; 82 mm filter; 7 blades, rounded; 14 elements/12 groups (4 ED, 4 aspherical), Nano Crystal Coat, fluorine front; STM. Retractable mechanism. Claimed first FX 14mm-start ultra-wide zoom that accepts screw-in filters. No VR listed."},{id:"nikon_tc14",name:"Nikon Singapore: NIKKOR Z Teleconverter TC-1.4x page",url:"https://www.nikon.com.sg/nikkor-z-teleconverter-tc-1-4x",kind:"manufacturer",tested_on:null,date:null,findings:"Compatible-lens list does not include the 14-30 f/4 S."},{id:"dcw_z50ii",name:"Digital Camera World: Nikon Z50 II vs Nikon Z50",url:"https://www.digitalcameraworld.com/buying-guides/nikon-z50-ii-vs-nikon-z50",kind:"review",tested_on:null,date:null,findings:"Z50 II has no IBIS; relies on VR lenses for stabilized stills."}],Kc={url:"https://www.youtube.com/watch?v=i5m5NoW3-iw",access:"title-only",summary:"A Christopher Frost video exists: YouTube oEmbed confirms the title 'Nikon Z 14-30 f/4 S lens review with samples' by 'Christopher Frost'. No transcript or description text could be retrieved (YouTube watch pages fail to fetch). His verdict is unknown; nothing here is attributed to him."},Uc="1) Sources mostly agree: strong center from f/4, corners best f/5.6–f/8 at 14–24mm, 30mm is the weak end. OpticalLimits is the most negative overall (optics score 6/10) mainly for raw distortion, vignetting and 14mm lateral CA, not for center resolution. 2) Astro: the lab reviewers (Lenstip, Photography Life, Reeve) all rate coma low; Astropix rates it 2/5 for astro, apparently weighing f/4 speed, vignetting and astigmatism. The record treats coma as low but notes those limitations. 3) Distortion figures differ by method (Lenstip −7.04%, Photography Life ~8%, OpticalLimits ~6%). 4) Lenstip numeric lpmm values were only partly stated in text; the rest are chart images. OpticalLimits and Photography Life MTF values are in chart images. 5) The Digital Picture review URL failed to fetch (client error). 6) Close-up best aperture is inference (no per-aperture close-range numbers). 7) Working distance is rough arithmetic, not measured. 8) Z5 II/Z50 II notes on diffraction are pixel-pitch inference. 9) The re-check-focus-after-power-cycle tip is a cautious practice for focus-by-wire lenses, not a sourced claim about these bodies.",qc={id:Sc,name:Zc,short:Pc,mount:Ac,adapter:Cc,coverage:Nc,kind:zc,focal_mm:xc,max_aperture:Rc,min_aperture_f:Dc,aperture_blades:Lc,rounded_blades:Mc,weight_g:Oc,filter_mm:Tc,focus:Ec,stabilization:Vc,close_focus:$c,quick:Xc,character:Bc,field_tips:Hc,body_notes:Wc,tc_compatible:jc,sources:Gc,chris_frost:Kc,research_notes:Uc},Jc="z-180-600-vr",Qc="NIKKOR Z 180-600mm f/5.6-6.3 VR",Yc="180-600 VR",ed="Z",td=null,od="FX",nd="zoom",id=[180,600],sd=[{focal_mm:180,f:5.6},{focal_mm:600,f:6.3}],ad=32,rd=9,ld=!0,cd=2140,dd=95,md={on_z_body:"AF",cpu:!0,motor:"Not stated on Nikon's page (described only as fast and quiet AF)",focus_throw_deg:null,notes:"Internal zoom with a short 70° zoom-ring throw (Nikon). Weight about 2,140 g with tripod collar, about 1,955 g without (Nikon spec table; the overview text says 1,995 g). Cameralabs (Z8): AF repeatability 99.2% in Reikan FoCal; infinity to 6 m in about 0.5 s at 600mm; parfocal from 600mm back to about 300mm, refocus at 250mm and shorter; focus breathing about 4% at 600mm, 1% at 180mm. Has a focus limiter, multi-function ring and Fn buttons (Cameralabs). Tripod foot is not Arca-Swiss compatible (Cameralabs). Lenstip: AF 'falls well short' (a con), which contradicts Cameralabs' fast, reliable AF; focus limiter FULL or 6 m–infinity; focus-by-wire ring, ~270° throw with a fast turn."},ud={lens_vr:!0,lens_vr_stops:5.5,synchro_vr:null,ibis_on_ftz:null,notes:"Nikon claims 5.5 stops (mode/standard not stated on the product page). Lenstip measured 4.3 EV at 600mm (several dozen shots 1/800–1/5 s) and Cameralabs measured about 4 stops in a 160-shot handheld test at 600mm on a Z8 and suggests not going slower than about 1/80 s handheld at 600mm. Synchro VR: still unverified. Nikon's support article (000066751) could not be fetched (robots-blocked); a FredMiranda quote of it (Jan 2026) lists the Z8 and Z5 II as compatible bodies but shows only a truncated lens list without this lens, which proves nothing either way. Field left null. Z50 II: no IBIS, lens VR only."},hd={mfd_m:[{focal_mm:180,value:1.3},{focal_mm:600,value:2.4}],max_mag:[{focal_mm:600,value:.25},{focal_mm:180,value:.16}],working_distance_mm_at_max_mag:2e3,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"Nikon: MFD 1.3 m at 180mm, 2.4 m at 600mm (from the focal plane); max reproduction 0.25x. Cameralabs measured 1:3.9 (≈0.26x) at 600mm with a working distance 'just over 2 m', and 1:6.2 (≈0.16x) at 180mm with MFD about 1.25 m. Working distance is entered as 2000 mm from Cameralabs' 'just over 2 m'. Photography Life also says the long end focuses to just over 2 m, which doesn't match Nikon's 2.4 m (Nikon measures from the sensor, and the lens is 315.5 mm long, so both can be roughly right). With the TC-1.4x, Nikon says the reproduction ratio is 1.4× the lens's (so about 0.35x at 840mm) and that MFD may differ from the lens documentation."},fd={headline:"Sharp wide open from 180–400mm; at 600mm stop to about f/8 if light allows (Lenstip), though other 45MP tests saw little gain. f/11 costs detail. With the TC-1.4x (840mm f/9) center is good, FX corners soft.",sweet_spot:"Wide open at 180–400mm; f/7.1–f/8 at 600mm",wide_open:"Lenstip (MTF50): center over 67 lpmm at 180mm f/5.6, almost 59 mid-range wide open, but only 'merely decent' at 600mm f/6.3 (over 47 at f/8; decency 40–42, diffraction ceiling about 66 at f/8). OpticalLimits (45MP): center very good, outer field good, stopping down brings little. Cameralabs (Z8): 180mm f/5.6 extremely crisp and even; 600mm f/6.3 only a tad softer in the center, FX corner a bit soft.",by_focal:[{focal_mm:180,center_peak:"f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"Lenstip: strongest focal length, center over 67 lpmm wide open; APS-C edge good from wide open; FF edge slightly behind mid-range. Cameralabs (Z8): extremely crisp center, DX corner not far behind, very even across the frame at f/5.6. OpticalLimits: lens is best in the low-to-mid range. Lateral CA highest here (1.5–2 px at borders, OpticalLimits)."},{focal_mm:300,center_peak:"f/6",corners_peak:"f/6–f/8",wide_open_note:"Cameralabs (Z8) at f/6: FX corner best of the group tested (ahead of Z 100-400 and Tamron 150-600 G2); field curvature undetectable at 300mm. Lenstip: mid-range center almost 59 lpmm wide open, almost 60 slightly stopped down; FF edge best in mid-range."},{focal_mm:400,center_peak:"f/6",corners_peak:"f/8",wide_open_note:"Cameralabs (Z8) at f/6: center similar to the Z 400mm f/4.5 VR S; DX contrast and FX corner slightly behind the prime. Lenstip: mid-range center almost 59 lpmm wide open, almost 60 slightly stopped down; FF edge best in mid-range."},{focal_mm:600,center_peak:"f/8",corners_peak:"f/8",wide_open_note:"Sources disagree. Lenstip: weakest point; center only 'merely decent' at f/6.3, over 47 lpmm at f/8; APS-C edge needs f/7.1–f/8, FF edge near f/8. Cameralabs (Z8): center only a tad softer than 180mm and FX corner only a bit soft at f/6.3. OpticalLimits: quality stays high at 600mm, stopping down improves little, f/11 diffraction-affected. Verdict f/8 when light allows; f/6.3 is still usable."},{focal_mm:840,center_peak:"f/9–f/11 (displayed, with TC-1.4x)",corners_peak:"f/11 (displayed, with TC-1.4x)",wide_open_note:"TC-1.4x: Cameralabs (Z8): good center and DX corner at f/9, FX corner 'decidedly soft'; acuity improves a little at f/11. Strong in a 1 km city test at 840mm. OpticalLimits advises against teleconverters because the smaller effective aperture adds diffraction (not tested)."}],close_up_best:"f/8–f/11, subject centered",close_up_note:"Cameralabs (Z8): at 180mm MFD (1:6.2) the center is very sharp at f/5.6, the DX corner needs about f/11, and the FX corner stays soft beyond f/11 because of field curvature (refocusing per corner barely helps). At 600mm MFD (1:3.9) the center is sharp at f/6.3 but everything outside it is soft; at f/11 with the subject centered and carefully focused, results are usable. Cameralabs lists soft close-up performance outside the center as a con and recommends f/11. One measured-visual source only: medium confidence.",diffraction_note:"Lenstip: f/8 is about the absolute maximum resolution this lens can deliver (diffraction ceiling ~66 lpmm). OpticalLimits (45MP): f/11 already affected. Cameralabs (Z8): TC-2.0x at 1200mm f/13 diffraction-limited; bokeh discs spike from f/11. On the Z8 treat f/8 as the limit.",avoid:["Don't stop past f/8 at normal distances: f/11 is diffraction-affected (OpticalLimits); Lenstip puts the diffraction ceiling at about f/8.","Don't use the TC-2.0x for detail: mushy at 1200mm f/13 even with aggressive sharpening (Cameralabs).","Don't put subjects in the FX corners at close focus (field curvature).","Don't count on Nikon's 5.5 stops handheld at 600mm: Cameralabs measured about 4; stay at 1/80 s or faster for static subjects."],confidence:"medium",confidence_reason:"Two measured sources (Lenstip MTF50 with numbers; OpticalLimits at 45MP, chart-only) plus Cameralabs' Z8 Siemens-star test. All agree on a sharp 180–400mm and f/11 diffraction cost; they disagree on 600mm wide open (Lenstip: needs f/8; OpticalLimits/Cameralabs: little gain). TC-1.4x verdict rests on Cameralabs alone."},pd={bokeh:"Very nice for a zoom (Cameralabs): discs perfectly circular in the center up to f/8, smooth interior with no onion rings, mild outlining, no LoCA colouring; mild cat's-eye compression toward corners wide open. OpticalLimits: nearly circular discs at max aperture with slight outlining and faint inner pattern; corner discs distorted until about f/8; smooth transitions. Entrance pupil 95mm (Cameralabs).",flare_sunstar:"Lenstip lists significant problems against bright light as a con; Cameralabs and OpticalLimits did not test flare. Use the hood and avoid the sun near the frame. Sunstars only from f/11 (Cameralabs); 9 rounded blades give 18 points.",ca:"Lateral CA about 1.5–2 px at the borders at 180mm, nearly absent at longer focal lengths (OpticalLimits); auto-corrected. Longitudinal CA and focus shift practically none at 600mm; no notable purple fringing (Cameralabs).",distortion:"Slight pincushion in RAW, peak about 1.1% mid-range (OpticalLimits); clearly visible uncorrected at 180 and 600mm, corrected well by the profile (Cameralabs).",vignetting:"Low even on FX (Lenstip). Low: about 0.7 EV RAW wide open, negligible from f/8 (OpticalLimits). Cameralabs: negligible at 180mm (profile lifts FX corner ~0.4 EV at f/5.6), stronger at 600mm (~0.5 EV correction at f/6.3, some falloff remains). Adobe disables profile vignette correction if in-camera vignette control is off.",coma_astro:"Well-corrected coma and low astigmatism (Lenstip); practically coma-free at 180mm wide open (Cameralabs).",focus_breathing:"About 4% at 600mm, about 1% at 180mm (Cameralabs, Z8); Lenstip calls it moderate.",other:"Internal zoom, 70° zoom throw, 95 mm filter. Parfocal only from 600mm down to about 300mm (Cameralabs). Value pick: OpticalLimits optics 6.5, build 9, value 9; Cameralabs 'Highly Recommended'. Photography Life field review (Z8/Z9): very sharp, slightly lower contrast than the Z 400mm f/2.8."},gd=["Birds on the Z8: 180–400mm wide open is fine. At 600mm use f/8 when light allows (Lenstip: wide open only 'decent'), but f/6.3 is usable (Cameralabs). Never go past f/8 for detail.","VR measured about 4–4.3 stops at 600mm (Cameralabs, Lenstip; not 5.5): stay at 1/80 s or faster for perched birds, and much faster for motion; use the focus limiter for distant birds to cut hunting.","Zoom-to-frame works without refocusing from 600 down to about 300mm (parfocal there); below 250mm, refocus before firing.","TC-1.4x = 252–840mm at f/8–f/9 displayed: keep birds central (FX corners soft), stop to f/11 only if the light allows, and expect AF to struggle in low contrast or poor light (Nikon warns AF may fail or the focus indicator flicker). On the Z8, DX crop at 600mm (900mm equivalent) is the comparison to make.","Close-ups (0.25x at 600mm, about 2 m away; about 0.35x with TC-1.4x): center the subject and use f/8–f/11."],bd=[{body:"z8",note:"Cameralabs tested on a Z8 and OpticalLimits at 45MP: wide open at 180–400mm, f/8 at 600mm if light allows, f/11 diffraction-affected. VR measured 4–4.3 stops. Synchro VR not verified. For extra reach compare TC-1.4x at 840mm f/9 against DX crop at 600mm (19.4MP crop; 1⅓ stops faster)."},{body:"z5ii",note:"24.5MP: corner softness wide open and with the TC is less visible per pixel; f/11 costs less (pixel-pitch inference). Slower body AF than the Z8 may make the TC-1.4x low-light AF warning more relevant (inference)."},{body:"z50ii",note:"DX crop = 270–900mm equivalent. No IBIS: lens VR only, so shutter discipline matters even more (Cameralabs' 1/80 s at 600mm was on a Z8 with IBIS+VR). The DX corners are close to the frame centre, where this lens is strongest."}],wd=!0,_d=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor Z 180-600 mm f/5.6-6.3 VR (resolution, build/stabilization, summary chapters)",url:"https://www.lenstip.com/695.4-Lens_review-Nikon_Nikkor_Z_180-600_mm_f_5.6-6.3_VR_Image_resolution.html",kind:"measured",tested_on:"Nikon Z body not named in the fetched chapters; RAW MTF50",date:"2025-06",findings:"Decency 40–42 lpmm; diffraction ceiling about 66 lpmm at f/8, which the author calls the absolute maximum to count on. Center: over 67 lpmm at 180mm wide open; almost 59 mid-range wide open (almost 60 slightly stopped down); 600mm only 'merely decent' wide open, over 47 at f/8. APS-C edge: good from wide open at 180mm and mid-range; at 600mm needs f/7.1–f/8. FF edge: best mid-range, 180mm slightly weaker, 600mm weakest, needs near f/8. Very good 180–400mm, sacrifices resolution at 600mm. Stabilization (695.3): measured 4.3 EV at 600mm vs 5.5 claimed. Build: internal zoom, focus limiter FULL/6 m–∞, 1,960 g without collar. Summary (695.11) pros: very good center, sensible APS-C edges, negligible LoCA, moderate lateral CA, slight distortion, low astigmatism, well-corrected coma, low vignetting, moderate breathing, nice bokeh, efficient VR, value. Cons: significant problems against bright light; AF falls well short. Other chapters: 695.7 coma/bokeh, 695.8 vignetting, 695.10 AF/breathing (not read)."},{id:"opticallimits",name:"OpticalLimits: Nikkor Z 180-600mm f/5.6-6.3 VR review (Klaus)",url:"https://opticallimits.com/nikon/nikon-z/nikkor-z-180-600mm-f-5-6-6-3-vr-review/",kind:"measured",tested_on:"45MP-normalized MTF (body not named in fetched text)",date:"2025-12",findings:"Center very good, outer field good; best in the low-to-mid range, quality stays high at 600mm. Stopping down brings little improvement; f/11 already affected by diffraction. RAW pincushion peak ~1.1% mid-range. RAW vignetting ~0.7 EV wide open, negligible from f/8. Lateral CA ~1.5–2 px at borders at 180mm, nearly absent at longer focal lengths. Bokeh: near-circular discs, slight outlining, corner discs distorted until ~f/8. TCs not tested; advises against them (diffraction from the smaller effective aperture). MFD 1.3–2.4 m, 1:4. Scores: optics 6.5, build 9, value 9. Numbers only in a chart image."},{id:"cameralabs",name:"Cameralabs: Nikon Z 180-600mm f5.6-6.3 VR review (Thomas), pages 1, 2 (Quality) and 4 (Verdict)",url:"https://www.cameralabs.com/nikon-z-180-600mm-f5-6-6-3-vr-review/2/",kind:"review",tested_on:"Nikon Z8 (45.7MP), Siemens stars at ~45× focal length plus 1 km city scene, Lightroom with profile",date:"2023-09",findings:"180mm f/5.6: extremely crisp center, very even to FX corner. 300mm f/6: best FX corner vs Z 100-400 and Tamron G2; no field curvature. 400mm f/6: center like Z 400 f/4.5, corners slightly behind it. 600mm f/6.3: center a tad softer than 180mm, FX corner a bit soft. TC-1.4x 840mm f/9: good center and DX corner, FX corner decidedly soft; slightly better at f/11. TC-2.0x 1200mm f/13: mushy, diffraction-limited. Close-up: 180mm 1:6.2, center very sharp at f/5.6, DX corner needs ~f/11, FX corner soft beyond f/11 (field curvature); 600mm 1:3.9, working distance just over 2 m, only center sharp at f/6.3, usable at f/11 centered. Bokeh circular to f/8, smooth, no onion rings. Vignetting correction ~0.4 EV (180) / ~0.5 EV (600). Practically no LoCA. Coma practically absent at 180mm. Page 1: AF repeatability 99.2%, ~0.5 s infinity→6 m at 600mm, breathing ~4% at 600mm and ~1% at 180mm, parfocal to ~300mm; VR measured ~4 stops at 600mm on Z8, suggests ≥1/80 s. Verdict: Highly Recommended; cons: soft close-up outside center (use f/11), not perfectly parfocal, non-Arca foot."},{id:"photographylife",name:"Photography Life: Nikon Z 180-600mm f/5.6-6.3 VR field review",url:"https://photographylife.com/reviews/nikon-z-180-600mm-f-5-6-6-3-vr",kind:"review",tested_on:"Nikon Z8 and Z9 (45.7MP)",date:null,findings:"Field review without per-aperture data: very sharp, not as sharp as the Z 400 f/2.8 mainly due to slightly lower contrast, but resolves a lot on 45MP. Lists 1.3 m (180mm) / 2.4 m (600mm), 0.25x; text says the long end focuses to just over 2 m. No TC tests; notes the Z 100-400 reaches 0.38x."},{id:"nikon_spec",name:"Nikon Imaging: NIKKOR Z 180-600mm f/5.6-6.3 VR product/spec page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_180-600mmf56-63_vr/",kind:"manufacturer",tested_on:null,date:null,findings:"f/5.6–6.3, min f/32–36; MFD 1.3 m (180mm) / 2.4 m (600mm); 0.25x; about 2,140 g with collar, 1,955 g without (overview says 1,995 g); 95 mm filter; 9 rounded blades; 25 elements/17 groups (6 ED, 1 aspherical), fluorine front; VR 5.5 stops; internal zoom; 70° zoom rotation; 110 × 315.5 mm. Teleconverters compatible, but AF may fail or the focus indicator flicker depending on subject, light and focus point. Synchro VR not mentioned."},{id:"nikon_tc14",name:"Nikon Imaging: Z TELECONVERTER TC-1.4x product/spec page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_tc_14x/",kind:"manufacturer",tested_on:null,date:null,findings:"Lists the Z 180-600 f/5.6-6.3 VR as compatible. Focal length and reproduction ratio ×1.4; effective aperture reduced by one stop; MFD with TC may differ from the lens documentation; AF may fail or the focus indicator flicker depending on subject, light and focus point. 220 g, 6 elements/4 groups."},{id:"dcw_z50ii",name:"Digital Camera World: Nikon Z50 II vs Nikon Z50",url:"https://www.digitalcameraworld.com/buying-guides/nikon-z50-ii-vs-nikon-z50",kind:"review",tested_on:null,date:null,findings:"Z50 II has no IBIS; relies on VR lenses for stabilized stills."}],vd={url:null,access:"not-found",summary:"One web search for a Christopher Frost review of the Z 180-600mm returned no Frost video (results were Fstoppers, Photography Life, Cameralabs, Photography Blog, Lenstip, Ken Rockwell, etc.). YouTube pages can't be fetched directly. Nothing here is attributed to him."},yd="1) Lenstip was added in a follow-up pass and is the only source with MTF numbers. DXOMARK, The-Digital-Picture, Photography Life lab data and Thom Hogan's zsystemuser review (page body not retrievable) are still missing. 2) OpticalLimits (measured, 45MP) and Cameralabs (Z8 visual) agree: sharp wide open, little gain from stopping down, f/11 diffraction-affected. Hence 'wide open to f/8' and medium confidence. Per-focal corner peaks are from Cameralabs' wide-open crops plus OpticalLimits' 'corner discs distorted until ~f/8' (bokeh, not resolution), so corner f/8 entries are partly inference. 3) Max aperture transition: Nikon doesn't say where f/6.3 starts; Cameralabs tested 300 and 400mm at f/6, so f/6 is reached by 300mm. Only 180mm f/5.6 and 600mm f/6.3 are entered. 4) TC-1.4x: Cameralabs says good IQ (Highly Recommended pro), OpticalLimits advises against TCs without testing. Verdict follows the tested source. 5) Weight discrepancy on Nikon's page (1,955 vs 1,995 g without collar). 6) MFD at 600mm: Nikon 2.4 m from the sensor vs 'just over 2 m' (Cameralabs working distance, Photography Life). 7) Synchro VR not verified. 8) Z5 II AF comment is inference. 9) 600mm conflict: Lenstip says wide open is only 'decent' and recommends f/7.1–f/8; OpticalLimits and Cameralabs saw little gain from stopping down. The record uses f/8 at 600mm when light allows. 10) AF conflict: Lenstip says AF falls well short; Cameralabs measured 99.2% repeatability and fast focusing on a Z8. Lenstip's body is not named, which may explain the difference (unverified). 11) Lenstip flags bright-light (flare) problems that the other sources did not test.",kd={id:Jc,name:Qc,short:Yc,mount:ed,adapter:td,coverage:od,kind:nd,focal_mm:id,max_aperture:sd,min_aperture_f:ad,aperture_blades:rd,rounded_blades:ld,weight_g:cd,filter_mm:dd,focus:md,stabilization:ud,close_focus:hd,quick:fd,character:pd,field_tips:gd,body_notes:bd,tc_compatible:wd,sources:_d,chris_frost:vd,research_notes:yd},Id="z-24-120-f4-s",Fd="NIKKOR Z 24-120mm f/4 S",Sd="24-120 f/4 S",Zd="Z",Pd=null,Ad="FX",Cd="zoom",Nd=[24,120],zd=[{focal_mm:24,f:4},{focal_mm:120,f:4}],xd=22,Rd=9,Dd=!0,Ld=630,Md=77,Od={on_z_body:"AF",cpu:!0,motor:"STM (stepping motor), focus-by-wire",focus_throw_deg:null,notes:"Nikon lists a stepping motor (STM). Lens has an AF/MF switch, a Fn button and a customizable control ring (Nikon; Dustin Abbott notes the AF/MF switch sits awkwardly near the Fn button and flash-sync cover on a Z8). Photography Life found AF fast and accurate with no meaningful focus shift on stopping down, but the lens is varifocal: refocus after zooming. Cameralabs saw a slight focus shift toward the background at 24mm. Nikon cites focus-breathing compensation for movie recording, and Dustin Abbott (Z8) describes breathing as very low (not measured)."},Td={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"No optical VR (Nikon spec lists none; every review confirms). Stabilization comes only from body IBIS on the Z8 and Z5 II. Dustin Abbott got a usable 1/13 s handheld frame at 120mm on a Z8. The Z50 II has no IBIS (Digital Camera World), so on that body this lens is completely unstabilized for stills."},Ed={mfd_m:[{focal_mm:24,value:.35},{focal_mm:120,value:.35}],max_mag:[{focal_mm:120,value:.39}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 0.35 m from the focal plane at every focal length (Nikon; Photography Life; Dustin Abbott). Max magnification 0.39x (1:2.6) at 120mm per Nikon. Ed Dozier (photoartfromscience) measured 0.42x on his copy; Cameralabs measured about 1:2.4 (≈0.42x) at 120mm with a sharp field of about 58 × 87 mm. Working distance not published. The lens is about 118 mm long at its retracted length (Nikon) and the barrel extends when zoomed, so the free distance at 120mm MFD is well under 0.35 m minus 16 mm flange back minus barrel length; no measured figure was found, so the field is null. Effective aperture at 0.39x is not reported by any source; the camera meters through the lens."},Vd={headline:"Very sharp center from f/4 at every focal length; on the Z8 shoot f/5.6–f/8 for corners, focus slightly in front of infinity at 24–28mm, and stay at or wider than f/11.",sweet_spot:"f/5.6–f/8",wide_open:"Center is excellent at f/4 everywhere (Ed Dozier on a Z8: 65–77 lp/mm MTF50 center at f/4 across the range; OpticalLimits at 45MP: outstanding center from f/4). Corners are the weak point wide open: Dozier's worst corner at f/4 is 32–43 lp/mm, lowest at 34.5mm (32.4) and 70mm (38.3). 24mm extreme corners suffer field curvature (OpticalLimits, Admiring Light). Long end corners soften at f/4 (Cameralabs, Z7).",by_focal:[{focal_mm:24,center_peak:"f/4–f/5.6",corners_peak:"f/8",wide_open_note:"Dozier (Z8) f/4: center 76.4, worst edge 57.9, worst corner 43.2 lp/mm. Strong field curvature in the extreme corners (OpticalLimits): for landscapes at infinity pull focus slightly toward the camera. Abbott (Z8): f/5.6 improves mid-frame and corners; f/8 narrows but never fully closes the extreme-corner gap."},{focal_mm:35,center_peak:"f/4–f/5.6",corners_peak:"f/5.6",wide_open_note:"Abbott (Z8) calls 35mm peak performance, sharp to the edges by f/5.6. Dozier's 34.5mm f/4 worst corner (32.4 lp/mm) and worst edge (39.1) are the lowest of his five focal lengths; his stopped-down values are only in chart images, so the f/5.6 corner verdict rests on Abbott and Cameralabs (Z7: strong up to 50mm)."},{focal_mm:50,center_peak:"f/5.6",corners_peak:"f/5.6",wide_open_note:"Dozier (Z8) f/4: center 77.4, edge 50.5, corner 43.2 lp/mm. Abbott: corners at f/4 better than 24mm at any aperture; center slightly softer than mid-frame at f/4, crisp and flatter-field at f/5.6. Cameralabs: good FX-corner resolution, negligible field curvature."},{focal_mm:70,center_peak:"f/5.6",corners_peak:"f/8",wide_open_note:"Dozier (Z8) f/4: center 65.2, edge 41.0, corner 38.3 lp/mm. Cameralabs (Z7): corners progressively softer from 70mm, improved at f/5.6 and f/8. Abbott: 85mm is the 'low ebb' of the zoom, with weaker corners than 50mm."},{focal_mm:120,center_peak:"f/5.6",corners_peak:"f/8",wide_open_note:"Dozier (Z8) f/4: center 66.5, edge 42.7, corner 41.2 lp/mm. Abbott: center sharper at f/5.6 than at 50 or 85mm; corners softer but usable. Cameralabs had to refocus per crop at 120mm (field curvature) and found f/5.6–f/8 improves corners. Photography Life: 105–120mm corners at infinity slightly behind other focal lengths."}],close_up_best:"f/5.6–f/8",close_up_note:"Center stays excellent at close focus even at f/4, but corners drop at f/4, worst at 120mm (Photography Life). Cameralabs (Z7, 120mm, ~1:2.4): center quite sharp wide open, falls off quickly away from center, and f/16 did NOT give the sharpest result because of field curvature. Abbott (Z8): contrast slightly low at f/4 right at MFD, improving if you back off a few cm or stop down. Nobody published a per-aperture close-focus test, so f/5.6–f/8 is an inference from these comments plus Abbott's 'softening after f/8'.",diffraction_note:"OpticalLimits (45MP): diffraction becomes more dominant beyond f/8. Dustin Abbott (Z8): softening begins after f/8, minimal at f/11, clearly visible at f/22. Ed Dozier (Z8) stopped testing at f/16 because diffraction 'destroys the resolution'. So on the Z8 f/11 is a mild cost, f/16 a real one.",avoid:["Don't use f/16–f/22 for detail on the Z8; use f/11 at most and focus carefully (or focus-stack) for depth.","Don't focus exactly at infinity for 24–28mm landscapes with important corners: field curvature; focus a touch nearer.","Don't expect stabilization on the Z50 II: no lens VR and no IBIS."],confidence:"medium",confidence_reason:"Two 45MP measured tests agree on an outstanding f/4 center and corners as the weakness (Dozier MTF50 on a Z8 with numbers at f/4 only; OpticalLimits at 45MP, numbers only in chart images). Per-focal corner peaks beyond f/4 come mostly from visual tests (Abbott Z8, Cameralabs Z7, Photography Life). No Lenstip test exists."},$d={bokeh:"Busy for a zoom. Photography Life: poor for creamy backgrounds, cat's-eye corners at all focal lengths (worst 120mm), harsh-edged 'soap bubble' highlights, near-'Rubinar-like' foreground. Abbott (Z8): 9 rounded blades keep highlights round f/4–f/8, transitions fairly pleasant, cleaner than the Canon RF 24-105. OpticalLimits: smooth background, slightly grainy highlight interiors, nisen foreground; mechanical vignetting clips discs toward edges at f/4. Best at close focus and the long end.",flare_sunstar:"Flare control very good to excellent (Photography Life, Abbott, Admiring Light): little or no flare with the sun at a corner or outside the frame; most flare with the sun about halfway into the frame. Sunstars above average for a zoom (Photography Life): 18 points (9 blades, Abbott), best at f/11–f/16 (OpticalLimits; Cameralabs: nice at 24mm f/11, weak at f/5.6–f/8), cleanest with the sun partly hidden behind an edge.",ca:"Lateral CA well controlled: about 1 px at the borders at 24 and 120mm (OpticalLimits); peak about 1.76 px around 24–35mm (Photography Life); 1.3 px worst at 24mm f/4 on a Z8 (Dozier). Longitudinal CA very low (Abbott, Cameralabs).",distortion:"Strong uncorrected: about 4–5% barrel at 24mm (OpticalLimits ~4%, Photography Life ~5%), pincushion from about 35mm, about 3% at 120mm (OpticalLimits). Correction is mandatory in-camera and applied in raw converters, and corrects well.",vignetting:"Raw about 2.6 EV at 24mm f/4 and near 2 EV at 120mm f/4 (OpticalLimits); well controlled from f/8. With Nikon's correction on, about 0.35 EV at 24mm and 0.5 EV at 120mm at f/4 (Cameralabs). Matters for night-sky and time-lapse flats at 24mm f/4.",coma_astro:"Cameralabs: very little coma even wide open, clearly better than the F-mount 24-120 f/4G; no color artifacts around streetlights. f/4 is slow for astro, but fine for star-trail and night time-lapse.",focus_breathing:"Not measured. Nikon cites focus-breathing compensation in video; Abbott (Z8) calls breathing 'very low'.",other:"Varifocal: refocus after zooming (Photography Life). Weather sealed, fluorine front element (Nikon). OpticalLimits flags durability concerns about the dual-cam zoom and a flimsy hood. Zoom ring tighter past 85mm (Abbott)."},Xd=["Default walkaround setting on the Z8: f/5.6 for 35–50mm, f/8 at 24mm and 70–120mm when corners matter; f/4 is fine whenever the subject is central.","Landscape at 24–28mm: focus slightly in front of infinity (OpticalLimits) or on something about one-third into the scene; check a corner at 100% before committing to a time-lapse.","Time-lapse: use manual focus after AF-locking, keep the zoom ring taped (varifocal, so any zoom creep means refocus), and keep vignette control fixed so frames match; correction is baked into NEFs.","For close-ups at 120mm (0.39x): shoot f/5.6–f/8 and back off a few cm from MFD if contrast looks flat; don't go to f/16 hoping for sharper corners, field curvature wins.","Sunstars: f/11–f/16 at 24mm with the sun partly behind an edge gives an 18-point star; accept the diffraction cost on the Z8 only for that frame."],Bd=[{body:"z8",note:"Most tests here used 45MP bodies (Dozier and Abbott on a Z8, OpticalLimits at 45MP, Cameralabs on a Z7), so the f/5.6–f/8 sweet spot and 'diffraction beyond f/8' apply directly. IBIS only (no Synchro VR, since no lens VR); Abbott hand-held 1/13 s at 120mm."},{body:"z5ii",note:"24.5MP: corners at f/4–f/5.6 look relatively better than on the Z8 and f/11 is practically free of visible diffraction at normal viewing (inference from pixel pitch, not tested). IBIS only."},{body:"z50ii",note:"DX crop = about 36–180mm equivalent and the weak FX extreme corners fall outside the frame. No IBIS and no lens VR: keep shutter at least 1/(2 × 1.5 × focal) for stills. 20.9MP DX pixel pitch is close to the Z8's, so the f/8 diffraction onset still applies."}],Hd=!1,Wd=[{id:"photoartfromscience",name:"Photo Art From Science (Ed Dozier): Nikkor Z 24-120mm f/4 S lens review",url:"https://www.photoartfromscience.com/single-post/nikkor-z-24-120mm-f-4-s-lens-review",kind:"measured",tested_on:"Nikon Z8 (45.7MP), unsharpened raw, MTFMapper",date:"2023-06 (updated 2023-09)",findings:"MTF50 at f/4 in lp/mm (center / worst edge / worst corner): 24mm 76.4/57.9/43.2; 34.5mm 72.7/39.1/32.4; 50mm 77.4/50.5/43.2; 70mm 65.2/41.0/38.3; 120mm 66.5/42.7/41.2. f/5.6–f/16 results are only in chart images (not readable). Meridional weaker than sagittal (astigmatism) at most settings until beyond f/11. Stops testing at f/16 because diffraction destroys resolution. Measured 0.42x at 120mm, MFD 35 cm; 120mm close-ups 'as sharp as a good macro lens'. Lateral CA worst at 24mm f/4 about 1.3 px. Heavy barrel at 24mm, evident pincushion at 120mm, auto-corrected by raw converters."},{id:"opticallimits",name:"OpticalLimits: Nikkor Z 24-120mm f/4 S review (Klaus)",url:"https://opticallimits.com/?p=6907",kind:"measured",tested_on:"45MP Nikon Z body (model not named on the page)",date:"2026-03 (updated 2026-08) per page",findings:"Center outstanding across the range straight from f/4; borders snappy; corners good at 24mm but strong field curvature there, very good mid-zoom, good to very good at the long end. Diffraction more dominant beyond f/8. Distortion ~4% barrel at 24mm, pincushion from ~35mm to ~3% at 120mm. Vignetting ~2.6 EV at 24mm f/4, near 2 EV at 120mm f/4, well controlled from f/8. Lateral CA ~1 px at borders at both ends. Bokeh smooth background, slightly grainy highlight interiors, nisen foreground. Sunstars from f/4, best f/11–f/16. MFD 0.35 m, 0.39x. Recommends pulling focus slightly toward the camera at 24–28mm for infinity scenes. Scores: optics 7.5, build 8, value 8. LW/PH numbers in chart image only."},{id:"photographylife",name:"Photography Life: Nikon Z 24-120mm f/4 S review (pages 1–3)",url:"https://photographylife.com/reviews/nikon-z-24-120mm-f-4-s/2",kind:"measured",tested_on:"Imatest; body not named in fetched text (samples on Z9 and Z7, 45.7MP)",date:null,findings:"Sharp across range and apertures with f/4–f/8 performing comparably; small spread between best and worst. Slightly weaker at 120mm. Field curvature measurable but rarely harmful. 105–120mm corners at infinity slightly behind. At close focus the center stays excellent at every focal length including f/4; corners at f/4 are the weak point, worst at 120mm. Diffraction at f/16. Distortion about 5% barrel at 24mm. Lateral CA peak about 1.76 px (24–35mm). Flare very good; most flare with sun halfway into frame. Sunstars above average, best f/16 with sun partly obscured. Bokeh poor/busy, cat's eye at all focal lengths. Specs page: 0.35 m at all focal lengths, 0.39x at 120mm, 630 g, 77 mm, 9 rounded blades. Lp/ph values only in chart images."},{id:"cameralabs",name:"Cameralabs: Nikon Z 24-120mm f4 S review, quality page",url:"https://cameralabs.com/nikon-z-24-120mm-f4-s-review/2",kind:"review",tested_on:"Nikon Z7 (45.7MP), 100% crops, studio at ~45× focal length plus 1 km city test",date:null,findings:"24mm: very good center and DX corner, FX corner quite good. 28–50mm: strong including FX corner, negligible field curvature. 70mm and 120mm: DX and FX corners progressively softer, field curvature relevant (refocused per crop at 120mm); f/5.6 and f/8 improve corners. Close-up at 120mm about 1:2.4 (sharp area ~58 × 87 mm): center quite sharp wide open, falls off quickly outside center; f/16 did not give the sharpest results. Very little coma wide open. Corrected vignetting about 0.35 EV (24mm) and 0.5 EV (120mm) at f/4. Sunstars nice at 24mm f/11, weak at f/5.6–f/8. Slight focus shift toward background at 24mm. Clearly sharper than AF-S 24-120 f/4G at all focal lengths."},{id:"dustinabbott",name:"Dustin Abbott: Nikkor Z 24-120mm F4 S review (written) and video transcript",url:"https://dustinabbott.net/2026/03/nikkor-z-24-120mm-f4-s-review/",kind:"review",tested_on:"Nikon Z8 (45.7MP), tripod, 2 s delay",date:"2026-03",findings:"24mm: exceptional center, extreme corners soft at f/4, f/5.6 improves mid-frame and corners. 35mm 'fantastic' (video: sharp to edges by f/5.6). 50mm: corners at f/4 better than 24mm at any aperture. 85mm the low ebb. 120mm: center sharper at f/5.6 than 50/85mm, deeper corner falloff. Extreme corners never fully catch up; f/8 narrows the gap. Diffraction: softening after f/8, minimal at f/11, clearly visible at f/22. MFD 35 cm constant, 0.39x; contrast a little low at MFD, better backing off or stopping down. Focus breathing very low (not measured). Flare consistently excellent. LoCA basically none. 18-point sunstar. 1/13 s handheld at 120mm with Z8 IBIS. Video page: https://dustinabbott.net/openvideo/v/nikkor-24-120mm-f4-s-review-the-best-f4-standard-zoom"},{id:"admiringlight",name:"Admiring Light: Review Nikon Nikkor Z 24-120mm f/4 S, page 2",url:"https://admiringlight.com/blog/review-nikon-nikkor-z-24-120mm-f-4-s/2/",kind:"review",tested_on:"Nikon Z8 and Z7 II (45.7MP)",date:null,findings:"Very good to excellent over most of the frame from f/4 at all focal lengths; center excellent stopped down; edges softer at f/4 but decent, very good stopped down; only 24mm extreme corners noticeably softer. Very good sharpness near MFD. Virtually no flare, small unobtrusive ghosts. Distortion moderate-to-high, correction cannot be disabled. Bokeh generally smooth, slight bright ring near 120mm, gumdrop-shaped highlights near corners."},{id:"photographyblog",name:"Photography Blog: Nikon Z 24-120mm f/4 S review, conclusion",url:"https://www.photographyblog.com/reviews/nikon_z_24_120mm_f4_s_review/conclusion",kind:"review",tested_on:"Nikon Z5 (24.3MP)",date:null,findings:"Center sharpness fantastic at all focal lengths and apertures; edges very good. CA and distortion well controlled (as corrected); vignetting more noticeable than hoped. Flare noticeable into the sun. No VR, which matters most on bodies without IBIS. 4.5/5."},{id:"nikon_spec",name:"Nikon Imaging: NIKKOR Z 24-120mm f/4 S product/spec page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_24-120mmf4s/",kind:"manufacturer",tested_on:null,date:null,findings:"f/4–f/22; MFD 0.35 m from focal plane; max reproduction 0.39x; about 630 g; 84 × 118 mm; 77 mm filter; 9 blades, rounded opening; 16 elements/13 groups (3 ED, 1 aspherical ED, 3 aspherical), Nano Crystal and ARNEO coats, fluorine front element; STM motor. No VR listed. Focus-breathing compensation cited for movies. Dust- and drip-resistant."},{id:"lenstip_spec",name:"Lenstip: Nikon Nikkor Z 24-120 mm f/4 S lens specifications",url:"https://www.lenstip.com/1896-Nikon_Nikkor_Z_24-120_mm_f_4_S-lens_specifications.html",kind:"manufacturer",tested_on:null,date:null,findings:"Spec page only (no Lenstip lab review exists): 0.35 m, 0.39x, 630 g, 77 mm, 9 blades, 16/13."},{id:"nikon_tc14",name:"Nikon Singapore: NIKKOR Z Teleconverter TC-1.4x page",url:"https://www.nikon.com.sg/nikkor-z-teleconverter-tc-1-4x",kind:"manufacturer",tested_on:null,date:null,findings:"Compatible-lens list (70-180 f/2.8, 70-200 f/2.8 VR S, 100-400 VR S, 180-600 VR, 400 f/2.8 TC, 400 f/4.5, 600 f/4 TC, 800 f/6.3 PF) does not include the 24-120 f/4 S."},{id:"dcw_z50ii",name:"Digital Camera World: Nikon Z50 II vs Nikon Z50",url:"https://www.digitalcameraworld.com/buying-guides/nikon-z50-ii-vs-nikon-z50",kind:"review",tested_on:null,date:null,findings:"Z50 II: no in-body image stabilization; relies on VR lenses for stabilized stills. 20.9MP APS-C."}],jd={url:"https://www.youtube.com/watch?v=dq7LFJ808Fc",access:"title-only",summary:"A Christopher Frost video exists: YouTube oEmbed confirms the title 'Nikon Z 24-120mm f/4 S lens review with samples' with author 'Christopher Frost'. The watch page could not be fetched (client error), and no transcript or written summary was found by search. His verdict is unknown; nothing in this record is attributed to him."},Gd="1) No Lenstip lab review of this lens exists (only a spec page). Primary numbers are Ed Dozier's Z8 MTF50 values at f/4; his stopped-down results and the OpticalLimits/Photography Life lp/ph values were chart images that could not be read. Per-focal corner peaks beyond f/4 are therefore from visual tests (Abbott Z8, Cameralabs Z7, Admiring Light Z8/Z7 II) and OpticalLimits' text, hence medium confidence. 2) Sources disagree on the overall picture modestly: Photography Life says f/4–f/8 perform comparably across the frame; Abbott and Cameralabs see clear corner gains to f/5.6–f/8. The verdict follows the 45MP corner-focused tests (Z8 owner). 3) Distortion figure differs (OpticalLimits ~4%, Photography Life ~5%) — both raw-uncorrected, likely different measurement methods. 4) Max magnification: Nikon 0.39x; Dozier measured 0.42x and Cameralabs ~1:2.4 (0.42x); spec value used. 5) Working distance and close-focus per-aperture sharpness not published; close_up_best is inference. 6) Z5 II comment on diffraction and corners is pixel-pitch inference, not tested. 7) Photography Life's text did not name the Imatest body. 8) Cameralabs page 2 fetched text is attributed to Cameralabs as served at that URL. 9) TC: not on Nikon's TC-1.4x compatibility list (the havecamerawilltravel compatibility page could not be read).",Kd={id:Id,name:Fd,short:Sd,mount:Zd,adapter:Pd,coverage:Ad,kind:Cd,focal_mm:Nd,max_aperture:zd,min_aperture_f:xd,aperture_blades:Rd,rounded_blades:Dd,weight_g:Ld,filter_mm:Md,focus:Od,stabilization:Td,close_focus:Ed,quick:Vd,character:$d,field_tips:Xd,body_notes:Bd,tc_compatible:Hd,sources:Wd,chris_frost:jd,research_notes:Gd},Ud="z-26-f28",qd="NIKKOR Z 26mm f/2.8",Jd="Z 26 f/2.8 pancake",Qd="Z",Yd=null,em="FX",tm="prime",om=[26],nm=[{focal_mm:26,f:2.8}],im=16,sm=7,am=!0,rm=125,lm=52,cm={on_z_body:"AF",cpu:!0,motor:"All-group (unit) focusing: the whole optical block moves (Sans Mirror; Phillip Reeve). Accurate but slower and more audible than other Z lenses (Reeve).",focus_throw_deg:null,notes:"The barrel extends slightly when focusing close (Reeve). Remove the lens cap before powering on, or the camera shows a lens initialization error (Reeve). Focus shift: Photography Life measured it as significant and advises setting the aperture before focusing. Cameralabs saw it soften the foreground at f/5.6. Reeve: small. Noticeable field curvature (Photography Life, Cameralabs). AF quick but not silent (Photography Life). Mostly plastic with a metal mount plate and a sealing gasket (Reeve). Nikon: dust and drip resistant design, not guaranteed."},dm={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"No optical VR. Body IBIS on the Z8 and Z5 II. None on the Z50 II."},mm={mfd_m:[{focal_mm:26,value:.2}],max_mag:[{focal_mm:26,value:.19}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 0.20 m from the focal plane, 0.19× (Nikon. Sans Mirror lists 1:5.3). The lens is only 23.5 mm long, but focusing extends it slightly. No working-distance figure is published."},um={headline:"True pancake with a center that is already at its best at f/2.8 (about 78 lp/mm). FX corners stay weak at every aperture. Measured 5% barrel distortion and about 2.5 stops of vignetting rely on correction.",sweet_spot:"f/2.8–f/4 (center); f/5.6 for corners",wide_open:"Center excellent at f/2.8 (Lenstip Z7: over 78 lp/mm. Photography Life and Cameralabs: very good wide open). FX corners slightly below Lenstip's decency level wide open, with low contrast and strong coma (Cameralabs). FX vignetting about 2.5 stops (Photography Life 2.45, Reeve 2.7 EV correction off).",by_focal:[{focal_mm:26,center_peak:"f/2.8–f/4",corners_peak:"f/5.6",wide_open_note:"Lenstip (Z7, 45.7MP): center over 78 lp/mm at f/2.8. DX edge 55 lp/mm at max aperture. FX edge just below decency (41–43 lp/mm) and crawls along that borderline at all apertures, with a dip near f/5.6. Photography Life (Z7): center fairly high throughout, midframe weaker, corners 'not very sharp' even at their best aperture of f/5.6. Cameralabs (Z7, about 1 km): FX corner better only at f/5.6 and still lacks fine detail at f/8. Reeve (Z7 II): stopping down doesn't improve FX sharpness."}],close_up_best:"f/2.8–f/4 (centre); f/5.6–f/8 for corners",close_up_note:"Cameralabs (Z7, 1:4.9): sharp center at f/2.8, corners need stopping down, and at f/5.6 the DX corner keeps some softness from field curvature (refocusing per crop was clearly sharper). Reeve rated close-up sharpness excellent on FX and DX. Photography Life measured significant focus shift and noticeable field curvature, so set the aperture before focusing and focus on the subject, not the center.",diffraction_note:"Reeve (Z7 II): sharpness drops slightly at f/16. Lenstip, Photography Life and Cameralabs did not discuss diffraction. On the 45.7MP Z8, expect a small loss by f/11 (inference from pixel pitch).",avoid:["Don't stop down expecting sharp FX corners. Lab tests show them weak at every aperture.","Don't focus wide open and then stop down: significant focus shift (Photography Life, Cameralabs).","Avoid f/16 on the Z8.","Don't power on with the lens cap fitted (initialization error).","Not for video focus pulls: focus breathing is strong."],confidence:"medium",confidence_reason:"Lenstip (Z7, numbers readable), Photography Life (Z7 lab) and Cameralabs (Z7) agree on an excellent wide-open center and weak FX corners. They disagree modestly on whether f/5.6 helps the corners (Photography Life and Cameralabs yes, Lenstip a dip near f/5.6). Close-up results are mixed: Reeve excellent, Cameralabs corners soft from field curvature."},hm={bokeh:"Pleasant for its type. Photography Life: 'surprisingly pleasant', round and uniform, with slightly harsher fringed transitions. Reeve: some optical vignetting and mild onion rings, without harsh edges.",flare_sunstar:"Reeve: better than expected, though ghosts can appear. Lenstip: performance against bright light could have been better. Weak sunstars (Reeve).",ca:"Lateral CA: Photography Life 0.99 px wide open rising to 1.62 px stopped down. Lenstip: slight. LoCA: Lenstip negligible. Photography Life sees some fringing in slightly out-of-focus areas. Lenstip notes a local CA maximum near f/5.6.",distortion:"High barrel: Photography Life measured 4.98% (vs 2.39% for the Z 28 f/2.8). Lenstip: noticeable. Reeve: quite high. Cameralabs: always corrected by the lens profile, which can't be disabled in camera.",vignetting:"Strong on FX. Photography Life maximum 2.45 stops. Cameralabs: over -2 EV at f/2.8 even with the profile applied, still visible from f/4. Reeve (correction off): FX 2.7 / 2.0 / 1.8 / 1.4 / 1.3 EV and DX 1.3 / 0.9 / 0.7 / 0.7 / 0.7 EV at f/2.8 / 4 / 5.6 / 8 / 11. Lenstip: distinct on FX, moderate on DX.",coma_astro:"Relatively high coma at f/2.8: Photography Life ('works in a pinch' for Milky Way), Lenstip ('a bit too high'), Cameralabs (strong in the FX corner). Reeve: mild, gone by f/4.",focus_breathing:"Quite strong (Reeve). Fine for stills, poor for video focus pulls.",other:"8 elements in 6 groups, 3 aspherical. 70 × 23.5 mm. About 125 g (Nikon). The lens has no filter thread of its own: 52 mm filters screw onto the included HB-111 hood, which doesn't rotate (Reeve, Sans Mirror). A slip-on cap fits either the lens or the hood (Nikon)."},fm=["Shoot it wide open freely for centered subjects: the center measured best at f/2.8. Stop down for depth of field, not corner sharpness.","Set the aperture before focusing (significant focus shift), and with off-center subjects put the AF point on the subject. Field curvature is noticeable.","For filters, mount the HB-111 hood. The 52 mm thread is on the hood, not the lens. Take the cap off before switching on.","Keep Vignette Control and distortion correction on. It measures about 5% barrel distortion and about 2.5 stops of FX corner falloff at f/2.8.","On the Z50 II it is a 39mm-equivalent pocket normal. The DX edge is usable at f/2.8 (Lenstip 55 lp/mm) and vignetting is small. No IBIS, so mind the shutter speed."],pm=[{body:"z8",note:"45.7MP: Reeve's Z7 II results apply. Excellent center at f/2.8, corners just good with OK contrast that stopping down doesn't fix. Slight diffraction at f/16, possibly visible from f/11 (inference)."},{body:"z5ii",note:"24.5MP: FX corner weakness is less visible per pixel. f/2.8–f/8 all usable (inference)."},{body:"z50ii",note:"DX (about 39mm-equivalent): Reeve (Z fc, 20.9MP DX) found better corners than FX, improving at f/5.6, and vignetting negligible from f/4. No IBIS."}],gm=!1,bm=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor Z 26 mm f/2.8 (resolution and summary chapters)",url:"https://www.lenstip.com/649.4-Lens_review-Nikon_Nikkor_Z_26_mm_f_2.8_Image_resolution.html",kind:"measured",tested_on:"Nikon Z7 (45.7MP), RAW via dcraw",date:"2023-05",findings:"Decency level 41–43 lp/mm. Center over 78 lp/mm at f/2.8 (its best). DX edge 55 lp/mm maximum at max aperture, usable. FX edge a tad below decency wide open and crawling along the borderline at all apertures, with a dip near f/5.6 from off-axis aberrations and a local CA maximum. Other per-aperture values are in a chart. Summary (https://www.lenstip.com/649.11-Lens_review-Nikon_Nikkor_Z_26_mm_f_2.8_Summary.html) pros: excellent center, sensible DX edge, negligible LoCA, slight lateral CA, no spherical aberration problems, low astigmatism, moderate DX vignetting. Cons: distinct FX vignetting, noticeable distortion, a bit too high coma wide open, bright-light performance could be better."},{id:"photographylife",name:"Photography Life: Nikon Z 26mm f/2.8 review (page 2, lab tests)",url:"https://photographylife.com/reviews/nikon-z-26mm-f-2-8/2",kind:"measured",tested_on:"Nikon Z7 (45.7MP)",date:null,findings:"Center fairly high at all apertures including f/2.8. Midframe a good bit weaker. Corners not very sharp even at their best, f/5.6. Significant focus shift (set aperture before focusing). Noticeable field curvature (focus at midframe or edge). Vignetting max 2.45 stops (Z 28 f/2.8: 2.20). Barrel distortion 4.98%. Lateral CA 0.99 px wide open, up to 1.62 px stopped down. Relatively high coma. Bokeh surprisingly pleasant. AF quick but not silent, somewhat slower than most Z lenses. 0.19× (1:5.3)."},{id:"cameralabs",name:"Cameralabs: Nikon Z 26mm f/2.8 review (Quality page)",url:"https://www.cameralabs.com/nikon-z-26mm-f2-8-review/2/",kind:"measured",tested_on:"Nikon Z7 (45.7MP), Siemens star at about 1.3 m and city scene at about 1 km",date:null,findings:"At about 1.3 m, f/2.8: center sharper than the Z 28 f/2.8 and just behind the Z 24 f/1.8 S. FX corner has the least contrast and strong coma, with contrast up at f/4. At about 1 km: center very good wide open, DX corner improves at f/4, FX corner only better at f/5.6 and lacks fine detail even at f/8. Close-up (1:4.9): sharp center at f/2.8, corners need stopping down, field curvature leaves DX-corner softness at f/5.6. Some focus shift at f/5.6. Vignetting over -2 EV at f/2.8 even with the profile. Distortion always corrected by the profile. Visual crops, no numeric scores."},{id:"phillipreeve",name:"Phillip Reeve: Review Nikon Z Nikkor 26mm f/2.8",url:"https://phillipreeve.net/blog/review-nikon-z-nikkor-26mm-f-2-8/",kind:"review",tested_on:"Nikon Z7 II (45.7MP FX) and Nikon Z fc (20.9MP DX)",date:null,findings:"FX infinity: center excellent at f/2.8, midframe very good, corners just good with OK contrast. Stopping down does not improve sharpness, and it drops slightly at f/16. DX: corners better, improving at f/5.6. Portrait distance: excellent center, very good circles. Close-up excellent on FX and DX. Quite high distortion uncorrected. Vignetting (off) FX 2.7/2.0/1.8/1.4/1.3 EV, DX 1.3/0.9/0.7/0.7/0.7 EV for f/2.8–f/11. Small focus shift. CA relatively well corrected. Mild coma gone by f/4. Flare better than expected, weak sunstars. Focus breathing quite strong. AF accurate but slower and louder than other Z lenses. Barrel extends close up. Cap-on startup error. No filter thread (filters via hood). Vs the Z 28 f/2.8: the 28 is less sharp in the center but more even across the frame, with less vignetting and weaker flare resistance."},{id:"nikon_spec",name:"Nikon: NIKKOR Z 26mm f/2.8 product page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_26mmf28/",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.2 m. 0.19×. About 125 g. 52 mm filter size. 7 rounded blades. 8 elements in 6 groups (3 aspherical). f/2.8–f/16. 70 × 23.5 mm. Dust and drip resistant design (not guaranteed). LC-K108 slip-on cap, HB-111 hood."},{id:"sansmirror_spec",name:"Thom Hogan (Sans Mirror): Nikkor Z 26mm f/2.8 lens specifications",url:"https://sansmirror.com/lenses/lens-database/lenses-from-camera-makers/nikon-z-mount-lenses/nikkor-z-26mm-f28.html",kind:"manufacturer",tested_on:null,date:"2023-02 (announced). Page updated 2025-12",findings:"Spec compilation: all elements move together for focus, 0.2 m, 1:5.3, 52 mm filter screws onto the HB-111 hood, metal mount, weather-sealed, 125 g, 24 mm long. Review listed as 'coming', so no optical verdict. Not S-line, and it overlaps heavily with the 28mm f/2.8."},{id:"frost_video",name:"Christopher Frost (YouTube): Nikon Z 26mm f/2.8 lens review",url:"https://www.youtube.com/watch?v=-ciyzzmq3lw",kind:"video",tested_on:"Not readable",date:null,findings:"Only the title and channel were confirmed (YouTube oEmbed). Content not readable, so no findings are used."}],wm={url:"https://www.youtube.com/watch?v=-ciyzzmq3lw",access:"title-only",summary:"YouTube oEmbed confirms the title 'Nikon Z 26mm f/2.8 lens review' by Christopher Frost. The watch page, description and transcript could not be fetched, so his verdict is unknown and not used."},_m="1) Follow-up search added three lab or structured-test sources on 45.7MP Z7 bodies: Lenstip, Photography Life and Cameralabs. Confidence raised from low to medium. 2) Corner conflict: Photography Life and Cameralabs find FX corners best (still weak) at f/5.6, while Lenstip shows an FX-edge dip near f/5.6, staying at the decency borderline across apertures, and Reeve sees no gain. corners_peak f/5.6 is used with the caveat that corners stay weak. 3) Close-up conflict: Reeve rates it excellent, Cameralabs found soft corners at 1:4.9 from field curvature. The center is sharp at f/2.8 in both. 4) Focus shift: Photography Life 'significant', Cameralabs visible at f/5.6, Reeve 'small'. The stronger measured finding is used. 5) filter_mm 52 is Nikon's stated filter size, but the thread is on the HB-111 hood, not the lens. 6) Build: Sans Mirror lists a metal mount, Reeve says mostly plastic with a metal mount plate. Both agree on sealing. 7) Diffraction is not measured by the lab sources. Z8 onset is inferred. 8) Reeve's size and weight comparison with the 28mm is internally inconsistent. Nikon specs are used. 9) Not on Nikon's Z TC-1.4x compatible list.",vm={id:Ud,name:qd,short:Jd,mount:Qd,adapter:Yd,coverage:em,kind:tm,focal_mm:om,max_aperture:nm,min_aperture_f:im,aperture_blades:sm,rounded_blades:am,weight_g:rm,filter_mm:lm,focus:cm,stabilization:dm,close_focus:mm,quick:um,character:hm,field_tips:fm,body_notes:pm,tc_compatible:gm,sources:bm,chris_frost:wm,research_notes:_m},ym="z-28-f28-se",km="NIKKOR Z 28mm f/2.8 (SE)",Im="Z 28 f/2.8 SE",Fm="Z",Sm=null,Zm="FX",Pm="prime",Am=[28],Cm=[{focal_mm:28,f:2.8}],Nm=16,zm=7,xm=!0,Rm=160,Dm=52,Lm={on_z_body:"AF",cpu:!0,motor:"Dual stepping motors, internal focusing (Sans Mirror spec). Accurate, quiet and quick, though not remarkable for a wide angle (Phillip Reeve). Fast, with a faint whirr (Thom Hogan).",focus_throw_deg:null,notes:"Single focus-by-wire ring, no AF/MF switch. Lens firmware 1.10 (separate downloads for the 28mm f/2.8 and the 28mm f/2.8 SE) adds linear 'Focus ring rotation range' options. Focus shift: the focal plane moves backward when stopping down. Hogan says AF on Z bodies handles it up to about f/5.6, but take care at small apertures and close distances. Plastic mount (Reeve, Sans Mirror)."},Mm={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"No optical VR. Body IBIS on the Z8 and Z5 II. None on the Z50 II."},Om={mfd_m:[{focal_mm:28,value:.19}],max_mag:[{focal_mm:28,value:.2}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 0.19 m from the focal plane, 0.2× (Nikon, both versions). The lens is 43 mm long, but no working distance is published, so the field is null. Close-up image quality is notably weaker than at distance (Reeve, Hogan)."},Tm={headline:"Small, cheap 28 with a good center that peaks at f/5.6. FX corners hover at Lenstip's decency borderline at every aperture. Stop to f/5.6–f/8 for close-ups, which are soft wide open.",sweet_spot:"f/5.6–f/8",wide_open:"Center good but not peak at f/2.8 (Lenstip Z7: 56 lp/mm. Photography Life: 'relatively weak' at f/2.8, improving at f/4). FX edge 41.0 lp/mm at f/2.8, right at Lenstip's decency floor. Heavy FX vignetting (Photography Life over 2 stops. Reeve 2.5 EV).",by_focal:[{focal_mm:28,center_peak:"f/5.6",corners_peak:"f/8",wide_open_note:"Lenstip (Z7, 45.7MP): center 56 lp/mm at f/2.8, peak 75 lp/mm at f/5.6. DX edge close to 50 lp/mm at most apertures, slightly lower at f/4–f/5.6. FX edge rises only from 41.0 (f/2.8) to 43.5 lp/mm (f/8), the decency borderline. Photography Life (Z7, Imatest): weak at f/2.8, better at f/4, strongest at f/5.6. Reeve (Z7 II) puts the overall peak at f/8, and Hogan says FX corners never fully tighten."}],close_up_best:"f/5.6–f/8",close_up_note:"Reeve (Z7 II): very soft with low contrast at f/2.8 close up, much better at f/4, excellent at f/5.6, peak at f/8, slight softening at f/11. Hogan: close-up is weaker than distance. Photography Life measured fairly high field curvature and a moderate backward focus shift on stopping down, so focus at the working aperture and put the AF point on the subject. No lab source measured sharpness at MFD.",diffraction_note:"Photography Life (Z7, 45.7MP): sharpness weakens gradually from the f/5.6 peak toward f/16 because of diffraction. Reeve: slight FX softness at f/16, and on DX from f/11. Lenstip's FX edge still gains slightly at f/8. On the Z8, f/8 is the last 'free' stop.",avoid:["Don't shoot close-ups at f/2.8 when you need detail: it is very soft there.","Avoid f/16 on the Z8 (diffraction).","Don't rely on FX corners for critical landscape work. Lenstip measured them at the decency borderline even at f/8.","Watch the sun in frame: strong flare at some angles (Reeve)."],confidence:"high",confidence_reason:"Two lab sources on 45.7MP Z7 bodies agree on a center peak at f/5.6 and weak FX corners: Lenstip (lp/mm numbers readable) and Photography Life (Imatest). The corner peak at f/8 rests on Lenstip's FX-edge maximum plus Reeve. The close-up verdict is from hands-on reviews only (Reeve, Hogan)."},Em={bokeh:"Better than expected. Photography Life: 'really good', with smooth, soft-edged highlights. Lenstip: pleasing for its class. Reeve: soft close to the subject. Hogan sees onion rings and elongated stopped-down highlights.",flare_sunstar:"Lenstip: 'sensible' against bright light. Hogan: flare is one of its better traits. Reeve: big flare problems with the sun in frame at some angles. All say there are no good sunstars (7 blades).",ca:"Lateral CA: Photography Life measured up to 1.94 px (high for a Z prime). Lenstip 'slight'. Reeve and Hogan: profile-corrected, with purple edge fringing visible without a profile. LoCA: Lenstip 'negligible'. Reeve: small at f/2.8, gone by f/5.6. Hogan: visible to f/4, worse close up.",distortion:"Barrel, corrected automatically in camera. Photography Life measured -2.39% (moderate). Reeve: moderate barrel uncorrected, virtually none corrected. Hogan describes pincushion, which conflicts with both.",vignetting:"High on FX. Photography Life: above 2 stops in the extreme corn

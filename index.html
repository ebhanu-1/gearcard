 at 18mm and f/40 at 140mm (Nikon). AF is reasonably snappy and occasionally slows at 140mm (Hogan, Z50). PhotoReview found AF very good, silent and smooth. The lens extends when zoomed (73 × 90 mm retracted, per Nikon). Nikon says it is dust- and drip-resistant, not guaranteed in all conditions."},zf={lens_vr:!0,lens_vr_stops:5,synchro_vr:null,ibis_on_ftz:null,notes:"Nikon rates it at 5.0 stops (CIPA, DX body, NORMAL, at 140mm). Rockwell measured about 3¾ stops at 18mm and 4 stops at 50mm and 140mm on the Z9. Hogan found about 5 stops achievable with careful technique. There is a Sport VR mode for panning (Hogan). PhotoReview got a high hit rate at 1/60 s at 140mm. On the Z50 II this is the only stabilisation. Synchro VR support was not confirmed by any source found, so it is null."},xf={mfd_m:[{focal_mm:18,value:.2},{focal_mm:140,value:.4}],max_mag:[{focal_mm:140,value:.33}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"Nikon gives 0.2 m at 18mm and 0.33x at 140mm. PhotoReview and Hogan give 0.4 m at 140mm. Rockwell measured shorter distances on his copy: 16 cm at 18mm, 23 cm at 35mm, 32 cm at 70mm and 37 cm at 140mm. PL: 0.33x fills the DX frame with a subject about 7.1 cm wide. Working distance at 140mm is roughly 0.4 m − 90 mm lens − 16 mm flange, about 0.29 m or less because the barrel extends when zoomed. This is arithmetic, not measured, so the field is null."},Rf={headline:"Do-everything DX zoom: best from 18mm to 70mm. Stop down 1–2 stops past 100mm and at close focus, and stay at f/8 or wider for maximum detail.",sweet_spot:"f/5.6–f/8",wide_open:"Good at the wide end: at 18mm the center barely changes from f/3.5 to f/5.6 (Hogan), and PL calls it 'pretty sharp, especially at the wide end'. From 50mm to 70mm the corners nearly match the center wide open (Hogan). Beyond 70–100mm, center resolution falls a little short (PhotoReview), and the corners are only fair to good wide open (Hogan).",by_focal:[{focal_mm:18,center_peak:"f/3.5–f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"Corners need f/5.6 for their best (Hogan, Z50). Correcting −5.91% barrel distortion costs a little corner sharpness (PL). PhotoReview: the edge exceeded expectations only from about f/4.5 to f/7.1."},{focal_mm:50,center_peak:"f/5.6–f/8",corners_peak:"f/5.6–f/8",wide_open_note:"Corners very good wide open, nearly matching the center (Hogan, 50–70mm). PL: the 16-50 is a little sharper at 50mm, but the difference is never huge."},{focal_mm:140,center_peak:"f/8",corners_peak:"f/8–f/9",wide_open_note:"Center good, corners only good to sometimes fair and inconsistent above 70mm. Stop down 1–2 stops from f/6.3 (Hogan). PhotoReview: center falls a little short beyond 70mm. PL: the 50-250 is clearly sharper at long focal lengths."}],close_up_best:"f/8–f/11 at 140mm",close_up_note:"Weak at close focus. Hogan: center only marginally good and corners barely fair at minimum distance. Rockwell (Z9 DX crop): at 140mm close focus, a little soft at f/6.3 and much sharper at f/11. f/11 sits at the diffraction edge on 20.9MP (PhotoReview), so try f/8 first and go to f/11 when you also need the depth of field.",diffraction_note:"PhotoReview (Imatest, Z50 20.9MP): diffraction noticeable from about f/10, and resolution drops sharply from f/11 to f/22 at all focal lengths. PL: the smallest apertures lose sharpness to diffraction. Avoid f/16 and smaller (f/22–f/40 available) except for sunstars.",avoid:["f/16–f/40: steep diffraction loss on the Z50 II.","Wide open at 100–140mm when the corners matter: stop down 1–2 stops.","Shooting into the sun at 18mm without a hood: Hogan rates flare the weakest trait at the wide end."],confidence:"medium",confidence_reason:"Two labs (PhotoReview Imatest on the Z50, and Photography Life DX lab) plus Hogan's Z50 field test agree on f/4.5–f/8 peaks and diffraction from about f/10. Numeric MTF values are in chart images that could not be read. Close-up guidance rests on Hogan plus Rockwell's subjective close test."},Df={bokeh:"PhotoReview: better than expected, but smooth background transitions at wide angles are near impossible with these apertures. Not otherwise assessed.",flare_sunstar:"Conflict. PL: hardly any flare with excellent contrast (some extra flare from dust on the front element). Hogan: flare is the lens's weakest trait, especially at the wide end. Sunstars: PL found well-defined 14-point stars at f/11–f/16, and Rockwell also saw 14-point stars at the smallest apertures.",ca:"Low. PhotoReview (corrections off): lateral CA well within the negligible band, highest at 18mm. Hogan: longitudinal CA virtually absent, and lateral CA up to about 1 px uncorrected wide open at the long end. PL: never extreme.",distortion:"Uncorrected: −5.91% barrel at 18mm (PL), almost none at 24mm, slight pincushion at 140mm (PhotoReview). Always corrected in-camera, leaving about 1% barrel at 18mm (Hogan).",vignetting:"Up to 2.34 stops wide open, depending on focal length (PL). Strong at 18mm and fine by f/5.6. Low from 24mm to about 100mm, then 1.5+ stops again at the long end. Default in-camera correction is weak, so stopping down one stop helps (Hogan). Rockwell (JPEG) found it negligible.",coma_astro:"Not tested by any source found.",focus_breathing:"Reasonably well suppressed for a consumer zoom (Hogan). Image slightly smaller at closer focus, unlikely to be noticed (Rockwell). PhotoReview: no noticeable breathing.",other:"Not parfocal, but zoom-induced focus shift is minimal (Hogan). Hogan rates it better than the F-mount 18-140 optically and smaller and lighter."},Lf=["18–70mm: shoot wide open to f/8 freely. At 18mm use f/5.6 when the corners matter.","Past 100mm, stop down to about f/8 rather than shooting f/6.3 for edge detail.","Close-ups at 0.33x (140mm, 0.4 m): f/8, or f/11 for depth of field. Corners will stay soft, so centre the subject.","Stay at f/11 or wider on the Z50 II. Use f/11–f/16 only to get 14-point sunstars.","VR is your only stabiliser on the Z50 II. Expect about 4 stops in practice, and use Sport mode for panning."],Mf=[{body:"z50ii",note:"Native body. PhotoReview (Z50) and Hogan (Z50) used the same 20.9MP sensor class, so their peaks (f/4.5–f/8) and f/10 diffraction onset apply directly. Lens VR is the only stabilisation."},{body:"z8",note:"Auto DX crop, 19.4MP (4.35 µm), essentially the same per-pixel behaviour as the Z50 II. Rockwell tested in Z9 DX crop (same 19.4MP) and found it sharp corner to corner, with diffraction only at the smallest apertures."},{body:"z5ii",note:"DX crop only about 10MP (computed). Less demanding per pixel, so f/11 is fine, but resolution is low. Prefer the Z50 II or Z8."}],Of=!1,Tf=[{id:"photoreview",name:"PhotoReview (Australia): Nikkor Z DX 18-140mm f/3.5-6.3 VR lens review (Margaret Brown)",url:"https://www.photoreview.com.au/reviews/mirrorless-lenses/mirrorless-lenses-aps-c/nikkor-z-dx-18-140mm-f-3-5-6-3-vr-lens/",kind:"measured",tested_on:"Nikon Z50 (20.9MP DX), Imatest on JPEG and NEF",date:"2021-11-30",findings:"Imatest graphs only, no numbers in text. Center exceeded expectations at shorter focal lengths and fell a little short beyond 70mm. At 75% of the way to the edge, exceeded expectations only from about f/4.5 to f/7.1. Diffraction noticeable from about f/10, with a sharp drop from f/11 to f/22 at all focal lengths. Lateral CA negligible (corrections off), highest at 18mm. Barrel distortion at 18mm, slight pincushion at 140mm. Vignetting wide open is reduced by stopping down 2 stops. MFD 20 cm at 18mm and 40 cm at 140mm, 0.33x. No noticeable focus breathing. Sharp handheld at 1/60 s at 140mm. Score 8.8."},{id:"photographylife",name:"Photography Life: Nikon Z DX 18-140mm f/3.5-6.3 VR review (pages 2–3)",url:"https://photographylife.com/reviews/nikon-z-dx-18-140mm-f-3-5-6-3-vr/2",kind:"measured",tested_on:"Nikon DX Z body (not named); PL DX lab charts",date:null,findings:"Pretty sharp, especially at the wide end. Telephoto 'totally reasonable'. The sharpest aperture ranges from f/4 to f/8 depending on focal length. Smallest apertures lose sharpness to diffraction. Barrel distortion −5.91% at 18mm, and its correction costs a little corner sharpness. Hardly any distortion at 24mm. Vignetting max 2.34 stops. CA never extreme. Hardly any flare. 14-point sunstars at f/11–f/16. 0.33x (frame about 7.1 cm wide on DX). Page 3: the 16-50 is slightly sharper overall but the 18-140 has better corners at 18mm. The 50-250 is clearly sharper corner to corner at long focal lengths. Close to the 24mm f/1.7."},{id:"hogan",name:"Thom Hogan (sansmirror): Nikon 18-140mm f/3.5-6.3 Lens Review",url:"https://sansmirror.com/lenses/lens-reviews/lenses-for-nikon-z-dx/nikon-18-140mm-f35-63-lens.html",kind:"review",tested_on:"Nikon Z50 (20.9MP DX)",date:"2021-11-27",findings:"18mm: center barely changes f/3.5 to f/5.6, and corners need f/5.6 to be good. 18–70mm center very good. 50–70mm corners very good wide open. 70–140mm center good, corners good to sometimes fair, and inconsistent. 100mm+: stop down 1–2 stops. Close focus: center marginally good, corners barely fair. Corrected distortion about 1% barrel at 18mm. Strong vignetting at 18mm, fine at f/5.6, 1.5+ stops at the long end. Longitudinal CA virtually absent, lateral up to about 1 px uncorrected at the long end. Breathing reasonably suppressed. About 5 stops VR with care. Sport mode. Flare is the weakest trait. Recommended."},{id:"kenrockwell",name:"Ken Rockwell: Nikon Z 18-140mm DX VR review",url:"https://kenrockwell.com/nikon/z/18-140mm.htm",kind:"review",tested_on:"Nikon Z9 in DX crop (19.4MP)",date:"2022-03",findings:"Very sharp corner to corner at every aperture, limited by diffraction at the smallest apertures (qualitative). At 140mm close focus: a little soft at f/6.3, much sharper at f/11. Measured MFD 16 cm at 18mm, 23 cm at 35mm, 32 cm at 70mm, 37 cm at 140mm. VR measured about 3¾ stops at 18mm and 4 stops at 50mm and 140mm. Falloff negligible in JPEG. Slight breathing. 14-point sunstars. Measured 312 g. Min aperture f/22–f/40."},{id:"nikon",name:"Nikon: NIKKOR Z DX 18-140mm f/3.5-6.3 VR product page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_dx_18-140mmf35-63_vr/",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.2 m at 18mm (focal plane), 0.33x at 140mm, about 315 g, 62 mm filter, 7 rounded blades, f/3.5–6.3, min f/22–40, VR 5.0 stops (CIPA, DX, NORMAL, tele end), 17 elements in 13 groups (2 ED, 2 aspherical), STM, 73 × 90 mm, dust- and drip-resistant (not guaranteed)."},{id:"fstoppers_frost",name:"Fstoppers (Alex Cooke): 'Is This Affordable Lens All Nikon Shooters Need?', a write-up of Christopher Frost's 18-140 video",url:"https://fstoppers.com/reviews/affordable-lens-all-nikon-shooters-need-596247",kind:"video",tested_on:null,date:"2022-02-12",findings:"Article paraphrases the video's conclusion: don't expect top-shelf image quality from such a long zoom range, but the results are impressive, and the lens is good value if you don't need a wide aperture. No test data."}],Ef={url:null,access:"title-only",summary:"Frost reviewed this lens (Fstoppers write-up by Alex Cooke, 12 Feb 2022, embeds his video). The video, its description and any transcript could not be opened, so the URL is unknown. The only content available is Fstoppers' second-hand paraphrase: not top-shelf image quality given the zoom range, but impressive results and good value if you don't need a wide aperture. No apertures or test details from Frost were readable."},Vf="1) No Lenstip, OpticalLimits, Lensrentals or TDP test exists for this lens. The measured sources are PhotoReview (Imatest, Z50) and Photography Life. Both publish numbers only as chart images (not readable), so their text conclusions are used. 2) Flare conflict: PL says hardly any flare, Hogan says flare is the weakest trait at the wide end. Likely conditions differ, so both are reported. 3) Vignetting: PL and Hogan measured it raw or uncorrected. Rockwell's 'negligible' is from corrected JPEG. 4) MFD: Nikon and PhotoReview give 0.2–0.4 m, Rockwell measured shorter on his copy. Nikon values are used. 5) 140mm peak f/8 combines Hogan's '1–2 stops down' with PhotoReview's f/10 diffraction onset. This is judgment, not a single measured peak. 6) Synchro VR not confirmed: null. 7) tc_compatible false: Nikon Z TCs fit only specific telephotos (general knowledge, not re-verified this session).",$f={id:gf,name:bf,short:wf,mount:_f,adapter:vf,coverage:yf,kind:kf,focal_mm:If,max_aperture:Ff,min_aperture_f:Sf,aperture_blades:Zf,rounded_blades:Pf,weight_g:Af,filter_mm:Cf,focus:Nf,stabilization:zf,close_focus:xf,quick:Rf,character:Df,field_tips:Lf,body_notes:Mf,tc_compatible:Of,sources:Tf,chris_frost:Ef,research_notes:Vf},Xf="z-dx-50-250-vr",Bf="NIKKOR Z DX 50-250mm f/4.5-6.3 VR",Hf="DX 50-250 VR",Wf="Z",jf=null,Gf="DX",Kf="zoom",Uf=[50,250],qf=[{focal_mm:50,f:4.5},{focal_mm:70,f:4.8},{focal_mm:100,f:5},{focal_mm:135,f:5.3},{focal_mm:200,f:6},{focal_mm:250,f:6.3}],Jf=22,Qf=7,Yf=!0,ep=405,tp=62,op={on_z_body:"AF",cpu:!0,motor:"STM (stepping motor)",focus_throw_deg:null,notes:"Minimum aperture is f/22 at 50mm and f/32 at 250mm (Nikon; Rockwell). Retractable: turn the zoom ring past 50mm to collapse it (Rockwell), giving 74 × 110 mm stored (Nikon). AF focus speed is quite good (Hogan, Z50) and generally competent in adequate light (PhotoReview). Zoom ring rotation is under 90° and not very smooth, and zoom noise is audible on a mic (Hogan). All-plastic build including the mount (Hogan). No hood supplied (PhotoReview)."},np={lens_vr:!0,lens_vr_stops:5,synchro_vr:null,ibis_on_ftz:null,notes:"Nikon rates it at 5.0 stops (CIPA, DX, tele end). Rockwell (Z50) measured about 3.5 stops at 50mm and at least 4 stops at 250mm. There is no VR switch on the lens, so changing VR mode is a menu trip (Hogan). On the Z50 II it is the only stabilisation. Synchro VR support was not confirmed, so it is null."},ip={mfd_m:[{focal_mm:50,value:.5},{focal_mm:250,value:1}],max_mag:[{focal_mm:250,value:.23}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"Nikon gives 0.5 m at 50mm and 0.23x, without stating the focal length for 0.23x. PhotoReview gives 1 m at 250mm. 0.23x is assumed at 250mm (inference). At 250mm, about 1 m minus the extended lens (more than 110 mm) leaves roughly 0.8 m of working distance. This is arithmetic, not measured, so the field is null. Good for butterflies and flowers from a distance. No source assessed close-focus sharpness in writing."},sp={headline:"Light DX tele that is sharpest at 70–135mm. At 50mm and 250mm the corners are only fair: use f/5.6–f/8, and never go past f/11.",sweet_spot:"f/5.6–f/8",wide_open:"Good. Hogan (Z50) finds it mostly sharpest wide open at nearly every focal length, with corners best at 70mm and fair at 50mm and 250mm. PhotoReview (Imatest, Z50) found its highest resolution wide open at 70mm. PL (Imatest, Z50) agrees the 50–70mm range is strong but says sharpness drops toward 200–250mm, worst wide open at 250mm.",by_focal:[{focal_mm:50,center_peak:"f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"Similar to the 16-50 at 50mm wide open. Sharper center at f/5.6 (PL). Stopping down pulls the corners in (Hogan). PhotoReview saw edge softening across most of the aperture range at 50mm."},{focal_mm:70,center_peak:"f/4.8–f/5.6",corners_peak:"f/4.8–f/5.6",wide_open_note:"Best focal length. Highest Imatest resolution wide open (PhotoReview). Center sharpest around 70mm, and corners best here (Hogan). PL: slightly better mid-frame and corners than at 50mm."},{focal_mm:135,center_peak:"f/5.6",corners_peak:"f/5.6",wide_open_note:"Slightly weaker overall, with f/5.6 the sweet spot (PL). Corners second-best (Hogan). PhotoReview: varied."},{focal_mm:250,center_peak:"f/6.3–f/8",corners_peak:"f/8",wide_open_note:"Weakest focal length. PL: worst at 250mm, especially wide open, so stop down to f/8. Hogan: center good, corners fair, mostly best wide open. Sources differ, so try f/8 when shutter speed allows."}],close_up_best:"f/8 at 250mm (inference)",close_up_note:"No source measured or described close-focus sharpness. The long end is weakest wide open (PL), and diffraction is to be avoided from f/11 (Hogan), so f/8 is a cautious inference for 0.23x at about 1 m.",diffraction_note:"Hogan (Z50): avoid f/11 through f/22, where diffraction adds to the lens's limits. No lab source published a measured onset. PhotoReview did not test 200–250mm. On the Z50 II's 4.2 µm pixels, f/8 is the practical ceiling.",avoid:["f/11 and smaller, especially at 200–250mm.","Expecting sharp 50mm or 250mm corners wide open.","Shooting toward bright sources without a hood: PL says telephotos cope poorly with them."],confidence:"medium",confidence_reason:"Two labs on the Z50 (PL and PhotoReview, chart images unreadable; PhotoReview skipped 200–250mm) plus Hogan's Z50 field review. They agree the lens is strongest at 70mm and weaker at the extremes, but disagree on stopping down at 250mm (PL: f/8; Hogan: wide open). Close-up advice is inference."},ap={bokeh:"Quite good but nothing mind-blowing (PL). PhotoReview: bright background areas can render as hard-edged circles with some outlining.",flare_sunstar:"PhotoReview: flare only when pointed at a bright source, and veiling flare lower than expected without a hood. Sunstars soft, only at the smallest apertures (Rockwell).",ca:"A little over 1 px lateral at 50mm and 70mm, much less at 135mm (PL Imatest). About 1 px at the short half and halved at the long half, minimal longitudinal (Hogan). Negligible in JPEG (PhotoReview).",distortion:"Low. 1.87% barrel at 50mm (PL Imatest). Rockwell (correction off, Z50): about +3.00 correction factor at 50mm, none at 70mm, −1.5 to −2.6 from 100mm to 250mm. Fully corrected in-camera, with no residual (Hogan, Rockwell).",vignetting:"About 1 stop at the extreme edges at 50mm, much less at 70mm (PL). About ⅔ stop wide open after in-camera correction, nearly gone one stop down (Hogan). Very slight (PhotoReview).",coma_astro:"Not tested by any source found.",focus_breathing:"Surprisingly little (PL). None visible (Rockwell). Largely suppressed, with some in-camera help (Hogan).",other:"PL's comparison (18-140 review): sharper corner to corner than the 18-140 at overlapping long focal lengths, 'seriously sharp'. Not usable in FX: Hogan says it is less useful on 24MP FX bodies because DX crop leaves about 9–10MP."},rp=["Best zone is 70–135mm at f/5.6. Wide open is fine there.","At 250mm, use f/8 if light allows, and keep the subject toward the center: the corners are only fair.","Never go past f/11 on the Z50 II. Raise ISO instead.","There is no VR switch: set VR Normal or Sport in the menu (or i menu) before birds or panning.","Unlock (extend) the barrel before power-on. For video, the short, stiff zoom ring makes smooth zooms hard: zoom between takes."],lp=[{body:"z50ii",note:"Native pairing (375mm-equivalent at the long end). PL, PhotoReview, Hogan and Rockwell all tested on the Z50 (same 20.9MP class). Lens VR is the only stabilisation."},{body:"z8",note:"Auto DX crop, 19.4MP (4.35 µm), so the same per-pixel behaviour as the Z50 II. For FX telephoto work a full-frame lens is the better choice."},{body:"z5ii",note:"DX crop only about 10MP (computed). Hogan judged this lens less useful on 24MP FX bodies for this reason."}],cp=!1,dp=[{id:"photographylife",name:"Photography Life: Nikon Z DX 50-250mm f/4.5-6.3 VR review, pages 2–3",url:"https://photographylife.com/reviews/nikon-z-dx-50-250mm-f4-5-6-3-vr/2",kind:"measured",tested_on:"Nikon Z50 (20.9MP DX), Imatest",date:null,findings:"50mm f/4.5 similar to the 16-50, center sharper at f/5.6. 70mm strong, slightly better mid and corners. 135mm slightly weaker, f/5.6 the sweet spot. 200mm decent but a noticeable drop. 250mm worst, especially wide open: 'stop the lens down to f/8'. Vignetting about 1 stop at the edges at 50mm. Distortion 1.87% barrel at 50mm. Lateral CA a little over 1 px at 50–70mm, much less at 135mm. Surprisingly little focus breathing. Bokeh quite good. Page 3: weaker above 135mm. The 18-140 review's page 3 calls the 50-250 sharper corner to corner than the 18-140 at long focal lengths."},{id:"photoreview",name:"PhotoReview (Australia): Nikkor Z DX 50-250mm f/4.5-6.3 VR lens review (Margaret Brown)",url:"https://www.photoreview.com.au/reviews/mirrorless-lenses/mirrorless-lenses-aps-c/nikkor-z-dx-50-250mm-f-4-5-6-3-vr-lens/",kind:"measured",tested_on:"Nikon Z50 (20.9MP DX), Imatest JPEG; raw for distortion and vignetting",date:"2020-03-13",findings:"On par with the 16-50. Highest resolution wide open at 70mm. 50mm shows edge softening across most apertures. 100mm and 135mm varied. 200mm and 250mm not tested. No numbers in text, no diffraction comment. CA negligible (JPEG). No obvious distortion (raw). Very slight vignetting. MFD 50 cm at 50mm and 1 m at 250mm, 0.23x. Flare only with a bright source in view. Score 8.8."},{id:"hogan",name:"Thom Hogan (sansmirror): Nikon 50-250mm f/4.5-6.3 DX Lens Review",url:"https://sansmirror.com/lenses/lens-reviews/lenses-for-nikon-z-dx/nikon-50-250mm-f45-63-dx.html",kind:"review",tested_on:"Nikon Z50 (20.9MP DX)",date:"2020 (page updated 2026-10-21)",findings:"Mostly sharpest wide open at nearly every focal length. At 50mm stopping down pulls the corners in. Center good to very good, best about 70mm, 250mm weakest ('good'). Corners best at 70mm, second at 135mm, 'fair' at 50mm and 250mm. Avoid f/11–f/22 (diffraction). Max apertures f/4.5 at 50, f/5 at 85, f/5.3 at 135, f/5.6 at 180, f/6 at 200, f/6.3 at 250. Corrected vignetting about ⅔ stop. About 1 px lateral CA at the short half. Breathing largely suppressed. No VR switch. Zoom ring under 90° and not smooth. Recommended."},{id:"kenrockwell",name:"Ken Rockwell: Nikon Z 50-250mm review",url:"https://kenrockwell.com/nikon/z/50-250mm.htm",kind:"review",tested_on:"Nikon Z50 (20.9MP DX)",date:"2019-12, updated 2023-02-13",findings:"Sharp wide open into the corners at every focal length (qualitative). MFD 0.5 m, 0.23x. Uncorrected distortion factors at 3 m: +3.00 at 50mm, 0 at 70mm, −1.50 at 100mm, −2.50 at 135mm, −2.60 at 200mm, −2.10 at 250mm, and 0 everywhere with correction on. VR measured about 3.5 stops at 50mm and at least 4 at 250mm. No focus breathing. Soft sunstars only at the smallest apertures. Measured 399.8 g. Retracts by turning the zoom ring past 50mm."},{id:"nikon",name:"Nikon: NIKKOR Z DX 50-250mm f/4.5-6.3 VR product page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_dx_50-250mmf45-63_vr/",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.5 m at 50mm (focal plane), 0.23x, about 405 g, 62 mm filter, 7 rounded blades, min f/22–32, VR 5.0 stops (DX, tele), 16 elements in 12 groups (1 ED), STM, 74 × 110 mm, retractable."},{id:"imaging_resource",name:"Imaging Resource / SLRgear lens page",url:"https://old.imaging-resource.com/lenses/nikon/z-50-250mm-f4.5-6.3-vr-dx-nikkor/review",kind:"manufacturer",tested_on:null,date:null,findings:"Marked 'Not yet tested'. Repeats Nikon's claims only: VR 5 stops, stepping motor, focus breathing suppressed, assignable control ring. No lab data."}],mp={url:null,access:"not-found",summary:"No Christopher Frost review of the Z DX 50-250mm was found. Two searches (including 'lens review with samples') returned PL, PhotoReview, Hogan, Rockwell and other sites but no Frost video or Fstoppers write-up. YouTube itself could not be fetched. The session's web-search budget ran out before a further check, so a Frost video may exist. Nothing is attributed to him."},up="1) No Lenstip, OpticalLimits, Lensrentals or TDP test exists for this lens. Imaging Resource lists it as untested. Measured sources are PL and PhotoReview, both Imatest on the Z50, numbers in chart images only, and PhotoReview did not test 200–250mm. 2) Conflict at 250mm: PL says stop to f/8, Hogan says mostly sharpest wide open, Rockwell says sharp wide open into the corners. 250mm is set to f/6.3–f/8 center and f/8 corners, which is why confidence is medium. 3) Max-mag focal length assumed 250mm. MFD at 250mm (1 m) is from PhotoReview, while Nikon's page gives only the 50mm value. 4) The PhotoReview page has typos (f/6.5, '112 groups'), and the Nikon values are used. 5) Synchro VR: null. 6) Frost search was cut short by the search budget.",hp={id:Xf,name:Bf,short:Hf,mount:Wf,adapter:jf,coverage:Gf,kind:Kf,focal_mm:Uf,max_aperture:qf,min_aperture_f:Jf,aperture_blades:Qf,rounded_blades:Yf,weight_g:ep,filter_mm:tp,focus:op,stabilization:np,close_focus:ip,quick:sp,character:ap,field_tips:rp,body_notes:lp,tc_compatible:cp,sources:dp,chris_frost:mp,research_notes:up},fp="z-mc-105-f28-vr-s",pp="NIKKOR Z MC 105mm f/2.8 VR S",gp="Z MC 105 f/2.8 VR S",bp="Z",wp=null,_p="FX",vp="macro",yp=[105],kp=[{focal_mm:105,f:2.8}],Ip=32,Fp=9,Sp=!0,Zp=630,Pp=62,Ap={on_z_body:"AF",cpu:!0,motor:"Internal focusing, stepping-motor AF, focus-by-wire manual ring. Quiet and accurate. Lenstip timed a full-range sweep plus confirmation at typically over 1 s.",focus_throw_deg:null,notes:"Focus limiter switch: FULL, or a close range of about 0.5 m to 0.29 m (Savazzi, measured on a Z8. Nikon names the limiter but publishes no ranges). The limiter only restricts AF, and MF still covers the full range (Savazzi). OpticalLimits recommends the limiter for macro to stop hunting, and says MF is often better at high magnification. Photography Life found AF fast for a macro, but it may need a manual nudge toward close range when switching from a distant subject. The lens LCD shows distance from the sensor plane and the reproduction ratio as its inverse ('1.2' = 1:1.2) (Savazzi). Lens firmware 1.10 added linear focus-ring response and the 'Switch focus/control ring roles' option (Nikon Download Center). No focus shift on stopping down (OpticalLimits, Photography Life). Nikon's focus-shift shooting works with this lens: Cameralabs tested it, and Savazzi notes full in-camera bracketing support."},Cp={lens_vr:!0,lens_vr_stops:4.5,synchro_vr:null,ibis_on_ftz:null,notes:"Optical VR rated 4.5 stops (CIPA, NORMAL mode). Nikon's own footnote says VR effectiveness decreases as the shooting distance decreases, so expect much less benefit at 1:1. Photography Life also says VR is less useful for close-up work but steadies the viewfinder. There is no VR switch on the lens. Set VR on/off and Normal/Sport in the camera menu (Savazzi). On the Z50 II (no IBIS) the lens VR is the only stabilization. Synchro VR: still unverified. Nikon's support article (000066751) could not be fetched (robots-blocked); a FredMiranda quote of it (Jan 2026) shows the Z8 and Z5 II as compatible bodies but only a truncated lens list without this lens, which proves nothing either way. Field left null."},Np={mfd_m:[{focal_mm:105,value:.29}],max_mag:[{focal_mm:105,value:1}],working_distance_mm_at_max_mag:138,effective_aperture_at_max_mag:"f/4.5 displayed at 1:1 when wide open, about 1⅓ stops down from f/2.8 (Nikon spec: aperture range f/2.8–32 at infinity, f/4.5–51 at 0.29 m). Z bodies show the effective value, which changes with focus distance (Savazzi, Z8). Confirmed by Photography Life, OpticalLimits and Cameralabs (f/4.5 effective at 1:1).",camera_displays_effective:!0,notes:"MFD 0.29 m from the focal plane (Nikon). Free working distance at 1:1: Savazzi measured 138 mm (about 8 mm less than the AF-S 105 VR's 146 mm). Photography Life gives 13.4 cm and OpticalLimits about 13 cm. The lens focuses internally and does not extend. Because the displayed aperture is already effective, the f-number you read on the Z8, Z5 II or Z50 II at 1:1 is the one that governs diffraction. Set a displayed f/5.6 at 1:1 and the iris is at roughly nominal f/3.5. The 1:1 maximum is conservative (OpticalLimits). For more, use extension tubes (Photography Life says they keep AF and electronic aperture), because Nikon Z teleconverters don't fit."},zp={headline:"Sharp edge-to-edge from f/2.8. Best at f/4–f/5.6 at normal distances and f/5.6–f/8 displayed at 1:1. About 138 mm of working room, and no teleconverter.",sweet_spot:"f/4–f/5.6",wide_open:"Very sharp at f/2.8 into the corners (Photography Life: 'extremely sharp out to the corners'. OpticalLimits: center 'brutally sharp' from f/2.8. Cameralabs (Z7): very good across the full frame at f/2.8). The only wide-open weaknesses are heavy RAW vignetting (about 2.4 EV) and cat's-eye highlights.",by_focal:[{focal_mm:105,center_peak:"f/4",corners_peak:"f/5.6",wide_open_note:"Photography Life: improves a bit by f/4, arguably the sharpest aperture. Corners a hair sharper at f/5.6. OpticalLimits (45MP): minor center gain at f/4. Lenstip (Z7, 45.7MP): excellent center (slightly behind the Tamron 90 VXD and Laowa 90 at f/2.8–f/4), and it clearly outclasses those rivals at the DX and FX edges (DX edge above 70 lp/mm)."}],close_up_best:"f/5.6–f/8 displayed (effective) at 1:1",close_up_note:"Measured on a Z8 at 1:1 (Savazzi): highest resolution at effective f/5.6. Effective f/4.5 is very slightly worse, and effective f/8 is roughly equal to f/4.5 with more depth of field. Cameralabs (Z7) at 1:1: f/4.5 is sharp with slight FX-corner softening, and the corner improves at f/8. Photography Life: sharpness holds at close distances and at 1:1. No field curvature to speak of (Cameralabs, Photography Life), so flat copy work is fine wide open. At 1:3.6, Cameralabs saw sharp results from effective f/3.2 and a slight loss at f/11.",diffraction_note:"OpticalLimits (45MP): diffraction sets in from about f/8. f/11 is still very usable, f/16 softer, and avoid f/22 for high-resolution work. Photography Life: strong at every aperture except f/16 (diffraction). At 1:1 the displayed value is already effective. Savazzi (Z8) saw slight diffraction loss by effective f/8 at the finest detail and a further drop at f/11.",avoid:["Don't go past displayed f/11 at 1:1 on the Z8. Focus-stack at f/5.6–f/8 instead.","Avoid f/16–f/22 at any distance for high-resolution work.","Don't mount a Z TC-1.4x or TC-2.0x: the lens is not compatible.","Don't count on the 4.5-stop VR rating at 1:1. Nikon says the effect shrinks as distance shortens."],confidence:"high",confidence_reason:"Photography Life, OpticalLimits (45MP), Lenstip (Z7) and Cameralabs (Z7) agree the lens is excellent from f/2.8 with only a small gain at f/4–f/5.6. The 1:1 aperture guidance comes from Savazzi's Z8 resolution test, backed by Cameralabs' 1:1 crops. Lenstip and OpticalLimits per-aperture numbers sit in chart images that could not be read."},xp={bokeh:"Smooth backgrounds (OpticalLimits; Lenstip: 'very pleasant'). 9 rounded blades. Center highlights are slightly non-circular at f/2.8 and rounder at f/4. Cat's-eye highlights toward the corners are stronger than usual and only fully round by f/8 (OpticalLimits).",flare_sunstar:"Lenstip lists performance against bright light as a weakness ('should have been better'). Nano Crystal and ARNEO coatings (Nikon). Sunstars not documented by any source used.",ca:"Lateral CA low: OpticalLimits 0.7–1.1 px at the borders, Lenstip 'slight'. Longitudinal CA practically zero (Lenstip, OpticalLimits).",distortion:"Slight barrel: Photography Life -0.66%, OpticalLimits 'slight', Lenstip 'slight'.",vignetting:"High on FX near wide open: OpticalLimits about 2.4 EV RAW at f/2.8, acceptable at f/4, negligible from f/5.6. Auto-correction removes about 1 EV at f/2.8. Lenstip: high on full frame near maximum aperture, negligible on DX.",coma_astro:"Lenstip: moderate coma, low astigmatism. Not an astro lens.",focus_breathing:"Sources disagree. Lenstip rated focus breathing 'very strong' (about 168% across the whole range, infinity to MFD). OpticalLimits called it 'minimal'. Savazzi measured the effective focal length shrinking from 102 mm at infinity to about 70 mm at 0.5× and about 49 mm at 1:1. Expect a much wider view than '105mm' at close range, and keep framing changes in mind for focus stacks and video focus pulls.",other:"Weather-sealed, fluorine front coat (Nikon). Lens OLED panel shows distance and magnification. A customizable control ring and an L-Fn button are on the barrel."},Rp=["Set the limiter to the close range (about 0.5–0.29 m) for insects and flowers so AF doesn't rack out to infinity. For people or landscapes, switch back to FULL.","At 1:1 the camera already shows the effective aperture (f/4.5 wide open). Shoot displayed f/5.6–f/8 for the sharpest frame on the Z8, and focus-stack rather than going to f/16+.","You have about 13.5 cm from the front element at 1:1, so a small flash or diffuser can reach in, but keep the lens hood off if it shades the subject.","Focus-shift shooting works with this lens: start at the nearest point. Cameralabs found step width 4 or lower sharpest at 1:1, and step 7 roughly doubles the spacing.","Don't buy a Z teleconverter for this lens. Use extension tubes for beyond 1:1, and in portraits shoot f/2.8–f/4 freely: it is sharp wide open."],Dp=[{body:"z8",note:"45.7MP: Savazzi's 1:1 tests were on a Z8, with peak at effective f/5.6 and visible diffraction loss starting by f/8–f/11. At normal distances f/4–f/5.6 peaks, and diffraction is visible from about f/8 (OpticalLimits 45MP). Lens VR combines with IBIS. Synchro VR not confirmed."},{body:"z5ii",note:"24.5MP (about 5.9 µm pitch): diffraction shows later per pixel, so f/8–f/11 at 1:1 is a reasonable depth-of-field compromise (inference from pixel pitch, not tested). IBIS plus lens VR."},{body:"z50ii",note:"DX crop: about 157mm-equivalent framing (1.5×), and the frame uses only the strong DX region (Lenstip DX edge above 70 lp/mm). No IBIS, so lens VR is the only stabilization. Savazzi found AF behaviour on the Z50 II the same as on the Z8."}],Lp=!1,Mp=[{id:"photographylife",name:"Photography Life: Nikon Z MC 105mm f/2.8 VR S review (pages 1–2)",url:"https://photographylife.com/reviews/nikon-z-mc-105mm-f-2-8-vr-s-macro/2",kind:"measured",tested_on:"Not stated on the page (lab chart image not readable)",date:null,findings:"Lab sharpness: extremely sharp to the corners even at f/2.8. Improves a bit by f/4, arguably the sharpest aperture. Corners a hair sharper at f/5.6. Strong at all apertures except f/16 (diffraction). Holds its sharpness at close focus, at 1:1 and at infinity. No focus shift and no meaningful field curvature. Distortion -0.66% barrel. Max aperture narrows to f/4.5 at MFD. AF fast for a macro. Page 1 (https://photographylife.com/reviews/nikon-z-mc-105mm-f-2-8-vr-s-macro): MFD 29.2 cm, 1:1, working distance 13.4 cm, 630 g. VR less useful for close-up work. Not compatible with Nikon teleconverters. Extension tubes keep AF and aperture control."},{id:"opticallimits",name:"OpticalLimits (Klaus): Nikkor Z MC 105mm f/2.8 VR S review",url:"https://opticallimits.com/?p=7433",kind:"measured",tested_on:"45MP Nikon Z body (model not named)",date:"2026-07",findings:"Center 'brutally sharp' from f/2.8 with a minor gain at f/4. Outer field very good. Diffraction from about f/8, f/11 still very usable, f/16 softer, avoid f/22 for high-megapixel work. Effective aperture drops to f/4.5 at high magnification. Working distance about 13 cm at 1:1. Use the focus limiter for macro. No focus shift. Vignetting about 2.4 EV RAW at f/2.8 (about 1 EV less corrected), negligible from f/5.6. Lateral CA 0.7–1.1 px at the borders, LoCA negligible. Slight barrel distortion. Cat's-eyes until f/8. Focus breathing 'minimal'. Not compatible with teleconverters. MTF values only in a chart image."},{id:"lenstip",name:"Lenstip review: Nikon Nikkor Z MC 105 mm f/2.8 VR S (resolution, focus breathing, summary chapters)",url:"https://www.lenstip.com/694.4-Lens_review-Nikon_Nikkor_Z_MC_105_mm_f_2.8_VR_S_Image_resolution.html",kind:"measured",tested_on:"Nikon Z7 (45.7MP), RAW",date:null,findings:"Center roughly equal to the Tamron 90 VXD and Laowa 90 2× within error, but the weakest of the three at f/2.8 and f/4. Only lens of the group above 70 lp/mm at the DX edge. Clearly outclasses rivals at the FX edge. Decent level 40–42 lp/mm, record 93.5 lp/mm. Per-aperture lp/mm only in chart https://www.lenstip.com/upload2/300810_roz.png (not readable). Summary (694.11): excellent center, very good DX edge, good FX edge, almost zero LoCA, slight lateral CA, slight distortion, moderate coma, low astigmatism, very pleasant bokeh, efficient VR, high FX vignetting near wide open, weak against bright light, very strong focus breathing. Chapter 694.10: about 168% breathing infinity to MFD. A full AF sweep typically takes over 1 s."},{id:"savazzi",name:"Enrico Savazzi: Nikon Z MC 105 mm f/2.8 VR S (macro optical tests)",url:"https://www.savazzi.net/photography/nikon-z-105-2-8-vr.html",kind:"measured",tested_on:"Nikon Z8 (45.7MP), resolution target at 1:1. Handling also on a Z50 II",date:null,findings:"Working distance at 1:1: 138 mm (AF-S 105 VR: 146 mm). Effective aperture at 1:1 about f/4.6 (about ⅔ stop faster than the thin-lens f/5.6). The camera displays the effective aperture according to focus distance. At 1:1 highest resolution at effective f/5.6, f/4.5 slightly worse, f/8 about equal to f/4.5. Diffraction slightly visible at f/8 and more at f/11. Effective focal length 102 mm at infinity, about 70 mm at 0.5×, about 49 mm at 1:1. Limiter FULL or 0.5–0.29 m, AF only. Does not accept teleconverters (rear element too close to the mount). Supports in-camera focus bracketing. VR switch is in the camera menu."},{id:"cameralabs",name:"Cameralabs: Nikon Z MC 105mm f/2.8 VR S review (Quality page)",url:"https://www.cameralabs.com/nikon-z-mc-105mm-f2-8-vr-s-review/2/",kind:"measured",tested_on:"Nikon Z7 (45.7MP), Siemens star and real-world crops",date:null,findings:"At about 5 m: very good across the full frame at f/2.8 (clearly ahead of the Laowa, near the Sigma 105 DG DN), slight gain at f/4, practically no field curvature. At about 1 km: very sharp corners, little gain from stopping down. At 1:3.6: very sharp wide open (effective f/3.2), slight diffraction loss at f/11. At 1:1: f/4.5 effective sharp with slight FX-corner softening, corner better at f/8. Focus-shift shooting tested: step width 1–4 gives the sharpest stacks, step 7 doubles the spacing. At 1:1 with f/4.5, step 4 is about 100 µm."},{id:"nikon_spec",name:"Nikon: NIKKOR Z MC 105mm f/2.8 VR S product page",url:"https://imaging.nikon.com/lineup/lens/z-mount/z_mc105mmf28_vr_s/index.htm",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.29 m. 1.0× max reproduction. About 630 g. 62 mm filter. 9 blades, rounded opening. 4.5-stop VR. 16 elements in 11 groups. Aperture range f/2.8–32 at infinity and f/4.5–51 at 0.29 m. Focus limiter present (no ranges given)."},{id:"nikon_release",name:"Nikon news release (June 2021): NIKKOR Z MC 105mm f/2.8 VR S",url:"https://www.nikon.com/news/2021/0602_lens_02.htm",kind:"manufacturer",tested_on:null,date:"2021-06",findings:"0.29 m MFD, 1.0×. 4.5-stop VR (CIPA, NORMAL), with the footnote that VR effectiveness decreases as shooting distance decreases. The focus limiter shortens focusing time for close-ups. Nano Crystal and ARNEO coats, fluorine coat, dust and drip resistance."},{id:"nikon_tc14",name:"Nikon: Z TELECONVERTER TC-1.4x product page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_tc_14x/",kind:"manufacturer",tested_on:null,date:null,findings:"Compatible lenses listed: Z 70-180 f/2.8, 70-200 f/2.8 VR S, 100-400 VR S, 180-600 VR, 400 f/2.8 TC VR S, 400 f/4.5 VR S, 600 f/4 TC VR S, 800 f/6.3 VR S. The MC 105 is not listed."},{id:"nikon_fw",name:"Nikon Download Center: NIKKOR Z MC 105mm f/2.8 VR S firmware 1.10",url:"https://downloadcenter.nikonimglib.com/en/download/fw/457.html",kind:"manufacturer",tested_on:null,date:"2022-08",findings:"1.10 adds linear focus-ring rotation and support for 'Switch focus/control ring roles'. Nothing about Synchro VR."},{id:"synchro_vr_forum",name:"FredMiranda forum thread 'Nikon IBIS + VR: Which lenses work & how?' (post #10, ekam, 2026-01-07) quoting Nikon support article 000066751",url:"https://www.fredmiranda.com/forum/topic/1922057/",kind:"forum",tested_on:null,date:"2026-01",findings:"Quotes Nikon's Synchro VR support article (https://www.nikonimgsupport.com/eu/BV_article?articleNo=000066751&ctry=gb&lang=en_GB, which could not be fetched: robots-blocked). Compatible cameras: Z9, Z8, Z6III, Z5II, Zf, ZR. Synchro VR runs when a compatible lens is on a compatible body with body stabilization on. Visible lens entries: Z 28-400 VR, Z 70-200 f/2.8 VR S (marked with an unexplained asterisk), Z 100-400 VR S, Z 400 f/2.8 TC VR S; the quoted list is truncated ('...Show more'), so absence of a lens proves nothing."}],Op={url:null,access:"not-found",summary:"No Christopher Frost review of the Z MC 105 was found. YouTube-restricted and open web searches surfaced reviews by other channels, including 'Nikon Z MC 105mm f/2.8 VR S lens review with samples images & video' (https://www.youtube.com/watch?v=2SHHjcUNKvw), which YouTube's oEmbed credits to Vahagraphy, not Frost. YouTube watch pages could not be fetched. Nothing is attributed to him."},Tp="1) Focus breathing conflict: Lenstip says 'very strong' (about 168% from infinity to MFD), and OpticalLimits says 'minimal'. Savazzi's measured effective focal length (102 → about 49 mm at 1:1) supports Lenstip that framing changes a lot over the full range. OpticalLimits may have judged breathing over a short video pull. Both are reported. 2) Working distance: 138 mm (Savazzi measured), 134 mm (Photography Life), about 130 mm (OpticalLimits). 138 is used. 3) Effective aperture: Nikon spec f/4.5 at 0.29 m. Savazzi calculates f/4.6 and says Z bodies display the effective value. The drop is about 1⅓ stops at 1:1, less than the thin-lens 2 stops. 4) Focus-limiter ranges come only from Savazzi. Nikon pages fetched give none, and Lenstip confirms two ranges. 5) Synchro VR: no Nikon document fetched lists this lens for Synchro VR on the Z8 or Z5 II. Null, to verify. 6) Lenstip and OpticalLimits lp/mm or LW/PH values are in chart images, which WebFetch could not read. Verdicts rely on their text plus Photography Life and Cameralabs. 7) The Photography Life lab body is not named on the pages fetched. 8) Elements: Nikon says 16/11, Savazzi lists 16/10. Nikon is used (not stored in the schema anyway). Savazzi weighed 620 g vs Nikon's 630 g. 9) Z TC compatibility is confirmed negative by Nikon's TC-1.4x list, Photography Life, OpticalLimits and Savazzi (rear element too close to the mount).",Ep={id:fp,name:pp,short:gp,mount:bp,adapter:wp,coverage:_p,kind:vp,focal_mm:yp,max_aperture:kp,min_aperture_f:Ip,aperture_blades:Fp,rounded_blades:Sp,weight_g:Zp,filter_mm:Pp,focus:Ap,stabilization:Cp,close_focus:Np,quick:zp,character:xp,field_tips:Rp,body_notes:Dp,tc_compatible:Lp,sources:Mp,chris_frost:Op,research_notes:Tp},Vp="zeiss-milvus-35-f2-zf2",$p="ZEISS Milvus 2/35 ZF.2 (Distagon T*)",Xp="Milvus 35 f/2",Bp="F",Hp="FTZ II",Wp="FX",jp="prime",Gp=[35],Kp=[{focal_mm:35,f:2}],Up=22,qp=9,Jp=!0,Qp=649,Yp=58,eg={on_z_body:"MF (manual-focus lens)",cpu:!0,motor:"None. Manual-focus Distagon with a CPU chip (ZF.2): passes aperture and focal length to the body; aperture set from the camera.",focus_throw_deg:113,notes:"113° from infinity to 0.3 m (ZEISS datasheet; TDP measured 116°). Floating-element focusing (ZEISS marketing text, via Imaging Resource). Rubberised metal focus ring, weather-sealed (Phillip Reeve). On FTZ/FTZ II the aperture ring must sit at f/22; if moved away the camera refuses to fire until reset, so set aperture with the command dial (Phillip Reeve, tested on Z7II and Zf via FTZ II). As a CPU MF lens, the in-focus indicator should work alongside peaking (inference from Nikon FTZ table rows for CPU lenses; not specifically confirmed for ZF.2)."},tg={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:"3-axis (yaw, pitch, roll) via FTZ II on Z8 and Z5 II. None on Z50 II (no IBIS).",notes:"Nikon FTZ II page: with a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. CPU chip passes 35 mm to IBIS automatically; no Non-CPU lens data needed."},og={mfd_m:[{focal_mm:35,value:.3}],max_mag:[{focal_mm:35,value:.19}],working_distance_mm_at_max_mag:180,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"ZEISS datasheet: focusing range 0.30 m–∞, free working distance 0.18 m at MOD, reproduction ratio 1:5.3 (about 0.19×; TDP gives 0.19×), coverage 128 × 191 mm at MOD. Light loss at 0.19× is about half a stop by N × (1 + m) (computed), so the effective aperture is not a practical concern. Phillip Reeve (46MP Z7II): close-up very good at f/2, excellent f/2.8–f/11, slight diffraction from f/11."},ng={headline:"Classic Zeiss 35: sharp centre from f/2, very good corners by f/8 on 45MP, gorgeous 18-point sunstars; heavy f/2 vignetting and a slightly busy background blur.",sweet_spot:"f/5.6–f/8",wide_open:"Centre excellent at f/2 on 46MP (Reeve), corners good. TDP (5Ds R): centre good at f/2, corners somewhat soft. Vignetting about 2.4–3 EV and LoCA at f/2.",by_focal:[{focal_mm:35,center_peak:"f/2.8–f/5.6",corners_peak:"f/8–f/11",wide_open_note:"Phillip Reeve (Z7II 46MP, ZF.2 on FTZ): centre excellent from f/2; midframe very good at f/2, excellent by f/4; corners good at f/2, very good at f/8; best across the frame at f/11; diffraction from f/16. TDP (50MP 5Ds R): centre clear gain at f/2.8, slight gain at f/4, little change from f/5.6; corners sharpen through f/8. Photozone (Canon FF DSLR, same optics as Distagon ZF): peak f/4–f/5.6, diffraction noticeable from f/8 (lower-resolution body). DxOMark (D800E 36MP): acutance peaks about f/2.8, uniform across the frame."}],close_up_best:"f/2.8–f/8",close_up_note:"Phillip Reeve (46MP): close-up very good at f/2, excellent from f/2.8 through f/11, slight diffraction from f/11. Floating elements keep close range strong. At 0.19× the effective aperture is only about half a stop smaller (computed).",diffraction_note:"Phillip Reeve (46MP Z7II): diffraction reduces sharpness from f/16 at infinity and from f/11 at close range; f/22 visibly softer. Photozone (Canon FF DSLR, lower resolution): noticeable from f/8, easily usable at f/11.",avoid:["Do not move the aperture ring off f/22 on FTZ II: the camera will refuse to fire.","Avoid f/16–f/22 except for sunstars on the Z8.","Do not expect a silky background: transitions can look busy, with coloured fringes at f/2."],confidence:"medium",confidence_reason:"Phillip Reeve tested this exact ZF.2 lens on a 46MP Nikon Z via FTZ (visual crops) and TDP tested on 50MP; they agree on a strong centre and corners peaking about f/8. Older measured tests of the same optics (Lenstip D200, Photozone Canon FF) are low resolution; Lenstip numbers exist only for f/2. DxOMark is the only high-resolution measured source and gives acutance, not per-aperture centre/corner values."},ig={bokeh:"Divided. Phillip Reeve: evenly lit highlights with no onion rings, but harsh transitions, bubble highlights toward the edges, orange/yellow midframe and green corner fringing, and some cat's eye; a bit busy. Photography Life: pleasant, round soft highlights with a slight edge. Photozone: pretty good for the class. TDP: smoothly filled highlights when stopped down.",flare_sunstar:"Sunstars are a highlight: 18-point stars from f/5.6, well defined at f/8, long rays at f/11, 'absolutely gorgeous' at f/16–f/22 (Reeve; TDP also notes 18 points). Flare is mixed: Reeve found contrast loss or ghosting in some situations; Photography Life saw large orange and purple flares from small bright sources at f/8 and smaller; TDP saw practically none with the sun in the corner at f/2, modest at f/16.",ca:"LoCA: small (Reeve), fully gone only at f/8; TDP purple/green fringing in out-of-focus highlights mostly at f/2. Lateral CA: Reeve small; Photozone about 1 px average at the borders; Photography Life over 2 px f/2–f/4, below 2 px at f/5.6; DxOMark noticeable far-corner fringing at f/2–f/2.8.",distortion:"Sources disagree. Reeve: minimal slight barrel (about +3 to correct). DxOMark (D800E): about 0.4% barrel. Photozone: about 1.8% barrel. TDP: slight barrel. A Lightroom profile exists.",vignetting:"Heavy wide open. Reeve (46MP): about 2.4 EV at f/2, 1.7 at f/2.8, 1.0 at f/4, 0.7 at f/5.6–f/8. Photozone: about 2.4 EV at f/2, 1.4 at f/2.8, not significant from f/4. Photography Life: almost 3 EV at f/2 and infinity. TDP: about 3 stops at f/2. DxOMark: about −1.7 EV at f/2.",coma_astro:"Reeve: coma noticeable at f/2–f/2.8, much better at f/4, gone by f/5.6. Lenstip (D200): well-controlled coma, low astigmatism.",focus_breathing:"Moderate (Reeve); TDP: modest change in subject size across focus distances.",other:"Focus shift: Phillip Reeve, on a 46MP Z7II, noted none. No other source reports any. Milvus shares the optical design of the earlier Distagon T* 2/35 ZF.2 / Classic (Reeve; TDP), with new housing, updated T* coating and weather sealing. ZF.2 649 g (ZEISS datasheet). Reeve: very sharp but 'doesn't truly excel' beyond sharpness; recommended mainly for DSLR/film/MF fans."},sg=["Lock the aperture ring at f/22 and set aperture on the command dial; if the camera won't fire, check the ring.","Focus with peaking + magnified view. Reeve saw no focus shift, so focusing wide open is fine, but at f/2–f/2.8 keep critical focus in magnified view.","Landscapes on the Z8: f/8 for corners, f/11 if depth is needed; f/16 only for the 18-point sunstar.","f/2 gives about 2.4–3 EV vignetting and LoCA on high-contrast edges: stop to f/2.8–f/4 for portraits, or use it as character.","Close-ups to 0.3 m (0.19×, about 18 cm working room): f/2.8–f/8 is excellent."],ag=[{body:"z8",note:"Reeve's 46MP Z7II results apply directly: centre excellent from f/2, corners very good at f/8, diffraction from f/16 (f/11 close up). IBIS 3-axis via FTZ II; focal length passed automatically."},{body:"z5ii",note:"24.5MP: corners look good by f/5.6 (Photozone's lower-resolution peak f/4–f/5.6 applies); f/11 is safe. IBIS 3-axis via FTZ II."},{body:"z50ii",note:"About 52mm-equivalent framing on DX; vignetting drops to about 1 stop at f/2 (TDP APS-C figure) and the corners are outside the crop. No IBIS."}],rg=!1,lg=[{id:"phillipreeve",name:"phillipreeve.net: Review: Zeiss Milvus 35mm f/2",url:"https://phillipreeve.net/blog/review-zeiss-milvus-35mm-f-2/",kind:"review",tested_on:"Nikon Z7II (45.7MP) via FTZ/FTZ II; samples on Nikon Zf; ZF.2 version",date:"2026-04",findings:"Infinity: centre excellent from f/2; midframe very good f/2, excellent f/4; corners good f/2, very good f/8; best across frame f/11; diffraction from f/16. Portrait distance: good f/2, very good f/2.8, excellent f/4. Close-up: very good f/2, excellent f/2.8–f/11, slight diffraction from f/11. No focus shift noted. LoCA small, gone at f/8. Lateral CA small. Vignetting about 2.4 EV at f/2, 1.7 at f/2.8, 1.0 at f/4, 0.7 at f/5.6–f/8. Distortion minimal barrel. Coma noticeable f/2–f/2.8, gone f/5.6. Sunstars 18-point from f/5.6, gorgeous f/16–f/22. Flare mixed. Focus breathing moderate. Bokeh evenly lit but harsh transitions, edge bubbles and fringing, a bit busy. Same optical construction as the classic Distagon 2/35 with new housing, coating, sealing. On FTZ/FTZ II the camera refuses to fire unless the aperture ring is at f/22. 113°, 0.3 m, 1:5.3, 649 g, 58 mm, 9 curved blades."},{id:"tdp",name:"The-Digital-Picture: Zeiss Milvus 35mm f/2 Lens Review",url:"https://www.the-digital-picture.com/Reviews/Zeiss-Milvus-35mm-f-2-Lens.aspx",kind:"measured",tested_on:"Canon EOS 5Ds R (50.6MP), ZE version",date:null,findings:"Centre good at f/2, clear gain at f/2.8, slight gain f/4, little change from f/5.6. Corners somewhat soft at f/2, sharpening through f/8. Lateral CA modest; axial CA with purple/green fringing in highlights mostly at f/2. Vignetting about 3 stops at f/2 on FF, about 1 stop on APS-C, about 0.6 stop at f/5.6–f/8. Slight barrel. Flare practically none at f/2 with sun in corner, modest at f/16; 18-point stars. Bokeh good. 116° focus rotation, 0.3 m, 0.19×, 9 blades. Optical design shared with the Classic 35 f/2 ZE."},{id:"dxomark",name:"DXOMARK: Carl Zeiss Milvus 2/35 ZF.2 Nikon lens review",url:"https://www.dxomark.com/carl-zeiss-milvus-2-35-zf.2-nikon-lens-review-affordable-quality",kind:"measured",tested_on:"Nikon D800E (36MP)",date:"2017-03",findings:"Score 40, sharpness 29 P-Mpix. Acutance about 70% at f/2, peak about 80% at f/2.8, strong f/4–f/11, uniform across the frame at all apertures. Distortion about 0.4% barrel. Vignetting about −1.7 EV at f/2, −1 EV at f/2.8, about 0.33 EV from f/4. Noticeable far-corner CA at f/2–f/2.8, mild in outer field f/4–f/22. Rated sharper and more uniform at f/2 than the older Distagon 2/35 ZF.2 measured on the same system."},{id:"photozone",name:"Photozone (OpticalLimits): Zeiss Distagon T* 35mm f/2 ZF (ZE) on Canon EOS FF",url:"https://photozone.de/canon_eos_ff/503-zeiss35f2eosff?start=1",kind:"measured",tested_on:"Canon full-frame DSLR (model not named in text; likely 21MP 5D Mark II), ZF version adapted",date:"2010-04",findings:"Same optics (pre-Milvus). Centre strong from f/2; borders/corners good to very good; peak f/4–f/5.6 across frame; diffraction noticeable from f/8, easily usable at f/11. Distortion about 1.8% barrel. Vignetting about 2.4 EV at f/2, 1.4 at f/2.8, insignificant from f/4. CA about 1 px. Bokeh pretty good for class. MTF numbers only in chart image."},{id:"lenstip",name:"Lenstip: Carl Zeiss Distagon T* 35 mm f/2 ZF/ZK/ZS/ZE review",url:"https://www.lenstip.com/179.4-Lens_review-Carl_Zeiss_Distagon_T*_35_mm_f_2_ZF_ZK_ZS_ZE_Image_resolution.html",kind:"measured",tested_on:"Nikon D200 (10.2MP DX)",date:"2009-06",findings:"Pre-Milvus optics. f/2: centre almost 40 lp/mm, corner (DX) over 30 lp/mm; both improve progressively stopping down (other values only in chart). Summary: consistently high centre quality, very good corners, low CA wide open but higher CA stopped down, low distortion, well-controlled coma, low astigmatism, vignetting higher than competitors."},{id:"photographylife",name:"Photography Life: Zeiss Distagon 35mm f/2 ZF.2 review",url:"https://photographylife.com/reviews/zeiss-distagon-35mm-f2-zf2",kind:"review",tested_on:"Nikon D3s (12MP FX) for field tests; lab body not named",date:null,findings:"Pre-Milvus Distagon ZF.2. Centre very good wide open, corners a tad weaker, sharper by f/5.6. Lateral CA over 2 px f/2–f/4, below 2 px from f/5.6. LoCA visible wide open. Bokeh pleasant, round soft highlights with slight edge. Flare minimal wide open; large orange/purple flares from small bright sources at f/8 and smaller. Vignetting almost 3 EV at f/2, infinity. Distortion moderate."},{id:"zeiss_datasheet",name:"ZEISS Milvus 2/35 datasheet (PDF)",url:"https://www.zeiss.it/content/dam/consumer-products/downloads/photography/datasheets/en/milvus-lenses/datasheet-zeiss-milvus-235.pdf",kind:"manufacturer",tested_on:null,date:null,findings:"9 elements / 7 groups; f/2–f/22; focusing range 0.30 m–∞; free working distance 0.18 m; 1:5.3 at MOD; coverage 128 × 191 mm; focus rotation 113°; M58 × 0.75 filter; ZF.2 length 81.3 mm, weight 649 g; MTF charts at f/2 and f/4 (values not readable)."},{id:"nikon_ftz_ii",name:"Nikon: Mount Adapter FTZ II product page",url:"https://www.nikon.ie/en_IE/product/accessories/mirrorless/mount-adapter-ftz-ii",kind:"manufacturer",tested_on:null,date:null,findings:"Fetched 2026-11-05: 'when you're shooting with a non-VR F-mount lens, yaw, pitch, and roll are corrected in-camera'. With VR F lenses, in-lens yaw/pitch is supplemented by in-camera roll. Full AF/AE for AF-S, AF-P and AF-I types (94 of about 360 compatible F lenses)."}],cg={url:null,access:"not-found",summary:"No Christopher Frost review of the ZEISS Milvus 2/35 (or the Distagon 2/35 ZF.2) was found. A search with his name and the lens returned only Phillip Reeve, Fstoppers (Milvus 35/1.4), DxOMark and The-Digital-Picture. Nothing is attributed to him."},dg="1) Optics: Reeve and TDP say the Milvus 2/35 keeps the classic Distagon 2/35 optical design (new housing, coating, sealing), so older Distagon ZF/ZF.2 tests (Lenstip, Photozone, Photography Life) are used for character, with lower weight. DxOMark nonetheless measured the Milvus sharper at f/2 than the old Distagon, possibly sample or coating differences. 2) Resolution vintage: Lenstip (10MP DX) and Photozone (Canon FF DSLR, likely 21MP) peak earlier (f/4–f/5.6, diffraction from f/8) than Reeve's 46MP Z7II (corners very good f/8, best f/11, diffraction from f/16). The Reeve result is the most directly relevant to the Z8, hence corners_peak f/8–f/11. 3) Focus shift: the brief asked for focus-at-shooting-aperture advice, but the only source that addresses it (Reeve, 46MP Z) reports none. No source reports focus shift, so the tip is phrased accordingly. 4) Distortion conflict: 0.4% (DxOMark), minimal (Reeve), 1.8% (Photozone, older optics test). 5) Nikon FTZ II IBIS statement confirmed on Nikon's FTZ II page this session (yaw, pitch, roll for non-VR F lenses). 6) Rounded blades: Reeve says 9 curved blades; the ZEISS datasheet fetched did not list blades. 7) No Lensrentals, OpticalLimits Milvus, Photography Life Milvus or Lenstip Milvus review found. Imaging Resource lists the lens as not tested.",mg={id:Vp,name:$p,short:Xp,mount:Bp,adapter:Hp,coverage:Wp,kind:jp,focal_mm:Gp,max_aperture:Kp,min_aperture_f:Up,aperture_blades:qp,rounded_blades:Jp,weight_g:Qp,filter_mm:Yp,focus:eg,stabilization:tg,close_focus:og,quick:ng,character:ig,field_tips:sg,body_notes:ag,tc_compatible:rg,sources:lg,chris_frost:cg,research_notes:dg},ug=[{id:"focus-mode",group:"Autofocus",name:"Focus mode (AF-S / AF-C / AF-F / MF)",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > Focus mode; or hold the focus-mode button and turn the main command dial",z5ii:"Photo shooting menu > Focus mode (also i menu)",z50ii:"Photo shooting menu > Focus mode (also i menu)"},one_liner:"Lock focus once (AF-S), keep tracking (AF-C), or focus by hand (MF).",what_it_does:"Sets whether the camera focuses once and holds (AF-S), keeps re-focusing while you half-press or hold AF-ON (AF-C), or leaves focus to you (MF). AF-F is a video-only mode that focuses continuously without a button press. The default release behaviour differs: AF-S waits for focus, AF-C fires whether or not focus is achieved (changeable in a1/a2).",options:[{value:"AF-S",meaning:"Single AF: focus locks on half-press; point turns green when locked, flashes red if it fails.",use_when:"Static subjects: landscapes, tripod moonrise, posed portraits, static macro."},{value:"AF-C",meaning:"Continuous AF: focus keeps updating while the AF control is held.",use_when:"Anything that moves: birds, dancers, running kids. Many shooters leave AF-C on full-time with back-button focus."},{value:"AF-A (Z50II only)",meaning:"Camera switches between AF-S and AF-C depending on subject movement. Photo mode only.",use_when:"Casual family snaps on the Z50II; avoid for serious action because you cannot predict which mode it picks."},{value:"AF-F",meaning:"Full-time AF, video mode only: focus adjusts continuously, locks on half-press.",use_when:"Video when you want the camera to keep focusing without holding a button."},{value:"MF",meaning:"Manual focus; shutter fires regardless of focus. Peaking and the focus indicator can assist.",use_when:"Stars, moon at long focal length, stacked macro, manual lenses (Thypoch, Laowa, Zeiss, Voigtlander, AF-D on FTZ II)."}],when_to_change:"Switch to AF-C the moment the subject can move; switch to MF for night sky, high-magnification macro and manual lenses.",suggested:[{scenario:"Birds in flight",value:"AF-C",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"AF-C",scenario_id:"dance"},{scenario:"Kids running",value:"AF-C",scenario_id:"kids"},{scenario:"Landscape on tripod",value:"AF-S (or MF after focusing with magnified view)",scenario_id:"landscape"},{scenario:"Macro handheld",value:"AF-C with a single point, or MF and rock the body; at 1:1 MF is usually more reliable",scenario_id:"macro"},{scenario:"Moonrise at 280mm on tripod",value:"AF-S pinpoint/single on the moon's limb, then switch to MF so focus cannot shift",scenario_id:"moonrise"}],body_differences:"Z8: AF-S, AF-C, AF-F (video), MF - no AF-A. Z50II: adds AF-A in photo mode. Z5II: Nikon's spec page does not list AF-A; confirm in camera.",gotchas:["AF-S default is focus priority (shutter will not fire until focus is found); AF-C default is release priority - check a1/a2 if shots are blocked or soft.","With screw-drive AF/AF-D lenses on the FTZ II (e.g. 60mm f/2.8D, 105 DC, 50 f/1.8D) the body can only manual focus.","Z8 a9 Focus mode restrictions can hide modes from the button/dial cycle."],related:["af-area-mode","af-c-priority","af-s-priority","af-activation"],firmware_note:"No functional change to the focus-mode list in Z8 FW 3.x, Z5II FW 1.20 or Z50II FW 1.10 found.",research_notes:"Z5II AF-A availability not confirmed: the Z5II online manual body text could not be retrieved (only navigation), and the Nikon spec page does not mention AF-A.",sources:[{id:"nikon-z8-focus",name:"Nikon Z8 Reference Guide - Focus chapter",url:"https://onlinemanual.nikonimglib.com/z8/en/focus_31.html",kind:"manufacturer",findings:"Lists four focus modes: AF-S (focus priority default), AF-C (release priority default), AF-F (video only), MF; focus mode set via focus-mode button + main command dial or menus."},{id:"nikon-z50ii-focus",name:"Nikon Z50II Reference Guide - Focus chapter",url:"https://onlinemanual.nikonimglib.com/z50II/en/18-02.html",kind:"manufacturer",findings:"Lists AF-A (photo only, auto-switches AF-S/AF-C), AF-S, AF-C, AF-F (video only), MF, with default priorities."},{id:"nikon-z8-csm-index",name:"Nikon Z8 Reference Guide - Custom Settings menu index (current FW 3.x manual)",url:"https://onlinemanual.nikonimglib.com/z8/en/csma_af-c_priority_selection_204.html",kind:"manufacturer",findings:"Lists a9 Focus Mode Restrictions in the Z8 Custom Settings menu."}]},{id:"af-area-mode",group:"Autofocus",name:"AF-area mode",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > AF-area mode; or hold the focus-mode button and turn the sub-command dial",z5ii:"Photo shooting menu > AF-area mode (also i menu)",z50ii:"Photo shooting menu > AF-area mode (also i menu)"},one_liner:"Decides which part of the frame the camera is allowed to focus on.",what_it_does:"Controls how big the active focus area is and whether the camera or you choose where it sits. Small areas give precision on static subjects; larger or tracking areas keep moving subjects in focus. Subject detection only works in wide-area, 3D-tracking, subject-tracking and auto-area modes.",options:[{value:"Pinpoint AF",meaning:"Very small point for precise focus; photo mode, AF-S only; slower.",use_when:"Moon limb, eye of a static macro subject, focusing through foliage."},{value:"Single-point AF",meaning:"One user-selected point.",use_when:"Static subjects where you choose exactly what is sharp; landscapes, tripod work."},{value:"Dynamic-area AF (S/M/L)",meaning:"Your chosen point, with surrounding points helping if the subject briefly slips off it. Photo mode, AF-C only. S is tightest.",use_when:"Predictable movers you can keep under the point; bird on a branch with clutter; dancer's face when you want to stay on one performer."},{value:"Wide-area AF (S/L)",meaning:"Like single-point but a larger box; closest subject in the box gets priority. Subject detection works inside the box.",use_when:"Subjects too fast for one point; panning; video. Good default for stage dance with People detection."},{value:"Wide-area AF (C1/C2)",meaning:"Custom-sized boxes you set by holding the OK button and resizing with the multi selector.",use_when:"Birds in flight against sky (tall/wide box sized to the bird); a stage strip where dancers move side to side."},{value:"3D-tracking",meaning:"Start on the subject and the camera follows it across the frame while AF is held; reverts when released. Photo mode, AF-C only.",use_when:"Erratic subjects: kids, BIF against clean backgrounds, a soloist moving across the stage."},{value:"Subject-tracking AF",meaning:"Video-mode tracking of a selected subject; started with OK or half-press, ended with OK.",use_when:"Video of a bird or dancer with the Z8 + 180-600."},{value:"Auto-area AF",meaning:"Camera detects the subject and picks the point over the whole frame.",use_when:"Kids, candid family shots, single bird against plain sky; least control when several subjects compete."}],when_to_change:"Go smaller when the camera grabs the wrong thing (branches, other dancers); go larger or tracking when you cannot keep a small point on the subject.",suggested:[{scenario:"Birds in flight",value:"Wide-area C1/C2 or 3D-tracking + Birds detection (Z8 + 180-600)",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"Wide-area (S) + People detection; 3D-tracking for a soloist",scenario_id:"dance"},{scenario:"Kids running",value:"Auto-area or 3D-tracking + People detection",scenario_id:"kids"},{scenario:"Landscape on tripod",value:"Single-point (or Pinpoint) on the chosen focus distance",scenario_id:"landscape"},{scenario:"Macro handheld",value:"Single-point or Pinpoint; Dynamic (S) if the subject sways",scenario_id:"macro"},{scenario:"Moonrise at 280mm on tripod",value:"Pinpoint or Single-point on the moon's edge, AF-S",scenario_id:"moonrise"}],body_differences:"Nikon's spec pages list the same set on all three bodies: Pinpoint (photo), Single, Dynamic S/M/L (photo), Wide S/L/C1/C2, Auto-area, 3D-tracking (photo), Subject-tracking (video). Z8 FW 3.00 added more custom wide-area (C1/C2) size patterns. Z5II and Z50II use the same Expeed 7 subject detection family, but the Z8's stacked sensor gives faster AF updates during bursts.",gotchas:["Pinpoint only in AF-S; Dynamic and 3D only in AF-C - the menu greys them out otherwise.","Subject detection is ignored in Single-point, Pinpoint and Dynamic modes.","3D-tracking resets to the start point when you release AF; recompose before re-engaging.","Tracking can fail on subjects with the same colour/brightness as the background, very small or fast subjects, or when obstructed."],related:["focus-mode","subject-detection","limit-af-area-mode-selection","focus-tracking-lock-on","store-points-by-orientation"],firmware_note:"Z8 FW 3.00: wider/more custom wide-area AF focus-area patterns (Nikon download center change log).",research_notes:"Z8 and Z5II option descriptions are taken from Nikon spec pages plus the Z50II manual text; the Z8/Z5II online manual bodies could not be retrieved, only their menu indexes.",sources:[{id:"nikon-z8-spec",name:"Nikon Z8 product page - Specifications",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z_8/",kind:"manufacturer",findings:"AF-area modes: pinpoint (photo), single-point, dynamic S/M/L (photo), wide-area S/L/C1/C2, auto-area, 3D-tracking (photo), subject-tracking (video)."},{id:"nikon-z5ii-spec",name:"Nikon Z5II product page - Specifications",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z5_2/",kind:"manufacturer",findings:"Same AF-area mode list as Z8, with the same photo/video restrictions."},{id:"nikon-z50ii-focus",name:"Nikon Z50II Reference Guide - Focus chapter",url:"https://onlinemanual.nikonimglib.com/z50II/en/18-02.html",kind:"manufacturer",findings:"Describes each AF-area mode; Dynamic and 3D only in AF-A/AF-C; Pinpoint only with AF-S; C1/C2 sized by holding OK; tracking cautions."},{id:"nikon-z8-fw-history",name:"Nikon Download Center - Z8 firmware change history (latest C 3.10)",url:"https://downloadcenter.nikonimglib.com/en/download/fw/573.html",kind:"manufacturer",findings:"FW 3.00 adds wider Wide-area AF focus areas."},{id:"nikon-sports-af-guide",name:"Nikon Professional Setting Guide: Sports AF Edition (2021, Z9-era; hosted copy)",url:"https://fotori.cz/files/upload/soubory/tela/Z9_TG_AF_En(Cz)01.pdf",kind:"manufacturer",findings:"Nikon recommends 3D-tracking for single erratic athletes, Dynamic (S) for team sports, Auto-area for subjects that fill the frame unpredictably."}]},{id:"subject-detection",group:"Autofocus",name:"AF/MF subject detection options",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Photo shooting menu > AF/MF subject detection options (video menu has its own)",z5ii:"Photo shooting menu > AF/MF subject detection options",z50ii:"Photo shooting menu > AF/MF subject detection options"},one_liner:"Tells the AF what kind of subject to look for: people, animals, birds, vehicles.",what_it_does:"Points the deep-learning detector at a subject class so the camera can find faces/eyes/heads or vehicles inside the active AF area. Detection works in Wide-area, 3D-tracking, Subject-tracking and Auto-area. Narrowing the class (e.g. Birds instead of Auto) reduces false grabs on other subject types.",options:[{value:"Auto",meaning:"Looks for people, animals and vehicles and picks one.",use_when:"Mixed scenes; family outings where kids and dogs share the frame."},{value:"People",meaning:"Faces and eyes (and bodies).",use_when:"Kids, portraits, stage dance."},{value:"Animal",meaning:"Dogs, cats and birds (face/eye or whole animal).",use_when:"Mammals and mixed wildlife."},{value:"Birds",meaning:"Bird heads/eyes or whole bird.",use_when:"Birding with the 180-600; more decisive than Animal on small birds."},{value:"Vehicle",meaning:"Cars, motorbikes, trains, bicycles (and aircraft on bodies without a separate option).",use_when:"Motorsport, trains."},{value:"Airplanes",meaning:"Aircraft body, nose or cockpit.",use_when:"Airshows."},{value:"Subject detection off",meaning:"No detection; pure area-based AF.",use_when:"Landscapes, macro, moon - where detection would only add false hits."}],when_to_change:"Change whenever your subject class changes; turn it off for static non-living subjects.",suggested:[{scenario:"Birds in flight",value:"Birds",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"People",scenario_id:"dance"},{scenario:"Kids running",value:"People (Auto if the dog joins in)",scenario_id:"kids"},{scenario:"Landscape on tripod",value:"Off",scenario_id:"landscape"},{scenario:"Macro handheld",value:"Off (Animal can sometimes find insect eyes, but is unreliable)",scenario_id:"macro"},{scenario:"Moonrise at 280mm on tripod",value:"Off",scenario_id:"moonrise"}],body_differences:"Z8: Birds option added in FW 2.00; FW 3.00 added subject-detection priority for MF and MF detection areas. Z5II: Nikon lists nine detectable subjects (people, birds, dogs, cats, cars, bicycles, motorcycles, trains, airplanes). Z50II manual lists Auto, People, Animal, Birds, Vehicle, Airplanes, Off.",gotchas:["Detection performance drops in high-speed frame capture+ and with HLG tone mode (Z50II manual).","Under fluorescent/mercury lights Birds detection can be affected by flicker - Photo flicker reduction may help.","Turn the AF-assist illuminator off for animals - it can affect their eyes.","When several subjects are detected, grey boxes appear; move between them with the multi selector left/right."],related:["af-area-mode","mf-subject-detection-area","af-assist-illuminator"],firmware_note:"Z8: Birds in FW 2.00; MF subject detection in FW 3.00. Z5II/Z50II: no detection changes in FW 1.20/1.10 change logs.",research_notes:"Exact option labels in the Z8 and Z5II menus were not readable from their online manuals; labels here follow the Z50II manual. Z8 option list (with Birds) is from the FW 2.00 change log and Nikon's '9 subject types including airplane and bird modes' copy.",sources:[{id:"nikon-z50ii-focus",name:"Nikon Z50II Reference Guide - Focus chapter",url:"https://onlinemanual.nikonimglib.com/z50II/en/18-02.html",kind:"manufacturer",findings:"Options Auto, People, Animal, Birds, Vehicle, Airplanes, off; detection only in Wide-area/3D/Subject-tracking/Auto-area; cautions on flicker, AF-assist, HLG, high-speed frame capture."},{id:"nikon-z8-fw-history",name:"Nikon Download Center - Z8 firmware change history (latest C 3.10)",url:"https://downloadcenter.nikonimglib.com/en/download/fw/573.html",kind:"manufacturer",findings:"FW 2.00 added Birds subject detection; FW 3.00 added subject detection in manual focus."},{id:"nikon-z8-spec",name:"Nikon Z8 product page - Specifications",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z_8/",kind:"manufacturer",findings:"Nine subject types for stills and video, including dedicated airplane and bird modes."},{id:"nikon-z5ii-spec",name:"Nikon Z5II product page - Specifications",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z5_2/",kind:"manufacturer",findings:"Automatic detection of nine subjects (people, birds, dogs, cats, cars, bicycles, motorcycles, trains, airplanes) - retailer copy of Nikon specs agrees."}]},{id:"af-c-priority",group:"Autofocus",name:"a1 AF-C priority selection",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Custom Settings menu > a Focus > a1 AF-C priority selection",z5ii:"Custom Settings menu > a Autofocus > a1 AF-C priority selection",z50ii:"Custom Settings menu > a Focus > a1 AF-C priority selection"},one_liner:"In AF-C, fire immediately (Release) or only when in focus (Focus).",what_it_does:"Only applies in AF-C. Release lets the shutter fire on every press regardless of focus; Focus blocks the shot until the camera thinks it is in focus; Focus + release gives focus priority to the first frame of a burst on dark or low-contrast subjects and release priority after that.",options:[{value:"Release",meaning:"Shutter always fires; burst rate never slows for focus.",use_when:"Action where timing matters more than every frame being sharp (Nikon's recommendation for all sports in its Sports AF guide)."},{value:"Focus + release",meaning:"First frame of a burst waits for focus in dim/low-contrast light; later frames release.",use_when:"Stage dance and dim indoor kids - protects the first frame without stalling the burst."},{value:"Focus",meaning:"Shutter only fires when focus is achieved.",use_when:"When a missed-focus frame is worse than a missed moment; rarely ideal for fast action."}],when_to_change:"Use Release for bright, fast action; switch to Focus + release when light is poor and the first frame keeps missing.",suggested:[{scenario:"Birds in flight",value:"Release",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"Focus + release",scenario_id:"dance"},{scenario:"Kids running",value:"Release",scenario_id:"kids"},{scenario:"Landscape on tripod",value:"n/a (AF-S)",scenario_id:"landscape"},{scenario:"Macro handheld",value:"Release (you time the shot as you rock into focus)",scenario_id:"macro"},{scenario:"Moonrise at 280mm on tripod",value:"n/a (AF-S or MF)",scenario_id:"moonrise"}],body_differences:"Same three options on all three bodies (verified in the Z50II manual; present as a1 on Z8 and Z5II menu indexes).",gotchas:["Has no effect in AF-S - use a2 for that.","Release priority means the camera will happily record out-of-focus frames; it does not make AF faster."],related:["af-s-priority","focus-mode","af-activation"],firmware_note:"",research_notes:"Option labels confirmed from Z50II manual; Z8/Z5II confirmed present at a1 via menu index only.",sources:[{id:"nikon-z50ii-a1",name:"Nikon Z50II Reference Guide - a1 AF-C priority selection",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-05-02.html",kind:"manufacturer",findings:"Options Release, Focus + release (focus priority for first shot in dark/low-contrast bursts), Focus; applies only in AF-C."},{id:"nikon-sports-af-guide",name:"Nikon Professional Setting Guide: Sports AF Edition (2021, Z9-era; hosted copy)",url:"https://fotori.cz/files/upload/soubory/tela/Z9_TG_AF_En(Cz)01.pdf",kind:"manufacturer",findings:"Recommends Release for all listed sports so the frame rate never drops."},{id:"reed-hoffmann-z8",name:"Reed Hoffmann - Nikon Z 8 Menus Jump Start",url:"https://reedhoffmann.com/nikon-z-8-menus-jump-start/",kind:"review",findings:"Z8 setup uses a1 Release."},{id:"cotswold-z8-wildlife",name:"The Cotswold Photographer - Best Nikon Z8 settings for wildlife",url:"https://thecotswoldphotographer.com/best-nikon-z8-settings-for-wildlife-photography/",kind:"review",findings:"Z8 wildlife setup uses AF-C priority Release."}]},{id:"af-s-priority",group:"Autofocus",name:"a2 AF-S priority selection",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Custom Settings menu > a Focus > a2 AF-S priority selection",z5ii:"Custom Settings menu > a Autofocus > a2 AF-S priority selection",z50ii:"Custom Settings menu > a Focus > a2 AF-S priority selection"},one_liner:"In AF-S, allow a shot before focus locks (Release) or not (Focus).",what_it_does:"Only applies in AF-S. Focus (default behaviour) blocks the shutter until focus is confirmed; Release fires whenever you press.",options:[{value:"Focus",meaning:"Shutter fires only after focus confirmation.",use_when:"Normal static work - prevents accidental soft frames."},{value:"Release",meaning:"Shutter fires immediately regardless of focus.",use_when:"Night/moon scenes where AF struggles and you have already set focus; or if AF-S hunting is blocking shots."}],when_to_change:"Switch to Release only when AF-S refuses to fire in conditions where you know focus is fine.",suggested:[{scenario:"Landscape on tripod",value:"Focus",scenario_id:"landscape"},{scenario:"Moonrise at 280mm on tripod",value:"Focus (switch to MF after focusing rather than using Release)",scenario_id:"moonrise"},{scenario:"Macro handheld",value:"Focus if using AF-S",scenario_id:"macro"},{scenario:"Birds in flight",value:"n/a (AF-C)",scenario_id:"birds"},{scenario:"Stage dance in low LED light",value:"n/a (AF-C)",scenario_id:"dance"},{scenario:"Kids running",value:"n/a (AF-C)",scenario_id:"kids"}],body_differences:"Same on all three bodies.",gotchas:["If AF-S shots 'won't fire' in the dark, this is usually why."],related:["af-c-priority","focus-mode"],firmware_note:"",research_notes:"",sources:[{id:"nikon-z50ii-a2",name:"Nikon Z50II Reference Guide - a2 AF-S priority selection",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-05-03.html",kind:"manufacturer",findings:"Options Release and Focus; applies only in AF-S."},{id:"nikon-z8-focus",name:"Nikon Z8 Reference Guide - Focus chapter",url:"https://onlinemanual.nikonimglib.com/z8/en/focus_31.html",kind:"manufacturer",findings:"AF-S defaults to focus priority: if focus fails the point flashes red and the shutter is disabled."}]},{id:"focus-tracking-lock-on",group:"Autofocus",name:"a3 Focus tracking with lock-on",available_on:["z8","z5ii","z50ii"],menu_path:{z8:"Custom Settings menu > a Focus > a3 Focus tracking with lock-on",z5ii:"Custom Settings menu > a Autofocus > a3 Focus tracking with lock-on",z50ii:"Custom Settings menu > a Focus > a3 Focus tracking with lock-on"},one_liner:"How stubbornly AF-C sticks to the subject when something crosses in front.",what_it_does:"Blocked shot AF response (1 Quick to 5 Delayed) sets how long AF-C waits before jumping to something that passes between you and the subject. On the Z8 a second item, Subject motion (Erratic/Steady), tunes prediction for stop-start versus constant-speed subjects.",options:[{value:"Blocked shot AF response 5 (Delayed) - 4",meaning:"Holds on the original subject through obstructions.",use_when:"Birds flying past branches; a dancer crossing behind another."},{value:"Blocked shot AF response 3 (default)",meaning:"Balanced.",use_when:"Start here."},{value:"Blocked shot AF response 2 - 1 (Quick)",meaning:"Jumps quickly to new subjects in the AF area.",use_when:"Switching between subjects deliberately, e.g. kids taking turns."},{value:"Subject motion: Erratic (Z8)",meaning:"Expects sudden stops/starts and direction changes.",use_when:"Small birds, kids, energetic jatis."},{value:"Subject motion: Steady (Z8)",meaning:"Expects smooth, constant-speed movement.",use_when:"Large birds

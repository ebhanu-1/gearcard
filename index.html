ers at f/2.8 at infinity (2.20 stops per its 26mm comparison), with f/5.6–f/16 indistinguishable. Reeve (correction off): 2.5 / 2.0 / 1.7 / 1.5 / 1.5 EV at f/2.8 / 4 / 5.6 / 8 / 11. Lenstip: distinct on FX, moderate on DX. Hogan: default Vignette Control still leaves over 1 EV.",coma_astro:"Lenstip: 'a bit too pronounced' at f/2.8. Photography Life (Z7): a bit of coma, good overall. Reeve: usable for Milky Way at f/2.8.",focus_breathing:"Almost none (Reeve). Small change from MFD to infinity, unnoticeable for most moves (Hogan).",other:"The SE has the same optics as the standard version, with retro styling (silver ring, ridged rings) designed for the Z fc. Reeve and Hogan both say the optics are identical. Nikon specs for both: 9 elements in 8 groups (2 aspherical), 0.19 m and 0.2×, 7 rounded blades, 52 mm filter, 43 mm long. The SE is 160 g and 71.5 mm diameter vs 155 g and 70 mm for the standard. No hood included (Sans Mirror)."},Vm=["Street and travel at distance: f/2.8–f/4 is fine for centered subjects. f/5.6 is the measured peak, and f/8 squeezes the most from the corners.","Close-ups (food, details): stop to f/5.6–f/8 and focus at that aperture. f/2.8 up close is soft and low-contrast.","Leave Vignette Control and auto distortion on. Over 2 EV of corner falloff at f/2.8 otherwise.","With the sun in the frame, shift the angle slightly to kill ghosts. The lens has no hood or S-line coatings.","On the Z50 II it becomes about a 42mm normal with excellent corner-to-corner sharpness (Reeve), and the soft FX corners drop out. Keep shutter speeds up without IBIS."],$m=[{body:"z8",note:"45.7MP: Reeve's Z7 II results apply directly. Excellent f/2.8 center, low-contrast corners until f/4–f/8, peak about f/8. Expect slight diffraction from f/11 (inference)."},{body:"z5ii",note:"24.5MP: wide-open corner softness is less visible per pixel. f/4–f/8 is a safe range, and f/11 is fine (inference)."},{body:"z50ii",note:"DX, about 42mm-equivalent: Reeve rates DX sharpness excellent corner to corner, with diffraction softening at f/11. Hogan says the DX area is very good wide open. No IBIS."}],Xm=!1,Bm=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor Z 28 mm f/2.8 (SE) (resolution and summary chapters)",url:"https://lenstip.com/624.4-Lens_review-Nikon_Nikkor_Z_28_mm_f_2.8_(SE)_Image_resolution.html",kind:"measured",tested_on:"Nikon Z7 (45.7MP), RAW via dcraw",date:"2022-02",findings:"Decency level 41–43 lp/mm. Center 56 lp/mm at f/2.8, peak 75 lp/mm at f/5.6 (4 lp/mm below the Z 24 f/1.8 S). DX edge mostly close to 50 lp/mm, slightly lower at f/4–f/5.6. FX edge 41.0 lp/mm at f/2.8 rising to 43.5 at f/8, the decency borderline. Summary (https://www.lenstip.com/624.11-Lens_review-Nikon_Nikkor_Z_28_mm_f_2.8_(SE)_Summary.html) pros: very good center, sensible DX edge, negligible LoCA, slight lateral CA, no spherical aberration problems, low astigmatism, moderate DX vignetting, sensible against bright light, pleasing bokeh, quick silent accurate AF. Cons: distinct FX vignetting, a bit too pronounced coma wide open, plastic barrel and mount. Tested the SE version."},{id:"photographylife",name:"Photography Life: Nikon Z 28mm f/2.8 review (page 2, lab tests)",url:"https://photographylife.com/reviews/nikon-z-28mm-f-2-8/2",kind:"measured",tested_on:"Nikon Z7 (45.7MP), Imatest",date:null,findings:"Relatively weak at f/2.8, improves at f/4, strongest at f/5.6, then weakens gradually toward f/16 from diffraction. Chart values not readable. Moderate backward focus shift on stopping down. Fairly high field curvature. Vignetting above 2 stops in the extreme corners at f/2.8 at infinity, f/5.6–f/16 indistinguishable. Barrel distortion -2.39%. Lateral CA up to 1.94 px. A bit of coma, good overall. Bokeh 'really good'. 1:5 magnification."},{id:"phillipreeve",name:"Phillip Reeve: Review Nikon Nikkor Z 28mm f/2.8",url:"https://phillipreeve.net/blog/review-nikon-nikkor-z-28mm-f-2-8/",kind:"review",tested_on:"Nikon Z7 II (45.7MP), plus a DX body for the APS-C results",date:null,findings:"Infinity FX: center excellent at f/2.8, peak f/8. Corners very sharp but lower contrast, improved by f/4. Slight diffraction softness from f/16. DX: excellent corner to corner, diffraction at f/11. Portrait distance: very good at f/2.8 and excellent at f/4. Close-up: very soft and low contrast at f/2.8, much better at f/4, excellent at f/5.6, peak f/8, slight softening at f/11. Vignetting (off) 2.5/2.0/1.7/1.5/1.5 EV at f/2.8–f/11. Almost no focus breathing. Distortion virtually none corrected, moderate barrel uncorrected. Big flare problems with the sun in frame at some angles. Poor sunstars. Slight coma, Milky Way usable. Says the SE is optically identical. Says there is no weather sealing."},{id:"hogan",name:"Thom Hogan (Sans Mirror): Nikon 28mm f/2.8 lens review",url:"https://sansmirror.com/lenses/lens-reviews/lenses-for-nikon-z/nikon-28mm-f28-lens-review.html",kind:"review",tested_on:"Nikon Z body, not named in the text (an image filename suggests a Z7 II)",date:null,findings:"Strong center. DX area very good wide open. FX corners fair-to-good, never fully tightening, mainly from field curvature. Distance performance better than close-up. 1:5 max magnification ('meh'). Pincushion uncorrected. Strong FX corner vignetting, with over 1 EV left at default Vignette Control. LoCA visible wide open and at f/4, worse close. Lateral CA well corrected. Onion-ring bokeh. Flare one of its better traits. Small breathing. Focal plane moves backward when stopping down, fine up to about f/5.6 with AF. SE has identical optics. No recommendation because of corner issues. Spec page (https://sansmirror.com/lenses/lens-database/lenses-from-camera-makers/nikon-z-mount-lenses/nikkor-z-28mm-f28-2.html): plastic mount, dual AF motors, internal focus, no hood. The SE differs only in ring textures and a silver ring."},{id:"nikon_spec_se",name:"Nikon: NIKKOR Z 28mm f/2.8 (SE) product page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_28mmf28_se/",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.19 m. 0.2×. About 160 g. 52 mm filter. 7 rounded blades. 9 elements in 8 groups (2 aspherical). f/16 minimum. 71.5 × 43 mm. Designed for dust and drip resistance (not guaranteed)."},{id:"nikon_spec_std",name:"Nikon: NIKKOR Z 28mm f/2.8 product page (standard version, for comparison)",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_28mmf28/",kind:"manufacturer",tested_on:null,date:null,findings:"Same optical specs as the SE: 9 elements in 8 groups (2 aspherical), 0.19 m, 0.2×, 7 rounded blades, f/16, 52 mm filter, 43 mm long. Differs only in weight (about 155 g) and diameter (70 mm)."},{id:"nikon_fw",name:"Nikon firmware 1.10 for NIKKOR Z 28mm f/2.8 and 28mm f/2.8 (SE), via Photography Life forum",url:"https://downloadcenter.nikonimglib.com/en/download/fw/537.html",kind:"manufacturer",tested_on:null,date:null,findings:"Linked from https://photographylife.com/forum/nikon/lens-firmware-updates-for-nikkor-28mm-f-2-8-40mm-f-2-and-28-75mm-f-2-8: firmware 1.10 (SE: fw/537, standard: fw/536) adds 'Focus ring rotation range' linear options. The Nikon page itself was not fetched."},{id:"frost_video",name:"Christopher Frost (YouTube): Nikon Z 28mm f/2.8 (SE) lens review with samples",url:"https://www.youtube.com/watch?v=_zihXBSQIVM",kind:"video",tested_on:"Not readable",date:null,findings:"Only the title and channel were confirmed (YouTube oEmbed). Video content was not readable, so no findings are used."}],Hm={url:"https://www.youtube.com/watch?v=_zihXBSQIVM",access:"title-only",summary:"YouTube oEmbed confirms the title 'Nikon Z 28mm f/2.8 (SE) lens review with samples' by Christopher Frost. The watch page, description and transcript could not be fetched, so his verdict is unknown and not used."},Wm="1) SE vs standard: Nikon's two product pages list identical optics (9/8, 2 aspherical, 0.19 m, 0.2×, 7 rounded blades, f/16, 52 mm), and Reeve and Hogan both state the SE is optically identical. Lenstip tested a lens it labels '28 mm f/2.8 (SE)'. Differences are cosmetic plus 5 g and 1.5 mm diameter. 2) Follow-up search added Lenstip (Z7) and Photography Life (Z7) lab data, and confidence was raised from low to high. 3) Center peak: Lenstip and Photography Life say f/5.6, Reeve f/8. f/5.6 is used, with sweet spot f/5.6–f/8. 4) Wide-open center: Reeve calls it 'excellent' at f/2.8, while Lenstip (56 lp/mm, well above decency but far from the 75 peak) and Photography Life ('relatively weak') are less positive. The measured view is used. 5) Distortion: barrel per Photography Life (-2.39%) and Reeve. Hogan's 'pincushion' is treated as an outlier. 6) Flare: Lenstip and Hogan say OK, Reeve saw strong flare with the sun in frame at some angles. Both are reported. 7) Weather sealing: Nikon describes a dust and drip resistant design (not guaranteed). Reeve says none. 8) Close-up sharpness is not lab-measured. It comes from Reeve and Hogan. 9) Not on Nikon's Z TC-1.4x compatible list.",jm={id:ym,name:km,short:Im,mount:Fm,adapter:Sm,coverage:Zm,kind:Pm,focal_mm:Am,max_aperture:Cm,min_aperture_f:Nm,aperture_blades:zm,rounded_blades:xm,weight_g:Rm,filter_mm:Dm,focus:Lm,stabilization:Mm,close_focus:Om,quick:Tm,character:Em,field_tips:Vm,body_notes:$m,tc_compatible:Xm,sources:Bm,chris_frost:Hm,research_notes:Wm},Gm="z-40-f2",Km="NIKKOR Z 40mm f/2",Um="Z 40 f/2",qm="Z",Jm=null,Qm="FX",Ym="prime",eu=[40],tu=[{focal_mm:40,f:2}],ou=16,nu=9,iu=!0,su=170,au=52,ru={on_z_body:"AF",cpu:!0,motor:"Stepping motor (STM). Acceptably fast, very accurate and fairly quiet (Phillip Reeve). Silent and accurate (Lenstip).",focus_throw_deg:null,notes:"Single focus-by-wire ring, no AF/MF switch. Lens firmware 1.10 (40mm f/2 and 40mm f/2 SE) adds linear focus-ring rotation options. Focus shift: stopping down from f/2 moves the plane of focus behind the subject (Photography Life; Reeve sees it going from f/2 to f/2.8). Pronounced field curvature (Photography Life). Plastic mount (Lenstip, Reeve)."},lu={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"No optical VR. Body IBIS on the Z8 and Z5 II. None on the Z50 II."},cu={mfd_m:[{focal_mm:40,value:.29}],max_mag:[{focal_mm:40,value:.17}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 0.29 m from the focal plane, 0.17× (Nikon). Photography Life: just over 1:6. A useful close-up for food and details, not macro. Working distance not published."},du={headline:"Tiny, light 40 that needs stopping down: soft-ish and low-contrast at f/2, good by f/2.8–f/4, peaks at f/5.6, and corners never reach excellent.",sweet_spot:"f/5.6–f/8",wide_open:"Center fair at f/2 (Lenstip Z7: 42.8 lp/mm, right at its decency level). Edges blurry near maximum aperture (Lenstip con). Reeve (Z7 II): center very good, mid good, corners just OK at f/2. Strong FX vignetting (Reeve 2.3 EV) and coma at f/2.",by_focal:[{focal_mm:40,center_peak:"f/5.6",corners_peak:"f/5.6–f/8",wide_open_note:"Lenstip (Z7, 45.7MP) center: 42.8 lp/mm at f/2, above 50 at f/2.8, 70 at f/4, peak 75.3 at f/5.6. Edges lag the center and only just pass 50 lp/mm around f/5.6. Reeve: peak at f/5.6, unchanged at f/8. Corners good at f/2.8 and very good at f/5.6–f/8, never excellent. Photography Life (Z7): weak at f/2–f/2.8, much sharper at f/4–f/5.6, corners strong f/5.6–f/11. Midframe at f/4 can look worse than corners because of field curvature."}],close_up_best:"f/5.6–f/8",close_up_note:"Reeve (Z7 II) close-up: good sharpness but low contrast at f/2, peak at f/5.6, no clear change at f/8. Because of the backward focus shift and curved field (Photography Life), refocus or confirm with magnified view at the shooting aperture. f/2 close-ups give a soft, glowy look rather than crisp detail.",diffraction_note:"Reeve (Z7 II): small, negligible diffraction hit at f/11, more obvious at f/16, especially in the corners. Photography Life (Z7): gradual loss at f/11 and f/16.",avoid:["Don't expect crisp FX corners below f/5.6. They never become excellent.","Avoid f/16 on the Z8.","Don't focus wide open and then stop down for critical close work: focus shifts backward.","Flat subjects (documents, walls) at f/2–f/4: field curvature softens part of the frame."],confidence:"high",confidence_reason:"Lenstip (Z7, center numbers readable), Photography Life (Z7) and Phillip Reeve (Z7 II) all agree on a weak f/2, a big gain by f/4, a peak around f/5.6 and corners that stay behind. Edge lp/mm per aperture is only in a Lenstip chart image."},mu={bokeh:"Soft and pleasant at close range (Reeve). At medium and long distance the background can look busy. Highlights have sharply defined edges with LoCA fringing (Photography Life). Bokeh balls go polygonal from about f/2.8 (Reeve), despite Nikon's rounded blades.",flare_sunstar:"Fairly good flare resistance, not S-line level (Reeve). Lenstip: sensible against bright light. Reeve: no nice sunstars.",ca:"Lateral CA low (Photography Life: low at all apertures. Lenstip: slight. Reeve: very well corrected). LoCA: Reeve and Photography Life see it wide open (gone by f/5.6 per Reeve), while Lenstip rates it negligible.",distortion:"Very low barrel: Photography Life 0.62%. Lenstip: practically zero. Reeve: mild, +2 in Lightroom fixes it.",vignetting:"High on FX: Reeve 2.3 / 1.5 / 1.3 / 1.1 / 0.9 EV at f/2 / 2.8 / 4 / 5.6 / 8. Photography Life: about 2 stops at f/2 at infinity. Lenstip: significant on FX, slight on DX.",coma_astro:"Coma at f/2, improving at f/2.8 and gone by f/4 (Reeve). Lenstip: 'a bit too high'. Photography Life (Z7): solid but not stunning. Not an astro first choice.",focus_breathing:"Reeve: only a very small amount. Nikon claims focus-breathing reduction for movies (no number).",other:"6 elements in 4 groups, 2 aspherical (Nikon). Plastic barrel and mount (Lenstip, Reeve), dust and drip resistant (Nikon, not guaranteed). No fluorine front coat (Reeve)."},uu=["Default to f/4–f/5.6 for anything that needs detail. Save f/2 for low light and a softer, glowing look.","For landscapes and architecture, use f/5.6–f/8. Corners are 'very good' there but never excellent.","Focus shifts backward when stopping down. For close subjects, focus at your working aperture or nudge focus slightly forward when shooting f/2.8–f/4 after focusing wide open.","Field curvature is pronounced: with off-center subjects at wide apertures, place the AF point on the subject itself rather than focusing and recomposing.","On the Z50 II it is a light 60mm-equivalent, and the DX crop avoids the weak corners and heavy FX vignetting. There is no IBIS, so keep shutter speeds up."],hu=[{body:"z8",note:"45.7MP shows the soft f/2 corners and low contrast clearly (Lenstip Z7, Reeve Z7 II, Photography Life Z7 are all 45MP). Peak f/5.6. Diffraction negligible at f/11 and visible at f/16."},{body:"z5ii",note:"24.5MP is more forgiving of wide-open softness per pixel. f/2.8–f/4 should look good in the center, but corners still benefit from f/5.6–f/8 (inference from pixel pitch)."},{body:"z50ii",note:"DX (about 60mm-equivalent): Lenstip found slight vignetting on DX. The DX crop excludes the weakest FX corners. No IBIS."}],fu=!1,pu=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor Z 40 mm f/2.0 (resolution and summary chapters)",url:"https://www.lenstip.com/620.4-Lens_review-Nikon_Nikkor_Z_40_mm_f_2.0_Image_resolution.html",kind:"measured",tested_on:"Nikon Z7 (45.7MP), RAW via dcraw",date:null,findings:"Decency level 41–43 lp/mm. Center 42.8 lp/mm at f/2, over 50 at f/2.8, 70 at f/4, peak 75.3 at f/5.6. Edges blurry wide open and only just over 50 lp/mm near f/5.6. Edge values otherwise only in a chart. Summary (https://www.lenstip.com/620.11-Lens_review-Nikon_Nikkor_Z_40_mm_f_2.0_Summary.html) pros: very good center, negligible LoCA, slight lateral CA, practically zero distortion, low astigmatism, slight DX vignetting, sensible against bright light, silent accurate AF. Cons: blurry edges near max aperture, significant FX vignetting, a bit too high coma, plastic mount and barrel."},{id:"photographylife",name:"Photography Life: Nikon Z 40mm f/2 review (page 2)",url:"https://photographylife.com/reviews/nikon-z-40mm-f-2/2",kind:"measured",tested_on:"Nikon Z7 (45.7MP)",date:null,findings:"A bit weak at f/2 and f/2.8, substantially sharper at f/4 and f/5.6. Corners strong at f/5.6–f/11. Midframe at f/4 worse than corners because of pronounced field curvature. Gradual diffraction loss at f/11 and f/16. Focus migrates behind the subject when stopping down from f/2. Vignetting near 2 stops at f/2 at infinity. Distortion 0.62% barrel. Low lateral CA. Coma solid but not stunning. Highlights hard-edged with LoCA. MFD about 0.3 m, just over 1:6. Chart values not readable."},{id:"phillipreeve",name:"Phillip Reeve: Review Nikon Z 40mm f/2 – The Street Sniper for Discreet Photography",url:"https://phillipreeve.net/blog/review-nikon-z-40mm-f-2-the-street-sniper-for-discreet-photography/",kind:"review",tested_on:"Nikon Z7 II (45.7MP)",date:null,findings:"Infinity: center very good, mid good, corner just OK at f/2. Corners good at f/2.8 and very good at f/5.6–f/8, never excellent. Peak f/5.6, unchanged at f/8. Portrait distance f/2: center quite good, outer zones OK. f/5.6 excellent and very good. Close-up: good but low contrast at f/2, peak at f/5.6. Slight focus shift f/2 → f/2.8. Diffraction negligible at f/11, more at f/16. Coma at f/2, gone by f/4. LoCA wide open, gone by f/5.6. Vignetting 2.3/1.5/1.3/1.1/0.9 EV (f/2–f/8). Very small breathing. Fairly good flare resistance, no nice sunstars. Says the SE has the same optics, size and weight."},{id:"nikon_spec",name:"Nikon: NIKKOR Z 40mm f/2 product page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_40mmf2/",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.29 m. 0.17×. About 170 g. 52 mm filter. 9 rounded blades. 6 elements in 4 groups (2 aspherical). f/16 minimum. Dust and drip resistant (not guaranteed). Focus-breathing reduction for movies claimed."},{id:"pl_forum_fw",name:"Photography Life forum: lens firmware updates for NIKKOR Z 28mm f/2.8 and 40mm f/2",url:"https://photographylife.com/forum/nikon/lens-firmware-updates-for-nikkor-28mm-f-2-8-40mm-f-2-and-28-75mm-f-2-8",kind:"forum",tested_on:null,date:null,findings:"Firmware 1.10 for the 28mm f/2.8, 28mm f/2.8 (SE), 40mm f/2 and 40mm f/2 (SE) adds 'Focus ring rotation range' options (linear MF response). Release date not shown."}],gu={url:null,access:"not-found",summary:"No Christopher Frost review of the Z 40mm f/2 was found. YouTube-restricted searches returned 40mm reviews whose oEmbed authors are Richard Wong (dam5CebG-II), Avp Studios (ZYoyYz240Wo) and Markus Fahs (znU6ccLRt9M), none by Frost. Nothing is attributed to him."},bu="1) LoCA disagreement: Lenstip calls it negligible, while Reeve and Photography Life see visible fringing wide open. It is reported as visible wide open and gone by f/5.6. 2) Lenstip's text says the edges become 'decently good' near f/2.5 but also lists blurry edges near maximum aperture as a con and has edges only just over 50 lp/mm at f/5.6. The corner verdict leans on Reeve (very good at f/5.6–f/8, never excellent) and Photography Life (strong at f/5.6–f/11). 3) Rounded blades per Nikon, though Reeve sees polygonal highlights from f/2.8. 4) Not on Nikon's Z TC-1.4x compatible list, so tc_compatible is false. 5) This record is the standard 40mm f/2. Reeve states the SE version is optically identical, so the data applies to both. 6) Working distance not published.",wu={id:Gm,name:Km,short:Um,mount:qm,adapter:Jm,coverage:Qm,kind:Ym,focal_mm:eu,max_aperture:tu,min_aperture_f:ou,aperture_blades:nu,rounded_blades:iu,weight_g:su,filter_mm:au,focus:ru,stabilization:lu,close_focus:cu,quick:du,character:mu,field_tips:uu,body_notes:hu,tc_compatible:fu,sources:pu,chris_frost:gu,research_notes:bu},_u="z-50-f18-s",vu="NIKKOR Z 50mm f/1.8 S",yu="Z 50 f/1.8 S",ku="Z",Iu=null,Fu="FX",Su="prime",Zu=[50],Pu=[{focal_mm:50,f:1.8}],Au=16,Cu=9,Nu=!0,zu=415,xu=62,Ru={on_z_body:"AF",cpu:!0,motor:"Stepping motor (STM) with internal focusing, focus-by-wire control ring. Silent and accurate (Lenstip).",focus_throw_deg:null,notes:"No AF/MF switch on the barrel. The single ring can be set to focus or to aperture/exposure compensation in the camera menu. Focus shift: OpticalLimits saw a small amount when stopping down (Z50, DX), Photography Life 'very minimal', and Phillip Reeve none visible (Z7 II)."},Du={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"No optical VR. Body IBIS on the Z8 and Z5 II. No stabilization on the Z50 II. Synchro VR needs lens VR, so it does not apply."},Lu={mfd_m:[{focal_mm:50,value:.4}],max_mag:[{focal_mm:50,value:.15}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 0.40 m from the focal plane, 0.15× (Nikon). That is not a close-up lens, so the effective-aperture loss at 0.15× is small (about 0.2 stop by the simple (1+m)² rule, a calculation, not a spec). Free working distance is not published and was not measured by any source found."},Mu={headline:"One of the sharpest 50s tested: f/1.8 is already excellent in the center, the whole frame peaks around f/2.8–f/4, and it stays sharp down to MFD.",sweet_spot:"f/2.8–f/5.6",wide_open:"Center is outstanding at f/1.8 (Lenstip Z7: over 70 lp/mm. Phillip Reeve Z7 II: 'phenomenal'). FX corners are only fair wide open. Lenstip had them a little below its decency level at f/1.8–f/2, reaching it near f/2.2, and Reeve rated them 'good'. Heavy FX vignetting wide open (Reeve 2.2 EV).",by_focal:[{focal_mm:50,center_peak:"f/2.8–f/4",corners_peak:"f/4–f/5.6",wide_open_note:"Lenstip (Z7, 45.7MP): center peak 83.7 lp/mm at f/4 (excellent-prime territory). DXOMARK (Z7): overall peak at f/2.8, 37 P-Mpix. Photography Life: slightly better at f/2.8 in the center on its second copy. Reeve (Z7 II): everything peaks at f/4 with excellent corners. Corners keep evening out to f/5.6 (DXOMARK: stopping down past the peak mainly improves uniformity)."}],close_up_best:"f/2.8–f/8",close_up_note:"Phillip Reeve (Z7 II) tested close-up: very good at f/1.8, excellent from f/2.8 through f/11, and only very good at f/16 from diffraction. No visible focus shift or field-curvature issues were reported there. There is no reason to stop down far for close-ups: f/2.8–f/8 covers peak sharpness, chosen by depth of field.",diffraction_note:"DXOMARK (Z7, 45.7MP): diffraction starts to cut sharpness around f/5.6–f/8 and is most visible from f/11. OpticalLimits (Z50, DX 20.9MP): resolution drops from f/8 onward. Reeve: close-up f/16 falls from excellent to very good.",avoid:["Avoid f/11–f/16 on the Z8 unless you need the depth of field.","Don't judge FX corners at f/1.8: stop to f/4 for edge-to-edge landscapes.","Don't expect smooth highlight bokeh in every scene: highlights can be defined, with faint onion rings and cat's-eyes off-center."],confidence:"high",confidence_reason:"Lenstip (Z7), DXOMARK (Z7), Photography Life and Phillip Reeve (Z7 II) all agree on excellent f/1.8 center, peak f/2.8–f/4 and weaker FX corners wide open. Corner peak aperture is from Reeve plus DXOMARK's uniformity note, because the Lenstip FX-edge numbers are in an unreadable chart image."},Ou={bokeh:"Smooth, soft backgrounds (OpticalLimits). Reeve: evenly lit bokeh balls without colored edges, faint onion-ring texture, cat's-eyes toward the corners ('Pass with Special Distinction'). Photography Life found highlights rather defined, not a sign of great bokeh. Lenstip: 'pleasing to the eye'.",flare_sunstar:"Good flare resistance (Lenstip 'good', Reeve 'very good'). 9 rounded blades give 18-point sunstars, decent from f/11 and better at f/16 (Reeve).",ca:"Lateral CA negligible: Lenstip 'negligible', Reeve 'virtually non-existent', DXOMARK about 1 px at f/1.8. LoCA: Lenstip 'moderate', OpticalLimits 'fairly low', Reeve 'negligible'.",distortion:"Very low barrel: DXOMARK 0.2%, OpticalLimits about 0.4% (Z50 DX), Photography Life 0.57%, Lenstip 'invisible'.",vignetting:"Strong on FX wide open: Reeve 2.2 EV at f/1.8, 1.3 EV at f/2.8, 0.9 EV from f/4. Photography Life up to 1.65 stops. Lenstip lists FX vignetting as its one con. Small on DX (OpticalLimits about ¾ stop on the Z50).",coma_astro:"Reeve: very good at f/1.8 though not perfect, gone by f/2.8. Lenstip: no astigmatism problems. Usable for wide-open night shots with stars near center (inference).",focus_breathing:"Reeve: none visible. Nikon lists the lens for movie focus-breathing compensation (camera feature). No source gave a number.",other:"Weather-sealed, mostly metal barrel (Lenstip). Larger and heavier (415 g) than older F-mount 50/1.8s."},Tu=["Shoot f/1.8–f/2.8 for people and centered subjects without hesitation. The center is already excellent wide open.","For landscapes or groups across the frame, use f/4–f/5.6. FX corners only catch up there.","On the Z8 stay at f/8 or wider when you can. Diffraction shows from about f/5.6–f/8 and clearly from f/11.","Leave vignetting correction on, or plan to fix about 2 EV of corner falloff at f/1.8 in raw.","On the Z50 II it frames like a 75mm portrait lens with excellent edge-to-edge DX results from f/1.8, but there is no stabilization, so keep shutter speeds up."],Eu=[{body:"z8",note:"45.7MP is what Lenstip, DXOMARK (Z7) and Reeve (Z7 II, 45.7MP) tested on. Peak f/2.8–f/4, with diffraction visible from about f/8 and clearly at f/11."},{body:"z5ii",note:"24.5MP: wide-open corner weakness and diffraction are less visible per pixel, so f/1.8–f/8 all look sharp and f/11 is fine (inference from pixel pitch)."},{body:"z50ii",note:"DX (about 75mm-equivalent): uses only the strong central region. OpticalLimits on a Z50 (20.9MP DX): excellent across the frame from f/1.8, diffraction from f/8. Lenstip: very good DX edge, usable at f/1.8, about 65 lp/mm stopped down. No IBIS."}],Vu=!1,$u=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor Z 50 mm f/1.8 S (resolution and summary chapters)",url:"https://lenstip.com/577.4-Lens_review-Nikon_Nikkor_Z_50_mm_f_1.8_S_Image_resolution.html",kind:"measured",tested_on:"Nikon Z7 (45.7MP), RAW via dcraw",date:null,findings:"Center over 70 lp/mm at f/1.8, peak 83.7 ±0.9 lp/mm at f/4 (decency level 42–44, excellent primes 80–85). DX edge usable at f/1.8–f/2, about 65 lp/mm stopped down. FX edge slightly below decency at f/1.8–f/2, reaching it near f/2.2. FX edge numbers only in a chart. Summary (https://www.lenstip.com/577.11-Lens_review-Nikon_Nikkor_Z_50_mm_f_1.8_S_Summary.html): sensational center, very good DX edge, acceptable FX edge, moderate LoCA, negligible lateral CA, invisible distortion, good against bright light, pleasing bokeh. Con: distinct vignetting on FX."},{id:"dxomark",name:"DXOMARK: Nikon Nikkor Z 50mm F1.8 S lens review",url:"https://www.dxomark.com/nikon-nikkor-z-50mm-f1-8s-lens-review/",kind:"measured",tested_on:"Nikon Z7 (45.7MP)",date:null,findings:"Score 44. Sharpness 37 P-Mpix (Otus 55: 33). T1.9. Distortion 0.2% barrel. Lateral CA about 1 px at f/1.8. Sharpness good at f/1.8, peaks at f/2.8. Stopping down further mainly improves uniformity. Diffraction starts around f/5.6–f/8 and is most noticeable from f/11. Corner vignetting stays near −0.5 EV beyond f/4."},{id:"photographylife",name:"Photography Life: Nikon Z 50mm f/1.8 S review (page 2)",url:"https://photographylife.com/reviews/nikon-z-50mm-f1-8-s/2",kind:"measured",tested_on:"Not stated on the page (chart values not readable)",date:null,findings:"'One of the sharpest lenses we have ever tested'. Second copy slightly best at f/2.8 in the center. Barrel distortion 0.57%. Vignetting max 1.65 stops at infinity, largely gone by f/2.8. Very minimal focus shift. Bokeh highlights rather defined."},{id:"phillipreeve",name:"Phillip Reeve: Review Nikon Nikkor Z 50mm f/1.8 S",url:"https://phillipreeve.net/blog/?p=58683",kind:"review",tested_on:"Nikon Z7 II (45.7MP), plus Z fc and Z f samples",date:null,findings:"Infinity: center phenomenal wide open, mid almost excellent, corners good, all peaking at f/4 with excellent corners. Portrait distance: excellent across the zones. Close-up: very good at f/1.8, excellent f/2.8–f/11, very good at f/16 (diffraction). No focus shift. Coma very good at f/1.8, gone by f/2.8. Negligible LoCA and lateral CA. 18-point sunstars from f/11. Vignetting 2.2/1.3/0.9 EV at f/1.8/f/2.8/f/4. No visible distortion. No focus breathing. Bokeh: onion rings faint, cat's-eyes toward corners. Visual chart tests, not lab numbers."},{id:"opticallimits",name:"OpticalLimits: Nikkor Z 50mm f/1.8 S review (APS-C test)",url:"https://opticallimits.com/nikon/nikkor-z-50mm-f-1-8-s-review/",kind:"measured",tested_on:"Nikon Z50 (20.9MP DX)",date:null,findings:"Excellent resolution across the whole DX frame from f/1.8. Diffraction lowers results from f/8. Barrel distortion about 0.4% (about 0.16% corrected). Vignetting about ¾ stop wide open on DX. Lateral CA just under 0.3 px. Fairly low LoCA. Small focus shift on stopping down. Very smooth bokeh. Scores 10 optical, 9 build, 10 value. MTF values are in a chart image."},{id:"nikon_spec",name:"Nikon: NIKKOR Z 50mm f/1.8 S product page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_50mmf18s/",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.4 m. 0.15×. About 415 g. 62 mm filter. 9 rounded blades. 12 elements in 9 groups. f/16 minimum. No VR. Page mentions focus-breathing compensation for movies."},{id:"frost_video",name:"Christopher Frost (YouTube): Nikkor Z 50mm f/1.8 S lens review with samples (Full-frame & APS-C)",url:"https://www.youtube.com/watch?v=i-PqTvcS1r0",kind:"video",tested_on:"Full-frame and APS-C Nikon Z bodies per the title (models not readable)",date:null,findings:"Only the title and channel were confirmed (YouTube oEmbed). Video, description and transcript could not be read, so none of his findings are used."}],Xu={url:"https://www.youtube.com/watch?v=i-PqTvcS1r0",access:"title-only",summary:"The video exists: YouTube's oEmbed returns the title 'Nikkor Z 50mm f/1.8 S lens review with samples (Full-frame & APS-C)' with author 'Christopher Frost'. The watch page, description and transcript could not be fetched (client error), and no transcript or write-up was found by search. His verdict is unknown and is not used."},Bu="1) Center peak: Lenstip f/4 (83.7 lp/mm), DXOMARK f/2.8, Photography Life f/2.8, Reeve f/4. Recorded as f/2.8–f/4. The difference is about one stop and all were on 45MP bodies. 2) Corner peak f/4–f/5.6 relies on Reeve (excellent at f/4) and DXOMARK (uniformity improves past the peak). Lenstip FX-edge per-aperture values are in a chart image that could not be read. 3) OpticalLimits tested only on DX (Z50), so its 'excellent from f/1.8' applies to the DX frame and is not used for FX corners. 4) LoCA disagreement: Lenstip moderate, OpticalLimits fairly low, Reeve negligible. All say it is minor. 5) Distortion figures vary 0.2–0.57% by method. All say low. 6) Working distance at MFD is not published, so it is null. 7) Nikon's Z TC-1.4x compatibility list does not include this lens (checked for the MC 105 record), so tc_compatible is false.",Hu={id:_u,name:vu,short:yu,mount:ku,adapter:Iu,coverage:Fu,kind:Su,focal_mm:Zu,max_aperture:Pu,min_aperture_f:Au,aperture_blades:Cu,rounded_blades:Nu,weight_g:zu,filter_mm:xu,focus:Ru,stabilization:Du,close_focus:Lu,quick:Mu,character:Ou,field_tips:Tu,body_notes:Eu,tc_compatible:Vu,sources:$u,chris_frost:Xu,research_notes:Bu},Wu="z-70-200-f28-vr-s",ju="NIKKOR Z 70-200mm f/2.8 VR S (original 2019 version)",Gu="70-200 f/2.8 VR S",Ku="Z",Uu=null,qu="FX",Ju="zoom",Qu=[70,200],Yu=[{focal_mm:70,f:2.8},{focal_mm:200,f:2.8}],eh=22,th=9,oh=!0,nh=1440,ih=77,sh={on_z_body:"AF",cpu:!0,motor:"Not stated on Nikon's spec page; not verified this session",focus_throw_deg:null,notes:"Weight is with tripod collar (Nikon: about 1,440 g; about 1,360 g without). Photography Life: no focus shift, no field curvature, zero focus breathing at any focal length, but not parfocal (refocus after zooming). OpticalLimits lists AF speed as 'not the fastest' and recommends the Mk II for action. Imaging Resource: AF slightly slower with the TC-1.4x, noticeably slower with the TC-2.0x. Mirrorlesscomparison (Z6/Z7): TC-1.4x did not noticeably slow AF in bird tests."},ah={lens_vr:!0,lens_vr_stops:5.5,synchro_vr:!0,ibis_on_ftz:null,notes:"Nikon: 5.5 stops CIPA (NORMAL mode, max telephoto, FX mirrorless). VR is controlled from the camera menu (no switch on the barrel per mirrorlesscomparison), with Normal and Sport modes, and works together with body IBIS. A Photography Life commenter saw framing 'jumps' in VR Normal on a Z8 burst that Sport avoided; the reply attributes it to VR recentering between frames (forum-weight). Synchro VR: supported. Nikon's lens firmware 1.20 added synchro VR (camera and lens VR synchronized), and Nikon's Synchro VR support article, as quoted on FredMiranda (Jan 2026), lists the Z8 and Z5 II among compatible bodies and this lens among compatible lenses (with an unexplained asterisk, probably the firmware requirement — inference). Make sure the lens is on firmware 1.20 or later (current 1.22) and keep body VR on. The Nikon article itself could not be fetched (robots-blocked), so this rests on a forum quote plus Nikon's firmware notes. The Z50 II has no IBIS, so lens VR is the only stabilization there."},rh={mfd_m:[{focal_mm:70,value:.5},{focal_mm:200,value:1}],max_mag:[{focal_mm:200,value:.2}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"Nikon: MFD 0.5 m at 70mm, 1.0 m at 200mm, max reproduction 0.2x. Photography Life: 1:5 at 200mm; 1:2.5 with the TC-2.0x. With the TC-1.4x, Nikon says the reproduction ratio is 1.4× the lens's, so about 0.28x at 280mm; Nikon adds that MFD with a teleconverter may differ from the lens documentation. Lens is about 220 mm long (Nikon), so free distance at 200mm MFD is roughly 1.0 m − 16 mm flange back − 220 mm ≈ 0.76 m minus the hood (arithmetic, not measured; field left null)."},lh={headline:"Sharp wide open at every focal length; f/4–f/5.6 is the bare-lens sweet spot. With the TC-1.4x at 280mm, f/4 is noticeably softer and f/5.6–f/8 (displayed) is very crisp.",sweet_spot:"f/4–f/5.6 (bare); f/5.6–f/8 displayed with TC-1.4x",wide_open:"Excellent. Lenstip (Z7): center over 80 lpmm at 70mm f/2.8, almost 72 at 135mm, over 66 at 200mm; FF edge above 50 lpmm wide open at all focal lengths (decency 41–43). DXOMARK (Z7): excellent sharpness wide open at all focal lengths, slight corner drop. OpticalLimits (45MP): center excellent from f/2.8; borders drop to 'very good' only at 200mm f/2.8.",by_focal:[{focal_mm:70,center_peak:"f/2.8–f/4",corners_peak:"f/4",wide_open_note:"Lenstip: center over 80 lpmm at f/2.8 (its peak). Photography Life: center peaks at f/2.8, corners already very good, f/4 best overall. Imaging Resource (Z7): f/2.8–f/8 nearly identical. Mirrorlesscomparison: razor sharp at f/2.8, corners excellent at f/4."},{focal_mm:105,center_peak:"f/2.8–f/4",corners_peak:"f/5.6",wide_open_note:"Photography Life: corners strongest at 105mm, very high at f/5.6. Mirrorlesscomparison: peak at f/2.8, corners near-perfect at f/5.6."},{focal_mm:135,center_peak:"f/4",corners_peak:"f/5.6",wide_open_note:"Lenstip: center almost 72 lpmm at f/2.8, over 76 at f/4; FF edge about 60. Imaging Resource: f/2.8 noticeably softer than f/4. DXOMARK: slight astigmatic softness at 135mm mainly wide open. Photography Life: corners extremely sharp at f/5.6."},{focal_mm:200,center_peak:"f/4",corners_peak:"f/4–f/5.6",wide_open_note:"Lenstip: center over 66 at f/2.8, slightly over 69 at f/4. Photography Life: f/2.8, f/4 and f/5.6 essentially equal; corners stable. Imaging Resource: slight softness at f/2.8 at 100%, better at f/4, f/5.6–f/8 identical. OpticalLimits: only at 200mm does f/4 slightly improve the corners."},{focal_mm:280,center_peak:"f/5.6–f/8 (displayed, with TC-1.4x)",corners_peak:"f/5.6–f/8 (displayed, with TC-1.4x)",wide_open_note:"TC-1.4x: Imaging Resource (Z7): at 280mm f/4 noticeably softer than bare 200mm f/2.8 but 'not too bad'; at f/5.6 very crisp, only slightly behind the bare lens. Digital Camera World (Zf, 24MP): center loses sharpness at large apertures, little difference at narrower apertures. Cameralabs (45MP): gradual softening at 280mm, not too bad. Mirrorlesscomparison: almost no loss vs bare."}],close_up_best:"f/4–f/5.6",close_up_note:"Mirrorlesscomparison: at MFD (0.5 m at 70mm, 1 m at 200mm) performance stays at the highest level, very sharp at f/2.8 and peaking at f/4; same behaviour with the TC-1.4x (crops at 98 and 280mm). Photography Life did not test close-focus sharpness. One visual source only, so medium-low confidence; f/5.6 adds depth of field at 0.2x without diffraction cost.",diffraction_note:"OpticalLimits (45MP): visible impact from f/8. Imaging Resource (Z7): noticeable at f/11 but usable; f/16–f/22 very soft. Mirrorlesscomparison: starts at f/11, more at f/16. Photography Life: softening at f/16. With the TC-1.4x, diffraction follows the displayed (effective) f-number, so displayed f/8 is the limit for detail on the Z8 (inference).",avoid:["Don't stop below f/8 bare (f/11 displayed with TC) on the Z8 unless you need the depth.","Don't shoot the TC-1.4x wide open (f/4 displayed) when you have light to spare: f/5.6 is clearly crisper (Imaging Resource).","Don't use the TC-2.0x on this lens for critical detail: soft at f/5.6, never crystal clear at f/8 (Imaging Resource)."],confidence:"high",confidence_reason:"Lenstip (Z7, MTF50 numbers), DXOMARK (Z7), OpticalLimits (45MP) and Photography Life (Imatest) agree it is sharp wide open with f/4–f/5.6 at or near peak. The TC-1.4x verdict rests on Imaging Resource (Z7, visual) and Digital Camera World (lab, 24MP Zf), which agree on 'softer wide open, near-bare when stopped down': medium for that row."},ch={bokeh:"Neutral and softer than expected for so sharp a lens (Photography Life); noticeable cat's-eye highlights, most at 200mm f/2.8 (Photography Life) and at 110mm in corners until f/5.6 (OpticalLimits). Slightly busy highlight interiors but smooth transitions, nearly no bokeh fringing (OpticalLimits). 9 rounded blades.",flare_sunstar:"Some ghosting into the sun, better at 70mm than 200mm; use the hood since sun just outside the frame can flare (Photography Life). Sunstars essentially absent (Photography Life).",ca:"Lateral CA very low: under ~1 px (Photography Life; OpticalLimits ~1 px); DXOMARK best of three compared, slight mid-frame CA at 200mm f/2.8. Axial CA basically absent (OpticalLimits). Important for moon limbs: almost no colour fringing.",distortion:"Low. DXOMARK: −0.1% at 70mm to +0.6% pincushion at 200mm; Photography Life: nearly 2% pincushion at 200mm (method difference). Profile removes it.",vignetting:"Photography Life uncorrected: about 1 stop at 70–85mm f/2.8, up to about 1.6 stops at 200mm infinity; halved at f/4, negligible from f/5.6. OpticalLimits: beyond 2 EV at 200mm f/2.8 RAW. DXOMARK: clears by f/8.",coma_astro:"Photography Life (Z7): barely visible at 70mm wide open, none at 200mm. Not an astro lens, but fine for moon and star-field tele shots.",focus_breathing:"None at any focal length (Photography Life).",other:"Not parfocal (refocus after zooming). Heavy (1.36 kg without collar). Superseded by the 2025 Mk II with faster AF; OpticalLimits still recommends the original for non-action work. Transmission about T3.1 (DXOMARK)."},dh=["Moonrise at 280mm (TC-1.4x on the Z8): shoot at displayed f/5.6–f/8, not f/4. The moon is only about 2.5 mm across on the sensor at 280mm (≈580 px on the Z8), so you'll crop; switch to DX crop for framing only if you want the 420mm-equivalent view.","With the TC-1.4x the lens is 98–280mm at f/4 max (Nikon: one stop lost); aperture readouts and EXIF show the effective value. Diffraction follows the displayed number, so keep it at or wider than f/8.","On a tripod for moonrise, focus manually on the moon's limb at maximum magnification; the lens has no breathing and no focus shift, so focus holds when you stop down, but it isn't parfocal, so refocus after any zoom change.","For bursts in VR Normal, framing can jump between frames as VR recenters; use VR Sport for steady framing during long sequences.","Close-ups: 0.2x at 200mm from 1 m; the TC-1.4x raises that to about 0.28x (Nikon: reproduction ratio ×1.4). Shoot f/4–f/5.6."],mh=[{body:"z8",note:"Measured data mostly on 45MP bodies (Lenstip, DXOMARK, Imaging Resource on Z7; OpticalLimits at 45MP), so verdicts apply directly. Bare: f/4–f/5.6; diffraction visible from about f/8. TC-1.4x at 280mm: f/5.6–f/8 displayed. Synchro VR supported (lens firmware 1.20+)."},{body:"z5ii",note:"24.5MP: f/2.8 softness at 135–200mm and TC f/4 softness are less visible per pixel; Digital Camera World's TC test on a 24MP Zf found little center difference once stopped down. f/11 is a safer working limit than on the Z8 (pixel-pitch inference)."},{body:"z50ii",note:"DX crop: 105–300mm equivalent bare, about 147–420mm equivalent with the TC-1.4x. Lenstip's APS-C edge is 60–70 lpmm from f/2.8 to f/5.6 with no weak points. No IBIS, so lens VR is the only stabilization."}],uh=!0,hh=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor Z 70-200 mm f/2.8 VR S, Image resolution",url:"https://www.lenstip.com/616.4-Lens_review-Nikon_Nikkor_Z_70-200_mm_f_2.8_VR_S_Image_resolution.html",kind:"measured",tested_on:"Nikon Z7 (45.7MP), RAW MTF50",date:null,findings:"Decency 41–43 lpmm; record ~85. Center: 70mm over 80 lpmm at f/2.8 (peak); 135mm almost 72 at f/2.8, over 76 at f/4; 200mm over 66 at f/2.8, slightly over 69 at f/4 (doesn't quite reach 70). APS-C edge about 60–70 lpmm f/2.8–f/5.6 at all focal lengths. FF edge above 50 lpmm wide open everywhere, about 60 at 135mm. Center better than the 24-70 f/2.8 S. No TC or diffraction comments in the text."},{id:"opticallimits",name:"OpticalLimits: Nikkor Z 70-200mm f/2.8 VR S review",url:"https://opticallimits.com/nikon/nikon-z/nikkor-z-70-200mm-f-2-8-vr-s/",kind:"measured",tested_on:"45MP-normalized results (body not named in fetched text)",date:null,findings:"Center excellent from f/2.8 across the zoom; borders excellent at 70–135mm, very good at 200mm f/2.8; corners very good at 70–135mm, f/4 slight improvement only at 200mm. Diffraction visible from f/8. Distortion none at 70mm, medium pincushion at long end. RAW vignetting beyond 2 EV at 200mm f/2.8, negligible from f/5.6. Lateral CA ~1 px; axial CA basically absent. Cat's-eye at 110mm until f/5.6. MFD 0.5–1 m, 0.2x. Teleconverter samples 'less tack sharp' (no test). Scores 8.5/9/9, 'Highly Recommended'; AF not the fastest, Mk II recommended for action."},{id:"dxomark",name:"DXOMARK: Nikon Nikkor Z 70-200mm F2.8 VR S lens review",url:"https://www.dxomark.com/nikon-nikkor-z-70-200mm-f2-8-vr-s-lens-review-great-performer-optically/",kind:"measured",tested_on:"Nikon Z7 (45.7MP)",date:null,findings:"Score 38 (second-best 70-200/2.8 in their database). Very high, uniform sharpness at almost every aperture; excellent at f/2.8 at all focal lengths including 200mm; slight corner drop at f/2.8; slight astigmatic softness at 135mm wide open; diffraction noticeable at f/22. Transmission about T3.1. Distortion −0.1% (70mm) to +0.6% (200mm). Vignetting heaviest at 200mm wide open, gone by f/8. Lateral CA very low; slight mid-frame CA at 200mm f/2.8."},{id:"photographylife",name:"Photography Life: Nikon Z 70-200mm f/2.8 VR S review, optical performance",url:"https://photographylife.com/reviews/nikon-z-70-200mm-f2-8-vr-s/2",kind:"measured",tested_on:"Imatest (body not named for sharpness); coma test on Z7",date:null,findings:"70mm: center peaks f/2.8, best overall f/4. 85mm: center highest f/2.8, best overall f/4. 105mm: strongest corners, very high at f/5.6. 135mm: corners dip slightly wide open, extremely sharp f/5.6. 200mm: f/2.8, f/4, f/5.6 essentially equal; corners stable. Diffraction softening at f/16. No focus shift, no field curvature, no focus breathing; not parfocal. 1:5 at 200mm; 1:2.5 with TC-2.0x. Uncorrected vignetting ~1 stop at 70–85mm f/2.8, ~1.6 stops at 200mm; negligible from f/5.6. Pincushion nearly 2% at 200mm. Lateral CA under ~1 px. Coma barely visible at 70mm, none at 200mm. Some ghosting into the sun; sunstars essentially absent. Bokeh neutral with cat's eye at 200mm f/2.8. Comments page (/6) has no TC test; a commenter reports VR Normal frame jumps on a Z8 burst."},{id:"imagingresource",name:"Imaging Resource: Nikon Z 70-200mm f/2.8 VR S Nikkor review (field test)",url:"https://imaging-resource.com/lenses/nikon/z-70-200mm-f2.8-vr-s-nikkor/review",kind:"review",tested_on:"Nikon Z7 (45.7MP) for sharpness; also Z5, Z6 II",date:"2020-12 (field test news item dated 2020-12-18)",findings:"70mm strong at f/2.8, f/2.8–f/8 nearly identical. 135mm f/2.8 noticeably softer than f/4. 200mm slight softness at f/2.8 at 100%, better at f/4, f/5.6 and f/8 identical. Corners very good at 70mm f/2.8, some softness at 135mm f/2.8 improved at f/4. Diffraction noticeable at f/11, f/16–f/22 very soft. TC-1.4x (98–280mm f/4): at 280mm f/4 noticeably softer than bare 200mm f/2.8 but not too bad; at f/5.6 very crisp, only slightly behind bare; AF slightly slower. TC-2.0x: soft at f/5.6, better at f/8 but never crystal clear; AF noticeably slower. MFD 50 cm, 0.2x."},{id:"dcw_tc",name:"Digital Camera World (Ben Andrews lab test, via inkl): Nikon claims its teleconverters don't degrade image quality – let's find out",url:"https://inkl.com/news/nikon-claims-its-teleconverters-don-t-degrade-image-quality-let-s-find-out",kind:"measured",tested_on:"Nikon Zf (24.5MP) with Z 70-200 f/2.8 VR S",date:null,findings:"TC-1.4x: center sharpness drops at large apertures, little difference at narrower apertures; corners reported to improve, by as much as 50% at f/4 (as published; the basis of comparison is not explained in the fetched text). TC-2.0x: center drop largest at maximum aperture (f/5.6), smaller but present stopped down; small corner loss. No absolute numbers."},{id:"cameralabs_tc",name:"Cameralabs: Nikon Z TC-1.4x / TC-2.0x teleconverter review, quality page",url:"https://cameralabs.com/nikon-z-tc-1-4x-tc-2-0x-teleconverter-review/2",kind:"review",tested_on:"45MP Nikon Z7 (implied; samples page states Z7)",date:null,findings:"Tested with the Z 70-200 f/2.8 VR S. Degradation slight up to 200mm; gradual, 'not too bad' softening at 280mm and 400mm. At 280mm, TC-1.4x at f/4 clearly sharper across the frame than TC-2.0x at f/5.6. Cropped to a 400mm view, the TC-2.0x is a bit sharper in the center, equal in the DX corner, softer in the FX corner. Siemens-star crops at f/4, f/5.6, f/8 with the 1.4x carry no text verdict."},{id:"mirrorlesscomparison",name:"Mirrorlesscomparison: Nikon Z 70-200mm 2.8, TC 1.4x, bird photography and more (pages 1–2)",url:"https://mirrorlesscomparison.com/stories/nikon-z-70-200mm-2-8-tc-1-4-birds/2/",kind:"review",tested_on:"Nikon Z6 and Z7 (also Z7 DX crop)",date:null,findings:"Bare: razor sharp from f/2.8; 85mm slightly soft wide open; corners near-perfect at f/5.6 (105–135mm); diffraction from f/11, more at f/16. TC-1.4x tested at 98–280mm: almost no loss vs bare (crops f/4–f/32 without per-aperture verdict). MFD performance at the highest level, very sharp at f/2.8, peak f/4; same with TC at 98 and 280mm. AF not noticeably slowed by the TC; bird keeper rates 83–96%. VR controlled in-camera (Normal/Sport); about 1/15 s at 200mm for ~50% keepers."},{id:"nikon_spec",name:"Nikon Imaging: NIKKOR Z 70-200mm f/2.8 VR S product/spec page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_70-200mmf28_vr_s/",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.5 m (wide), 1.0 m (tele); 0.2x; about 1,440 g with collar, 1,360 g without; 77 mm filter; 9 rounded blades; f/22 min; 21 elements/18 groups (6 ED, 2 aspherical, 1 fluorite, 1 SR), Nano Crystal and ARNEO; VR 5.5 stops CIPA; 89 × 220 mm. Motor, Synchro VR and TC compatibility not listed on the page."},{id:"nikon_tc14",name:"Nikon Imaging: Z TELECONVERTER TC-1.4x product/spec page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_tc_14x/",kind:"manufacturer",tested_on:null,date:null,findings:"Lists the Z 70-200 f/2.8 VR S as compatible. Focal length and reproduction ratio ×1.4; effective aperture reduced by one stop; MFD with TC may differ from lens documentation; AF/VR kept reliable with minimal degradation, but AF may fail or the focus indicator flicker depending on subject, light and focus point. Nikon publishes MTF charts for the 70-200 + TC-1.4x (no numbers in text). 220 g. Nikon Singapore's TC page (https://www.nikon.com.sg/nikkor-z-teleconverter-tc-1-4x) gives the same compatibility list."},{id:"dcw_z50ii",name:"Digital Camera World: Nikon Z50 II vs Nikon Z50",url:"https://www.digitalcameraworld.com/buying-guides/nikon-z50-ii-vs-nikon-z50",kind:"review",tested_on:null,date:null,findings:"Z50 II has no IBIS; relies on VR lenses for stabilized stills."},{id:"synchro_vr_forum",name:"FredMiranda forum thread 'Nikon IBIS + VR: Which lenses work & how?' (post #10, ekam, 2026-01-07) quoting Nikon support article 000066751",url:"https://www.fredmiranda.com/forum/topic/1922057/",kind:"forum",tested_on:null,date:"2026-01",findings:"Quotes Nikon's Synchro VR support article (https://www.nikonimgsupport.com/eu/BV_article?articleNo=000066751&ctry=gb&lang=en_GB, which could not be fetched: robots-blocked). Compatible cameras: Z9, Z8, Z6III, Z5II, Zf, ZR. Synchro VR runs when a compatible lens is on a compatible body with body stabilization on. Visible lens entries: Z 28-400 VR, Z 70-200 f/2.8 VR S (marked with an unexplained asterisk), Z 100-400 VR S, Z 400 f/2.8 TC VR S; the quoted list is truncated ('...Show more'), so absence of a lens proves nothing."},{id:"nikon_fw_122",name:"Nikon Download Center: NIKKOR Z 70-200mm f/2.8 VR S firmware 1.22",url:"https://downloadcenter.nikonimglib.com/en/download/fw/532.html",kind:"manufacturer",tested_on:null,date:null,findings:"Version 1.20 added Z 9 features including synchro VR ('Camera and lens VR are synchronized for improved vibration reduction'). 1.21 fixed focus-position display/recall beep issues; 1.22 improved focus tracking while zooming. Applies to lens firmware 1.10–1.21."}],fh={url:null,access:"not-found",summary:"One web search for a Christopher Frost review of the Z 70-200mm f/2.8 VR S returned no Frost video (results were Fstoppers, Photography Blog, Cameralabs, Lenstip, Photography Life, Shotkit, etc.). YouTube pages can't be fetched directly. Nothing here is attributed to him."},ph="1) Bare-lens verdict is well supported by four measured sources on 45MP bodies. Lenstip puts the center peak at f/2.8 (70mm) and f/4 (135/200mm); Photography Life says f/2.8–f/5.6 are essentially equal at 200mm. f/4–f/5.6 is used as the sweet spot because it covers corners at 105–135mm (f/5.6 per Photography Life and mirrorlesscomparison). 2) TC-1.4x: sources differ in degree. Imaging Resource sees a clear f/4 softening at 280mm and crisp f/5.6; mirrorlesscomparison sees almost no loss; DCW lab (24MP) sees a center drop wide open only; Cameralabs 'not too bad'. Verdict f/5.6–f/8 displayed for the Z8, medium confidence for that row. DCW's '50% better corners at f/4 with the 1.4x' is reported as published; its baseline is unclear. 3) Synchro VR set true: Nikon firmware notes (1.20 added synchro VR) plus Nikon support article 000066751 as quoted on FredMiranda listing Z8, Z5 II and this lens. The Nikon article could not be fetched directly (robots-blocked). 4) AF motor type not on Nikon's page; left as unverified. 5) Diffraction onset differs: OpticalLimits f/8, Imaging Resource/mirrorlesscomparison f/11, Photography Life f/16 — 45MP lab results point to f/8 onset with f/11 still usable. 6) Close-up best rests on one visual source. 7) TC magnification ×1.4 is from Nikon's TC-1.4x page. Moon-size figure is arithmetic (0.5° × 280mm), not sourced. 8) Chris Frost: not searched (budget), see chris_frost. 9) Distortion figures differ by method (DXOMARK 0.6% vs Photography Life ~2% at 200mm).",gh={id:Wu,name:ju,short:Gu,mount:Ku,adapter:Uu,coverage:qu,kind:Ju,focal_mm:Qu,max_aperture:Yu,min_aperture_f:eh,aperture_blades:th,rounded_blades:oh,weight_g:nh,filter_mm:ih,focus:sh,stabilization:ah,close_focus:rh,quick:lh,character:ch,field_tips:dh,body_notes:mh,tc_compatible:uh,sources:hh,chris_frost:fh,research_notes:ph},bh="z-dx-12-28-pz-vr",wh="NIKKOR Z DX 12-28mm f/3.5-5.6 PZ VR",_h="DX 12-28 PZ VR",vh="Z",yh=null,kh="DX",Ih="zoom",Fh=[12,28],Sh=[{focal_mm:12,f:3.5},{focal_mm:14,f:3.8},{focal_mm:16,f:4.2},{focal_mm:18,f:4.5},{focal_mm:20,f:4.8},{focal_mm:22,f:5},{focal_mm:24,f:5.3},{focal_mm:28,f:5.6}],Zh=16,Ph=7,Ah=!0,Ch=205,Nh=67,zh={on_z_body:"AF",cpu:!0,motor:"Stepping motor (STM), internal focus",focus_throw_deg:null,notes:"Minimum aperture is f/16 at 12mm and f/25 at 28mm (Nikon; Photography Life). Zoom and focus are both internal, so the length never changes (Nikon; DCW; Savazzi), which suits gimbals. The zoom ring is by-wire power zoom with 11 speed settings, about 0.5 s to 36 s end to end (DCW; Thom Hogan). It can also be driven by the ML-L7 remote, the MC-N10 grip or SnapBridge. There is no AF/MF switch: the control ring defaults to by-wire manual focus (Savazzi; Photography Life). The focal length resets at power-off unless 'Save zoom position (PZ lenses)' is on (Photography Life). AF is fast, accurate and effectively silent (Hogan; Amateur Photographer), but hesitates at very close range (AP) and slows in low light (Photography Life)."},xh={lens_vr:!0,lens_vr_stops:4.5,synchro_vr:null,ibis_on_ftz:null,notes:"Nikon rates the VR at 4.5 stops (CIPA, DX body, VR NORMAL, at 28mm). Ken Rockwell measured about 3¾ stops at 12mm and 3 stops at 28mm in real use. On the Z50 II (no IBIS) this lens VR is the only stabilisation for stills, which is why the lens has it (Photography Life). Synchro VR support was not confirmed by any source found, so it is null."},Rh={mfd_m:[{focal_mm:12,value:.19},{focal_mm:28,value:.19}],max_mag:[{focal_mm:28,value:.21}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD is 0.19 m from the focal plane at every focal length, and max magnification is 0.21x (1:4.8) (Nikon; Savazzi; Hogan; AP). Nikon does not say at which focal length 0.21x occurs. 28mm is assumed because the MFD is constant, so this is an inference. Hogan: at MFD at the wide end the frame is about 23 cm wide. The lens is only about 64 mm long, so the free working distance at 28mm MFD is roughly 0.19 m − 64 mm − about 16 mm flange ≈ 11 cm. This is arithmetic, not measured, so the field is null. Savazzi: at 19 cm the hood almost always casts a shadow into the frame."},Dh={headline:"Small power-zoom ultra-wide that is sharp wide open across the range. Shoot at any aperture to f/8, and stay at f/11 or wider on the Z50 II.",sweet_spot:"f/5.6–f/8",wide_open:"Good to excellent. Photography Life's lab says you can shoot at maximum aperture at any focal length without concern, with corners only slightly weaker at 12mm and the lens slightly weaker overall at 28mm. Hogan (Z30) and Rockwell (Z8 DX crop) agree: sharpness is flat from wide open, and corners hold up wide open.",by_focal:[{focal_mm:12,center_peak:"f/3.5–f/8",corners_peak:"f/5.6–f/8",wide_open_note:"Center at its best wide open (Savazzi, Z50 II, unchanged to f/11). Corners only slightly softer wide open (PL, Savazzi). Hogan saw a very small gain at f/5.6. Possible slight field curvature at 12mm (Hogan)."},{focal_mm:18,center_peak:"f/4.5–f/8",corners_peak:"f/5.6–f/8",wide_open_note:"Not reported separately. PL and Hogan describe the mid-range as consistent with the ends. Hogan rates the corners good+ from 12mm to 20mm. Inferred plateau."},{focal_mm:28,center_peak:"f/5.6–f/8",corners_peak:"f/5.6–f/8",wide_open_note:"Weakest focal length, but still good. PL: 'a little weaker at 28mm'. Hogan: center drops from excellent to very good, while corners are very good. Savazzi (Z50 II): no corner/center difference, and f/5.6 is as sharp as 12mm."}],close_up_best:"f/5.6–f/8 (inference)",close_up_note:"No source measured resolution at close focus. Rockwell calls it very sharp even wide open at close range (subjective, Z8 DX crop). At 0.21x, depth of field is shallow and field curvature at 12mm was suspected (Hogan), so f/5.6–f/8 at 28mm is a cautious inference. Remove the hood at MFD (Savazzi), and expect AF to hesitate very close (AP).",diffraction_note:"PL lab: values fall as you stop down to f/11 and f/16. Savazzi (Z50 II, 20.9MP): slight but detectable blur at f/16 at both 12mm and 28mm, unchanged through f/11. Rockwell (Z8 DX crop): softer from f/11. Treat f/11 as the last 'free' stop and f/16 as visibly soft.",avoid:["f/16–f/25 except for sunstars or slow shutter.","Shooting at 19 cm with the HB-112 hood on: it shades the frame.","Relying on the zoom ring for fast stills reframing: it is by-wire, and Rockwell found it lags fast turns."],confidence:"medium",confidence_reason:"One lab (Photography Life, numbers in chart images that could not be read) plus careful hands-on tests (Savazzi on the Z50 II, Hogan on the Z30, Rockwell on the Z8 DX crop). All agree the lens is flat from wide open to f/8–f/11. No Lenstip, OpticalLimits or PhotoReview numeric data exists. Close-up advice is inference."},Lh={bokeh:"Not assessed by sources found. Little background blur is possible at f/3.5–5.6 on an ultra-wide.",flare_sunstar:"Flare better than expected: typically one defined dot near the sun with faint reflections (PL). 7 rounded blades give moderately defined 14-point sunstars, best at f/11–f/16 (PL). Rockwell describes them as soft.",ca:"Lateral CA is low, under about 1 px and only near that at 12mm (PL). Under half a pixel (Hogan). Extremely little at all settings (DCW lab). Hogan saw some longitudinal CA on extreme-contrast edges.",distortion:"Very strong uncorrected barrel distortion at 12mm, close to fisheye (PL simulated −8.13%; DCW 'very severe' uncorrected). Z bodies always correct it in-camera, and Lightroom does too. After correction, it is virtually none (Hogan) with slight waviness at 12–18mm (Rockwell).",vignetting:"Uncorrected 2.45 stops at 12mm f/3.5 at distance (PL), and about 2 stops at 12mm that stopping down does not cure (Hogan). Minimal by 28mm and at f/5.6–f/11 (PL). PL recommends in-camera vignette control set to Medium or High.",coma_astro:"Not tested by any source found.",focus_breathing:"None at the wide end and slight at the long end (Rockwell). Very minor at tele and unnoticeable at wide (Hogan).",other:"Moiré: Savazzi saw colour moiré on window edges at 28mm f/5.6–f/11 on the Z50 II, which mostly disappeared at f/16. PL saw internal fogging in high humidity that cleared. Weather sealing conflict: Nikon/PL/Fstoppers say dust- and drip-resistant, Savazzi says not sealed, and Rockwell notes the plastic mount has no gasket."},Mh=["Turn on 'Save zoom position (PZ lenses)', or it returns to 12mm every power-on.","Set PZ speed low (of 11 settings) for smooth video zooms. For quick stills framing, expect the by-wire ring to trail fast turns.","Any aperture from wide open to f/8 is sharp. Use f/8–f/11 for depth of field and avoid f/16 unless you want sunstars (best f/11–f/16).","At 12mm, leave vignette control at Medium or High: about 2.5 stops of falloff wide open.","Close-ups at 19 cm: take the hood off, zoom to 28mm, use f/5.6–f/8, and use MF via the control ring if AF hesitates."],Oh=[{body:"z50ii",note:"Native body. 20.9MP (about 4.2 µm): Savazzi tested on exactly this body and found the center flat f/3.5–f/11 with a slight drop at f/16. No IBIS, so lens VR (4.5 stops) is the only stabilisation. Moiré possible at 28mm f/5.6–f/11 on fine repeating detail."},{body:"z8",note:"Auto DX crop, 19.4MP (4.35 µm), so per-pixel behaviour is essentially the same as on the Z50 II. Rockwell shot it this way: corners as sharp wide open as stopped down, and softer from f/11. The FX corners are not usable."},{body:"z5ii",note:"Auto DX crop leaves only about 10MP (computed 24.5MP / 1.5²). Diffraction is far less visible, so f/11 is fine. Weak on resolution: prefer the Z50 II or Z8 with this lens."}],Th=!1,Eh=[{id:"photographylife",name:"Photography Life: Nikon Z DX 12-28mm f/3.5-5.6 PZ VR review (pages 1–3)",url:"https://photographylife.com/reviews/nikon-z-dx-12-28mm-f-3-5-5-6-pz-vr/2",kind:"measured",tested_on:"Nikon DX Z body (not named in text); PL DX lab charts",date:"2024 (conclusion says 'as of mid-2024')",findings:"Sharpness 'really nice and consistent regardless of your aperture or focal length'. A little weaker at 28mm, corners 'a hair less sharp' at 12mm. Numbers decrease at f/11 and f/16 due to diffraction. Maximum aperture usable at any focal length, and the author would use f/5.6–f/11 on a tripod for depth of field. Lab numbers are in chart images that could not be read. Vignetting 2.45 stops at 12mm f/3.5, minimal f/5.6–f/11. Lateral CA under about 1 px. Distortion very high at 12mm (−8.13% simulation), auto-corrected. Flare better than expected. Sunstars clearest at f/11–f/16. Max mag 0.21x. Page 3: sharpest Z DX lens at these focal lengths (mid-2024), with sharper corners than the 16-50 at 16–18mm and about equal to the 18-140 at 18mm. Page 1: 205 g, weather sealing, internal zoom, no AF/MF switch, use 'Save zoom position', no appreciable PZ lag."},{id:"savazzi",name:"Enrico Savazzi: Nikon Z DX 12-28 mm f/3.5-5.6 PZ",url:"https://www.savazzi.net/photography/nikon-z-dx-12-28pz.html",kind:"review",tested_on:"Nikon Z50 II (20.9MP DX), handheld, visual crops",date:"2026-05",findings:"12mm: center at its best wide open and unchanged through f/11, with slight detectable blur at f/16. Corners slightly softer than center, 'hardly noticeably'. 28mm: f/5.6 as sharp as 12mm, unchanged to f/11, very slight loss at f/16, and no corner/center difference. Colour moiré at 28mm f/5.6–f/11, mostly gone at f/16. Measured maximum aperture by focal length: 12mm f/3.5, 14mm f/3.8, 16mm f/4.2, 18mm f/4.5, 20mm f/4.8, 22mm f/5, 24–26mm f/5.3, 28mm f/5.6. MFD 19 cm at all focal lengths, 0.21x, and the hood shadow almost always visible at MFD. Internal zoom and focus, by-wire rings. Says not weather-sealed, plastic mount."},{id:"hogan",name:"Thom Hogan (sansmirror/zsystemuser): Nikon 12-28mm f/3.5-5.6 DX Lens Review",url:"https://sansmirror.com/lenses/lens-reviews/lenses-for-nikon-z-dx/nikon-12-28mm-f35-56-dx.html",kind:"review",tested_on:"Nikon Z30 (20.9MP DX)",date:"2023-06-28",findings:"Center excellent at all focal lengths except 28mm (very good). Corners good+ at 12–20mm and very good at 28mm. Sharpness fairly flat from max aperture until diffraction, with a very small gain at f/5.6 at 12mm. Possible slight field curvature at 12mm. About 2 stops of uncorrected vignetting at 12mm. Lateral CA under 0.5 px. Corrected distortion virtually none. Focus breathing very minor at tele. 11 PZ speeds, no zoom lock. MFD 0.19 m, about 1:5, frame about 23 cm wide at MFD at the wide end. Rated Recommended."},{id:"kenrockwell",name:"Ken Rockwell: Nikon Z 12-28mm VR DX PZ review",url:"https://kenrockwell.com/nikon/z/12-28mm.htm",kind:"review",tested_on:"Nikon Z8 in DX crop (19.4MP)",date:"2024-04 (update)",findings:"Surprisingly sharp, corners as sharp wide open as stopped down, softens at f/11 and smaller from diffraction. Very sharp wide open at close range (subjective). No focus breathing at the wide end, slight at the long end. PZ responds with a slight delay and cannot keep up with fast ring turns. VR measured about 3¾ stops at 12mm and 3 stops at 28mm. Soft 14-point sunstars. Mount has no gasket. Slight residual waviness at 12–18mm after correction."},{id:"dcw",name:"Digital Camera World: Nikon Z DX 12-28mm f/3.5-5.6 PZ VR review (Matthew Richards)",url:"https://www.digitalcameraworld.com/reviews/nikon-z-dx-12-28mm-f35-56-pz-vr-review",kind:"measured",tested_on:"Imatest lab body not named; samples on Nikon Z30",date:"2023-06-01",findings:"Imatest charts are images, no readable values. Very strong sharpness at the widest apertures across the zoom including corners. Center excellent 12–24mm and drops a little at 28mm. Extremely little fringing. Uncorrected distortion very severe. 11 PZ speeds, about 0.5–36 s end to end. MFD 0.19 m, 0.21x."},{id:"ap",name:"Amateur Photographer: Nikon Z DX 12-28mm lens review (Amy Davies)",url:"https://amateurphotographer.com/review/nikon-z-dx-12-28mm-lens-review/",kind:"review",tested_on:"Nikon Z30 (some samples on Z6 II)",date:null,findings:"Sharp throughout the zoom range and across the frame, no per-aperture data. No visible CA. AF effectively silent but hesitates very close. MFD 0.19 m at all focal lengths, 0.21x."},{id:"nikon",name:"Nikon: NIKKOR Z DX 12-28mm f/3.5-5.6 PZ VR product page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_dx_12-28mmf35-56_pz_vr/",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.19 m (focal plane), max reproduction 0.21x, about 205 g, 67 mm filter, 7 blades rounded, f/3.5–5.6, min f/16–25, VR 4.5 stops (CIPA, DX, NORMAL, tele end), 12 elements in 11 groups (1 ED, 1 aspherical), 72 × 63.5 mm, angle of view 99°–53°."},{id:"fstoppers_frost",name:"Fstoppers (Alex Cooke): write-up of Christopher Frost's 12-28 video",url:"https://fstoppers.com/reviews/review-nikon-nikkor-z-dx-12-28mm-f35-56-pz-vr-lens-634773",kind:"video",tested_on:null,date:"2023-06-15",findings:"Article only embeds and introduces Frost's video. No test results transcribed. Lists stepping AF motor, dust and drip resistance, 4.5-stop VR, internal focus and zoom, 11 zoom speeds. Article author's own line: 'quite a nice lens for the price'."}],Vh={url:null,access:"title-only",summary:"Frost reviewed this lens (Fstoppers write-up by Alex Cooke, 15 June 2023, embeds his video). The video page itself could not be fetched (YouTube blocked), and no transcript or description was readable, so the exact video URL is unknown. A Rumble upload titled 'Nikon Z DX 12-28mm f/3.5-5.6 PZ VR lens review' also appeared in search but could not be opened. His verdict is not known and is not summarised here."},$h="1) No Lenstip, OpticalLimits, Lensrentals, TDP or PhotoReview test exists for this lens (searched). Photography Life's lab is the only measured sharpness source, and its numbers are in unreadable chart images, so only its text is used. 2) Test bodies: Savazzi used the Z50 II itself, Hogan the Z30 (same 20.9MP sensor class), and Rockwell the Z8 in DX crop, so the conclusions transfer directly. 3) PZ responsiveness conflict: PL says no appreciable lag, while Rockwell says a slight delay and it cannot keep up with fast turns. Both are reported. 4) Weather sealing conflict: Nikon, PL and Fstoppers say dust/drip resistant, Savazzi says not sealed, and Rockwell says no mount gasket. 5) Max magnification focal length not stated by Nikon. 28mm assumed. 6) Savazzi's summary text appeared to say the lens has no in-lens VR. That contradicts Nikon's spec (VR 4.5 stops) and was disregarded as a likely extraction error. 7) Synchro VR not confirmed: null. 8) tc_compatible false: Nikon Z teleconverters are only for specific S-line telephotos (general knowledge, not re-verified this session). 9) ephotozine's test page could not be fetched.",Xh={id:bh,name:wh,short:_h,mount:vh,adapter:yh,coverage:kh,kind:Ih,focal_mm:Fh,max_aperture:Sh,min_aperture_f:Zh,aperture_blades:Ph,rounded_blades:Ah,weight_g:Ch,filter_mm:Nh,focus:zh,stabilization:xh,close_focus:Rh,quick:Dh,character:Lh,field_tips:Mh,body_notes:Oh,tc_compatible:Th,sources:Eh,chris_frost:Vh,research_notes:$h},Bh="z-dx-16-50-vr",Hh="NIKKOR Z DX 16-50mm f/3.5-6.3 VR",Wh="DX 16-50 VR",jh="Z",Gh=null,Kh="DX",Uh="zoom",qh=[16,50],Jh=[{focal_mm:16,f:3.5},{focal_mm:50,f:6.3}],Qh=22,Yh=7,ef=!0,tf=135,of=46,nf={on_z_body:"AF",cpu:!0,motor:"STM (stepping motor), focus-by-wire",focus_throw_deg:null,notes:"Minimum aperture is f/22 at 16mm and f/40 at 50mm (Nikon). The lens retracts to about 32 mm long: the camera asks you to extend it before shooting, and it clicks in at 16mm (PL). PL notes that rotating slowly past the click gives a few mm wider than 16mm at an image-quality cost, and that focus resets at power-off. AF is fast and quiet (PL, PhotoReview, Hogan). It can be slow at 50mm in low light: Hogan puts the limit at about 0 EV at f/6.3. All-plastic build including the mount, with no weather gasket (Hogan). No hood is supplied (PhotoReview, PL)."},sf={lens_vr:!0,lens_vr_stops:4.5,synchro_vr:null,ibis_on_ftz:null,notes:"Nikon claims 4.5 stops at the tele end on a DX body. PL found it did a great job in low light. Not measured by any source found. On the Z50 II it is the only stabilisation. Synchro VR support was not confirmed, so it is null."},af={mfd_m:[{focal_mm:16,value:.25},{focal_mm:24,value:.2},{focal_mm:35,value:.23},{focal_mm:50,value:.3}],max_mag:[{focal_mm:50,value:.2}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD by focal length is from the Nikon spec as reproduced by PhotographyBlog and a dealer spec sheet. Nikon's own page lists only 0.2 m at 24mm. Max reproduction is 0.2x (Nikon). Its focal length is not stated, and 50mm is assumed (inference). PhotoReview: close focus is not great for close-ups, though workable at 50mm. PL: zoomed to 50mm and close, you get fairly decent background blur."},rf={headline:"Tiny pancake kit zoom: sharp center wide open at 16mm, corners need f/5.6. f/8 is a safe all-round setting, and stay at f/11 or wider.",sweet_spot:"f/5.6–f/8",wide_open:"Center excellent wide open at 16mm (PL, Hogan), and PhotoReview's Imatest found its best results at 16mm wide open. Corners at 16mm are fair to good wide open (field curvature, some coma per Hogan; PL) and improve noticeably at f/5.6. At 50mm f/6.3, the center drops to very good while the corners are good.",by_focal:[{focal_mm:16,center_peak:"f/3.5–f/4",corners_peak:"f/5.6–f/8",wide_open_note:"Center excellent wide open and barely better at f/4 (Hogan, PL). Corners weak wide open from field curvature, much better at f/5.6 (PL)."},{focal_mm:24,center_peak:"f/5.6",corners_peak:"f/5.6",wide_open_note:"Strong in the center and extreme corners. f/5.6 gives the best overall results (PL)."},{focal_mm:35,center_peak:"f/5.6",corners_peak:"f/5.6",wide_open_note:"Very good. f/5.6 again best center to corner (PL)."},{focal_mm:50,center_peak:"f/6.3–f/8",corners_peak:"f/6.3–f/8",wide_open_note:"Center resolution drops at the long end but the corners get sharper (PL). PL says to use maximum aperture unless you need more depth of field. Hogan: center very good, corners solidly good."}],close_up_best:"f/6.3–f/8 at 50mm (inference)",close_up_note:"No source measured sharpness at close focus. 0.2x at about 0.3 m (50mm) is a modest close-up. PL says 50mm is best used near wide open, and diffraction starts around f/8–f/11, so f/6.3–f/8 is a cautious inference. PhotoReview calls close-up ability not great.",diffraction_note:"Sources disagree. PhotoReview (Imatest, Z50): consistent to about f/8, with diffraction taking effect between f/10 and f/11. Hogan (Z50): visible diffraction softening starts between f/5.6 and f/8. PL: evenly good at f/8 across all focal lengths. Best-supported: f/8 is safe, f/11 shows a measurable loss, and f/16 and smaller should be avoided.",avoid:["f/16–f/40 on the Z50 II.","Wide open at 16mm when the corners matter: use f/5.6.","Shooting until the lens is fully extended and clicked to 16mm: slow-twisting past the click is softer."],confidence:"medium",confidence_reason:"Two labs on the Z50 (Photography Life Imatest, PhotoReview Imatest) plus Hogan on the Z50 agree on the 16mm center-sharp / corner-weak pattern and f/5.6 as the corner fix. The diffraction onset differs (Hogan f/5.6–f/8 vs PhotoReview f/10–f/11). No numbers are readable (chart images)."},lf={bokeh:"PhotoReview: smooth bokeh is hard at these apertures, with choppy bright spots and outlining, especially at short focal lengths. PL: decent background blur when close at 50mm.",flare_sunstar:"Flare and ghosting are well controlled (PL, PhotoReview, Hogan) even without a hood. Sunstars are 14-point but break up and dissipate. PL: 'definitely not the lens for' pretty sunstars.",ca:"Lateral CA is the most visible of Hogan's Z lenses: about 2 px at 24mm, 1.5 px at 35mm, about 1 px at 16mm, and not measurable at 50mm. PL (Imatest) agrees: about 1 px at 16mm, close to 2 px at 24–35mm, gone at 50mm. PhotoReview found it negligible in JPEG (corrected). Leave CA correction on.",distortion:"Uncorrected: 4.27% barrel at 16mm (PL Imatest), about 4% (Hogan), turning to pincushion from 24mm (Hogan about 2–3%). Always corrected in-camera.",vignetting:"Almost 2 stops at f/3.5 at 16mm (PL), about 1⅔ stops wide open (Hogan). Not a worry at f/5.6–f/6.3 (PL). Virtually none at 50mm (PhotoReview).",coma_astro:"Hogan saw some coma smearing in the 16mm corners wide open. Not an astro lens.",focus_breathing:"Negligible or not measurable (Hogan, who suspects firmware correction). Focus shift negligible.",other:"Slightly wider than 16mm uncorrected, with corrections bringing it to 16mm (Hogan). No hood fits by design (PL)."},cf=["Twist the barrel until it clicks at 16mm before shooting. It is softer if you creep past the click.","At 16mm, f/3.5–f/4 is fine for centred subjects. Use f/5.6 for edge-to-edge landscapes.","If unsure, use f/8 at any focal length: PL found it even across the range. Don't go past f/11.","At 50mm, shoot f/6.3 wide open unless you need depth of field. Get as close as 0.3 m for the best background blur.","In dim light at 50mm, AF slows (f/6.3). Zoom wider or use AF-assist."],df=[{body:"z50ii",note:"Native kit pairing. PL, PhotoReview and Hogan all tested on the Z50 (same 20.9MP class), so their findings apply directly. Lens VR is the only stabilisation."},{body:"z8",note:"Auto DX crop, 19.4MP (4.35 µm), essentially the same per-pixel behaviour as the Z50 II. A pointless pairing apart from size."},{body:"z5ii",note:"DX crop only about 10MP (computed). Usable as a pocket lens, but low resolution."}],mf=!1,uf=[{id:"photographylife",name:"Photography Life: Nikon Z DX 16-50mm f/3.5-6.3 VR review (Nasim Mansurov), pages 1–3",url:"https://photographylife.com/reviews/nikon-z-dx-16-50mm-f3-5-6-3-vr/2",kind:"measured",tested_on:"Nikon Z50 (20.9MP DX), Imatest",date:"updated 2024-01-27",findings:"16mm: center and mid excellent at f/3.5–f/4, corners somewhat weak from field curvature, noticeably better at f/5.6. 24mm: strong center and corners, f/5.6 best. 35mm: f/5.6 best center to corner. 50mm: center drops wide open but the corners get sharper, so use max aperture unless you need depth of field. Even performance at f/8 across all focal lengths: 'just stop it down to f/8'. Vignetting almost 2 stops at 16mm f/3.5. Distortion 4.27% barrel at 16mm, pincushion from 24mm. Lateral CA a bit over 1 px at 16mm, close to 2 px at 24–35mm, disappears at 50mm. Flare well controlled. Weak, dissipating 14-point sunstars. Page 3 (per the 18-140 review): slightly sharper than the 18-140 overall, but the 18-140 has better 18mm corners."},{id:"photoreview",name:"PhotoReview (Australia): Nikkor Z DX 16-50mm f/3.5-6.3 VR lens review (Margaret Brown)",url:"https://www.photoreview.com.au/reviews/mirrorless-lenses/mirrorless-lenses-aps-c/nikkor-z-dx-16-50mm-f-3-5-6-3-vr-lens/",kind:"measured",tested_on:"Nikon Z50 (20.9MP DX), Imatest JPEG plus raw",date:"2020-03-13",findings:"Best results at the shortest focal length and widest aperture (unusual). Very good for a kit lens and fairly consistent to about f/8, then declining. Diffraction takes effect between f/10 and f/11. No numbers in text. CA negligible in JPEG, slightly higher in raw. Slight barrel at 16mm and pincushion at 50mm (raw). Vignetting obvious wide open at 16mm and 24mm, virtually none at 50mm. MFD 25 cm at 16mm and 30 cm at 50mm, 0.2x, close-up not great. Bokeh choppy with outlining. Little flare. Score 8.8."},{id:"hogan",name:"Thom Hogan (sansmirror): Nikon 16-50mm f/3.5-6.3 DX Lens Review",url:"https://sansmirror.com/lenses/lens-reviews/lenses-for-nikon-z-dx/nikon-16-50mm-f35-63-lens.html",kind:"review",tested_on:"Nikon Z50 (20.9MP DX)",date:"2020 (page updated 2026-10-21)",findings:"16mm: center excellent wide open, peaking around f/4, corners fair to good (field curvature, some coma). Corners improve to good when zoomed. 50mm f/6.3: center very good, corners solidly good. Visible diffraction softening starts between f/5.6 and f/8. Distortion about 4% barrel at 16mm, about 2% pincushion at 24mm, about 3% at 35mm, about 2% at 50mm. Vignetting about 1⅔ stops wide open. Lateral CA about 2 px at 24mm, 1.5 px at 35mm, about 1 px at 16mm. Focus breathing negligible. Low-light AF at 50mm about 0 EV. Plastic mount, no gasket. Strong flare resistance. 'Outright bargain', Recommended."},{id:"nikon",name:"Nikon: NIKKOR Z DX 16-50mm f/3.5-6.3 VR product page",url:"https://imaging.nikon.com/imaging/lineup/lens/z-mount/z_dx_16-50mmf35-63_vr/",kind:"manufacturer",tested_on:null,date:null,findings:"MFD 0.2 m at 24mm, 0.2x, about 135 g, 46 mm filter, 7 rounded blades, f/3.5–6.3, min f/22–40, VR 4.5 stops (tele, DX), 9 elements in 7 groups (1 ED, 4 aspherical), 70 × 32 mm, retractable."},{id:"spec_sheet",name:"PhotographyBlog spec page (reproducing Nikon specifications)",url:"https://www.photographyblog.com/reviews/nikon_z_dx_16_50mm_f3_5_6_3_vr_review/specifications",kind:"manufacturer",tested_on:null,date:null,findings:"MFD from the focal plane: 0.25 m at 16mm, 0.2 m at 24mm, 0.23 m at 35mm, 0.3 m at 50mm. 0.2x. 135 g, 46 mm, 7 rounded blades. Matches the Carmarthen Cameras expanded spec sheet (https://carmarthencameras.com/pages/expanded-specifications-nikon-nikkor-z-dx-16-50mm-f3-5-6-3-vr-lens)."},{id:"fstoppers_frost",name:"Fstoppers (Alex Cooke): 'Tiny and Versatile', a write-up of Christopher Frost's 16-50 video",url:"https://fstoppers.com/gear/tiny-and-versatile-review-nikon-nikkor-z-dx-16-50mm-f35-63-vr-lens-502130",kind:"video",tested_on:null,date:"2020-07-26",findings:"Article only points to the embedded Frost video for his thoughts. No findings transcribed."}],hf={url:null,access:"title-only",summary:"Frost reviewed this lens (Fstoppers write-up by Alex Cooke, 26 July 2020, embeds his video). The video, its description and transcript could not be opened, and the Fstoppers article reports none of his findings. His verdict is unknown."},ff="1) No Lenstip, OpticalLimits, Lensrentals or TDP test exists for this lens. The measured sources are Photography Life and PhotoReview, both Imatest on the Z50, with numbers only in chart images. 2) Diffraction conflict: Hogan says visible softening from f/5.6–f/8, PhotoReview says f/10–f/11, and PL says f/8 is evenly good. f/8 is the safe ceiling for maximum detail, and f/11 is acceptable. 3) PL's 50mm wording is ambiguous: the center drops wide open, but they advise max aperture. Interpreted as little gain from stopping down at 50mm, so f/6.3–f/8. 4) Max-mag focal length assumed 50mm. 5) Weather sealing: Nikon page does not state any, and Hogan says no mount gasket. 6) Synchro VR: null (not confirmed).",pf={id:Bh,name:Hh,short:Wh,mount:jh,adapter:Gh,coverage:Kh,kind:Uh,focal_mm:qh,max_aperture:Jh,min_aperture_f:Qh,aperture_blades:Yh,rounded_blades:ef,weight_g:tf,filter_mm:of,focus:nf,stabilization:sf,close_focus:af,quick:rf,character:lf,field_tips:cf,body_notes:df,tc_compatible:mf,sources:uf,chris_frost:hf,research_notes:ff},gf="z-dx-18-140-vr",bf="NIKKOR Z DX 18-140mm f/3.5-6.3 VR",wf="DX 18-140 VR",_f="Z",vf=null,yf="DX",kf="zoom",If=[18,140],Ff=[{focal_mm:18,f:3.5},{focal_mm:140,f:6.3}],Sf=22,Zf=7,Pf=!0,Af=315,Cf=62,Nf={on_z_body:"AF",cpu:!0,motor:"STM (stepping motor)",focus_throw_deg:null,notes:"Minimum aperture is f/22

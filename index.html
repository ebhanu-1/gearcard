units, uneven across the frame. Photozone (D200 DX) says 'already very good at f/2'. Vignetting is about 0.75 stop at f/2 on FX (IR D3x). By f/2.8 the frame evens out (IR about 1.5 units) and portrait-distance performance is good across the frame (Reeve).",by_focal:[{focal_mm:105,center_peak:"f/4–f/5.6",corners_peak:"f/5.6",wide_open_note:"All tests are at the neutral DC setting. Photozone (D200): sweet spot around f/5.6. Imaging Resource (D200 + D3x): essentially tack-sharp across the frame at f/5.6. Phillip Reeve (42MP A7R II): at infinity, 'very good everywhere' by f/5.6, with traces of fringing at f/2.8. At 2.6 m, good across the frame at f/2.8. Better corners than the 105/1.4E and 105/2.5 Ai, which needed about f/11. Photography Life: the 105/1.4E is significantly sharper at all apertures (no numbers on the page read)."}],close_up_best:"f/4–f/5.6",close_up_note:"Reeve (42MP, 0.9 m, 1:7.3): soft at f/2, slight fringing at f/2.8, good from f/4. Residual spherical aberration (the very thing DC adjusts) means best-contrast and best-resolution focus differ slightly close up, so use magnified-view MF. Keep DC at 0 for close-ups unless you want the glow.",diffraction_note:"Imaging Resource (D3x, 24.5MP FX, about 5.9 µm): diffraction 'begins to set in very slightly' at f/11, still no more than 1.5 blur units at f/16. On the Z8 (4.35 µm) expect onset about one stop earlier, around f/8 (inference from pixel pitch, not measured). On the Z5 II, which matches the D3x pitch, f/11 is still fine.",avoid:["Don't set the DC number beyond the aperture you shoot (e.g. DC R4 at f/2) unless you want soft focus: it smears the focal plane (Reeve, Rockwell, IR, Photozone).","Don't change DC after focusing: the focus plane moves, so refocus every time.","Don't shoot bright, high-contrast edges at f/2 if fringing matters: LoCA is strong (Reeve). f/2.8 is much cleaner.","Don't use FRONT for portraits with busy backgrounds: it overcorrects spherical aberration and makes the background harsher (Nikon, Rockwell)."],confidence:"medium",confidence_reason:"Two measured sources (Photozone D200 DX, Imaging Resource D200/D3x blur index) and one 42MP visual test (Reeve) agree on soft-ish f/2, good f/2.8, peak about f/5.6. No measured MTF50 on a 36–45MP body was found, and DXOMARK's figures are only a headline score of uncertain body. The diffraction onset for the Z8 is inferred."},Yi={bokeh:"The reason to own it. Rockwell calls it extraordinary. Reeve finds it pleasing at neutral DC (preferred to the 85/1.4D) with the usual era fringing. REAR settings smooth the background further. Reeve: R2 at f/2 gives subtly smoother backgrounds with no notable sharpness cost, R2.8 at f/2 gives a stronger effect but softens the focal plane, and R4 adds no smoothness, only lost contrast. 9 rounded blades.",flare_sunstar:"Reeve: the recessed front element and built-in hood don't prevent ghosting or veiling flare with strong light at f/2, and ghosts get more obvious at f/11. Somewhat better than the 85/1.4D, but 'still not great'. No distinct sunstars at any aperture (blade alignment). Stage lights in frame will flare.",ca:"Lateral CA is very low (Photozone about 0.5 px at the DX borders. Reeve: very low. IR: virtually none on D3x with auto correction). Longitudinal CA is strong at f/2 (Reeve), still present at f/2.8 with traces of outlining at f/4. Rockwell: slight green behind and magenta in front of focus. Photozone: greenish and reddish transitions on out-of-focus edges.",distortion:"Negligible. Photozone 0.12% (DX). IR trace barrel about 0.1% (D3x). DXOMARK 0.1%.",vignetting:"IR (D3x): about 0.75 stop at f/2, 0.25 at f/2.8, less beyond. DXOMARK headline −1.3 EV (body likely D800E, not explicit). Photozone (DX): very well controlled.",coma_astro:"Not tested by the sources read.",focus_breathing:"Not measured. Internal rear-group focusing (Rockwell).",other:"HOW THE DC RING WORKS (Nikon's 'Thousand and One Nights' No. 32, written for the sister 135 DC but describing the same Defocus-image Control): turning the DC ring changes the spacing of internal elements to alter spherical aberration (SA) slightly, without much change in astigmatism or colour. At 0, SA is corrected to near zero, giving the best sharpness. R (rear) leaves SA undercorrected, which softens the edges of out-of-focus BACKGROUND discs and makes them smoother. F (front) overcorrects SA, which smooths the FOREGROUND blur and makes the background harsher. Nikon optimised the SA amount per aperture, so the DC scale is marked in f-numbers (f/2–f/5.6 on R and F sides). Match the DC number to your shooting aperture: DC at or below your aperture (e.g. R2 at f/2, R2.8 at f/2.8) changes the blur with little cost to the focal plane (Reeve, IR, Photozone). DC set beyond your aperture (e.g. R4 or R5.6 at f/2) lets the SA reach the in-focus image and gives a soft-focus glow with highlight halation (Nikon, Rockwell, Reeve, Photozone). It is not a soft-focus filter by design (Rockwell). When to use: REAR at or matched to the aperture for head-and-shoulders portraits against a busy background. FRONT for still-life with foreground foliage. Neutral 0 for sharpness, stage and groups. Reeve: at long distances DC mostly costs resolution and contrast rather than visibly reshaping the bokeh, so it matters most at portrait distances. Photography Life: most owners rarely use it. Release button needed to rotate the ring (IR). 6 elements in 6 groups, introduced 1993."},es=["Default to DC 0 and the M/A switch on M. Focus with peaking plus magnified view, or the green focus point. Eye-detect can't focus this lens.","Portrait with a busy background: shoot f/2, set DC to R2, then refocus. For a dreamier look accept R2.8 at f/2. Never go beyond about one stop past your aperture unless you want glow.","For a deliberate soft-glow portrait (e.g. a vintage look), set DC well past the aperture (R4–R5.6 at f/2), expose a little bright, and refocus. Don't use this on stage.","Stage dance: MF at 105mm with moving dancers is hard. Use it for posed or slow moments at f/2.8 (much cleaner LoCA than f/2) with DC 0, or zone-focus on a known mark.","Sharpest frames: f/4–f/5.6 at DC 0. On the Z8 stay at f/8 or wider. On the Z50 II it frames like about 158mm with no IBIS, so use 1/320 s or faster."],ts=[{body:"z8",note:"45.7MP shows f/2 softness and LoCA plainly. Use f/2.8 or slower for crisp eyes and f/4–f/5.6 for maximum detail. Diffraction is likely from about f/8 (inferred). 3-axis IBIS via FTZ II. Use focus peaking and magnified view (no AF)."},{body:"z5ii",note:"24.5MP matches the D3x Imaging Resource test: tack-sharp at f/5.6, good at f/2.8, f/11 still fine. 3-axis IBIS via FTZ II. MF with electronic rangefinder."},{body:"z50ii",note:"About 158mm-equivalent. Vignetting and soft corners fall outside the DX frame (Photozone's D200 test applies directly: very good at f/2, peak about f/5.6). No IBIS: keep the shutter fast."}],os=!1,ns=[{id:"photozone",name:"Photozone/OpticalLimits: Nikkor AF 105mm f/2 D DC review (analysis + verdict)",url:"https://www.photozone.de/nikon--nikkor-aps-c-lens-tests/222-nikkor-af-105mm-f2-d-dc-review--test-report?start=1",kind:"measured",tested_on:"Nikon D200 (10.2MP DX), neutral DC setting",date:null,findings:"Resolution already very good at f/2, excellent beyond, sweet spot about f/5.6 (values in chart images only). Distortion 0.12%. Vignetting very well controlled on DX. Lateral CA about 0.5 px at the borders. LoCA present (greenish/reddish out-of-focus edges). DC settings other than neutral add softening to resolution and contrast in varying degree. Verdict (https://photozone.de/nikon--nikkor-aps-c-lens-tests/222-nikkor-af-105mm-f2-d-dc-review--test-report?start=2): very high-quality tele with excellent resolution as a conventional lens. DC toward F emphasizes foreground blur, toward R background blur. The ring locks at f/2–f/5.6. Past the working aperture it gives soft focus. Refocusing needed after a DC change. Screw AF dated. Optical 4 stars."},{id:"imaging_resource",name:"Imaging Resource / SLRgear: Nikon 105mm f/2D AF DC Nikkor review",url:"https://old.imaging-resource.com/lenses/nikon/105mm-f2d-af-dc-nikkor/review",kind:"measured",tested_on:"Nikon D200 (10MP DX) and D3x (24.5MP FX), DC at 0; blur-index",date:null,findings:"Blur index: f/2 2–3 units, some unevenness. f/2.8 about 1.5, even. f/5.6 essentially tack-sharp across the frame. Diffraction begins very slightly at f/11, f/16 at most 1.5. Vignetting D3x: f/2 about 0.75 stop, f/2.8 about 0.25. D200: f/2 about 0.25. Distortion D3x about +0.1% barrel. CA virtually nil on D3x with auto CA reduction. DC: selectable f/2–f/5.6 R or F. A DC value smaller (aperture) than the main aperture adds softness. For max sharpness, DC should be the same or larger aperture. F makes out-of-focus edges sharper, R blurs them more. No AF override: a switch must be set to M."},{id:"phillipreeve",name:"Phillip Reeve: Review Nikon 105mm 2.0 AF DC-Nikkor",url:"https://phillipreeve.net/blog/review-nikon-105mm-2-0-af-dc-nikkor/",kind:"review",tested_on:"Sony A7R II (42MP FX) via adapter, 100% crops; neutral DC for sharpness",date:null,findings:"Infinity: purple fringing and good resolution except corners at f/2, traces at f/2.8, very good everywhere by f/5.6. 2.6 m: slightly soft and not fully colour-corrected at f/2, good across the frame at f/2.8. 0.9 m (1:7.3): soft f/2, slight fringing f/2.8, good from f/4. LoCA strong at f/2, present at f/2.8, traces at f/4. Lateral CA very low. Small focus shift f/2 to f/2.8. DC: at or below the aperture, no real focal-plane effect. Beyond the aperture, large sharpness loss. R smooths background and roughens foreground, F the reverse. R2 at f/2 subtly smoother (author's favourite). R2.8 at f/2 stronger but softer. R4 only loses contrast. Refocus after each DC change. Flare/ghosting not great. No distinct sunstars. No AF on Z via FTZ."},{id:"nikon_1001_nights_32",name:"Nikon: NIKKOR – The Thousand and One Nights No. 32 (Ai AF DC Nikkor 135mm f/2S)",url:"https://imaging.nikon.com/imaging/information/story/0032/",kind:"manufacturer",tested_on:null,date:null,findings:"Explains Nikon's Defocus-image Control (written for the 135 DC, the same principle as the 105 DC). The DC ring changes element spacing to shift spherical aberration slightly with little effect on astigmatism or colour. Center position: SA about zero (best when DC is unused). R: SA undercorrected, softening out-of-focus background edges. F: SA overcorrected, blurring foreground more. Optimal SA per aperture found by simulation, hence the f-number scale to f/5.6. Turning past the marked range gives a soft-focus effect with flare around highlights."},{id:"kenrockwell",name:"Ken Rockwell: Nikon 105mm f/2 DC review",url:"https://kenrockwell.com/nikon/105mm-f2-dc.htm",kind:"review",tested_on:"Nikon D700, D3, D7000; qualitative",date:null,findings:"Set the DC ring to the aperture in use (unlock button). REAR softens the background, FRONT the foreground (usually looks unnatural). The effect is subtle. The wrong direction makes backgrounds harsher. In-focus areas stay sharp. It is not a soft-focus lens. DC beyond the shooting aperture gives the softer look. DC 0 is sharpest. Changing DC shifts focus. Sharp edge to edge at f/2 on D700/D3/D7000 (subjective). No lateral colour seen. Slight green behind and magenta in front. 620 g Nikon (624 g measured), 0.9 m, 1:7.7, 9 curved blades, f/16, 72 mm non-rotating, 6/6, built-in telescoping hood. No AF on the FTZ. Low weight as a source."},{id:"lenstip_spec",name:"Lenstip: Nikon Nikkor AF DC 105 mm f/2D specifications",url:"https://www.lenstip.com/353-Nikon_Nikkor_AF_DC_105_mm_f_2D-lens_specifications.html",kind:"manufacturer",tested_on:null,date:null,findings:"6/6, MFD 0.9 m, 1:7.7, 9 blades, 72 mm, 640 g, 79 × 111 mm, f/16, marketed 1993. No full Lenstip review found."},{id:"dxomark",name:"DXOMARK: Nikon AF DC-Nikkor 105mm f/2D (lens database + D800 spec page)",url:"https://www.dxomark.com/Lenses/Camera-Lens-Database/Nikon/Nikon-AF-DC-Nikkor-105mm-F2D/(camera)/865",kind:"measured",tested_on:"Probably Nikon D800E (36MP), the widget-selected camera, not stated explicitly",date:null,findings:"Score 35 (best at f/2.8). Sharpness 23 P-Mpix. Transmission T2.2. Distortion 0.1%. Vignetting −1.3 EV. CA 2 µm. Spec page (https://www.dxomark.com/Lenses/Nikkor/Nikon-AF-DC-Nikkor-105mm-F2D-mounted-on-Nikon-D800---Specifications__792): released Jan 1993, 640 g, 72 mm, 6/6, 9 blades circular, no AF motor, no full-time MF."},{id:"photographylife_105e",name:"Photography Life: Nikon 105mm f/1.4E vs Nikon 105mm f/2 DC",url:"https://photographylife.com/reviews/nikon-105mm-f1-4e/3",kind:"review",tested_on:"Not stated on the page read (Imatest charts not readable)",date:null,findings:"The 105/1.4E is 'significantly sharper' than the DC wide open and stopped down. DC lenses show AF shifts at each DC setting, and DC beyond the aperture gives a soft glow. Most DC owners rarely use the ring."},{id:"nikon_ftz_ii",name:"Nikon: Mount Adapter FTZ II product page",url:"https://www.nikon.ie/en_IE/product/accessories/mirrorless/mount-adapter-ftz-ii",kind:"manufacturer",tested_on:null,date:null,findings:"With a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. Full AF only for lenses with a built-in AF motor (AF-S, AF-P, AF-I)."},{id:"nikon_ftz_compat",name:"Nikon: FTZ 'Compatible F Mount Lenses' feature table (manualmachine copy)",url:"https://manualmachine.com/nikon/ftz/17014601-compatible-f-mount-lenses",kind:"manufacturer",tested_on:null,date:null,findings:"Row 'AF NIKKOR Type G and D': autofocus not supported. MF with electronic rangefinder supported. All exposure and metering modes supported. (Same source as used for the AF Micro 60 record.)"},{id:"pl_ftz_guide",name:"Photography Life: Nikon FTZ and FTZ II adapter lens compatibility, explained",url:"https://photographylife.com/nikon-ftz-adapter-lens-compatibility",kind:"review",tested_on:null,date:null,findings:"AF-D lenses: no AF. Electronic rangefinder, focus peaking, camera aperture control, metering, EXIF, diffraction compensation and IBIS work. Distortion/vignetting control and focus-shift shooting do not."}],is={url:null,access:"not-found",summary:"No Christopher Frost review of the AF DC-Nikkor 105mm f/2D was found. Two web searches (one youtube.com-restricted with his name) and the LensVid 'christopher frost' tag returned no video on this lens. YouTube is blocked to fetching here. Nothing is attributed to him."},ss="1) No Lenstip review exists (spec page only). The Digital-Picture has a results container with no written review (text says a full review is not planned), and its ISO 12233 crops were not read. 2) The DC mechanism is cited from Nikon's 135 DC article, which describes the same Defocus-image Control. Nikon's own 105 DC explanation was not found. The stacken.kth.se DC explainer could not be fetched (redirect loop). 3) Measured sharpness comes from DX D200 (Photozone, IR) and 24MP D3x (IR blur index). Reeve's 42MP evidence is visual. Z8 diffraction onset (about f/8) is inferred from pixel pitch. 4) The DXOMARK body is ambiguous (assumed D800E). 5) Max magnification: 1:7.7 (Lenstip, Rockwell, DXOMARK-consistent) used; Reeve measured 1:7.3. 6) Weight: 640 g (Lenstip, DXOMARK) vs Rockwell's 620 g 'Nikon' figure. 640 used. 7) tc_compatible false: Nikon AF-S/AF-I teleconverters do not support screw-drive AF-D lenses on Nikon's lists (general knowledge, not re-verified this session). 8) Nikon's imaging.nikon.com FTZ II page summary listed 'AF Type G and D' as AF+MF, which conflicts with the Nikon compatibility table, Photography Life, Rockwell and Reeve. That extraction is treated as garbled, and MF-only stands. 9) Whether the Z EVF shows the DC effect at the taking aperture during MF is unverified.",as={id:Li,name:Mi,short:Oi,mount:Ti,adapter:Ei,coverage:Vi,kind:$i,focal_mm:Xi,max_aperture:Bi,min_aperture_f:Hi,aperture_blades:Wi,rounded_blades:ji,weight_g:Gi,filter_mm:Ki,focus:Ui,stabilization:qi,close_focus:Ji,quick:Qi,character:Yi,field_tips:es,body_notes:ts,tc_compatible:os,sources:ns,chris_frost:is,research_notes:ss},rs="f-af-micro-60-f28d",ls="AF Micro-NIKKOR 60mm f/2.8D",cs="AF Micro 60 f/2.8D",ds="F",ms="FTZ II",us="FX",hs="macro",fs=[60],ps=[{focal_mm:60,f:2.8}],gs=32,bs=7,ws=null,_s=440,vs=62,ys={on_z_body:"MF only (screw-drive lens on FTZ II)",cpu:!0,motor:"None in lens: screw-drive AF powered by a DSLR body motor. The FTZ II has no drive, so no AF on Z bodies.",focus_throw_deg:null,notes:"Nikon's FTZ compatibility table lists AF Type G/D lenses as: autofocus not supported; MF with electronic rangefinder supported (the focus point turns green and an in/out indicator shows when in focus, per Ken Rockwell's FTZ page). The lens has a separate A-M ring and no full-time manual override (DPReview, Nikon manual), so turn it to M to focus by hand. FULL/LIMIT switch: two LIMIT zones, about 0.3 m to infinity or 0.3 m to 0.219 m (Nikon manual; DPReview). Unit-focusing design with CRC (lens-db); the front group moves out about 24 mm from infinity to 1:1 (Ken Rockwell measured 74.8 mm to 99.3 mm from the flange). The filter thread does not rotate. One blog (Marco Aries) gives a 160° focus throw. That figure is unverified, so the field is null."},ks={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:"3-axis (yaw, pitch, roll) via FTZ II on Z8 and Z5 II. None on Z50 II (no IBIS).",notes:"Nikon FTZ II page: with a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. Being a CPU lens, it passes its focal length to IBIS automatically. Nikon names only those 3 axes, so x/y shift is not corrected. That is inference, but x/y shift is the shake that dominates at 1:1, so do not count on IBIS for handheld macro. The Z50 II has no IBIS for stills (Digital Camera World)."},Is={mfd_m:[{focal_mm:60,value:.219}],max_mag:[{focal_mm:60,value:1}],working_distance_mm_at_max_mag:73,effective_aperture_at_max_mag:"About f/5 at 1:1 when wide open (exposure factor 3.20 = 1⅔ stops per the Nikon manual; Ken Rockwell and Lenstip both give f/5). Whether a Z body shows this value through the FTZ II is not verified.",camera_displays_effective:null,notes:"MFD is 0.219 m from the focal plane (Nikon manual; Lenstip; DPReview). Free working distance at 1:1 is about 73 mm from the front of the lens (Ken Rockwell measured 73 mm; lens-db lists 0.073 m at 1:1; photoartfromscience says about 3 in). Rockwell cites a Nikon figure of 90.4 mm, which no Nikon document fetched here confirms. The barrel extends toward the subject as you focus closer. Effective aperture: the Nikon manual's exposure table gives a factor of 1.92 (1 stop) at 1:2 and 3.20 (1⅔ stops) at 1:1. So N_eff is about N × 1.79 at 1:1, a little less than the simple N × (1 + m) = N × 2, because pupil magnification is above 1. Set f/8 is about f/14 effective, f/11 about f/20, f/16 about f/29. Ken Rockwell's max-aperture table: f/2.8 at infinity and 3 m, f/3.2 at 1 m, f/3.5 at 0.3 m, f/4 at 0.25 m, f/5 at 1:1. Lenstip says the full f/2.8 holds only from about 1.8 m out. Nikon DSLRs (the owner's D750) show this reduced aperture for Micro lenses (Rockwell table; Unique Photo Q&A on a D90). No source found confirms whether Z8, Z5 II or Z50 II show the effective value with this D lens on the FTZ II. Metering is through the lens, so exposure follows the light loss automatically, but shutter speeds drop by about 1⅔ stops at 1:1."},Fs={headline:"Sharp classic 1:1 macro and compact 60mm: manual focus only on Z, best at f/5.6–f/8, and only about 73 mm of working room at 1:1.",sweet_spot:"f/5.6–f/8",wide_open:"Center is very sharp at f/2.8 (Lenstip: about 40 lp/mm on 10MP DX, 'brilliant'). FX corners are soft at f/2.8 and still weak at f/4 on a 36MP body (Kasson, Rockwell). CA (about 0.10–0.12% Lenstip; 1.5 px Photozone) and coma in the corners are visible wide open.",by_focal:[{focal_mm:60,center_peak:"f/4–f/8",corners_peak:"f/8",wide_open_note:"Center plateaus from f/4: photoartfromscience (24MP DX) found +9% MTF50 from f/2.8 to f/4 and no measurable gain at f/5.6. Corners gained 40% at f/4 and another 29% at f/5.6, peaking at f/8. Photozone (D200) also peaked at f/8, even across the frame. FX corners at 36MP were 'credible' only from f/5.6 (Kasson, D810)."}],close_up_best:"f/5.6–f/8 set (about f/10–f/14 effective at 1:1)",close_up_note:"No source measured resolution at 1:1, so this is a calculation, not a test. At 1:1 the effective aperture is about 1.79 × the set value (Nikon exposure factor 3.20), and per-pixel softening on 24MP DX starts at f/11 (photoartfromscience). Set f/5.6–f/8 for maximum detail per frame. Set f/11–f/16 (about f/20–f/29 effective) only when you need the depth of field and can accept visible softening on the Z8. Focus-stack at f/5.6–f/8 instead. photoartfromscience saw no sharpness gain from moving closer in limited tests.",diffraction_note:"photoartfromscience (D7100, 24MP DX, 3.9 µm pitch): softening begins at f/11 and is noticeable beyond f/11. Photozone (D200, 10MP DX): diffraction is the limit past medium apertures, and f/32 is 'still not good'. The Z8's 4.35 µm pitch is slightly coarser than the D7100's, so expect onset at about f/11 at normal distances. At 1:1 that same onset arrives at about set f/5.6–f/6.3 (×1.79).",avoid:["Set f/16–f/32 at 1:1 except as a last resort: that is about f/29–f/57 effective.","Do not rely on f/2.8 for FX corner detail at distance.","Do not trust IBIS to save handheld 1:1 shots (no x/y correction for non-VR F lenses; none at all on Z50 II)."],confidence:"medium",confidence_reason:"Two measured DX tests (Photozone 10MP, photoartfromscience 24MP) agree on an f/8 peak across the DX frame. FX corner evidence on high-resolution bodies is only visual (Kasson D810, version unspecified) plus Rockwell. Lenstip per-aperture lp/mm values are in a chart image that could not be read. No measured 1:1 data exists, so close-up guidance is calculated (low confidence)."},Ss={bokeh:"Mixed. Ken Rockwell rates it poor (busy backgrounds at f/2.8). The Nikon Rumors guest review found highlights round wide open but polygonal stopped down. Marco Aries found highlights soft and backgrounds smooth. 7 blades.",flare_sunstar:"Some flare with a light source in frame: SLRgear/Imaging Resource saw more than expected, and Kasson saw flare in one corner at f/2.8 on a D810. Marco Aries had no problems in normal use without a hood. Sunstars are not documented (7 blades would give 14 points; inferred, not tested).",ca:"Lateral CA is moderate wide open. Lenstip: 0.10–0.12% at f/2.8 ('medium'), not a problem 2–3 stops down. Photozone: 1.5 px average at the borders at large apertures (D200), 'very high for a prime', decent from f/5.6. DxOMark (D800E): 3 µm. Enable lateral CA correction in raw processing.",distortion:"Essentially none. Photozone 0.03%, DxOMark 0.1% (D800E), Lenstip 'zero distortion', Rockwell none visible on FX. Good for copy work.",vignetting:"Low. Lenstip (DX): 12% (−0.37 EV) at f/2.8 and 5% at f/4. DxOMark (D800E, FX): −0.9 EV. Photozone: usable wide open.",coma_astro:"Lenstip: coma in the corners at f/2.8 between medium and large, almost gone one stop down. Astigmatism low (5%). Not an astro lens.",focus_breathing:"Not measured by any source found. The lens focuses by extending, so framing changes as you focus (unquantified).",other:"Designed 1989; D version 1993 (DxOMark, lens-db). It has an aperture ring with a minimum-aperture lock at f/32. Copy variation is possible: SLRgear/Imaging Resource found its APS-C sample 'mediocre' wide open with a soft left side, and a reader suggested a defective copy."},Zs=["Turn the A-M ring to M and focus with peaking or the green focus-point and in/out indicator. AF is impossible on the FTZ II. At 1:1, set the ring to minimum focus and move the camera (or a rail) to focus.","Lock the aperture ring at f/32 and set aperture from the camera. If the focus ring stops short of 1:1 or infinity, the FULL/LIMIT switch is on LIMIT.","At 1:1 the front of the lens is only about 73 mm from the subject and the barrel grows about 24 mm. Light from the side or use a small diffused flash, and don't spook insects.","At 1:1 you lose about 1⅔ stops (f/2.8 becomes about f/5). Set f/5.6–f/8 (about f/10–f/14 effective) for the sharpest frame, and focus-stack rather than going to f/16 or smaller on the Z8.","As a general 60mm: shoot f/5.6–f/8 for edge-to-edge FX, while f/2.8–f/4 is fine for centered subjects. On the Z50 II it frames like about 90mm with no IBIS, so keep shutter speeds fast."],Ps=[{body:"z8",note:"45.7MP (4.35 µm) shows FX corner softness at f/2.8–f/4 and CA wide open. Peak about f/8 across the frame. At 1:1, diffraction appears from about set f/5.6–f/8. IBIS 3-axis only via FTZ II. Effective-aperture display not verified."},{body:"z5ii",note:"24.5MP FX (about 5.9 µm pitch) is less demanding. Its per-pixel behavior is close to the D200-era tests' 6 µm, so f/8 is a safe peak. At 1:1, f/11 set is still acceptable. IBIS 5-axis body (Nikon), but only yaw, pitch and roll apply to this non-VR F lens per Nikon's FTZ II statement."},{body:"z50ii",note:"DX crop: about 90mm-equivalent framing (DPReview), and soft FX corners fall outside the frame. 20.9MP (about 4.2 µm) is close to the D7100 test (3.9 µm), so the f/8 peak and f/11 diffraction onset apply directly. No IBIS for stills."}],As=null,Cs=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor AF Micro 60 mm f/2.8D (Arkadiusz Olech)",url:"https://www.lenstip.com/29.4-Lens_review-Nikon_Nikkor_AF_Micro_60_mm_f_2.8D_Image_resolution.html",kind:"measured",tested_on:"Nikon D200 (10.2MP DX), RAW MTF50",date:"2007-10",findings:"Center at f/2.8 is 'brilliant' at almost 40 lp/mm. Edge: weaker than the 105 VR at f/2.8, very high marks from f/4. Per-aperture lp/mm values are only in a chart image (not readable here). CA 0.10–0.12% at f/2.8 (medium), not problematic 2–3 stops down. Vignetting (DX) 12% (−0.37 EV) at f/2.8, 5% at f/4. Coma medium-to-large at f/2.8, almost gone one stop down. Astigmatism 5%. Summary: zero distortion, small vignetting, coma a bit large, CA wide open could be lower. Build page: MFD 0.219 m with max aperture f/5.0 there, full f/2.8 only at 1.8 m and beyond. Barrel extends noticeably. FULL/LIMIT switch. Separate A/M ring. 7 blades, non-rotating 62 mm filter. Other chapters: 29.3 Build, 29.5 CA, 29.7 Coma, 29.8 Vignetting, 29.11 Summary."},{id:"photozone",name:"Photozone (now OpticalLimits): Micro-Nikkor AF 60mm f/2.8 D review",url:"https://photozone.de/nikon--nikkor-aps-c-lens-tests/219-micro-nikkor-af-60mm-f28-d-review--test-report?start=1",kind:"measured",tested_on:"Nikon D200 (10.2MP DX)",date:"2006-06",findings:"Excellent from f/2.8. Center slightly better than the border at large to medium apertures. Peak at f/8 with a perfectly even characteristic across the frame. Beyond medium apertures, diffraction is the limit, and f/32 is comparatively good but 'still not good'. Distortion 0.03%. Vignetting very well controlled. CA peaks at about 1.5 px average at the borders at large apertures ('very high for a fix-focal'), very decent from f/5.6. LW/PH figures are only in the chart image. Page 1: MFD 0.22 m for 1:1, linear extension design, focus limiter, separate AF/MF ring, non-rotating front. Verdict page: 4 stars optical."},{id:"photoartfromscience",name:"Photo Art From Science: Micro-Nikkor 60mm AF-D review (MTF50 tests)",url:"https://www.photoartfromscience.com/single-post/2015/12/13/micro-nikkor-60mm-afd-review",kind:"measured",tested_on:"Nikon D7100 (24MP DX, about 3.9 µm pitch); single copy",date:"2015-12 (updated 2020-08)",findings:"Relative MTF50 changes. Center +9% from f/2.8 to f/4, no measurable gain at f/5.6. Corners +40% at f/4 and +29% more at f/5.6. f/8 is peak performance across the frame. Diffraction begins at f/11 (still great), noticeable drop beyond f/11. Min aperture f/32 (f/57 at 1:1). No resolution gain seen at closer distances (limited test, 1:1 not specifically tested). Working distance about 3 in at 1:1. Center about 13% sharper than the 105 f/2.8 AF-S VR Micro, while the 105 has better corners until f/5.6. Only percentages were published, no absolute values."},{id:"kasson",name:"Jim Kasson (The Last Word): normal lenses on the D810 at f/2.8, f/5.6 and f/8",url:"https://blog.kasson.com/the-last-word/normal-lenses-on-the-d810-at-f8",kind:"measured",tested_on:"Nikon D810 (36MP FX, 4.88 µm); distant landscape, visual 3× crops, no numbers",date:"2015-03",findings:"Lens listed only as 'Nikon 60mm f/2.8 AF Micro-Nikkor' (screw-drive AF; D or non-D not stated). f/2.8: center slightly soft relative to the 58/1.4G, Sigma 50 Art and Otus, and the upper-right corner soft with some flare. Corner not good enough at f/4 and 'credible' at f/5.6. f/8: centers all similar, corner second-weakest of six (behind the Sigma, Otus and Coastal 60, ahead of the 58/1.4G). Related pages: https://blog.kasson.com/the-last-word/normal-lenses-on-the-d810-at-f2-8 and https://blog.kasson.com/the-last-word/normal-lenses-on-the-d810-at-f5-6/"},{id:"dxomark",name:"DXOMARK: AF Micro-Nikkor 60mm f/2.8D on D800E",url:"https://www.dxomark.com/cn/Lenses/Nikon/Nikon-AF-Micro-Nikkor-60mm-F28D-mounted-on-Nikon-D800E__814",kind:"measured",tested_on:"Nikon D800E (36MP FX)",date:null,findings:"Score 30. Sharpness 25 P-Mpix. Transmission T3. Distortion 0.1%. Vignetting −0.9 EV. CA 3 µm. Spec page (D810 listing) says 7 blades with circular aperture 'yes', which conflicts with Rockwell."},{id:"slrgear",name:"SLRgear / Imaging Resource: Nikon 60mm f/2.8D AF Micro Nikkor",url:"https://www.imaging-resource.com/?p=479738",kind:"measured",tested_on:"APS-C Nikon body (D70-era, about 6MP); blur-index charts",date:"2005/2006",findings:"Wide open 'decidedly mediocre' with the whole left side soft, improving stopped down. Good CA, very good shading and distortion. More flare than expected. Verdict 'only a mediocre lens'. A reader comment suggests a defective copy, and this result disagrees with every other test. Treated as possible copy variation. No blur-index numbers were readable."},{id:"kenrockwell",name:"Ken Rockwell: Nikon 60mm f/2.8 AF-D Micro review",url:"https://kenrockwell.com/nikon/60mm-afd.htm",kind:"review",tested_on:"Nikon DSLRs, FX and DX (specific bodies not captured); qualitative",date:"2008-05 (nav shows 2013-06)",findings:"8 elements in 7 groups, CRC. 7 straight (not rounded) blades. 62 mm non-rotating filter. Measured weight 434 g (Nikon spec 440 g). MFD 0.219 m to the image plane. f/32 min (f/57 at 1:1). Extends from 74.8 mm (2.943 in) to 99.26 mm from the flange at 1:1. Measured working distance at 1:1 about 73 mm (says Nikon specifies 90.4 mm). Max aperture by distance: f/2.8 at infinity and 3 m, f/3.2 at 1 m, f/3.5 at 0.3 m, f/4 at 0.25 m, f/5 at 1:1. 'Unquestionably excellent'. Only weakness is the far FX corners at f/2.8. Diffraction-limited a stop or two down. No visible distortion (RMS 0.196). Low falloff on FX. Bokeh rated poor. Focus limiter present. AF hunts over the full range. Low weight as a source."},{id:"nikon_manual",name:"Nikon instruction manual: AF Micro-Nikkor 60mm f/2.8D (ManualsLib scan)",url:"https://manualslib.com/manual/953104/Nikon-Af-Micro-Nikkor-60mm-F-2-8-D.html?page=5",kind:"manufacturer",tested_on:null,date:null,findings:"Closest focus 0.219 m (8¾ in). Exposure factors: 1:2 = 1.92 (1 stop), 1:1.4 = 2.43 (1⅓ stops), 1:1 = 3.20 (1⅔ stops). Focus limit switch FULL/LIMIT with two LIMIT zones, about 0.3 m to infinity and 0.3 m to 0.219 m (page 4). Minimum-aperture lock at f/32. A-M ring selects AF or MF. OCR is partly garbled, and pages 4–5 were used."},{id:"nikon_ftz_ii",name:"Nikon: Mount Adapter FTZ II product page",url:"https://www.nikon.ie/en_IE/product/accessories/mirrorless/mount-adapter-ftz-ii",kind:"manufacturer",tested_on:null,date:null,findings:"With a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. F lenses with a built-in AF motor (AF-S, AF-P, AF-I) keep full AF."},{id:"nikon_ftz_compat",name:"Nikon: FTZ 'Compatible F Mount Lenses' feature table (manualmachine copy)",url:"https://manualmachine.com/nikon/ftz/17014601-compatible-f-mount-lenses",kind:"manufacturer",tested_on:null,date:null,findings:"Row 'AF NIKKOR Type G and D': autofocus not supported. MF with electronic rangefinder and plain MF supported. All exposure modes and metering supported. Nikon's own PDF (https://download.nikonimglib.com/archive6/amgQQ00igi0U06sJjMP25JWC2H05/FTZ_CompatibleFmount_(En)11.pdf) was also fetched, but its table extraction was ambiguous. It says on-camera VR covers pitch, yaw and roll."},{id:"kenrockwell_ftz",name:"Ken Rockwell: Nikon FTZ and FTZ II compatibility",url:"https://kenrockwell.com/nikon/mirrorless/lenses/ftz.htm",kind:"review",tested_on:"Nikon Z bodies with FTZ",date:null,findings:"No AF with AF-D screw-drive lenses. Focus confirmation works: the selected focus point turns from red to green and in/out indicators appear. Full EXIF and exposure control. Nothing on Micro effective-aperture display."},{id:"dpreview_specs",name:"DPReview product page: Nikon AF Micro-Nikkor 60mm f/2.8D",url:"https://www.dpreview.com/products/nikon/lenses/nikon_60_2p8d_micro/",kind:"manufacturer",tested_on:null,date:null,findings:"Spec database, not a lab test. MFD 0.22 m, 1.0×, 7 blades, 440 g. Focus limiter FULL, or LIMIT at 0.3 m–infinity / 0.3–0.219 m. About 90mm-equivalent on DX. No full-time manual focus in AF mode."},{id:"lensdb",name:"lens-db: Nikon AF Micro-Nikkor 60mm F/2.8D (1993)",url:"https://lens-db.com/nikon-af-micro-nikkor-60mm-f28d-1993",kind:"manufacturer",tested_on:null,date:null,findings:"Compiled from manufacturer data. MFD 0.219 m, 1:1, a figure of 0.073 m listed alongside 1:1 (likely working distance), 7 blades, 440 g, 62 mm, Ø70 × 74.5 mm, CRC, FULL/LIMIT limiter. Introduced Oct 1993 (AF non-D 1989)."},{id:"photoblogs_users",name:"Nikon Rumors guest review (Neo Vincent) and Marco Aries blog",url:"https://nikonrumors.com/2017/12/16/nikon-af-micro-nikkor-60mm-f-2-8d-lens-review.aspx/",kind:"review",tested_on:"Nikon D7200 (24MP DX); Marco Aries body unnamed, adapted",date:"2017-12 / 2024-11",findings:"Nikon Rumors guest: slightly soft below f/5 on their copy (improved with AF fine-tune +11). Bokeh highlights round wide open, polygonal stopped down. Mostly shot at f/5.6. Marco Aries (https://marcoaries.blogspot.com/2024/11/micro-nikkor-60mm-f28-lens-review-and.html): center very sharp at f/2.8, softer corners, very sharp across the frame by f/8. Smooth bokeh. Some flare toward light sources. CA wide open fades stopped down. States a 160° focus throw and about 420 g."},{id:"photolounge_video",name:"The Photo Lounge (YouTube): Nikon 60mm f2.8 Micro Nikkor tested!",url:"https://www.youtube.com/watch?v=Nb_SacLQK6Q",kind:"video",tested_on:"Mirrorless (body not stated in description)",date:"2021-12",findings:"Description only (video not watched): an older AF macro lens, 'a super sharp performer', with 'some slight issues for use on mirrorless cameras' (issues not specified in the description). Lens version not stated."},{id:"body_ibis",name:"Nikon Z5II product page; Digital Camera World Z50 II vs Z50",url:"https://imaging.nikon.com/imaging/lineup/mirrorless/z5_2/",kind:"manufacturer",tested_on:null,date:null,findings:"Z5II: 5-axis image-sensor-shift VR (7.5 stops center, CIPA 2024). Digital Camera World (https://www.digitalcameraworld.com/buying-guides/nikon-z50-ii-vs-nikon-z50): the Z50 II relies on VR lenses for stabilized stills (no IBIS)."}],Ns={url:null,access:"not-found",summary:"No Christopher Frost review of the AF Micro-NIKKOR 60mm f/2.8D was found. A web search and a youtube.com-restricted search returned his channel pages but no video on this lens. The YouTube search page itself is blocked to fetching. Videos found on this lens are from other channels: The Photo Lounge (2021), David Saylors (2018), Jules Vuotto's Photo Focus (2025, as a standard lens) and Marco Aries (2025). An 'AF-S Micro 60mm f/2.8G ED review' result turned out to be from Camera Insider, not Frost. Nothing is attributed to him."},zs="1) Test vintage: every measured test predates high-resolution FX mirrorless. Lenstip and Photozone used a 10MP DX D200 (about 6 µm pitch), SLRgear a roughly 6MP DX body, photoartfromscience a 24MP DX D7100 (3.9 µm). Only Kasson (D810, 36MP FX, visual only, version unspecified) and DxOMark (D800E) cover FX at high resolution. For the Z8 (4.35 µm, FX), the DX tests describe the central 1.5× crop well: the D7100 is even finer-pitched. FX corners rest on Kasson and Rockwell, hence corners_peak f/8 with medium confidence. Lenstip lp/mm by aperture (chart image https://www.lenstip.com/upload3/2559_Nik60mm_res.jpg) and Photozone LW/PH charts could not be read, so they are not quoted. 2) Close-up: no source measured sharpness at 1:1. close_up_best is computed from the Nikon exposure factor (×1.79 at 1:1) plus photoartfromscience's f/11 diffraction onset. Low confidence. 3) Effective aperture on Z bodies via FTZ II: not verifiable (no Nikon document or user report found). DSLR display of reduced aperture is documented (Rockwell table; Unique Photo Q&A on D90: https://www.uniquephoto.com/community/qa/why-does-my-nikon-60mm-micro-af-d-show-a-smaller-maximum-aperture-on-a-d90). 4) Working distance: 73 mm (Rockwell measured, lens-db 0.073 m, photoartfromscience about 3 in, and arithmetic 219 − 46.5 flange − 99.3 extended length ≈ 73 mm) vs a 90.4 mm figure Rockwell attributes to Nikon. 73 mm is used. 5) Rounded blades: DxOMark says circular, Rockwell says straight, and the Nikon Rumors guest saw polygonal highlights stopped down. Set to null. 6) The SLRgear negative result conflicts with all other tests and is treated as a likely bad copy. 7) tc_compatible null: Nikon TC-E teleconverters are generally limited to specific AF-S/AF-I telephotos, but this was not verified this session. 8) Nikon official imaging.nikon.com/nikonusa spec page for this lens was not found. Specs are from the Nikon manual scan plus Lenstip, DPReview, lens-db and Photography Life (https://photographylife.com/lenses/nikon-af-micro-nikkor-60mm-f2-8d: 0.22 m, 1:1, 440 g, 62 mm, 7 blades, 8/7, f/2.8–32, 70 × 74.5 mm), which all agree. 9) The focus limiter's effect in MF on this lens is unverified, so the field tip is phrased conditionally. 10) data/kit.json notes ownership 'confirmed Nov 5, 2026 (manifest update pending)'.",xs={id:rs,name:ls,short:cs,mount:ds,adapter:ms,coverage:us,kind:hs,focal_mm:fs,max_aperture:ps,min_aperture_f:gs,aperture_blades:bs,rounded_blades:ws,weight_g:_s,filter_mm:vs,focus:ys,stabilization:ks,close_focus:Is,quick:Fs,character:Ss,field_tips:Zs,body_notes:Ps,tc_compatible:As,sources:Cs,chris_frost:Ns,research_notes:zs},Rs="f-af-s-85-f14g",Ds="AF-S NIKKOR 85mm f/1.4G",Ls="AF-S 85 f/1.4G",Ms="F",Os="FTZ II",Ts="FX",Es="prime",Vs=[85],$s=[{focal_mm:85,f:1.4}],Xs=16,Bs=9,Hs=!0,Ws=595,js=77,Gs={on_z_body:"AF",cpu:!0,motor:"SWM (Silent Wave Motor, AF-S) with M/A full-time manual override",focus_throw_deg:null,notes:"Nikon's FTZ II page lists AF-S Type G lenses as fully supported for AF and AE. Photography Life's FTZ compatibility guide rates AF-S lenses fully compatible: AF, electronic rangefinder, peaking, aperture control, EXIF, distortion/vignetting control and IBIS all work. Phillip Reeve reports no limitations on Z bodies via the FTZ. Eye/subject detection: Nikon's FTZ II page does not mention it. Forum users on BCG report subject and eye detection working with adapted AF-S lenses in the wide-area, custom, 3D and auto modes, because the body does the detection. Treat this as user-reported (forum). Speed: Phillip Reeve calls AF slow next to the older AF-D, and says Nikon tuned the AF-S primes for accuracy over speed. Photography Life says it is more accurate than the AF-D, especially in low light. Ed Dozier (photoartfromscience, 2024) shot this lens on a Z8 and Z9, which requires an FTZ-type adapter (inference). He saw no sluggish AF until ambient light became very dim."},Ks={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:"3-axis (yaw, pitch, roll) via FTZ II on Z8 and Z5 II. None on Z50 II (no IBIS).",notes:"Nikon's FTZ II page says that with a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. The lens is a CPU lens, so it passes its focal length to IBIS automatically. Synchro VR needs a VR lens, so it does not apply. IBIS does not freeze dancer motion, so stage shutter speeds still have to be set for the subject."},Us={mfd_m:[{focal_mm:85,value:.85}],max_mag:[{focal_mm:85,value:.12}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"Nikon specifies MFD 0.85 m and maximum reproduction 0.12× (about 1:8.3). Phillip Reeve's page gives both 1:7.7 and 1:8.6 in different places, so the Nikon figure is used. Close up is a tight head-and-shoulders or face crop, not a detail lens. No source gives a working distance. Phillip Reeve (42MP A7R II): at close range the older AF-D was better at f/1.4–f/2, and the AF-S caught up at f/2.8."},qs={headline:"Creamy, flat-field FX portrait lens with full AF on Z: soft-ish but usable at f/1.4, crisp from f/2.8, peaks f/4–f/5.6, and has strong colour fringing in the blur wide open.",sweet_spot:"f/4–f/5.6",wide_open:"Center is decent at f/1.4 (Lenstip D3x: 30 lp/mm, right at their 'decency' level), and the edge is borderline wide open (Lenstip). Photozone (D3x) called the center excellent and the borders very good wide open. Strong LoCA (magenta in front, green behind) and about 1.8 EV corner vignetting at f/1.4.",by_focal:[{focal_mm:85,center_peak:"f/4–f/5.6",corners_peak:"f/4–f/5.6",wide_open_note:"Lenstip (D3x, 24.5MP FX) center: f/1.4 30, f/2 33, f/4 and f/5.6 about 44 lp/mm, against about 46–47 for the best primes. The edge passes the 'useful' level about 1 EV down from f/1.4. Photozone (D3x): extremely high center at f/4, and excellent borders and corners from f/4. photoartfromscience (D7000 DX): peak at f/5.6, with a slight drop at f/8 from diffraction. Lensrentals (optical bench, 2014): 'clearly the off-center champion' among Canon/Nikon/Sigma/Zeiss 85s, with a nearly flat field but a less sharp center than the Canon and Zeiss."}],close_up_best:"f/2.8–f/5.6",close_up_note:"Phillip Reeve: at close range the lens is weaker than the AF-D at f/1.4–f/2 and catches up at f/2.8. Its focus shift is worst close up. Z bodies autofocus at the shooting aperture up to f/5.6 (photoartfromscience, Z8/Z9), which removes the focus-shift error that plagued DSLRs. Tight face portraits at f/1.4 have razor-thin depth of field, so f/2.8 is the safer close-up choice (inference from depth of field, not measured).",diffraction_note:"photoartfromscience (D7000, 16MP DX, about 4.8 µm pitch): peak at f/5.6, and resolution 'drops a bit' at f/8 as diffraction sets in. The Z8's 4.35 µm pitch is slightly finer, so expect the same: best by f/5.6, softening visible from f/8, clearer at f/11–f/16. Lenstip (D3x, 5.9 µm) measured f/4 and f/5.6 equal at about 44 lp/mm. On the Z5 II (about 5.9 µm) f/8 costs little.",avoid:["Don't shoot high-contrast edges (white saree borders, jewellery, backlit hair) at f/1.4–f/2 if colour fringing matters: LoCA is strong and only partly fixable in post.","Don't expect sharp corners or even illumination at f/1.4 (about 1.8 EV vignetting). Stop to f/2.8 for group shots.","Don't stop past f/8 on the Z8 for sharpness: diffraction starts there."],confidence:"high",confidence_reason:"Lenstip (24MP FX), Photozone (24MP FX) and photoartfromscience (16MP DX) all measured a peak at f/4–f/5.6, and Lensrentals' bench confirms the strong off-center field. No measured test on a 45MP body was found, so wide-open per-pixel softness on the Z8 will look somewhat worse than these 24MP figures suggest, while the peak aperture should not move."},Js={bokeh:"Very smooth (Photozone: blur at a 'very high level'), with slight nervousness in the transition zone that eases a little stopped down. Nine rounded blades keep highlights round except toward the corners, where mechanical vignetting gives cat's-eye shapes at f/1.4 and somewhat at f/2. Minor outlining (Photozone). Phillip Reeve found the Sony 85 GM better in the corners, with less outlining and less cat's eye.",flare_sunstar:"Lenstip: 'quite good' against bright light. Phillip Reeve: veiling flare is still a problem even with the large hood, but ghosting is much improved over the AF-D. Distinct sunstars are hard to get (Reeve), because the rounded blades soften the points.",ca:"Lateral CA is low: Photozone measured a maximum of 0.9 px average at the borders at f/2 (D3x), and Lenstip rates it slight. Longitudinal CA is strong: Lenstip lists 'distinct longitudinal CA' as a con, Photozone saw magenta halos in front of focus and green behind, and Reeve saw clear bokeh fringing at f/1.4 that is still visible at f/2.8. Ed Dozier calls the spherochromatism mostly academic unless the subject is white.",distortion:"Slight barrel. Photozone: 'hardly field-relevant'. Lenstip: negligible.",vignetting:"Photozone (D3x, uncorrected JPEG): almost 1.8 EV in the corners at f/1.4, still potentially disturbing at f/2, not field-relevant from f/2.8. Lenstip: significant on FX, slight on DX. The Z bodies apply in-camera vignette control to AF-S lenses (Photography Life FTZ guide).",coma_astro:"Lenstip: slightly too much coma in FX corners wide open, well corrected on DX. Astigmatism 'sensationally corrected' (Lenstip).",focus_breathing:"Not measured by any source found.",other:"Focus shift from residual spherical aberration (Photozone: slight. Reeve: noticeable at f/2.8 close up. Dozier: severe on DSLRs). Z bodies focus at the taking aperture up to f/5.6, so this is largely solved on the Z8 and Z5 II (photoartfromscience, Z8/Z9). Introduced 2010, 10 elements in 9 groups, Nano Crystal Coat (Nikon). Lensrentals rates copy-to-copy variation excellent."},Qs=["Family portraits: f/2–f/2.8 gives the look with fewer fringes. Use f/4–f/5.6 for groups or when the eyes and jewellery must be biting sharp on the Z8.","Stage dance: f/1.4–f/2 is fine for light. Put eye-detect (Wide-area or Auto with People detection) on the dancer and keep the shutter at about 1/500 s or faster for hands and feet. AF is accurate rather than fast, so pre-focus on the dancer's position.","Watch for magenta/green fringing on bright edges wide open (white costume borders, gold jewellery, stage lights). Stop to f/2.8 or fix it with defringe in raw. Lateral CA correction alone won't remove it.","Focus shift isn't a worry on Z: the body focuses at the shooting aperture up to f/5.6. You can skip the AF fine-tune habits from the DSLR days.","On the Z50 II it frames like about 127mm, with no IBIS, so use 1/250 s or faster handheld, or a higher ISO."],Ys=[{body:"z8",note:"45.7MP (4.35 µm) shows f/1.4 softness and LoCA more than the 24MP tests suggest. Peak f/4–f/5.6, diffraction visible from f/8. AF at shooting aperture to f/5.6 removes the focus-shift problem (Dozier, Z8). 3-axis IBIS via FTZ II."},{body:"z5ii",note:"24.5MP FX matches the D3x test pixel pitch almost exactly, so the Lenstip and Photozone numbers apply directly: f/1.4 decent, peak f/4–f/5.6, f/8 still fine. 3-axis IBIS via FTZ II."},{body:"z50ii",note:"DX crop frames like about 127mm, and the vignetting and soft corners fall outside the frame. photoartfromscience's D7000 DX test (peak f/5.6, slight drop at f/8) is the closest match. No IBIS."}],ea=!1,ta=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor AF-S 85 mm f/1.4G (resolution + summary chapters)",url:"https://www.lenstip.com/264.4-Lens_review-Nikon_Nikkor_AF-S_85_mm_f_1.4G_Image_resolution.html",kind:"measured",tested_on:"Nikon D3x (24.5MP FX), RAW MTF50",date:null,findings:"Center MTF50: f/1.4 = 30 lp/mm, f/2 = 33, f/4 and f/5.6 about 44 (decency level about 30, best fixed lenses about 46–47). Edge (no numbers in text): borderline useful wide open across the full frame, exceeds that level about 1 EV down. Summary (https://www.lenstip.com/264.11-Lens_review-Nikon_Nikkor_AF-S_85_mm_f_1.4G_Summary.html) pros: splendid center, very good edges even on FX, slight lateral CA, negligible distortion, sensationally corrected astigmatism, quite good against bright light, fast, silent, accurate AF. Cons: significant FX vignetting, slightly too much coma in FX corners, distinct longitudinal CA."},{id:"photozone",name:"Photozone/OpticalLimits: Nikkor AF-S 85mm f/1.4G (FX) review",url:"https://www.photozone.de/nikon_ff/606-nikkorafs854ff?start=1",kind:"measured",tested_on:"Nikon D3x (24.5MP FX)",date:null,findings:"Center excellent wide open, extremely high at f/4. Borders and corners very good wide open, excellent from f/4. Slight focus shift when stopping down (residual spherical aberration). Lateral CA maximum 0.9 px average at the borders at f/2. Vignetting almost 1.8 EV at f/1.4 (uncorrected JPEG), disturbing at f/2, not field-relevant from f/2.8. Slight barrel distortion, hardly field-relevant. Bokeh at a very high level, slight nervousness in the transition zone, cat's-eye highlights toward the corners at f/1.4–f/2, small outlining. LoCA noticeable at large apertures: magenta in front of focus, green behind. MTF values are in chart images only."},{id:"photoartfromscience",name:"Photo Art From Science (Ed Dozier): Nikkor 85mm f/1.4 AF-S review",url:"https://www.photoartfromscience.com/single-post/2015-9-4-nikkor-85mm-f14-afs",kind:"measured",tested_on:"Nikon D7000 (16MP DX, about 4.8 µm), MTF50 (single copy)",date:"2015-09",findings:"Worst corner at f/1.4 about 28.3 lp/mm sagittal, about 31 meridional, roughly even across the DX frame. f/5.6 is 'peak resolution performance'. At f/8 diffraction starts and resolution drops a bit. Other per-aperture values are in chart images only. Focus shift: his copy needed fine-tune +1 at f/1.4, 0 at f/2, −4 further down. Spherochromatism: magenta in front, greenish behind, mostly academic unless the subject is white."},{id:"photoartfromscience_z",name:"Photo Art From Science (Ed Dozier): Nikon Z cameras fix spherical aberration focus shift",url:"https://photoartfromscience.com/single-post/nikon-z-cameras-fix-spherical-aberration-focus-shift",kind:"review",tested_on:"Nikon Z8 and Z9 (45.7MP) with the 85mm f/1.4 AF-S",date:"2024-01",findings:"Z cameras stop the lens down to the shooting aperture to autofocus, up to f/5.6. Beyond that they focus at f/5.6 and stop down at capture. With the 85/1.4 AF-S, which shifts focus badly on DSLRs, focus was 'nailed every single time at any aperture' (no measurements given). No sluggish AF on the Z8 or Z9 until ambient light got very dim."},{id:"lensrentals",name:"Lensrentals blog (Roger Cicala): Just the Lenses: Canon and Nikon mount 85mm f/1.4 (and 1.2) primes",url:"https://www.lensrentals.com/blog/2014/09/just-the-lenses-canon-and-nikon-mount-85mm-f1-4-and-1-2-primes/",kind:"measured",tested_on:"Optical bench (Olaf), lens only, multiple copies",date:"2014-09",findings:"Nikon 85/1.4G is 'clearly the off-center champion' and has a nearly perfectly flat field. Its center is not as sharp as the Canon 85L or Zeiss. Corner-to-corner copy variance rated excellent. MTF values are in charts only (not quoted)."},{id:"phillipreeve",name:"Phillip Reeve: Review Nikon AF-S 85mm 1.4G",url:"https://phillipreeve.net/blog/review-nikon-af-s-85mm-1-4g/",kind:"review",tested_on:"Sony A7R II (42MP FX) via adapter for controlled tests. Samples on D700/D800",date:null,findings:"Corners at infinity better than the AF-D wide open. Some fringing wide open, gone by about f/4–f/5.6. Focus shift noticeable at f/2.8 at close range, but no problem on Z bodies because they focus stopped down. Clear LoCA and purple fringing at f/1.4, still visible at f/2.8. Lateral CA almost absent. Veiling flare remains even with the hood, ghosting much improved. Sunstars hard to get. MFD 0.85 m. At close range the AF-D was better at f/1.4–f/2, and the AF-S catches up at f/2.8. AF slow vs the AF-D. No limitations on Z via the FTZ."},{id:"photographylife",name:"Photography Life: Nikon 85mm f/1.4G review",url:"https://photographylife.com/reviews/nikon-85mm-f1-4g/4",kind:"review",tested_on:"Nikon DSLRs (not stated on the page read)",date:"2010 (price note 2018)",findings:"Qualitative only on the page read. Sharp, good colour and contrast, beautiful subject isolation. AF possibly slower than the 85/1.4D but more accurate, especially in low light. Critical focus wide open in dim light needs care."},{id:"nikon_spec",name:"Nikon: AF-S NIKKOR 85mm f/1.4G product page",url:"https://imaging.nikon.com/imaging/lineup/lens/f-mount/singlefocal/normal/af-s_nikkor85mmf_14g/",kind:"manufacturer",tested_on:null,date:null,findings:"10 elements in 9 groups (Nano Crystal Coat). f/16 minimum. MFD 0.85 m. Max reproduction 0.12×. 9 rounded blades. 77 mm filter. About 595 g. 86.5 × 84 mm. M/A mode."},{id:"nikon_ftz_ii",name:"Nikon: Mount Adapter FTZ II product page",url:"https://www.nikon.ie/en_IE/product/accessories/mirrorless/mount-adapter-ftz-ii",kind:"manufacturer",tested_on:null,date:null,findings:"Full AF/AE with AF-S Type G/D/E, AF-P and AF-I lenses. With a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. No mention of eye/subject detection."},{id:"pl_ftz_guide",name:"Photography Life: Nikon FTZ and FTZ II adapter lens compatibility, explained",url:"https://photographylife.com/nikon-ftz-adapter-lens-compatibility",kind:"review",tested_on:null,date:null,findings:"AF-S lenses fully compatible: AF, electronic rangefinder, peaking, aperture control, EXIF, metering, distortion/vignetting control, diffraction compensation, focus shift shooting, IBIS. Eye detection not discussed."},{id:"bcg_forum",name:"BCG Forums thread: Does Z9 subject detection AF work using an F-mount lens and FTZ adapter?",url:"https://bcgforums.com/threads/does-z9-subject-detection-af-work-using-an-f-mount-lens-and-ftz-adapter.25416/",kind:"forum",tested_on:"Nikon Z9 with AF-S/AF-P telephotos",date:null,findings:"Users report subject and eye detection working with adapted AF-S/AF-P lenses in Wide-area S/L, custom, 3D and Auto modes. A dealer claim that Z lenses are required was contradicted. Not tested with this 85mm specifically."}],oa={url:null,access:"not-found",summary:"No Christopher Frost review of the AF-S 85mm f/1.4G was found. Searches for his name with this lens, a youtube.com-restricted search, and a check of the lensvid.com 'christopher frost' tag pages turned up no video on it. YouTube itself is blocked to fetching here. Nothing is attributed to him."},na="1) Test vintage: Lenstip and Photozone used a 24.5MP D3x (5.9 µm), photoartfromscience a 16MP D7000 DX, and Phillip Reeve a 42MP A7R II (qualitative). No measured MTF50 on a 45MP body was found. The peak aperture (f/4–f/5.6) is set by aberrations and diffraction and should hold on the Z8. Wide-open per-pixel softness and LoCA will be more visible on the Z8 than the numbers suggest. 2) DXOMARK measurement page was fetched, but its values are in interactive charts that could not be read, so none are quoted. The-Digital-Picture review page failed to load. 3) Eye-detection evidence for adapted AF-S lenses is forum-level (BCG). Nikon does not state it. 4) Dozier's Z8/Z9 article does not mention the adapter, but an F-mount lens can only mount on a Z8 via an FTZ-type adapter (inference). 5) Max magnification: Nikon 0.12×. Reeve's page shows conflicting 1:7.7 and 1:8.6, so it is not used. 6) tc_compatible false: Nikon AF-S teleconverters are designed for longer AF-S/AF-I telephotos, and this lens is not on the lists generally published (not re-verified this session). 7) DPReview's lab widget and Lensrentals' 2019 MTF graphs (referenced by Reeve) were not read.",ia={id:Rs,name:Ds,short:Ls,mount:Ms,adapter:Os,coverage:Ts,kind:Es,focal_mm:Vs,max_aperture:$s,min_aperture_f:Xs,aperture_blades:Bs,rounded_blades:Hs,weight_g:Ws,filter_mm:js,focus:Gs,stabilization:Ks,close_focus:Us,quick:qs,character:Js,field_tips:Qs,body_notes:Ys,tc_compatible:ea,sources:ta,chris_frost:oa,research_notes:na},sa="laowa-65-f28-2x-macro",aa="Venus Optics Laowa 65mm f/2.8 2x Ultra Macro APO (Nikon Z)",ra="Laowa 65 2x Macro",la="Z",ca=null,da="DX",ma="macro",ua=[65],ha=[{focal_mm:65,f:2.8}],fa=22,pa=9,ga=null,ba=335,wa=52,_a={on_z_body:"MF (manual-focus lens)",cpu:!1,motor:"None. Manual focus, manual aperture ring (full-stop clicks), no electronic contacts.",focus_throw_deg:null,notes:"Internal focusing: the length stays constant (Venus Optics; OpticalLimits). Long throw from 2:1 to infinity, reported as about 220° (OpticalLimits), about 240° (Dustin Abbott), about 260° (Amateur Photographer) and about 270° (Jonas Rask); the field is null because the figures differ. With no contacts there is no EXIF, no camera-controlled aperture and no focus-distance readout (OpticalLimits; Abbott). Abbott found peaking unreliable for precise portrait-distance focus, so use magnified view at longer distances. At 1:1–2:1, set the ring for the magnification you want and focus by moving the camera or a rail."},va={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:null,notes:"Native Z mount, so FTZ II does not apply. IBIS only, on the Z8 and Z5 II, and only if 65 mm is entered under Setup menu > Non-CPU lens data (Nikon Z8 manual: the data enables on-board VR for non-CPU lenses). The Z50 II has no IBIS for stills. At 1:1–2:1, shift (x/y) shake dominates and in-body VR helps little at these magnifications (general macro principle, not lens-specific testing); use flash or a tripod."},ya={mfd_m:[{focal_mm:65,value:.17}],max_mag:[{focal_mm:65,value:2}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:"About f/8.4 at 2:1 when set to f/2.8. Using N_eff ≈ N × (1 + m): f/5.6 at 1:1 and f/8.4 at 2:1. Amateur Photographer gives f/5.6 at 1:1 (−2 stops) and f/8 at 2:1 (−3 stops). The camera cannot show this value (no CPU); metering through the lens handles the exposure.",camera_displays_effective:!1,notes:`MFD 17 cm from the image plane at 2:1 (Venus Optics; Neocamera). No published working distance was found from Venus Optics or any reviewer. Estimated free working distance at 2:1: about 50–55 mm, computed as 170 mm MFD − 16 mm Z flange − about 100 mm lens length (Venus Optics Φ57 × 100 mm; whether the Z version's length includes the mount was not confirmed). Abbott says 1:1 gives only 'a couple of extra centimetres' over 2:1, so roughly 70–75 mm at 1:1 (estimate). Internal focus means the barrel does not grow toward the subject. Remove the hood at close range to avoid shading the subject (Abbott).

Effective aperture, N_eff ≈ N × (1 + m), computed:
- At 1:1 (×2, −2 stops): f/2.8→f/5.6, f/4→f/8, f/5.6→f/11, f/8→f/16, f/11→f/22, f/16→f/32.
- At 2:1 (×3, −3.2 stops): f/2.8→f/8.4, f/4→f/12, f/5.6→f/17, f/8→f/24, f/11→f/33, f/16→f/48.

Amateur Photographer reports the same (f/5.6 at 1:1, f/8 at 2:1). Jonas Rask observed only about 1 stop of exposure loss at 2x on Fuji bodies. That conflicts with the formula and with AP, so treat it as anecdotal. OpticalLimits found the aperture slightly inaccurate: marked f/22 behaves closer to f/14–f/16 at distance.`},ka={headline:"Superb APO 2:1 macro for DX: sharp from f/2.8 with no measurable CA. At 2:1 every marked stop is three stops smaller, so shoot f/2.8–f/4 and stack.",sweet_spot:"f/4–f/5.6 (at normal distances)",wide_open:"Excellent centre and very good borders at f/2.8; extreme DX corners 'good' (OpticalLimits). Abbott: excellent across the frame at f/2.8. DCW: centre very good wide open, peaking at f/4; corners more average.",by_focal:[{focal_mm:65,center_peak:"f/4–f/5.6",corners_peak:"f/5.6",wide_open_note:"OpticalLimits (Fuji X APS-C): f/2.8 centre excellent, borders very good, corners good; f/4 outer field improves noticeably; f/5.6 superb across the frame (best); f/8 marginal diffraction impact; f/16 still impressive. DCW (Canon EF-M lab): centre peak at f/4. AP (26MP X-T3): sharpest about f/5.6, visible softening beyond f/8."}],close_up_best:"1:1: f/4–f/5.6 set (f/8–f/11 effective). 2:1: f/2.8–f/4 set (f/8.4–f/12 effective) for maximum detail; f/5.6 (about f/17 effective) only when one frame must carry more depth.",close_up_note:"No source measured resolution at 1:1 or 2:1, so this is calculated. OpticalLimits saw marginal diffraction loss from f/8 at distance (APS-C), and Amateur Photographer saw softening 'almost immediately' at high magnification because effective apertures are small. Jonas Rask advises at least f/5.6 at 2x for usable depth of field and calls f/2.8 at 2x nearly useless (depth thinner than a hair). Best compromise: focus-stack at f/2.8–f/4 at 2:1 on the Z8's DX crop.",diffraction_note:"OpticalLimits (APS-C, distance): marginal impact at f/8, still impressive at f/16 (the marked f/22 is really about f/14–f/16). AP (26MP APS-C): visible softening beyond f/8. At 2:1 that onset (about f/8 effective) arrives at set f/2.8. On the Z8 DX crop (4.35 µm pitch) and Z50 II (about 4.2 µm), expect the same.",avoid:["Do not shoot FX image area on the Z8 or Z5 II: it is an APS-C lens (set Image area to DX manually; with no CPU the body cannot detect it).","Avoid set f/8 and smaller at 2:1 (f/24+ effective) except as a last resort.","Do not shoot into the sun without care: flare-prone (Abbott)."],confidence:"medium",confidence_reason:"One lab test (OpticalLimits, APS-C, verbal grades; values only in charts) plus DCW lab (centre peak f/4) and AP agree on f/4–f/5.6 at distance. Nothing measured at 1:1 or 2:1, and no working-distance figure is published, so the macro guidance is computed (low confidence on those parts)."},Ia={bokeh:"Generally good. OpticalLimits and Canon News: smooth foreground blur, harsher-edged background blur; highlights nice at f/2.8 with a hint of an outer ring, edgier and outlined at f/4–f/5.6 (blades not rounded at smaller apertures). Abbott: good with character, busy backgrounds acceptable, APO edge hardness mild. Rask and AP: creamy, beautifully blurred backgrounds.",flare_sunstar:"Abbott: 'somewhat flare prone', with ghosting and veiling into the sun and a noticeable loss of contrast in backlit portraits. Sunstars not tested by any source found.",ca:"APO: OpticalLimits found lateral CA practically non-existent and no axial CA (LoCA), which it calls unusual. Abbott: no visible LoCA even in high-contrast scenes. AP: no objectionable fringing of either kind. DCW: very well controlled.",distortion:"Virtually none (OpticalLimits, without correction; DCW 0.17%; Abbott very low).",vignetting:"Low: OpticalLimits about 0.7 EV wide open, fading by about f/5.6. Abbott: mild but extends well into the frame (+33 LR). AP: disappears in the macro range or at f/4.",coma_astro:"Not tested; not an astro lens.",focus_breathing:"Not measured. Internal focus, and strong breathing is inherent to going from infinity to 2:1.",other:"OpticalLimits scores: optics 9, build 7.5, price/performance 9. All metal, not weather sealed. About 100mm-equivalent field of view on DX (Venus Optics). Z version released February 2021 (Nikon Rumors)."},Fa=["Mount it, then set Image area to DX on the Z8/Z5 II and select the stored 65 mm f/2.8 Non-CPU lens data (for IBIS and EXIF).","At 2:1 the subject sits only about 5 cm from the front (estimate): take the hood off, light from the side or use a diffused flash.","Remember the hidden light loss: 2 stops at 1:1 and about 3 stops at 2:1. f/4 set is about f/8 at 1:1 and f/12 at 2:1.","For the sharpest 2:1 frames, shoot f/2.8–f/4 and focus-stack by rocking the camera or using a rail. Use f/5.6 only when one frame must carry more depth.","Expect no CA (APO) but watch flare: shade the front element when the sun is near the frame."],Sa=[{body:"z8",note:"Use DX crop (19.4MP, 4.35 µm): diffraction appears from about f/8 effective, which is set f/4 at 1:1 and set f/2.8 at 2:1. IBIS only with Non-CPU lens data; DX crop is not automatic with a contactless lens."},{body:"z5ii",note:"DX crop is about 11MP (computed from 6048 × 4032 /1.5²), with coarse pixels that tolerate smaller apertures (set f/5.6 at 2:1 is fine per pixel), but there is little to crop. IBIS needs Non-CPU lens data."},{body:"z50ii",note:"The natural body: native DX, 20.9MP (about 4.2 µm), about 100mm-equivalent framing. No IBIS, so use flash or a tripod at 1:1–2:1. Whether the Z50 II offers Non-CPU lens data was not verified."}],Za=!1,Pa=[{id:"opticallimits",name:"OpticalLimits: Laowa 65mm f/2.8 2x Ultra Macro APO review",url:"https://opticallimits.com/fujifilm/laowa-65mm-f-2-8-2x-ultra-macro-apo-review/",kind:"measured",tested_on:"Fujifilm X APS-C body (model/MP not stated on the page)",date:"2020-01 (updated 2024-06)",findings:"335 g, 57 × 100 mm, 52 mm, 9 blades, f/2.8–f/22 full-stop clicks, MFD 0.17 m, 2:1, 14/10 with 3 ED, internal focus, about 220° throw. Resolution (verbal; numbers only in charts): f/2.8 centre excellent, borders very good, extreme corners good; f/4 outer field noticeably better; f/5.6 superb across the frame (best); f/8 marginal diffraction; f/16 still impressive; f/22 more than usable because the true aperture is about f/14–f/16. Field curvature negligible. Distortion virtually none. Vignetting about 0.7 EV wide open. Lateral CA practically none; no axial CA. Bokeh: nice f/2.8 highlights with a slight outer ring, outlined at f/4–f/5.6; smooth foreground, harsher background; blades not curved stopped down. No close-up resolution figures. Scores 9 / 7.5 / 9."},{id:"dustinabbott",name:"Dustin Abbott: Laowa 65mm F2.8 Ultra 2x Macro Review",url:"https://dustinabbott.net/2020/02/laowa-65mm-f2-8-ultra-2x-macro-review/",kind:"review",tested_on:"Sony a6500 (24MP APS-C) and a7RIII in APS-C mode",date:"2020-02",findings:"Excellent across the frame at f/2.8 with little centre-to-corner fall-off; better at f/4 and f/5.6 (one of the best APS-C results he has seen). No visible LoCA. Bokeh good with character. 'Somewhat flare prone': ghosting and veiling into the sun, contrast loss in backlight. Vignetting mild but extends into the frame (+33). Distortion very low. About 240° throw (0.37 m to infinity per his note). MFD 17 cm at 2:1; 1:1 gives 'a couple of extra centimetres' of working distance over 2:1. Remove the hood at close range. No electronics: no EXIF, no focal length to IBIS. Peaking unreliable for precise portrait focus."},{id:"amateurphotographer",name:"Amateur Photographer: Laowa 65mm f/2.8 2x Ultra Macro review",url:"https://amateurphotographer.com/review/laowa-65mm-f-2-8-2x-ultra-macro-review/",kind:"review",tested_on:"Fujifilm X-T3 (26MP APS-C)",date:null,findings:"Effective aperture drops two stops at 1:1 (to f/5.6) and three stops at 2:1 (to f/8). About 260° focus travel from infinity to 17 cm. Wide open resolves impressive detail across the frame; sharpest about f/5.6 at longer distances, visible softening beyond f/8. At high magnification, diffraction softening is visible almost immediately. No objectionable lateral or longitudinal CA. Distortion essentially absent. Vignetting slight wide open, gone in the macro range or at f/4. Bokeh beautifully blurred. 'Sublime'."},{id:"dcw",name:"Digital Camera World: Laowa 65mm f/2.8 2x Ultra Macro APO review",url:"https://www.digitalcameraworld.com/reviews/laowa-65mm-f28-2x-ultra-macro-apo-review",kind:"measured",tested_on:"Canon EF-M body (model/MP not stated in text)",date:"2020-03",findings:"Lab: centre very good wide open through f/11, excellent peak at f/4; corners more average than expected. Per-aperture lw/ph values only in chart images. CA very well controlled at all apertures. Distortion 0.17. 9 blades, f/22 min, MFD 0.17 m. Verdict: 'ludicrously sharp' for the price; best on a tripod."},{id:"jonasrask",name:"Jonas Rask: The Laowa 65mm f/2.8 2x Ultra Macro APO review",url:"https://jonasraskphotography.com/2020/01/24/the-laowa-65mm-f-2-8-2x-ultra-macro-apo-review/",kind:"review",tested_on:"Fujifilm X-Pro3 (26MP) and X-H1 (24MP)",date:"2020-01",findings:"About 270° throw from 2x to infinity. In macro, use at least f/5.6; at 2x f/2.8 is 'about as useless as it gets' because the depth of field is thinner than a hair. Needed about 1 stop of extra exposure at 2x (observation, conflicts with AP). Creamy, pleasing out-of-focus areas."},{id:"canonnews",name:"Canon News: Laowa 65mm f/2.8 2x Ultra Macro APO review (summary of OpticalLimits)",url:"https://www.canonnews.com/laowa-65mm-f28-2x-ultra-macro-apo-review",kind:"review",tested_on:"Summarises the OpticalLimits Fuji test",date:"2020-02",findings:"Centre tack sharp at f/2.8, slight corner softness; f/5.6 'as good as it gets'. Lateral and axial CA and distortion non-existent. Bokeh good; background blur could be better; blades not curved stopped down. Not an independent test."},{id:"venus",name:"Venus Optics: Laowa 65mm f/2.8 2X Ultra-Macro APO product page",url:"https://www.venuslens.net/product/laowa-65mm-f-2-8-2x-ultra-macro-apo/",kind:"manufacturer",tested_on:null,date:null,findings:"APS-C format, 65mm f/2.8, 24.4° AOV, 14/10 with 3 ED, 9 blades, MFD 17 cm, 2:1, Φ57 × 100 mm, 335 g, 52 mm filter, internal focus keeps length constant, Nikon Z among mounts. No working distance, image circle or throw stated."},{id:"neocamera_nikonrumors",name:"Neocamera spec page (Nikon Z version) and Nikon Rumors Z-mount release post",url:"https://www.neocamera.com/lens/venus/laowa_65mm_f2.8_2x_macro/nz",kind:"manufacturer",tested_on:null,date:"2021-02",findings:"Neocamera: Z version 335 g, 57 × 100 mm, 52 mm, MFD 17 cm from the imaging plane, 2X, 9 blades, f/2.8–f/22, APS-C, internal focus, introduced 2021-02-19. Nikon Rumors (https://nikonrumors.com/2021/02/19/juts-released-laowa-65mm-f-2-8-2x-ultra-macro-apo-for-nikon-z-mount.aspx/amp): Z version 'just released' 2021-02-19, optimised for APS-C mirrorless."},{id:"nikon_z8_noncpu",name:"Nikon Z8 Online Manual: Non-CPU Lens Data",url:"https://onlinemanual.nikonimglib.com/z8/en/sum_non-cpu_lens_data_308.html",kind:"manufacturer",tested_on:null,date:null,findings:"Setup menu: record focal length and maximum aperture for a non-CPU lens to enable features normally reserved for CPU lenses, including on-board vibration reduction."}],Aa={url:null,access:"not-found",summary:"No Christopher Frost review of the Laowa 65mm f/2.8 2x Ultra Macro APO was found. A search with his name, a youtube.com-restricted search and an exact-title search returned only Dustin Abbott, Digital Camera World, OpticalLimits, Fstoppers and others. Nothing is attributed to him."},Ca="1) Every test was on Fuji X, Sony APS-C or Canon EF-M bodies (24–26MP APS-C). That matches the Z8 DX crop (19.4MP, 4.35 µm) and Z50 II (20.9MP) closely, so the verdicts transfer well, if anything slightly conservatively. No Nikon Z-specific test was found. 2) Working distance: no manufacturer or measured figure was found. 50–55 mm at 2:1 is computed from MFD (170 mm), Z flange (16 mm) and the 100 mm listed length. It assumes the 100 mm is measured from the mount and that the Z version keeps the same length, neither of which was confirmed. The 1:1 value is only inferred from Abbott's remark. Both are estimates, so working_distance_mm_at_max_mag is null. 3) Effective aperture: the formula N × (1 + m) agrees with Amateur Photographer (f/5.6 at 1:1, f/8 at 2:1). Jonas Rask's about-1-stop observation conflicts and is treated as anecdotal; pupil magnification for this lens is not published. 4) Focus throw: four figures between 220° and 270°, so null. 5) Rounded blades: AP says the diaphragm is curved; OpticalLimits and Canon News say it is not curved at smaller apertures. Null. 6) FX coverage: Venus Optics specifies APS-C. No test of the FX image area was found, so behaviour in FX mode is not documented here. Auto DX crop needs the lens to identify itself, which a contactless lens cannot (inference), so set DX manually. 7) Lens-cwi.pages.dev lists 12 blades and a 62 mm filter in its text, contradicting the manufacturer; it was ignored. 8) Close-up best apertures are computed from the f/8 diffraction onset (OpticalLimits, AP) and the effective-aperture factor. Low confidence.",Na={id:sa,name:aa,short:ra,mount:la,adapter:ca,coverage:da,kind:ma,focal_mm:ua,max_aperture:ha,min_aperture_f:fa,aperture_blades:pa,rounded_blades:ga,weight_g:ba,filter_mm:wa,focus:_a,stabilization:va,close_focus:ya,quick:ka,character:Ia,field_tips:Fa,body_notes:Sa,tc_compatible:Za,sources:Pa,chris_frost:Aa,research_notes:Ca},za="sigma-135-f18-art",xa="Sigma 135mm F1.8 DG HSM | Art (Nikon F)",Ra="Sigma 135 f/1.8 Art",Da="F",La="FTZ II",Ma="FX",Oa="prime",Ta=[135],Ea=[{focal_mm:135,f:1.8}],Va=16,$a=9,Xa=!0,Ba=1130,Ha=82,Wa={on_z_body:"AF",cpu:!0,motor:"HSM (Hyper Sonic Motor, ring-type) with full-time manual override. Three-position focus limiter: FULL, 0.875–1.5 m, 1.5 m–infinity.",focus_throw_deg:null,notes:"Sigma stated in 2018 that its current lenses keep full functionality on Nikon Z via the FTZ (TechRadar). Photography Life's FTZ guide lists Sigma HSM Art lenses as compatible. Firmware: in Oct 2018 and Jan 2019 Sigma released firmware for the Nikon-mount 135 Art (and 85 Art) that fixes occasional overexposure when stopping down from f/5.6 on Z bodies via the FTZ (Nikon Rumors). It is installed with the Sigma USB Dock (UD-01 for Nikon) and SIGMA Optimization Pro 1.5.0 or later, so check the lens firmware before relying on it. Z8 firmware 3.00 (July 2025): Nikon warned about installing it with non-NIKKOR lenses or non-FTZ adapters attached, and Tamron and Viltrox reported problems (Imaging Resource). Sigma was not named. Remove the Sigma before updating body firmware and test after. Eye/subject detection: no Sigma or Nikon statement found. BCG forum users report detection working with adapted F lenses generally (body-side), but not with this lens specifically. AF accuracy: TDP measured about 95% consistency at the center point on a 1D X II and the upper 80s% on a 5Ds R at f/1.8. Dustin Abbott found outer points less consistent on Canon. The Z bodies focus on-sensor, which removes DSLR phase-detect calibration error (inference)."},ja={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:"3-axis (yaw, pitch, roll) via FTZ II on Z8 and Z5 II. None on Z50 II (no IBIS).",notes:"Nikon's FTZ II page says that with a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. The Sigma reports its focal length over the CPU contacts, so IBIS should set itself. That is inference, not verified for this lens on Z. With about 1.26 kg of lens plus adapter, the FTZ II tripod-free design means the lens carries the load, so support the lens, not the body."},Ga={mfd_m:[{focal_mm:135,value:.875}],max_mag:[{focal_mm:135,value:.2}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 0.875 m and 1:5 (0.20×) per Photography Life and TDP specs. TDP measured 0.838 m on its copy. TDP: sharpness holds at minimum focus distance. Dustin Abbott: the Zeiss Milvus 135/2 did better at MFD. The 0.875–1.5 m limiter position is the close-portrait range."},Ka={headline:"One of the sharpest portrait lenses made: use it wide open at f/1.8 with confidence. It peaks around f/2.8–f/4, but it is heavy (about 1.26 kg with the FTZ II).",sweet_spot:"f/2.8–f/4",wide_open:"Excellent at f/1.8 across the frame. Lenstip (5D III, 22MP): FX edge 44.1 lp/mm wide open, higher than the Canon 135L's best center (43.2). Photozone (5Ds R, 50MP): center tack sharp and borders and corners very good at f/1.8. TDP (5Ds R): sharp corner to corner at f/1.8. Vignetting about 1.4–2 EV wide open.",by_focal:[{focal_mm:135,center_peak:"f/2.8",corners_peak:"f/4",wide_open_note:"Lenstip center record of 51.6 lp/mm at f/2.8 (5D III). Photozone (50MP): center improves only marginally stopped down, with the sweet spot at f/4 for excellent performance across the field. Lensrentals (10 copies, optical bench): MTF holds 'impressively well' to the corners, and one average copy at f/2.8 was markedly sharper than at f/1.8. TDP: corners improve modestly to f/4, mostly as vignetting clears."}],close_up_best:"f/2.8–f/4",close_up_note:"TDP (5Ds R): sharpness holds at MFD (0.20×). No source gives per-aperture data close up. The general f/2.8–f/4 peak is used. At 0.875 m, f/1.8 depth of field is only millimetres deep (inference), so stop down for whole-face sharpness. No focus shift (Lenstip, Photozone), so the focus point stays put as you stop down.",diffraction_note:"Photozone (Canon 5Ds R, 50MP, about 4.1 µm pitch, very close to the Z8's 4.35 µm): diffraction first noticeable at f/8, f/11 still usable. Expect the same on the Z8. On the Z5 II (about 5.9 µm), f/8 is effectively free.",avoid:["Don't stop down 'for safety' on portraits: f/1.8–f/2.8 is already excellent. Past f/5.6 you only lose resolution on the Z8.","Don't carry it by the body: support the lens, since the adapter joint takes about 1.26 kg.","Don't update Z8 firmware with the Sigma mounted. Keep the Sigma lens firmware current via the USB Dock."],confidence:"high",confidence_reason:"Photozone (50MP), Lenstip (22MP), TDP (50MP) and Lensrentals (bench) all agree: excellent at f/1.8, best around f/2.8–f/4, diffraction from f/8. Two of these tests used 50MP bodies, so the verdict transfers directly to the Z8. All are Canon-mount copies (same optics, Nikon mount not separately tested)."},Ua={bokeh:"Creamy and smooth. Photozone: transition blur 'perfectly symmetrical', virtually no outlining in highlights from f/1.8 to f/2.8 (slight at f/4), cat's eye in the corners wide open, reduced at f/2.8. Dustin Abbott: smoother transitions than the Sigma 85 Art. TDP notes an occasional seatbelt-like artifact in some highlights.",flare_sunstar:"Strong flare resistance. Dustin Abbott: much better than the Canon 135/2L. TDP: flare only starts to appear at f/16. 9 rounded blades give 18-point sunstars at narrow apertures (TDP).",ca:"Lateral CA is negligible: Lenstip max 0.02%, Photozone under 0.5 px. LoCA is low to moderate: Photozone saw purple in front and green behind, visible through f/4. Lenstip says it is noticeable (its only real con). TDP: mild at f/1.8, largely gone by f/2. Dustin Abbott: almost perfectly controlled. Far milder than the Nikon 85/1.4G.",distortion:"About 0.18% pincushion (Photozone), essentially none.",vignetting:"Photozone (5Ds R): 1.4 EV at f/1.8, irrelevant from f/2.8. TDP: about 2 stops at f/1.8, 1.5 at f/2, 0.5 at f/2.8, 0.3 at f/4. Lenstip lists noticeable FX vignetting wide open as a con. Nikon in-camera vignette control is not expected to support third-party lenses (inference), so correct it in raw.",coma_astro:"Lenstip: very good coma correction, slight astigmatism.",focus_breathing:"TDP: subjects noticeably change size with large focus changes (not quantified).",other:"No focus shift and no spherical-aberration issues (Lenstip, Photozone). Lensrentals' 10-copy sample was ti

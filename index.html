as the FTZ, without the tripod foot.",ko={aperture_loss_stops:0,magnification_factor:1,af_impact:"No AF motor in the adapter. AF-S, AF-P and AF-I lenses autofocus. Nikon warns AF may be slower and may fail on dark or low-contrast subjects in some combinations, and lists three DX lenses (18-55 VR, 18-55 VR II, 55-200 IF-ED) that may need repeated AF attempts.",notes:"Purely mechanical and electrical adapter with no glass, so no optical effect."},Io=[{class:"AF-S (Type G, E, D)",af:"Yes",mf_rangefinder:"Yes",exposure_modes:"All",metering:"All",aperture:"Camera-controlled",vr:"Lens VR works if present. Body IBIS combines with it (see stabilization)."},{class:"AF-P (Type G, E)",af:"Yes",mf_rangefinder:"Yes",exposure_modes:"All",metering:"All",aperture:"Camera-controlled",vr:"Lens VR works if present.",notes:"Focus position may shift if the camera is turned off and on after focusing."},{class:"AF-I (Type D)",af:"Yes",mf_rangefinder:"Yes",exposure_modes:"All",metering:"All",aperture:"Camera-controlled (lock the aperture ring at minimum)",vr:"None in lens. Body IBIS on Z8 and Z5II."},{class:"E-type (electromagnetic diaphragm)",af:"Yes if AF-S or AF-P",mf_rangefinder:"Yes",exposure_modes:"All",metering:"All",aperture:"Camera-controlled electronically",vr:"As per lens"},{class:"G-type (no aperture ring)",af:"Yes if AF-S or AF-P. No if screw-drive AF G.",mf_rangefinder:"Yes",exposure_modes:"All",metering:"All",aperture:"Camera-controlled",vr:"As per lens"},{class:"AF Type G/D screw-drive (AF, AF-D, AF Micro, AF DC)",af:"No (MF only)",mf_rangefinder:"Yes (focus indicator)",exposure_modes:"All",metering:"All",aperture:"Camera-controlled. Set the aperture ring to minimum aperture before mounting.",vr:"No lens VR. Body IBIS 3-axis on Z8 and Z5II."},{class:"Other AF lenses (e.g. F3AF type)",af:"No",mf_rangefinder:"No",exposure_modes:"A and M (per Nikon table; reading of a garbled table)",metering:"Yes",aperture:"-",vr:"Body IBIS on Z8 and Z5II"},{class:"AI-P (CPU manual focus)",af:"No",mf_rangefinder:"No",exposure_modes:"A and M (per Nikon table; reading of a garbled table)",metering:"Yes",aperture:"Aperture ring",vr:"Body IBIS on Z8 and Z5II, using the focal length the CPU passes."},{class:"PC-E / PC 19mm f/4E",af:"No",mf_rangefinder:"No",exposure_modes:"A and M",metering:"Yes",aperture:"Lens/camera per type",vr:"Body IBIS"},{class:"PC Micro 85mm f/2.8D",af:"No",mf_rangefinder:"No",exposure_modes:"M only",metering:"Yes",aperture:"Aperture ring",vr:"Body IBIS"},{class:"Non-CPU (AI, AI-S, Series E)",af:"No",mf_rangefinder:"No",exposure_modes:"A and M only",metering:"Yes. Highlight-weighted falls back to center-weighted.",aperture:"Aperture ring",vr:"Body IBIS on Z8 and Z5II. Enter focal length and max aperture in Non-CPU lens data so IBIS and EXIF are correct."}],Fo={non_vr_f_lenses:"Z8 and Z5II: 3-axis in-body correction (yaw, pitch, roll), per Nikon's FTZ II product page as recorded in the existing lens record f-af-micro-60-f28d. Not re-fetched here. Z50II: none (no IBIS).",vr_f_lenses:"Lens VR handles pitch and yaw. Nikon's FTZ guide says in-camera VR works together with lens VR across pitch, yaw and roll, and the lens VR switch takes precedence.",synchro_vr:"Not supported with F lenses (Nikon FTZ guide).",focus_point_vr:"Z5II Focus-point VR needs non-VR NIKKOR Z lenses, so it is not available with F lenses."},So=["Z TELECONVERTER TC-1.4x and TC-2.0x cannot be used with the FTZ or FTZ II.","F-mount AF-S and AF-I teleconverters work only with Nikon's listed lenses. AF may be slower or fail in low contrast.","Focus shift shooting works with AF-S and AF-P lenses only. Focus position auto reset is disabled and no peaking stack image is recorded.","Save/Recall focus position roles are disabled with F lenses.","The Auto Capture 'Distance' criterion (Z8) may not work well with F lenses.","Vignette control and Auto distortion control have no effect on PC-E, AI-P, PC Micro, non-CPU and older non-G/E/D AF lenses.","The electronic rangefinder may be inaccurate with some AF-S, AF-P and AF-I lenses. AF fine-tune may help.","Non-CPU lenses: enter Non-CPU lens data (focal length, max aperture) for correct IBIS and EXIF.","Third-party F-mount lenses (Sigma, Tokina, Zeiss ZF.2, Voigtländer SL II) are not covered by Nikon's guide. Behavior is unverified."],Zo="Z8 (FW 3.00+), Z5II and Z50II have MF subject detection. Nikon sources fetched here do not say whether F lenses on the FTZ II are supported. J.M. Peltier (Zf/Z6III) reports that it works with non-CPU and CPU F lenses, that the ERF works with CPU lenses that pass distance data, and that some AF-D lenses are uncertain. Low confidence for the owner's bodies.",Po=[{lens_id:"f-af-micro-60-f28d",class:"AF Type D screw-drive",on_ftz_ii:"MF only with electronic rangefinder. Metering and all exposure modes work. Body IBIS 3-axis on Z8 and Z5II. Focus shift shooting not supported (not AF-S/AF-P)."},{lens_id:"f-af-s-85-f14g",class:"AF-S Type G",on_ftz_ii:"Full AF. All modes. Body IBIS 3-axis on Z8 and Z5II. Focus shift shooting supported."},{lens_id:"f-af-dc-105-f2d",class:"AF Type D screw-drive",on_ftz_ii:"MF only with electronic rangefinder. Body IBIS 3-axis on Z8 and Z5II. Set the aperture ring to minimum."},{lens_id:"f-af-50-f18d",class:"AF Type D screw-drive",on_ftz_ii:"MF only with electronic rangefinder. Body IBIS 3-axis on Z8 and Z5II."},{lens_id:"sigma-135-f18-art",class:"Third-party HSM (in-lens motor)",on_ftz_ii:"Has its own motor, so AF is expected, but it is not in Nikon's guide. Behavior unverified here."},{lens_id:"zeiss-milvus-35-f2-zf2",class:"Third-party CPU manual lens (ZF.2), if F mount",on_ftz_ii:"Manual focus. Nikon's table for comparable AI-P lenses lists modes A and M only. Unverified for ZF.2."},{lens_id:"voigtlander-58-f14-sl2",class:"Third-party CPU manual lens, if F mount",on_ftz_ii:"Manual focus. Mount and CPU version to confirm."},{lens_id:"tokina-100-f28-macro",class:"Unknown (mount/version to confirm)",on_ftz_ii:"If it is the F-mount screw-drive AT-X Pro D, MF only. Unverified."}],Ao=["Screw-drive lenses (AF-D Micro 60, DC 105, 50 f/1.8D) are manual focus on every Z body. Use the green focus-point indicator or magnified view and focus peaking.","Lock the aperture ring at minimum (largest f-number) on D lenses before mounting, or the camera will show an error.","On the Z50II there is no IBIS, so non-VR F lenses are unstabilized. Raise the shutter speed.","For focus stacking with F glass, only AF-S and AF-P lenses (e.g. the 85 f/1.4G) work with in-camera focus shift.","The Z teleconverter will not fit through the FTZ II."],Co=[{id:"ftz-guide",name:"Nikon: Using F-mount NIKKOR lenses with the FTZ II/FTZ mount adapter (PDF, SB3J11(11))",url:"https://download.nikonimglib.com/archive6/amgQQ00igi0U06sJjMP25JWC2H05/FTZ_CompatibleFmount_(En)11.pdf",kind:"manufacturer",tested_on:null,date:"undated, copyright 2018 (revision 11)",findings:"Compatibility table by lens class. AF-P focus-shift-after-power-cycle note. Focus shift works with AF-S/AF-P but auto reset is disabled. Z TCs cannot be used. No Synchro VR. Save/Recall focus position disabled. The Auto Capture Distance criterion may not work. Vignette and distortion control limits. Non-CPU lens data required."},{id:"wiki-mirror-zmount",name:"Nikon Z-mount (Wikipedia mirror, wiki.riteme.site)",url:"https://wiki.riteme.site/wiki/Nikon_Z",kind:"forum",tested_on:null,date:null,findings:"Metering, IBIS and EXIF work with any F lens. AF only with AF-I, AF-S and AF-P. Z TCs cannot be used with the FTZ. The FTZ II drops the tripod foot."},{id:"peltier-mfsd",name:"J.M. Peltier: Manual focus subject detection on Nikon Z",url:"https://www.jmpeltier.com/manual-focus-subject-detection-nikon-z/",kind:"review",tested_on:"Nikon Zf / Z6III",date:"2024-09-16 (updated 2026-07-11)",findings:"MF subject detection works with CPU and non-CPU F lenses. ERF works with CPU lenses that pass distance data. AF-D lenses are uncertain."}],No="The 3-axis (yaw, pitch, roll) IBIS claim for non-VR F lenses comes from Nikon's FTZ II product page as cited in the existing lens record f-af-micro-60-f28d. That page could not be re-fetched in this run (Nikon product pages returned errors), so no URL is listed. The 'A and M only' entries for 'Other AF' and AI-P lenses come from a partly garbled PDF table; the PDF text explicitly confirms them for non-CPU and PC Micro lenses. The FTZ II's own weight and dimensions were not captured. Third-party F lenses are not covered by Nikon. The mounts of the Zeiss, Voigtländer and Tokina lenses should be confirmed against the kit. The web search budget ran out before third-party lens behavior on the FTZ II could be researched.",zo={id:bo,name:wo,kind:_o,short:vo,summary:yo,effects:ko,compatibility_classes:Io,stabilization:Fo,limitations:So,mf_subject_detection_with_f_lenses:Zo,compatible_lenses:Po,field_tips:Ao,sources:Co,research_notes:No},xo="z-tc-14x",Ro="Nikon Z TELECONVERTER TC-1.4x",Do="teleconverter",Lo="Z TC-1.4x",Mo="Multiplies focal length and maximum magnification by 1.4 at the cost of 1 stop of light. It fits only Nikon's listed Z telephotos. On the owner's kit that means the 70-200 f/2.8 VR S and the 180-600 VR. It does not fit the MC 105.",Oo={aperture_loss_stops:1,focal_factor:1.4,magnification_factor:1.4,magnification_notes:"The teleconverter does not change the lens's minimum focus distance, so maximum magnification rises by about 1.4× (focal length ×1.4 at the same distance). Working distance is essentially unchanged; the TC adds length on the camera side.",af_impact:null,sharpness_impact:null,notes:"The camera displays and meters the effective aperture (f-number × 1.4). Measured AF-speed and sharpness losses for these specific combos were not found in this run, so those fields are null."},To=[{lens_id:"z-70-200-f28-vr-s",native:"70–200 mm f/2.8",with_tc:"98–280 mm f/4",z50ii_fov_equiv:"147–420 mm FX-equivalent",notes:"f/2.8 × 1.4 = f/3.92, displayed as f/4."},{lens_id:"z-180-600-vr",native:"180–600 mm f/5.6–6.3",with_tc:"252–840 mm f/8–9",z50ii_fov_equiv:"378–1260 mm FX-equivalent",notes:"f/5.6 × 1.4 = f/7.84, shown as f/8. f/6.3 × 1.4 = f/8.82, shown as f/9. f/9 is at or near diffraction onset on the Z8's 4.35 µm and Z50II's 4.22 µm pixels."}],Eo={official_list_as_found:["NIKKOR Z 70-180mm f/2.8","NIKKOR Z 70-200mm f/2.8 VR S","NIKKOR Z 100-400mm f/4.5-5.6 VR S","NIKKOR Z 180-600mm f/5.6-6.3 VR","NIKKOR Z 400mm f/2.8 TC VR S","NIKKOR Z 400mm f/4.5 VR S","NIKKOR Z 600mm f/4 TC VR S","NIKKOR Z 600mm f/6.3 VR S","NIKKOR Z 800mm f/6.3 VR S"],list_source_note:"This list is from a Wikipedia mirror, not a Nikon page; Nikon's product pages returned errors in this run. Newer lenses (e.g. a 70-200mm f/2.8 VR S II, which appears in Nikon's 2026 Download Center) may be compatible but are not on this list. Check Nikon's current TC-1.4x compatibility list.",owner_lenses:[{lens_id:"z-70-200-f28-vr-s",compatible:!0,notes:"Listed. The owner's main TC use."},{lens_id:"z-180-600-vr",compatible:!0,notes:"Listed."},{lens_id:"z-mc-105-f28-vr-s",compatible:!1,notes:"Not on the compatibility list. Z teleconverters have a protruding front element that fits only the listed telephotos' recessed rear groups. Do not try to mount it."},{lens_id:"z-24-120-f4-s",compatible:!1,notes:"Not listed."},{lens_id:"z-dx-50-250-vr",compatible:!1,notes:"Not listed."}]},Vo=[{body:"z8",note:"AF and subject detection behavior with the TC at f/8–9 was not verified from measured sources in this run."},{body:"z5ii",note:"The TC lenses are VR lenses, so Focus-point VR does not apply. Normal IBIS plus lens VR."},{body:"z50ii",note:"No IBIS, but both compatible lenses have lens VR. The 1.5× DX crop stacks with the TC (180-600 + TC covers 378–1260 mm FX-equivalent)."}],$o=["FTZ / FTZ II: Z teleconverters cannot be used with F lenses through the adapter (Nikon FTZ guide)."],Xo=["Budget 1 stop: the 70-200 becomes 98–280 f/4, and the 180-600 becomes 252–840 f/8–9. Raise ISO or lower shutter speed accordingly.","Close-up bonus: on the 70-200 the TC raises maximum magnification by 1.4× at the same minimum focus distance. That is handy for butterflies and flowers.","Never try it on the MC 105 or other unlisted lenses. The TC's front element can collide with the lens's rear element.","At 840 mm f/9, stop down little or not at all. f/9 is at or near diffraction onset on all three bodies (check the app's per-body diffraction figure).","Mount the TC to the lens first, then the pair to the camera, and change it out of wind and dust."],Bo=[{id:"wiki-mirror-zmount",name:"Nikon Z-mount (Wikipedia mirror, wiki.riteme.site)",url:"https://wiki.riteme.site/wiki/Nikon_Z",kind:"forum",tested_on:null,date:null,findings:"Lists the TC-1.4x/TC-2.0x compatible lenses: 70-180 f/2.8, 70-200 f/2.8 VR S, 100-400 VR S, 180-600 VR, 400 f/2.8 TC VR S, 400 f/4.5 VR S, 600 f/4 TC VR S, 600 f/6.3 VR S, 800 f/6.3 VR S. Z TCs cannot be used with the FTZ."},{id:"ftz-guide",name:"Nikon: Using F-mount NIKKOR lenses with the FTZ II/FTZ (PDF)",url:"https://download.nikonimglib.com/archive6/amgQQ00igi0U06sJjMP25JWC2H05/FTZ_CompatibleFmount_(En)11.pdf",kind:"manufacturer",tested_on:null,date:null,findings:"The Z-series TC-1.4x and TC-2.0x cannot be used with the FTZ or FTZ II."}],Ho="1 stop, ×1.4 focal length and ×1.4 maximum magnification at an unchanged MFD are standard teleconverter optics; the brief supplied them and they are consistent with the list above. The compatibility list comes from a Wikipedia mirror because Nikon USA and Nikon Asia product pages failed to load and the web search budget ran out. Confidence is medium for the listed lenses and medium for the MC 105 being incompatible (absent from the list; the mechanical reason is general Z-TC design knowledge, not a fetched Nikon statement). No measured AF or sharpness impact (Photography Life, Lenstip, DPReview) was retrieved for the 70-200 + TC or 180-600 + TC, so af_impact and sharpness_impact are null. Weight, optical construction and weather sealing of the TC were not captured.",Wo={id:xo,name:Ro,kind:Do,short:Lo,summary:Mo,effects:Oo,effective_combos:To,compatible_lenses:Eo,body_notes:Vo,not_compatible_with:$o,field_tips:Xo,sources:Bo,research_notes:Ho},jo="z50ii",Go="Nikon Z50II",Ko="DX",Uo={effective_mp:20.9,width_px:5568,height_px:3712,width_mm:23.5,height_mm:15.7,pixel_pitch_um:4.22,type:"CMOS (same 20.9 MP sensor as the Z50). Photography Life calls it BSI. Not stacked.",olpf:!1,readout_ms:45,readout_notes:"Stills, electronic shutter: about 1/22 s (about 45 ms), measured by mplough (Jan 2025). The figure is the same as the Z50 and Z30. That makes the e-shutter (silent mode) unsuitable for moving subjects. Bit depth of that measurement not stated. Video readout not found."},qo={base:100,native_range:"100–51200",extended:"Hi 0.3–Hi 2 (ISO 204800 equivalent). No Lo setting for stills.",dual_gain_notes:null,ptp_notes:"PhotonsToPhotos published Z50II data (Nikon Rumors, 2026-02-05), but the chart could not be read here. Dual-gain point unverified."},Jo={cipa_stops:null,synchro_vr_stops:null,focus_point_vr:!1,notes:"No in-body image stabilization (confirmed). Digital Camera World says the Z50II, like the Z50, relies on VR lenses for stabilized stills. Photography Life's spec table lists 'No IBIS'. Nikon's spec lists only electronic VR for video. Stills stabilization comes only from VR lenses (the owner's DX 12-28 PZ VR, 16-50 VR, 18-140 VR and 50-250 VR). The Sigma 30/56 DC DN and F lenses on the FTZ II get no stabilization."},Qo={mechanical:!0,efcs:!0,electronic_fastest:"1/4000 (Nikon lists a single 1/4000–30 s range)",flash_sync:"1/200 s (Photography Life). Nikon lists 1/250 or 1/200 s or slower, with a reduced flash range between 1/200 and 1/250. Auto FP high-speed sync up to 1/4000 s.",slowest:"30 s standard. 900 s in M with extended shutter speeds (up from 30 s on the Z50). Bulb and Time also available.",notes:"Vertical-travel focal-plane mechanical shutter, electronic front-curtain, and electronic shutter. There is no shutter or shield closure at shutdown and no built-in sensor cleaning, so the sensor is exposed during every lens change."},Yo={max_fps_raw:"About 11 fps with the mechanical shutter (C-H extended). Nikon also lists 15 fps in silent mode for C-H extended. RAW support at that rate is not confirmed, and the 45 ms readout makes it poor for motion anyway.",pre_release_capture:"Yes, in C15 and C30 (High-Speed Frame Capture+), JPEG only. Buffers up to 1 s before the full press. FW 1.01 made it usable with the SmallRig SR-RG2 grip.",notes:"C-L 1–5 fps. C-H 5.6 fps (9.7 fps silent, non-RAW). C-H extended about 11 fps (15 fps silent). C15/C30 JPEG only (Digital Camera World)."},en={subject_detection:["People (face, eye)","Animals (dogs, cats)","Birds","Vehicles (cars, motorcycles, bicycles, trains)","Airplanes"],low_light_ev:"−9 to +19 EV (f/1.2 lens, ISO 100, 20 °C, AF-S). Photography Life standardizes this to −7.5 EV at f/2.",notes:"209 points. Nine subject types (Digital Camera World). The exact list is inferred from the Z8/Z9 nine-type set it is said to match, and the bird item rests on a Wikipedia mirror, so confidence is medium. The manual lists AF/MF subject detection options."},tn="AF-S, AF-P and AF-I lenses: full AF with electronic rangefinder. Screw-drive AF and AF-D lenses: MF only, with electronic rangefinder. AI-P and non-CPU (AI/AI-S) lenses: MF, modes A and M only. Non-CPU lenses need Non-CPU lens data. No body stabilization for any F lens, because the Z50II has no IBIS; only VR F lenses are stabilized, by their own VR. FX F lenses give a 1.5× field of view. Focus shift shooting works with AF-S and AF-P lenses, but auto reset is disabled. Z teleconverters cannot be used on the FTZ II. See accessories/ftz-ii.json.",on={mp:null,notes:"Native DX body. FX lenses give a 1.5× field of view."},nn=[{name:"Pixel shift",available:!1,firmware:null,notes:"Photography Life lists no sensor-shift high-res mode. It is not in the Z50II Reference Guide TOC, and there is no IBIS to drive it."},{name:"Focus shift shooting",available:!0,firmware:"launch",notes:"Confirmed by the Z50II Reference Guide (up to 300 shots, step width 1–10, AF-A/AF-S/AF-C). Photography Life's spec table says 'no focus stacking'; the manual takes precedence."},{name:"Auto capture",available:!1,firmware:null,notes:"Not in the Z50II Reference Guide TOC."},{name:"Bird detection",available:!0,firmware:"launch",notes:"Listed among subject-detection types by a Wikipedia mirror. Medium confidence."},{name:"Starlight View",available:!0,firmware:"launch",notes:"Custom setting d11 (photo Lv) in the manual TOC."},{name:"High-frequency flicker reduction",available:!0,firmware:"launch",notes:"In the photo menu, alongside Photo flicker reduction (manual TOC)."},{name:"MF subject detection",available:!0,firmware:"launch",notes:"The spec page mentions AF/MF subject detection options. F-lens support is unverified by Nikon."},{name:"Imaging Recipes (formerly Cloud Picture Control)",available:!0,firmware:"launch; renamed in 1.10",notes:"Through Nikon Imaging Cloud. A dedicated Picture Control button gives 31 presets."},{name:"Flexible Color Picture Control",available:!0,firmware:"launch",notes:"Created in NX Studio (Photography Life; Wikipedia mirror)."},{name:"Hi-Res Zoom",available:!0,firmware:"launch",notes:"Video at 1080p 24/25/30."},{name:"Pre-release capture",available:!0,firmware:"launch",notes:"JPEG only, in C15/C30."}],sn={internal_raw:"None (no RAW video).",log:"N-Log (10-bit H.265) and HLG.",notes:"4K UHD to 60p (4K/60 adds a 1.5× crop). 4K/30 oversampled from 5.6K. 1080p to 120p. Electronic VR for video only. Recording beyond 2 hours per Nikon's press release (Photography Life notes a conflicting 30-min figure in the spec table)."},an={current:"1.11",date:"2026-08-05",notable_changes:"1.11 (2026-08-05): Simplified/Traditional Chinese menu names only. 1.10 (2026-07): Cloud Picture Control renamed Imaging Recipe, Download Imaging Recipes, 'On saving user settings' for Save focus position, automatic monitor display switch, Wi-Fi Always ON, FTP inactive timeout, aperture freed in S mode video, HDMI output behavior after recording. 1.03 (2025-11-05): Imaging Cloud defaults, new Picture Control acquisition method, RAW and video freeze fixes. 1.01 (2025-04-16): pre-release capture with the SmallRig SR-RG2 grip."},rn="EN-EL25a (EN-EL25 also fits). CIPA 230 shots (EVF) / 250 (LCD) per Photography Life. USB-C PD charging in camera. One SD UHS-II slot.",ln=["The sensor is fully exposed at every lens change: no shutter closure at power-off and no built-in sensor cleaning. Change lenses mount-down, out of the wind, and carry a blower.","No IBIS: with the Sigma 30/56 or any non-VR or F lens, use about 1/(2 × focal length × 1.5) or faster for stills, or a support.","The electronic (silent) shutter reads out in about 1/22 s. Use the mechanical shutter for anything that moves, and silent mode only for static subjects.","C15/C30 and pre-release capture are JPEG only. Switch quality to JPEG first, or use about 11 fps mechanical for RAW.","The top shutter speed is 1/4000. With f/1.4 primes in bright sun at ISO 100 you will run out of speed, so carry an ND filter.","Focus shift shooting is available (up to 300 frames) for focus stacking, even though some reviews say otherwise."],cn=[{id:"z50ii-manual-spec",name:"Nikon Z50II Reference Guide: Specifications",url:"https://onlinemanual.nikonimglib.com/z50II/en/15-08.html",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"20.9 MP. 23.5 × 15.7 mm. DX L 5568 × 3712. Mechanical, EFCS and electronic shutters. 1/4000–30 s, 900 s in M. Flash 1/250 or 1/200, FP to 1/4000. C-L 1–5, C-H 5.6/9.7, C-H extended 11/15, C15/C30 with pre-release. ISO 100–51200, Hi to 204800. Electronic VR for video only. AF −9 to +19 EV. EN-EL25a. SD UHS-II. 4K60, N-Log."},{id:"z50ii-manual-focusshift",name:"Nikon Z50II Reference Guide: Focus shift shooting (and TOC)",url:"https://onlinemanual.nikonimglib.com/z50II/en/09-03-33.html",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"Focus shift up to 300 shots. The TOC lists High-frequency flicker reduction, d11 Starlight view and Vibration reduction (lens VR). No pixel shift, no auto capture."},{id:"dcw-compare",name:"Digital Camera World: Nikon Z50 II vs Z50",url:"https://www.digitalcameraworld.com/buying-guides/nikon-z50-ii-vs-nikon-z50",kind:"review",tested_on:null,date:null,findings:"No IBIS: relies on VR lenses for stills. 11 fps mechanical. 30 fps JPEG-only Frame Capture+. Pre-release capture. Nine subject types. EXPEED 7. EVF 1000 cd/m²."},{id:"pl-announce",name:"Photography Life: Nikon Z50 II announced",url:"https://photographylife.com/news/nikon-z50-ii-announced-autofocus-and-video-improvements/amp",kind:"review",tested_on:null,date:"2024-11",findings:"4.22 µm pitch. No low-pass filter. 1/4000 max. Flash sync 1/200. 900 s. No sensor protection at shutdown. No IBIS, no pixel shift, 'no focus stacking' (contradicted by the manual). Pre-release JPEG only. −7.5 EV at f/2. One SD UHS-II slot. CIPA 230/250."},{id:"mplough",name:"Measuring camera sensor readout speeds (mplough)",url:"https://mplough.github.io/2025/01/30/camera-sensor-readout-speeds.html",kind:"measured",tested_on:"Nikon Z50II",date:"2025-01-30",findings:"Z50II readout about 1/22 s (about 45 ms), the same as the Z50 and Z30."},{id:"wiki-mirror",name:"Nikon Z50II (Wikipedia mirror, cavac.at)",url:"https://cavac.at/cavacopedia/Nikon%20Z50II",kind:"forum",tested_on:null,date:null,findings:"No IBIS. No AA filter. No built-in sensor cleaning. Focus shift present. Subject detection includes birds. Firmware 1.01–1.03 history. Low weight, used as a corroborating source only."},{id:"nikon-dc-2026",name:"Nikon Download Center: 2026 updates",url:"https://downloadcenter.nikonimglib.com/en/update/index/2026.html",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"Z50II firmware 1.11 dated 2026-08-05."},{id:"nr-fw111",name:"Nikon Rumors: minor firmware update for the Z50II",url:"https://nikonrumors.com/2026/08/05/nikon-released-a-minor-firmware-update-for-the-z50ii-camera.aspx/",kind:"review",tested_on:null,date:"2026-08-05",findings:"1.11 changes Chinese menu item names only."},{id:"nr-fw110",name:"Nikon Rumors: Z50II firmware 1.10",url:"https://nikonrumors.com/2026/07/06/nikon-z50ii-firmware-update-version-1-10-released.aspx/amp/",kind:"review",tested_on:null,date:"2026-07-06",findings:"Imaging Recipe rename, Save focus position option, monitor auto switch, Wi-Fi Always ON, FTP timeout, aperture freed in S mode video, HDMI change."},{id:"cined-recipes",name:"CineD: Nikon and RED Imaging Recipes",url:"https://www.cined.com/nikon-and-red-release-nine-free-image-recipes-for-select-z-mount-cameras/",kind:"review",tested_on:null,date:"2025-12-10",findings:"Z50II is a compatible camera."},{id:"ftz-guide",name:"Nikon: Using F-mount NIKKOR lenses with the FTZ II/FTZ (PDF)",url:"https://download.nikonimglib.com/archive6/amgQQ00igi0U06sJjMP25JWC2H05/FTZ_CompatibleFmount_(En)11.pdf",kind:"manufacturer",tested_on:null,date:null,findings:"F-lens compatibility classes."}],dn="Pixel pitch = 23.5 / 5568 × 1000 = 4.2205, rounded to 4.22 µm (matches Photography Life). No IBIS is confirmed by three independent sources. Conflict: Photography Life says no focus stacking, but the Nikon Z50II Reference Guide has a Focus shift shooting page, and the manual wins. Sensor type: Photography Life calls it BSI and other sources only say CMOS, so stacking or BSI status is low confidence. The readout figure comes from a single hobbyist measurement (mplough), so confidence is medium. Whether RAW is allowed at the C-H extended 15 fps silent rate is not confirmed. The dual-gain ISO is unknown (PtP chart unreadable). The exact list of nine subject types is not quoted from Nikon text that was fetched. The web search budget ran out before these could be checked.",mn={id:jo,name:Go,format:Ko,sensor:Uo,iso:qo,ibis:Jo,shutter:Qo,drive:Yo,af:en,ftz_ii_behavior:tn,dx_crop:on,special_features:nn,video_key:sn,firmware:an,battery_media:rn,field_tips:ln,sources:cn,research_notes:dn},un="z5ii",hn="Nikon Z5II",fn="FX",pn={effective_mp:24.5,width_px:6048,height_px:4032,width_mm:35.9,height_mm:23.9,pixel_pitch_um:5.94,type:"BSI CMOS (not stacked)",olpf:!0,readout_ms:null,readout_notes:"No measured stills electronic-shutter readout was found. DPReview says readout is faster than the original Z5's but still slow enough that the e-shutter is best avoided except for silent shooting or the JPEG-only bursts, which use a faster 12-bit readout. Photography Life expects it to be about 1/20 s, like the Zf; that is an estimate, not a measurement. Video readout (DPReview): 4K 24/25/30p full width 22.2 ms (17.8 ms with e-VR crop). 4K 50/60p (1.52× crop) 14.6 ms. N-RAW 4K30 22.2 ms at 1.00×, 11.6 ms at 1.52× crop."},gn={base:100,native_range:"100–64000",extended:"Hi 0.3–Hi 1.7 (up to ISO 204800 equivalent). No Lo setting is listed for stills.",dual_gain_notes:null,ptp_notes:"PhotonsToPhotos published Z5II data (Nikon Rumors, 2025-05-07), but the chart is JavaScript-rendered and could not be read here. The dual-gain ISO is unverified."},bn={cipa_stops:7.5,synchro_vr_stops:null,focus_point_vr:!0,notes:"5-axis sensor-shift VR: 7.5 stops at the center and 6.0 stops at the periphery (CIPA 2024, Z 24-120mm f/4 S at telephoto, NORMAL). Focus-point VR (menu label 'Link VR to focus point') centers the correction on the active AF point. It works only in photo mode, only with NIKKOR Z lenses that have no VR, and not when multiple focus points are displayed. Nikon sources fetched here do not mention Synchro VR for the Z5II, so the field is null. Electronic VR for video."},wn={mechanical:!0,efcs:!0,electronic_fastest:"1/8000 (Nikon lists a single 1/8000–30 s range. A separate electronic-shutter top speed is not stated.)",flash_sync:"1/200 s or slower. Auto FP high-speed sync up to 1/8000 s. Flash support with the fully electronic shutter was not confirmed.",slowest:"30 s standard. 900 s in M with extended shutter speeds. Bulb and Time also available.",notes:"Vertical-travel focal-plane mechanical shutter, electronic front-curtain, and electronic shutter (Custom setting d6). With the slow e-shutter readout, use mechanical or EFCS for anything that moves. Pixel shift always uses the electronic shutter."},_n={max_fps_raw:"About 11 fps RAW with the mechanical shutter (DPReview). Nikon's C-H (extended) rates are 14 fps (mechanical) and 15 fps (silent). Nikon's footnote limits the high rates to non-RAW image quality. DPReview's press-release notes say 14 fps mechanical is JPEG only.",pre_release_capture:"Yes. C15 and C30 (High-Speed Frame Capture+), JPEG only. Buffers up to 1 s before the full press. Options in Custom setting d3.",notes:"C-L 1–7 fps. C-H 7.8 fps (mechanical), 9.4 fps (EFCS), 10 fps (silent). 3D-tracking holds at 14 fps."},vn={subject_detection:["People (faces, eyes, heads, upper bodies)","Dogs","Cats","Birds (bird detection mode)","Cars","Motorcycles","Bicycles","Airplanes","Trains"],low_light_ev:"−10 to +19 EV (f/1.2 lens, ISO 100, 20 °C, AF-S center point). Photography Life standardizes this to −8.5 EV at f/2.",notes:"273 points. Nikon says AF takes about one-third the time of the original Z5. AF-A is available. AF/MF subject detection options and an MF subject detection area are in the menus."},yn="AF-S, AF-P and AF-I lenses: full AF with electronic rangefinder. Screw-drive AF and AF-D lenses: MF only, with electronic rangefinder. AI-P and non-CPU (AI/AI-S) lenses: MF, modes A and M only. Non-CPU lenses need Non-CPU lens data. Non-VR F lenses get 3-axis IBIS (yaw, pitch, roll). VR F lenses combine lens VR with body roll correction. No Synchro VR. Focus-point VR needs NIKKOR Z lenses, so it is not available on F lenses. Focus shift shooting works with AF-S and AF-P lenses, but auto reset is disabled. Z teleconverters cannot be used on the FTZ II. See accessories/ftz-ii.json.",kn={mp:10.6,notes:"DX image area L is 3984 × 2656 px, about 10.6 MP (Nikon Asia spec). Only useful for a quick framing crop."},In=[{name:"Pixel shift",available:!0,firmware:"launch",notes:"About 96 MP from 16 or 32 shots (4 and 8 shots keep 24 MP). Electronic shutter, RAW only, tripod and static subject, merged in NX Studio (DPReview, J.M. Peltier)."},{name:"Focus shift shooting",available:!0,firmware:"launch",notes:"Photo shooting menu (Z5II manual TOC; Photography Life)."},{name:"Auto capture",available:!1,firmware:null,notes:"Not in the Z5II Reference Guide TOC."},{name:"Bird detection",available:!0,firmware:"launch",notes:"Nikon press material: bird detection mode for birds in motion and in flight."},{name:"Starlight View",available:!0,firmware:"launch",notes:"Custom setting d11 (photo Lv). Warm color display mode is also available."},{name:"High-frequency flicker reduction",available:!0,firmware:"launch",notes:"In the Photo and Video menus (Z5II manual TOC)."},{name:"MF subject detection",available:!0,firmware:"launch",notes:"MF Subject Detection Area and AF/MF Subject Detection Options are in the TOC. Whether chipped F lenses work is not confirmed by Nikon. J.M. Peltier reports MF detection working with CPU and non-CPU F lenses on the Zf/Z6III (likely, unverified on the Z5II)."},{name:"Focus-point VR",available:!0,firmware:"launch",notes:"Non-VR NIKKOR Z lenses only, photo mode only."},{name:"Imaging Recipes (formerly Cloud Picture Control)",available:!0,firmware:"launch; renamed 'Imaging Recipe' in 1.20",notes:"Downloaded through Nikon Imaging Cloud and applied with the dedicated Picture Control button. 31 built-in presets."},{name:"Flexible Color Picture Control",available:!0,firmware:"launch",notes:"Created in NX Studio and imported as a Custom Picture Control."},{name:"Hi-Res Zoom",available:!0,firmware:"launch",notes:"Video only: up to 2× at 1080p 24/25/30, FX area."},{name:"Focus limiter",available:!1,firmware:null,notes:"Not in the Z5II manual TOC."}],Fn={internal_raw:"N-RAW 12-bit to SD: 4032 × 2268 (FX) at 30/25/24p. V90 cards recommended.",log:"N-Log (ISO Lo 0.3–2.0 and 800–51200 in N-Log) and HLG.",notes:"4K/30 full width. 4K/60 with a 1.5× crop. 1080p to 120p. 10-bit H.265. Electronic VR is not available with N-RAW."},Sn={current:"1.20",date:"2026-08-18",notable_changes:"1.20 (2026-08-18): 'Cloud Picture Control' renamed 'Imaging Recipe'. Auto ISO minimum shutter speed range updated. 'On saving user settings' option for Save focus position. Automatic monitor display switch. Wi-Fi Always On. FTP inactive timeout. Aperture no longer restricted in S mode video. Bug fixes. 1.11 (May 2026): changes aperture behavior when the standby timer expires. 1.10 (Dec 2025): HDMI output no longer interrupted when recording ends. 1.02 (Nov 2025): sensor cleaning default set to 'Clean at shutdown'. 1.01 (Jun 2025): text and naming changes."},Zn="EN-EL15c (EN-EL15b/a also fit, with fewer shots). CIPA 330 shots (LCD) per DPReview. MB-N14 grip available. Two SD UHS-II slots.",Pn=["Use the mechanical shutter or EFCS for anything that moves. The non-stacked sensor's electronic shutter reads out slowly and will skew motion.","Pre-release capture (C15/C30) only records JPEG. Switch image quality to JPEG before a bird-takeoff session, or stay on 11 fps RAW mechanical.","Focus-point VR works only with non-VR NIKKOR Z lenses (for example the 26, 28, 40 and 50 primes), in photo mode, with a single focus point. It does nothing for VR lenses or F glass.","For about 96 MP pixel shift, use 16 or 32 shots on a tripod with a still subject, then merge in NX Studio. It always uses the electronic shutter, so watch for flicker under artificial light.","Under LED or venue lighting, enable High-Frequency Flicker Reduction, especially with the electronic shutter.","Since FW 1.02 the default is 'Clean at shutdown'. Leave it on, because the sensor is exposed during lens changes."],An=[{id:"nikon-asia-spec",name:"Nikon Asia Z5II body specifications",url:"https://www.nikon-asia.com/z5ii-body",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"24.5 MP effective. 35.9 × 23.9 mm. FX L 6048 × 4032, DX L 3984 × 2656. Mechanical, EFCS and electronic shutters. 1/8000–30 s, 900 s extended. Flash sync 1/200. C-L 1–7, C-H 7.8/9.4/10, C-H extended 14/15, C15/C30 with pre-release. ISO 100–51200 (highest standard 64000), Hi to 204800. AF −10 to +19 EV. Pixel shift. 2× SD UHS-II. N-RAW 12-bit."},{id:"dpreview-review",name:"DPReview Nikon Z5II in-depth review",url:"https://www.dpreview.com/reviews/2735390920",kind:"review",tested_on:"Nikon Z5II",date:"2025",findings:"24 MP BSI. E-shutter best avoided except silent or JPEG bursts (faster 12-bit readout). Video readout 22.2/17.8/14.6/11.6 ms. 11 fps RAW mechanical. Pre-release JPEG only. IBIS 7.5/6.0 EV. Focus-point VR. Pixel shift about 96 MP. CIPA 330 shots."},{id:"dpreview-specs",name:"DPReview Z5II specifications",url:"https://www.dpreview.com/reviews/2735390920/2",kind:"review",tested_on:null,date:"2025",findings:"ISO 100–64000, Hi 1.7 = 204800. 1/8000 s max. C15/C30 JPEG only with pre-release up to 1 s. 11 fps RAW mechanical. 700 g."},{id:"dpreview-pr",name:"DPReview Z5II press release page",url:"https://www.dpreview.com/reviews/2735390920/3",kind:"manufacturer",tested_on:null,date:"2025-04-03",findings:"Nine subject types listed. Bird detection. Starlight View. Hi-Res Zoom 2× at 1080p. Imaging Recipes. Flexible Color. 14 fps mechanical JPEG only."},{id:"nr-announce",name:"Nikon Rumors: Z5II officially announced",url:"https://nikonrumors.com/?p=204704",kind:"manufacturer",tested_on:null,date:"2025-04-03",findings:"BSI CMOS. VR 7.5 stops center and 6.0 periphery (CIPA 2024). Focus-point VR conditions. −10 EV AF. Pre-release capture JPEG only. Pixel shift about 96 MP."},{id:"nr-compare",name:"Nikon Rumors: Z5 vs Z5II specifications comparison",url:"https://nikonrumors.com/2025/04/03/nikon-z5-vs-nikon-z5ii-specifications-comparison.aspx",kind:"manufacturer",tested_on:null,date:"2025-04-03",findings:"Nikon spec text, including the footnote that the high-speed rates apply to non-NEF image quality and auto FP sync to 1/8000."},{id:"pl-compare",name:"Photography Life: Nikon Z5 II vs Zf vs Z6 III",url:"https://photographylife.com/nikon-z5-ii-vs-zf-vs-z6-iii",kind:"review",tested_on:null,date:"2025",findings:"5.94 µm pitch. Low-pass filter present. Readout not yet known (expected about 1/20 s like the Zf). Flash sync 1/200. Pixel shift and focus shift present. −8.5 EV at f/2. Extended ISO 50–204800 (conflicts with Nikon, which lists no Lo)."},{id:"z5ii-manual-toc",name:"Nikon Z5II Online Reference Guide (TOC)",url:"https://onlinemanual.nikonimglib.com/z5II/en/psm_pixel_shift_shooting_162.html",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"Lists Pixel shift, Focus shift, High-frequency flicker reduction, d11 Starlight view, d3 Pre-Release Capture options, MF subject detection area, Hi-Res Zoom, Link VR to focus point, d6 Shutter type. No Auto capture, no focus limiter, no Lo ISO."},{id:"nikon-in",name:"Nikon India Z5II page",url:"https://www.nikon.co.in/mirrorless-z5ii",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"7.5/6.0 stops (CIPA 2024). Pre-release 1 s. Nine subjects. Pixel shift. Starlight View. Imaging Recipes via Nikon Imaging Cloud. Flexible Color."},{id:"wikipedia",name:"Wikipedia: Nikon Z5II",url:"https://en.wikipedia.org/wiki/Nikon_Z5II",kind:"review",tested_on:null,date:"accessed 2026-11-05",findings:"BSI-CMOS 35.9 × 23.9 mm, 6048 × 4032. Firmware history 1.01 (2025-06-24), 1.02 (2025-11-05, Clean at shutdown default), 1.10 (2025-12-16)."},{id:"nikon-dc-2026",name:"Nikon Download Center: 2026 updates",url:"https://downloadcenter.nikonimglib.com/en/update/index/2026.html",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"Z5II firmware 1.20 dated 2026-08-18."},{id:"ir-fw120",name:"Imaging Resource: Nikon releases major firmware update for the Z5 II",url:"https://www.imaging-resource.com/news/nikon-releases-major-firmware-update-for-the-z5-ii/",kind:"review",tested_on:null,date:"2026-08-19",findings:"1.20 changes: Auto ISO min shutter range, Imaging Recipe rename, Save focus position option, monitor auto switch, Wi-Fi Always On, FTP timeout, aperture freed in S mode video."},{id:"nr-fw111",name:"Nikon Rumors: Z5II firmware 1.11",url:"https://nikonrumors.com/2026/05/12/nikon-z5ii-firmware-update-version-1-11-released.aspx/amp/",kind:"review",tested_on:null,date:"2026-05-12",findings:"Changes how aperture is adjusted when the standby timer expires."},{id:"pronews-110",name:"PRONEWS: Z9 5.30 and Z5II 1.10",url:"https://en.pronews.com/news/20251217132713636.html",kind:"review",tested_on:null,date:"2025-12-17",findings:"Z5II 1.10: HDMI output no longer interrupted when recording ends."},{id:"peltier-pixelshift",name:"J.M. Peltier: Nikon pixel shift shooting",url:"https://www.jmpeltier.com/nikon-pixel-shift-shooting/",kind:"review",tested_on:"24 MP Z bodies and Z8",date:"2026-09-14",findings:"16 and 32 shots give about 4× resolution (24 MP to 96 MP). Electronic shutter, RAW only."},{id:"peltier-mfsd",name:"J.M. Peltier: Manual focus subject detection on Nikon Z",url:"https://www.jmpeltier.com/manual-focus-subject-detection-nikon-z/",kind:"review",tested_on:"Nikon Zf / Z6III",date:"2024-09-16 (updated 2026-07-11)",findings:"MF subject detection works with CPU and non-CPU F lenses. ERF is not available on non-CPU lenses."},{id:"cined-recipes",name:"CineD: Nikon and RED Imaging Recipes",url:"https://www.cined.com/nikon-and-red-release-nine-free-image-recipes-for-select-z-mount-cameras/",kind:"review",tested_on:null,date:"2025-12-10",findings:"Z5II is a compatible camera."},{id:"ftz-guide",name:"Nikon: Using F-mount NIKKOR lenses with the FTZ II/FTZ (PDF)",url:"https://download.nikonimglib.com/archive6/amgQQ00igi0U06sJjMP25JWC2H05/FTZ_CompatibleFmount_(En)11.pdf",kind:"manufacturer",tested_on:null,date:null,findings:"F-lens compatibility classes. Focus shift works with AF-S and AF-P only."}],Cn="Pixel pitch = 35.9 / 6048 × 1000 = 5.936, rounded to 5.94 µm (matches Photography Life's 5.94). The stills e-shutter readout is unmeasured: no Kasson, Horshack or PtP figure was found, so the field is null. The ISO range conflicts: Nikon Asia lists 100–51200 in one row and 'highest standard 64000' in another. DPReview and the press release say 100–64000, which is used here. Photography Life lists extended ISO 50, but Nikon lists no Lo for stills. The RAW frame rate is ambiguous: Nikon's footnote and DPReview indicate RAW tops out at about 11 fps mechanical; whether C-H extended at 14/15 fps accepts RAW is unclear. Synchro VR is not mentioned in any Z5II source fetched, so the field is null. The dual-gain ISO is unknown because the PtP chart could not be read. Whether the mechanical shutter closes at power-off is not stated (the TOC has no sensor-shield item). The web search budget ran out before these gaps could be closed.",Nn={id:un,name:hn,format:fn,sensor:pn,iso:gn,ibis:bn,shutter:wn,drive:_n,af:vn,ftz_ii_behavior:yn,dx_crop:kn,special_features:In,video_key:Fn,firmware:Sn,battery_media:Zn,field_tips:Pn,sources:An,research_notes:Cn},zn="z8",xn="Nikon Z8",Rn="FX",Dn={effective_mp:45.7,width_px:8256,height_px:5504,width_mm:35.9,height_mm:23.9,pixel_pitch_um:4.35,type:"stacked CMOS",olpf:null,readout_ms:3.7,readout_notes:"Stills, electronic shutter, 14-bit: about 3.7 ms (about 1/270 s). Kasson measured 3.7 ms on the Z9, which uses the same sensor. Horshack gives 1/268 for the Z8/Z9, and mplough calibrated against 3.7 ms on a Z8. DPReview reports no drop to 12-bit readout in RAW bursts, so 20 fps RAW keeps the 14-bit readout. High-Speed Frame Capture+ (JPEG) is slower: Horshack measured about 1/90 s at 60 fps (full-size DX JPEG) and about 1/173 s at 120 fps (small FX JPEG). Video (DPReview): 8K 13.6 ms. Most other modes 14.4 ms. 4K/120p, subsampled 60p and ProRes RAW 4.1K/60p 4.9 ms (line-skipping). A 12-bit stills readout figure was not found."},Ln={base:64,native_range:"64–25600",extended:"32 (Lo 1) – 102400 (Hi 2)",dual_gain_notes:"Stills: the high-gain mode starts at ISO 500 and the low-gain mode covers ISO 64–400 (Dariusz Breś guest post on Nikon Rumors, July 2026). Video: high gain from ISO 4000, low gain ISO 800–3200 (same post). In practice, if a dim scene will be brightened in post, ISO 500 has lower read noise than ISO 250–400.",ptp_notes:"The PhotonsToPhotos PDR chart is rendered by JavaScript and could not be read here, so no PDR numbers are recorded. DPReview says dynamic range matches the Z9, with a small read-noise cost visible only in the deepest shadows."},Mn={cipa_stops:5.5,synchro_vr_stops:6,focus_point_vr:!1,notes:"5-axis sensor-shift VR. Nikon USA lists 5.5 stops in-body and 6.0 stops with Synchro VR-compatible NIKKOR Z lenses. DPReview's spec table gives only the 6 EV Synchro VR figure. Synchro VR is not available with F lenses on the FTZ II (Nikon FTZ compatibility guide). Focus-point VR is not listed for the Z8."},On={mechanical:!1,efcs:!1,electronic_fastest:"1/32000",flash_sync:"1/200 s X-sync with the electronic shutter. Auto FP high-speed sync up to 1/8000 s (Nikon USA spec).",slowest:"30 s standard. 900 s in M with extended shutter speeds. Bulb and Time also available.",notes:"Electronic shutter only. There is no mechanical shutter. A sensor shield closes over the sensor at power-off; the Setup menu item 'Sensor shield behavior at power off' controls it. Fast readout keeps rolling-shutter skew small, but banding is still possible under LED and other pulsed light. Use High-Frequency Flicker Reduction for that."},Tn={max_fps_raw:"20 fps RAW (C-H, 14-bit, full AF/AE). C-L 1–10 fps.",pre_release_capture:"Only in High-Speed Frame Capture+ (JPEG): C15 (added in FW 3.00), C30, C60 and C120. It buffers up to about 1 s before the full press. C60 is full-size DX JPEG and C120 is 11 MP JPEG. There is no RAW pre-release capture.",notes:"Nikon USA: 30 fps JPEG Fine, 60 fps JPEG Normal, 120 fps 11 MP JPEG. C60 and C120 read out slower than C30 or 20 fps, so moving subjects skew more."},En={subject_detection:["People (face, eye, head, upper body)","Animals (dogs, cats)","Birds (dedicated option since FW 2.00)","Vehicles (cars, motorcycles, bicycles, trains)","Airplanes"],low_light_ev:"−7 to +19 EV. −9 EV with Starlight View (Nikon USA spec).",notes:"493 focus points. FW 3.00 added an in-camera focus limiter (a16), MF subject detection (MF Subject Detection Area), more Wide-area C1/C2 sizes, and subject detection during Hi-Res Zoom. DPReview found bird detection weaker than expected at launch. FW 2.00 then added the dedicated Birds option. In video, AF uses Subject-tracking AF; there is no 3D-tracking."},Vn="AF-S, AF-P and AF-I lenses: full AF with electronic rangefinder. Screw-drive AF and AF-D lenses: MF only, with electronic rangefinder. AI-P and non-CPU (AI/AI-S) lenses: MF, modes A and M only. Non-CPU lenses need Non-CPU lens data. Non-VR F lenses get 3-axis IBIS (yaw, pitch, roll). VR F lenses combine lens VR with body roll correction. No Synchro VR. Focus shift shooting works with AF-S and AF-P lenses, but auto reset is disabled and no peaking stack image is saved. Z teleconverters cannot be used on the FTZ II. See accessories/ftz-ii.json.",$n={mp:19.4,notes:"DX image area L is 5392 × 3592 px, about 19.4 MP (Nikon USA spec). With DX lenses the camera switches to DX automatically. The DX crop gives a 1.5× field-of-view reach on the 180-600 at the cost of resolution."},Xn=[{name:"Pixel shift",available:!0,firmware:"2.00 (Feb 2024); expanded in 3.00",notes:"4, 8, 16 or 32 frames. 16 and 32 frames give about 180 MP (J.M. Peltier). Electronic shutter, RAW only, tripod required, merged in NX Studio. FW 3.00 can combine it with focus shift or AE bracketing (PetaPixel, Nikon AU), adds per-sequence folders and self-timer support."},{name:"Focus shift shooting",available:!0,firmware:"launch",notes:"Photo shooting menu. With F lenses on the FTZ II: AF-S and AF-P only, and focus position auto reset is disabled."},{name:"Auto capture",available:!0,firmware:"2.00",notes:"Criteria are Motion, Distance (NIKKOR Z lenses only) and Subject detection. The Distance criterion may not work well with F lenses (FTZ guide)."},{name:"Bird detection",available:!0,firmware:"2.00",notes:"Dedicated Birds subject-detection option."},{name:"Starlight View",available:!0,firmware:"launch",notes:"Custom setting d10. AF down to −9 EV in photo Lv."},{name:"High-frequency flicker reduction",available:!0,firmware:"launch; presets added in 3.00",notes:"In the Photo and Video menus. Nikon AU lists 'high-frequency flicker reduction presets' under FW 3.00."},{name:"MF subject detection",available:!0,firmware:"3.00",notes:"Settings: AF/MF Subject Detection Options and MF Subject Detection Area. Nikon sources fetched here do not say whether chipped F lenses on the FTZ II are supported. J.M. Peltier (Zf/Z6III article) reports detection working with CPU and non-CPU F lenses, with uncertain results on some AF-D lenses. Treat as likely but unverified on the Z8."},{name:"Focus limiter",available:!0,firmware:"3.00",notes:"Custom setting a16."},{name:"Flexible Color Picture Control",available:!0,firmware:"3.00",notes:"Built in NX Studio and loaded as a Custom Picture Control."},{name:"Picture Control Cloud / Imaging Recipes (Nikon Imaging Cloud)",available:!1,firmware:null,notes:"The Z8 is not on the CineD (Dec 2025) list of Imaging Recipe cameras, which names the Z6III, Zf, ZR, Z50II and Z5II, and the Z8 manual has no Imaging Recipe item."},{name:"Hi-Res Zoom",available:!0,firmware:"2.10 (video); subject detection during Hi-Res Zoom in 3.00",notes:"Video only."},{name:"Pre-release capture",available:!0,firmware:"launch; C15 added in 3.00",notes:"JPEG only, in High-Speed Frame Capture+."}],Bn={internal_raw:"N-RAW 12-bit up to 8K/60p and 4K/120p. ProRes RAW HQ 12-bit up to 4K/60p (Nikon USA).",log:"N-Log and HLG. N-Log minimum ISO 800 at launch (DPReview).",notes:"ProRes 422 HQ 10-bit up to 4K/60p. H.265 8/10-bit and H.264 8-bit. 8K is limited to about 90 min. Electronic VR adds a 1.25× crop. Shutter-angle mode was added in FW 2.10."},Hn={current:"3.12",date:"2026-10-20",notable_changes:"3.12 (Download Center 2026-10-20; Nikon Rumors dated it 2026-10-19): fixes the camera freezing with some lenses. 3.11 (2026-09-16): bug fixes for NX Tether wireless, a High-Frequency Flicker Reduction/Protect button conflict, and Custom Picture Control freezes. 3.10 (2025-09-17): HDMI output keeps running after recording stops, plus fixes. 3.00 (July 2025): focus limiter, MF subject detection, Flexible Color, C15, pixel shift combined with focus shift or AE bracketing, more Wide-area C1/C2 sizes, 400% zoom. 2.10 (Feb 2025): shutter angle, Hi-Res Zoom. 2.00 (Feb 2024): pixel shift, Birds detection, Auto Capture."},Wn="EN-EL15c (EN-EL15b/a also fit, with fewer shots). CIPA 340 shots (LCD) / 330 (EVF) per DPReview. One CFexpress Type B/XQD slot and one SD UHS-II slot.",jn=["Change lenses with the sensor shield closed: power off first, and check Setup > Sensor shield behavior at power off. With no mechanical shutter, the shield is the only thing covering the sensor.","Under LED or stage lighting, turn on High-Frequency Flicker Reduction before you shoot. The electronic-only shutter can show banding, and DPReview reported flickering screens upsetting AF.","20 fps RAW stays 14-bit, so there is no image-quality reason to drop to C-L for action.","Pre-release capture is JPEG only (C15/C30/C60/C120). C60 and C120 read out slower (about 1/90 s at 60 fps), so use C30 or 20 fps RAW for fast lateral motion.","In dim light, if you will brighten in post anyway, ISO 500 (high-gain mode) has less shadow noise than ISO 250–400.","For extra reach, DX crop gives 19.4 MP, enough for most birding crops with the 180-600."],Gn=[{id:"nikonusa-spec",name:"Nikon USA Z8 product page and tech specs",url:"https://www.nikonusa.com/p/z-8/1695/overview#tech-specs",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"45.7 MP. 35.9 × 23.9 mm. FX L 8256 × 5504, DX L 5392 × 3592. Electronic shutter, 1/32000–30 s, extendable to 900 s. X-sync 1/200, FP to 1/8000. C-H 10–20 fps, C30/C60/C120. ISO 64–25600, Lo to 32, Hi to 102400. VR 5.5 stops, 6.0 with Synchro VR. AF −7 to +19 EV (−9 with Starlight View). 9 subject types. EN-EL15c. CFexpress B/XQD + SD."},{id:"dpreview-review",name:"DPReview Nikon Z8 review",url:"https://www.dpreview.com/reviews/3604292544",kind:"review",tested_on:"Nikon Z8",date:"2023-10-16",findings:"Video readout 13.6 ms (8K), 14.4 ms in most modes, 4.9 ms in 4K/120 and ProRes RAW 4.1K/60. No drop to 12-bit readout in bursts. Sensor shield closes at power-off. Pre-release up to 1 s in the 30/60/120 fps JPEG modes. DR matches the Z9. Bird detection weak at launch. Flickering screens upset AF."},{id:"dpreview-specs",name:"DPReview Nikon Z8 specifications",url:"https://www.dpreview.com/reviews/3604292544/2",kind:"review",tested_on:null,date:"2023",findings:"Synchro VR up to 6 EV. 1/32000 s. Readout about 1/270 s. 20 fps RAW, 30 fps JPEG. CIPA 340/330 shots. 910 g."},{id:"kasson-z9",name:"Jim Kasson: How fast is the Z9 shutter",url:"https://blog.kasson.com/z9/how-fast-is-the-z9-shutter",kind:"measured",tested_on:"Nikon Z9 (same sensor as Z8)",date:"2022-01-27",findings:"Electronic-shutter transit time 3.7 ms (about 1/270 s), the same at 1/32000 s."},{id:"mplough",name:"Measuring camera sensor readout speeds (mplough)",url:"https://mplough.github.io/2025/01/30/camera-sensor-readout-speeds.html",kind:"measured",tested_on:"Nikon Z8, Z50, Z50II",date:"2025-01-30",findings:"Uses the Z8's about 1/270 s (3.7 ms) as a calibration reference."},{id:"dpr-forum-horshack",name:"DPReview forum: Z8/Z9 rolling shutter in 60fps/120fps continuous modes (Horshack)",url:"https://www.dpreview.com/forums/thread/4752433",kind:"forum",tested_on:"Nikon Z8/Z9",date:null,findings:"Standard readout 1/268. 60 fps DX JPEG 1/90. 120 fps small FX JPEG 1/173."},{id:"nr-dualgain",name:"Nikon Rumors guest post (Dariusz Breś): Z9/Z8 dual gain ISO",url:"https://nikonrumors.com/2026/07/18/nikon-z9-z8-z6-z7-and-zf-cameras-have-dual-gain-iso-this-means-its-better-to-shoot-at-iso-500-than-at-iso-250-due-to-the-wider-dynamic-range-and-less-noise.aspx/amp/",kind:"review",tested_on:"Nikon Z9/Z8",date:"2026-07-18",findings:"Stills: high gain from ISO 500, low gain ISO 64–400. Video: high gain from ISO 4000."},{id:"nikon-dc-2026",name:"Nikon Download Center: 2026 updates",url:"https://downloadcenter.nikonimglib.com/en/update/index/2026.html",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"Z 8 firmware 3.12 dated 2026-10-20."},{id:"nr-312",name:"Nikon Rumors: Z9 v5.33 and Z8 v3.12",url:"https://nikonrumors.com/?p=221729",kind:"review",tested_on:null,date:"2026-10-19",findings:"3.12 fixes the camera stopping responding with some lenses."},{id:"minna-fw",name:"Minna Camera: Z8 firmware history",url:"https://www.minnacamera.com/mags/6455",kind:"review",tested_on:null,date:"2026-09",findings:"3.11 (2026-09-16) bug fixes. 3.10 (2025-09-17). 3.01 (2025-07-16). 3.00 (2025-07-01): focus limiter, MF subject detection, Flexible Color, C15, pixel shift and auto capture expansion. 2.10 (2025-02-26): Hi-Res Zoom, shutter angle. 2.00 (2024-02-07): pixel shift, Birds, Auto Capture."},{id:"nr-310",name:"Nikon Rumors: Z8 firmware 3.10",url:"https://nikonrumors.com/2025/09/17/nikon-z8-firmware-update-version-3-10-released.aspx/amp",kind:"review",tested_on:null,date:"2025-09-17",findings:"HDMI output continues after recording ends. Fixes to playback filters and Save focus position."},{id:"nikon-fw200",name:"Nikon news release: Z 8 firmware 2.00",url:"https://www.nikon.com/company/news/2024/0207_firmware_01/",kind:"manufacturer",tested_on:null,date:"2024-02-07",findings:"Adds the Birds option, Auto Capture (Motion, Distance for NIKKOR Z only, Subject), pixel shift via NX software, and Rich Tone Portrait."},{id:"nikon-au-fw",name:"Nikon Australia: Z8 firmware updates",url:"https://www.nikon.com.au/z8-firmware-updates",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"FW 3.00: focus limiter, pixel shift integrated with focus shift or AE bracketing, high-frequency flicker reduction presets, High-Res Zoom subject detection, Flexible Colour. FW 2.10: shutter angle 5.6°–360°."},{id:"petapixel-fw300",name:"PetaPixel: Z8 firmware 3.00",url:"https://petapixel.com/2025/06/11/nikon-z8-firmware-adds-worlds-first-pixel-shift-mode-with-focus-shift-and-ae-bracketing",kind:"review",tested_on:null,date:"2025-06-11",findings:"Pixel shift combined with focus shift or AE bracketing, focus limiter, MF subject detection, Flexible Color, 400% zoom."},{id:"peltier-pixelshift",name:"J.M. Peltier: Nikon pixel shift shooting",url:"https://www.jmpeltier.com/nikon-pixel-shift-shooting/",kind:"review",tested_on:"Nikon Z8 and 24 MP Z bodies",date:"2026-09-14",findings:"4/8/16/32 shots. 16 and 32 give about 4× resolution (Z8 about 180 MP). Electronic shutter only, RAW only, NX Studio merge."},{id:"peltier-mfsd",name:"J.M. Peltier: Manual focus subject detection on Nikon Z",url:"https://www.jmpeltier.com/manual-focus-subject-detection-nikon-z/",kind:"review",tested_on:"Nikon Zf / Z6III",date:"2024-09-16 (updated 2026-07-11)",findings:"Works with non-CPU lenses (no ERF). ERF works with CPU F lenses that pass distance data. AF-D lenses are uncertain."},{id:"z8-manual-toc",name:"Nikon Z8 Online Reference Guide (table of contents)",url:"https://onlinemanual.nikonimglib.com/z8/en/subject_detection_changes_391.html",kind:"manufacturer",tested_on:null,date:"accessed 2026-11-05",findings:"The TOC lists Auto Capture, High-Frequency Flicker Reduction, d10 Starlight View, Focus Shift, Pixel Shift, d3 Pre-Release Capture Options, a16 Focus Limiter, MF Subject Detection Area, Hi-Res Zoom, and Sensor Shield Behavior at Power Off. It has no Imaging Recipe item."},{id:"cined-recipes",name:"CineD: Nikon and RED release nine free Imaging Recipes",url:"https://www.cined.com/nikon-and-red-release-nine-free-image-recipes-for-select-z-mount-cameras/",kind:"review",tested_on:null,date:"2025-12-10",findings:"Compatible cameras: Z6III, Zf, ZR, Z50II, Z5II. The Z8 is not listed."},{id:"ftz-guide",name:"Nikon: Using F-mount NIKKOR lenses with the FTZ II/FTZ (PDF)",url:"https://download.nikonimglib.com/archive6/amgQQ00igi0U06sJjMP25JWC2H05/FTZ_CompatibleFmount_(En)11.pdf",kind:"manufacturer",tested_on:null,date:null,findings:"Compatibility classes. No Synchro VR with F lenses. Focus shift works with AF-S and AF-P. Z TCs cannot be used."}],Kn="Pixel pitch = 35.9 / 8256 × 1000 = 4.348, rounded to 4.35 µm. OLPF: no source fetched here states it, so the field is null. The Z8 is widely reported to have no OLPF, but that is unverified here. IBIS 5.5 stops comes from one Nikon USA page (read through a summarizer); DPReview gives only the 6 EV Synchro VR figure, so confidence is medium. The PhotonsToPhotos charts could not be read (JavaScript-rendered), so the dual-gain point relies on the Breś Nikon Rumors post. Medium confidence, consistent with the widely cited ISO 500 for the Z9 sensor. The 14-bit readout time comes from Z9 measurements (same sensor) plus Z8 references. A 12-bit stills readout time was not found. Whether MF subject detection supports chipped F lenses on the Z8 is not confirmed by Nikon. The web search budget ran out before Synchro VR lens lists and some PtP checks could be done.",Un={id:zn,name:xn,format:Rn,sensor:Dn,iso:Ln,ibis:Mn,shutter:On,drive:Tn,af:En,ftz_ii_behavior:Vn,dx_crop:$n,special_features:Xn,video_key:Bn,firmware:Hn,battery_media:Wn,field_tips:jn,sources:Gn,research_notes:Kn},qn="2026-11-05",Jn="Owner's gear spreadsheet gear_spend_August_2026.xlsx and the Camera Stuff project manifest (camera_project_knowledge.md), Nov 5, 2026",Qn=[{id:"z8",order:1,role:"Primary / serious use p down to f/8. Hogan: center good, corners fair. Sources differ, so try f/8 when shutter speed allows."}]},"z-mc-105-f28-vr-s":{lastUpdated:"2026-11-05",macro:{mode:"displayed",magnifications:["inf","1:1"]},sources:[{name:"Enrico Savazzi",url:"https://www.savazzi.net/photography/nikon-z-105-2-8-vr.html",testBody:"Nikon Z8 (45.7MP), resolution target at 1:1. Handling also on a Z50 II"},{name:"OpticalLimits (Klaus)",url:"https://opticallimits.com/?p=7433",testBody:"45MP Nikon Z body (model not named)"},{name:"Photography Life",url:"https://photographylife.com/reviews/nikon-z-mc-105mm-f-2-8-vr-s-macro/2",testBody:"Not stated on the page (lab chart image not readable)"},{name:"Lenstip",url:"https://www.lenstip.com/694.4-Lens_review-Nikon_Nikkor_Z_MC_105_mm_f_2.8_VR_S_Image_resolution.html",testBody:"Nikon Z7 (45.7MP), RAW"},{name:"Cameralabs",url:"https://www.cameralabs.com/nikon-z-mc-105mm-f2-8-vr-s-review/2/",testBody:"Nikon Z7 (45.7MP), Siemens star and real-world crops"}],entries:[{focal_mm:105,mag:"inf",wideOpen:"Very sharp into the corners at f/2.8",centerPeak:"f/4",cornerPeak:"f/5.6",downhillFrom:"f/8",clearlySofter:"f/16",source:"OpticalLimits (45MP); Photography Life; Savazzi (Z8, 1:1); Lenstip (Z7); Cameralabs (Z7)",confidence:"measured",note:"OpticalLimits (45MP): diffraction sets in from about f/8; f/11 still very usable, f/16 softer, avoid f/22 for high-resolution work."},{focal_mm:105,mag:"1:1",wideOpen:"Wide open at 1:1 reads f/4.5 (close-focus loss included); no separate close-range verdict researched",centerPeak:null,cornerPeak:null,overallPeak:"f/5.6–f/8",downhillFrom:"f/11",clearlySofter:"f/16",startAt:4.5,source:"OpticalLimits (45MP); Photography Life; Savazzi (Z8, 1:1); Lenstip (Z7); Cameralabs (Z7)",confidence:"measured",note:"The camera shows the effective aperture, so these are displayed numbers. Savazzi (Z8) saw slight diffraction loss by f/8 at the finest detail and a further drop at f/11. Only a whole-frame peak was researched at 1:1, so Center and Corners are not measured separately. Focus-stack at f/5.6–f/8 instead of going to f/16+."}]},"zeiss-milvus-35-f2-zf2":{lastUpdated:"2026-11-05",sources:[{name:"phillipreeve.net",url:"https://phillipreeve.net/blog/review-zeiss-milvus-35mm-f-2/",testBody:"Nikon Z7II (45.7MP) via FTZ/FTZ II"},{name:"Photozone (OpticalLimits)",url:"https://photozone.de/canon_eos_ff/503-zeiss35f2eosff?start=1",testBody:"Canon full-frame DSLR (model not named in text"},{name:"The-Digital-Picture",url:"https://www.the-digital-picture.com/Reviews/Zeiss-Milvus-35mm-f-2-Lens.aspx",testBody:"Canon EOS 5Ds R (50.6MP), ZE version"}],entries:[{focal_mm:35,wideOpen:"Center excellent, corners good; Digital Picture: corners somewhat soft",centerPeak:"f/2.8–f/5.6",cornerPeak:"f/8–f/11",downhillFrom:"f/16",clearlySofter:"f/22",source:"Reeve (Z7 II, 46MP); Photozone (Canon FF); The Digital Picture (5Ds R)",confidence:"measured",note:"Reeve (46MP): diffraction reduces sharpness from f/16 at infinity and from f/11 at close range; f/22 visibly softer. Photozone (lower resolution): noticeable from f/8, easily usable at f/11."}]}},li={schema:ii,comment:si,lastUpdated:ai,lenses:ri},ci="f-af-50-f18d",di="AF NIKKOR 50mm f/1.8D",mi="AF 50 f/1.8D",ui="F",hi="FTZ II",fi="FX",pi="prime",gi=[50],bi=[{focal_mm:50,f:1.8}],wi=22,_i=7,vi=!1,yi=155,ki=52,Ii={on_z_body:"MF only (screw-drive lens on FTZ II)",cpu:!0,motor:"None in lens: screw-drive AF (AF-D) powered by a DSLR body motor. The FTZ II has no drive, so there is no AF on Z bodies.",focus_throw_deg:100,notes:"Nikon's FTZ compatibility table lists AF Type D lenses as having no AF, with MF and the electronic rangefinder supported. Photography Life's FTZ guide: on AF-D lenses via FTZ, the electronic rangefinder (focus point turns green, with in/out indicators per Ken Rockwell's FTZ page), focus peaking, camera control of aperture through the CPU, metering, EXIF, diffraction compensation and IBIS all work. In-camera distortion/vignetting control and focus-shift shooting do not. Eye/subject detection cannot drive focus because there is no AF. Mechanics: Imaging Resource measured about 100° of focus-ring travel from close to infinity, with hard stops. The lens extends about 3/4 inch (about 19 mm) when focusing close. It has an aperture ring with a lock at f/22. Imaging Resource found no A/M switch on the lens, and Dozier says MF is selected on the camera body ('D' design). On a Z body the FTZ II gives no AF, so you simply turn the ring (the lens has no clutch to switch)."},Fi={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:"3-axis (yaw, pitch, roll) via FTZ II on Z8 and Z5 II. None on Z50 II (no IBIS).",notes:"Nikon's FTZ II page says that with a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. Photography Life lists IBIS as working with AF-D lenses on the FTZ. As a CPU lens it passes 50mm to IBIS automatically."},Si={mfd_m:[{focal_mm:50,value:.45}],max_mag:[{focal_mm:50,value:.15}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"Nikon (Australia sales page) and Photography Life: MFD 0.45 m, max reproduction 0.15×. Lenstip lists 1:6.8 (0.147×), which agrees, and Imaging Resource lists 46 cm and 0.15×. No source measured sharpness close up. Photozone notes that the low wide-open contrast makes bokeh fringing more visible at close focus distances. Working distance not given by any source read."},Zi={headline:"Tiny, cheap, very sharp from f/2.8: manual focus only on Z, weak and low-contrast at f/1.8–f/2 (especially FX corners), best at f/5.6–f/8. Bokeh behind the subject can be busy.",sweet_spot:"f/5.6–f/8",wide_open:"Weak wide open. Lenstip (D200 DX) center below 30 lp/mm near f/1.8, 'unsatisfying', passing their decency level about f/2.2. Imaging Resource (D3x FX): f/1.8 center about 1.5 blur units, but corners over 12 and the frame average about 5. Photozone (D3x FX): center very good but lacking contrast, borders 'barely good'. Fine by f/2.8 (IR D3x: center about 1.5, corners 3 or under). Vignetting about 1–1.3 EV at f/1.8 on FX.",by_focal:[{focal_mm:50,center_peak:"f/4–f/5.6",corners_peak:"f/8",wide_open_note:"Center: Lenstip (D200) peak 46.4 lp/mm at f/5.6 ('outstanding'). Its D3x FX center is 2–3 lp/mm lower with the same shape. Photozone (D3x): center outstanding at f/4–f/5.6, declining from f/8 (diffraction). IR (D3x): almost 1 blur unit at f/4. Borders/corners: Photozone (D3x) improve steadily and peak at f/8. IR (D3x): 'as sharp as sharp gets' by f/8. Lenstip FX edge 'very decent' f/2.8–f/16. photoartfromscience (D7100 24MP DX): good edge to edge at f/2.8, peak overall at f/8."}],close_up_best:"f/4–f/5.6",close_up_note:"Not measured by any source. This is inferred from the general center peak (f/4–f/5.6) and Photozone's note that low wide-open contrast makes fringing more visible close up. At 0.45 m, f/1.8 depth of field is very thin and the lens is at its weakest, so stop down to at least f/2.8 for close detail. Low confidence.",diffraction_note:"Photozone (D3x, 24.5MP FX, about 5.9 µm): center declines from f/8. Imaging Resource (D200 and D3x): diffraction limiting begins at f/11, and f/22 is still only about 2 blur units. photoartfromscience (D7100, 3.9 µm, a finer pitch than the Z8's 4.35 µm): peak f/8, softening visible at f/16. On the Z8 expect the center to soften slightly past f/5.6–f/8 and clearly from f/11. Corners still gain to f/8, so f/8 is the best whole-frame compromise.",avoid:["Don't use f/1.8–f/2 for FX group shots that need sharp edges: corners are very soft (IR D3x: over 12 blur units) and vignetting is about 1–1.3 EV.","Don't place busy, high-contrast backgrounds (fairy lights, foliage) close behind the subject wide open: rear bokeh is nervous, with outlining and polygonal highlights stopped down (Photozone).","Don't expect AF on any Z body: there is no motor in the lens."],confidence:"high",confidence_reason:"Three measured sources agree: Lenstip (D200 + D3x), Photozone (D3x FX) and Imaging Resource (D200 + D3x) put the center peak at f/4–f/5.6 and the whole-frame peak at f/8, with photoartfromscience (24MP DX) also at f/8. All tests are 10–24MP, and none is on 36–45MP. On the Z8 the wide-open weakness will look worse per pixel, but the peak apertures should not move. Copy variation is notable (Dozier's borrowed second copy was poor)."},Pi={bokeh:"The main weakness. Photozone (D3x): smooth in front of the focus plane but visibly nervous behind it, 'somewhat unpleasant'. Highlights are not circular toward the edges wide open (mechanical vignetting) and polygonal stopped down, with pronounced outlining. 7 blades. Photozone recommends the AF-S 50/1.8G for better bokeh.",flare_sunstar:"Lenstip lists weaker-than-expected performance against bright light as a con. Sunstars not documented by the sources read (7 straight blades would give 14 points, an inference).",ca:"Lateral CA moderate. Photozone (D3x) 0.9 to almost 1.5 px, highest wide open. Lenstip: not bothersome. IR: almost none on the D3x with auto correction. LoCA/bokeh fringing is noticeable wide open (Photozone: magenta halos in front of focus, green behind), reduced stopped down.",distortion:"Low. Photozone (D3x): 0.3% barrel. IR (D3x): about +0.1% barrel in the corners. Lenstip: negligible.",vignetting:"IR (D3x): about 1 EV at f/1.8, 2/3 EV at f/2, 1/4 EV or less at f/2.8. Photozone (D3x): about 1.3 EV at f/1.8, not an issue from f/2.8. Lenstip: significant. In-camera vignette control does not apply to AF-D lenses on FTZ (Photography Life), so correct it in raw.",coma_astro:"Lenstip: distinct coma, and bothersome astigmatism near maximum aperture. Not an astro lens wide open.",focus_breathing:"Not measured. Unit-focusing design that extends about 19 mm (IR), so framing changes with focus distance (unquantified).",other:"6 elements in 5 groups, marketed 2002 per Lenstip (D version). 155 g, 52 mm filter, 63.5 × 39 mm (Nikon). Lenstip: high light transmission, and AF accuracy on DSLRs 'could be better', which is irrelevant on Z because you focus manually off the sensor. Copy variation: Dozier found a second copy poor."},Ai=["Focus by turning the ring (about 100° of travel). Use peaking plus magnified view, or the green focus-point indicator. Keep the aperture ring locked at f/22 and set aperture from the camera.","Family portraits: f/2.8–f/4 gives the best mix of blur and crisp eyes. f/1.8 is soft and low-contrast on the Z8, so use it only when light forces it.","Groups and landscapes on FX: f/8 for edge-to-edge sharpness. Past f/11 diffraction costs detail on the Z8.","Keep backgrounds far behind the subject or simple: its rear bokeh gets busy and outlined, especially with bright points.","On the Z50 II it frames like about 75mm (a compact portrait lens) with no IBIS, and the soft FX corners fall outside the crop. Use 1/160 s or faster handheld."],Ci=[{body:"z8",note:"45.7MP magnifies the weak f/1.8–f/2 contrast and corners. Center peak f/4–f/5.6, corners f/8, diffraction clear from f/11. MF only via FTZ II (rangefinder + peaking). 3-axis IBIS."},{body:"z5ii",note:"24.5MP matches the D3x tests (Photozone, IR, Lenstip FX) directly: good from f/2.8, best f/5.6–f/8. MF only. 3-axis IBIS via FTZ II."},{body:"z50ii",note:"About 75mm-equivalent. DX tests apply (Lenstip D200: 46.4 lp/mm center at f/5.6. Dozier D7100: good edge to edge at f/2.8, peak f/8). No IBIS."}],Ni=!1,zi=[{id:"lenstip",name:"Lenstip review: Nikon Nikkor AF 50 mm f/1.8D (resolution + summary chapters)",url:"https://www.lenstip.com/219.4-Lens_review-Nikon_Nikkor_AF_50_mm_f_1.8D_Image_resolution.html",kind:"measured",tested_on:"Nikon D200 (10.2MP DX) and Nikon D3x (24.5MP FX), RAW MTF50",date:null,findings:"DX center below 30 lp/mm near f/1.8 ('unsatisfying'), passes the decency level about f/2.2, peak 46.4 lp/mm at f/5.6 ('outstanding'). Comparisons: AF 50/1.4D 44.6, AF-S 50/1.4G 44.4, Zeiss Planar 50/1.4 48. DX edge similar to center: low at f/1.8–f/2, decent from f/2.5, very good near f/5.6. D3x center about 2–3 lp/mm below D200 with the same shape. FX edge very decent f/2.8–f/16. Per-aperture values are in chart images (not read). Summary (https://lenstip.com/219.11-Lens_review-Nikon_Nikkor_AF_50_mm_f_1.8D_Summary.html) pros: excellent center, good edges, CA not bothersome, negligible distortion, quiet fairly fast AF, high transmission. Cons: weak near max aperture, distinct coma, bothersome astigmatism wide open, significant vignetting, AF accuracy could be better, weaker against bright light than expected. Specs page (https://www.lenstip.com/351-Nikon_Nikkor_AF_50_mm_f_1.8D-lens_specifications.html): 6/5, 0.45 m, 1:6.8, 7 blades, 52 mm, 155 g, 63.5 × 39 mm, f/22, marketed 2002."},{id:"photozone_fx",name:"Photozone/OpticalLimits: Nikkor AF 50mm f/1.8 D (FX) review, analysis + verdict",url:"https://photozone.de/nikon_ff/623-nikkorafd5018ff?start=1",kind:"measured",tested_on:"Nikon D3x (24.5MP FX), RAW via Capture One",date:null,findings:"Distortion 0.3% barrel. Vignetting about 1.3 EV at f/1.8, not an issue from f/2.8. Center very good wide open but low contrast, excellent from f/2.8, outstanding at f/4–f/5.6, declining from f/8 (diffraction). Borders/corners barely good wide open, improving steadily, peaking at f/8. Lateral CA 0.9 to almost 1.5 px. Bokeh smooth in front of focus, nervous behind ('somewhat unpleasant'), non-circular edge highlights wide open, polygonal with pronounced outlining stopped down. Bokeh fringing (magenta front, green behind) noticeable wide open, more visible close up. Verdict (https://photozone.de/nikon_ff/623-nikkorafd5018ff?start=2): wide open lacks contrast and sharpness especially at borders and corners, sharp stopped down, bokeh the main weakness, AF-S 50/1.8G suggested for better bokeh and borders."},{id:"imaging_resource",name:"Imaging Resource / SLRgear: Nikon 50mm f/1.8D AF Nikkor review",url:"https://old.imaging-resource.com/lenses/nikon/50mm-f1.8d-af-nikkor/review",kind:"measured",tested_on:"Nikon D200 (10MP DX) and Nikon D3x (24.5MP FX); blur index",date:null,findings:"D3x: f/1.8 center about 1.5 blur units, corners over 12, average about 5. f/2 similar. f/2.8 center about 1.5, corners 3 or under. f/4 almost 1. f/8 'as sharp as sharp gets'. Diffraction begins f/11. f/22 just over 2. D200: f/1.8–f/2 3–4 across the frame, tack-sharp by f/5.6, f/22 about 2. Vignetting D3x: about 1 EV f/1.8, 2/3 EV f/2, 1/4 EV or less f/2.8. Distortion D3x about +0.1% barrel. CA nearly nil on D3x with auto correction. About 100° focus travel with hard stops. Lens extends about 3/4 in. Aperture ring locks at f/22. Focus ring turns during AF. MFD 46 cm, 0.15×. 156 g."},{id:"photoartfromscience",name:"Photo Art From Science (Ed Dozier): Nikkor 50mm f/1.8 AF-D FX review",url:"https://www.photoartfromscience.com/single-post/2016/02/29/nikkor-50mm-f18-afd-fx-review",kind:"measured",tested_on:"Nikon D7100 (24MP DX, about 3.9 µm), MTF50, single copy",date:"2016-02 (updated 2020-08)",findings:"f/1.8 acceptable center, corners a bit off. f/2 similar. f/2.8 good edge to edge. f/4 stellar center. f/8 peak overall. f/16 diffraction softening but still quite good. No MTF numbers in text. A second borrowed copy performed poorly (copy variation). MF requires switching the camera to M (D design). Focus ring turns during AF."},{id:"nikon_spec",name:"Nikon Australia: AF NIKKOR 50mm f/1.8D product page",url:"https://sales.nikon.com.au/af-nikkor-50mm-f-1-8d",kind:"manufacturer",tested_on:null,date:null,findings:"6 elements in 5 groups. MFD 0.45 m. Max reproduction 0.15×. 7 blades (rounding not stated). 52 mm filter. About 155 g. 63.5 × 39 mm. f/22 minimum."},{id:"pl_spec",name:"Photography Life lens database: Nikon AF NIKKOR 50mm f/1.8D",url:"https://photographylife.com/lenses/nikon-af-nikkor-50mm-f1-8d",kind:"manufacturer",tested_on:null,date:null,findings:"Spec summary matching Nikon: 0.45 m, 0.15×, 7 blades, 52 mm, 155 g, 6/5, f/22, 63.5 × 39 mm. No lab test on the page (MTF chart image only)."},{id:"nikon_ftz_ii",name:"Nikon: Mount Adapter FTZ II product page",url:"https://www.nikon.ie/en_IE/product/accessories/mirrorless/mount-adapter-ftz-ii",kind:"manufacturer",tested_on:null,date:null,findings:"With a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. Full AF only for lenses with a built-in AF motor (AF-S Type G/D/E, AF-P, AF-I)."},{id:"nikon_ftz_compat",name:"Nikon: FTZ 'Compatible F Mount Lenses' feature table (manualmachine copy)",url:"https://manualmachine.com/nikon/ftz/17014601-compatible-f-mount-lenses",kind:"manufacturer",tested_on:null,date:null,findings:"Row 'AF NIKKOR Type G and D': autofocus not supported. MF with electronic rangefinder supported. All exposure and metering modes supported. (Cited from the AF Micro 60 record, not re-fetched this session.)"},{id:"pl_ftz_guide",name:"Photography Life: Nikon FTZ and FTZ II adapter lens compatibility, explained",url:"https://photographylife.com/nikon-ftz-adapter-lens-compatibility",kind:"review",tested_on:null,date:null,findings:"AF-D lenses: no AF. Electronic rangefinder, focus peaking, camera aperture control, metering, EXIF, diffraction compensation and IBIS work. Distortion/vignetting control and focus-shift shooting do not."}],xi={url:null,access:"not-found",summary:"No Christopher Frost review of the AF NIKKOR 50mm f/1.8D was found in one targeted web search (his name, the lens, 'youtube'). Results showed other reviewers (TDP, Lenstip, Fstoppers) and a Frost review of an unrelated Viltrox 50mm. YouTube is blocked to fetching here. Nothing is attributed to him."},Ri="1) Chris Frost: searched once (as instructed, to save budget), not found. 2) Test vintage: all measured tests are 10–24MP (D200, D3x, D7100). None on 36–45MP. Peak apertures should hold on the Z8, but f/1.8–f/2 softness and fringing will look worse per pixel. 3) rounded_blades false: Photozone describes polygonal highlights stopped down, and Nikon/Lenstip don't claim rounded blades. Inferred from Photozone, not a manufacturer statement. 4) focus_throw_deg 100 is from Imaging Resource's measurement (about 100°). 5) Close-up guidance is inferred, since no source measured near MFD (low confidence for that field only). 6) No A/M switch: per Imaging Resource (none mentioned) and Dozier (MF set on the camera body). Not checked against the Nikon manual. 7) tc_compatible false: Nikon AF-S/AF-I teleconverters are not intended for AF-D standard primes (general knowledge, not re-verified). 8) The Digital-Picture page and the Photozone DX test (https://www.photozone.de/nikon--nikkor-aps-c-lens-tests/217-nikkor-af-50mm-f18-d-review--test-report?start=1) appeared in search results but were not read. DXOMARK not consulted. 9) Lenstip's 'marketed 2002' likely refers to the current D production. The lens was not researched for earlier versions. 10) Searches used for this lens: 3 (Lenstip/Photozone, Nikon specs, Chris Frost). The earlier attempts were refused when the budget ran out.",Di={id:ci,name:di,short:mi,mount:ui,adapter:hi,coverage:fi,kind:pi,focal_mm:gi,max_aperture:bi,min_aperture_f:wi,aperture_blades:_i,rounded_blades:vi,weight_g:yi,filter_mm:ki,focus:Ii,stabilization:Fi,close_focus:Si,quick:Zi,character:Pi,field_tips:Ai,body_notes:Ci,tc_compatible:Ni,sources:zi,chris_frost:xi,research_notes:Ri},Li="f-af-dc-105-f2d",Mi="AF DC-NIKKOR 105mm f/2D",Oi="AF DC 105 f/2D",Ti="F",Ei="FTZ II",Vi="FX",$i="prime",Xi=[105],Bi=[{focal_mm:105,f:2}],Hi=16,Wi=9,ji=!0,Gi=640,Ki=72,Ui={on_z_body:"MF only (screw-drive lens on FTZ II)",cpu:!0,motor:"None in lens: screw-drive AF from a DSLR body motor. The FTZ II has no drive, so there is no AF on Z bodies.",focus_throw_deg:null,notes:"Nikon's FTZ compatibility table lists AF Type D lenses as having no AF, with MF and the electronic rangefinder supported. Photography Life's FTZ guide confirms AF-D lenses on FTZ: no AF, but the electronic rangefinder (focus-point turns green, with in/out indicators), focus peaking, camera aperture control, metering, EXIF and IBIS all work. The CPU passes aperture and focal length. Ken Rockwell and Phillip Reeve both confirm MF only on the FTZ. Imaging Resource: there is no full-time manual override, so set the lens's M/A switch to M before turning the focus ring. Focusing is internal (rear group), with a light, smooth ring (Rockwell). The DC ring shifts the focal plane, so focus last, after setting DC (Rockwell, Reeve, Photozone). On a Z body this is natural, because you focus by eye in the EVF anyway. Eye detection cannot drive focus (no AF). Rockwell says 1993 DSLR AF was accurate at DC 0 or REAR and could be slightly off at FRONT, which is irrelevant on Z."},qi={lens_vr:!1,lens_vr_stops:null,synchro_vr:!1,ibis_on_ftz:"3-axis (yaw, pitch, roll) via FTZ II on Z8 and Z5 II. None on Z50 II (no IBIS).",notes:"Nikon's FTZ II page says that with a non-VR F-mount lens, yaw, pitch and roll are corrected in-camera. As a CPU lens it passes 105mm to IBIS automatically (Photography Life lists IBIS as working for AF-D on the FTZ)."},Ji={mfd_m:[{focal_mm:105,value:.9}],max_mag:[{focal_mm:105,value:.13}],working_distance_mm_at_max_mag:null,effective_aperture_at_max_mag:null,camera_displays_effective:null,notes:"MFD 0.9 m. Max magnification 1:7.7 (0.13×) per Lenstip specs and Ken Rockwell. Phillip Reeve measured 1:7.3 on his copy. Close-up sharpness (Reeve, 42MP A7R II, 0.9 m): soft at f/2, slight colour fringing at f/2.8, good from f/4. Reeve also notes that at close range peak resolution and peak contrast fall at slightly different focus points (residual spherical aberration). The built-in telescoping metal hood locks with about two turns (Rockwell)."},Qi={headline:"Classic portrait 105 with a unique bokeh-shaping DC ring: manual focus only on Z, soft-glowy at f/2, crisp by f/2.8, peak about f/5.6. Keep DC at 0 or match it to the aperture.",sweet_spot:"f/4–f/5.6",wide_open:"f/2 is slightly soft with strong LoCA and purple fringing (Reeve, 42MP). Imaging Resource (D3x) measured blur of 2–3
